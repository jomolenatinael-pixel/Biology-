ly about 1.5 V, decreasing as current is drawn off."},{"type":"mc","q":"A lead storage battery is an example of a secondary (rechargeable) cell.","opts":["True","False"],"correct":0,"explain":"The text describes the lead storage battery as an example of a secondary, rechargeable cell."},{"type":"mc","q":"A single lead-storage cell delivers about 2 volts, and a 12 V battery contains six cells connected in series.","opts":["True","False"],"correct":0,"explain":"The text states a single lead-storage cell delivers about 2 V, and a 12 V battery contains six such cells in series."},{"type":"mc","q":"In an electrolytic cell, the cathode is the electrode at which oxidation occurs.","opts":["True","False"],"correct":1,"explain":"The text states that in an electrolytic cell, reduction occurs at the cathode and oxidation occurs at the anode, the reverse of this statement."},{"type":"mc","q":"In an electrolytic cell, the electrode connected to the positive terminal of the battery is called the anode.","opts":["True","False"],"correct":0,"explain":"The text states that in an electrolytic cell, the electrode connected to the positive terminal is the anode."},{"type":"mc","q":"Electrolysis is a process in which electrical energy is used to drive a nonspontaneous chemical reaction.","opts":["True","False"],"correct":0,"explain":"The text defines electrolysis as using electrical energy to drive an otherwise nonspontaneous reaction."},{"type":"mc","q":"Sodium metal can be obtained commercially by the electrolysis of molten sodium chloride.","opts":["True","False"],"correct":0,"explain":"The text describes the electrolysis of molten NaCl as the commercial method for producing sodium metal."},{"type":"mc","q":"Oxidation always takes place at the cathode and reduction always takes place at the anode in any electrochemical cell.","opts":["True","False"],"correct":1,"explain":"The text states oxidation always takes place at the anode and reduction always takes place at the cathode, the reverse of this statement."},{"type":"mc","q":"According to the text, non-metals are generally poor conductors of electricity because they lack freely moving electrons.","opts":["True","False"],"correct":0,"explain":"The text states non-metals are generally non-conductors of electricity because they lack freely moving electrons."},{"type":"mc","q":"A reaction that releases heat, causing the surroundings to warm up, is described as:","opts":["Endothermic","Exothermic","Isothermic","Adiabatic"],"correct":1,"explain":"The text describes heat-releasing reactions as exothermic."},{"type":"mc","q":"A reaction that absorbs heat from the surroundings, causing them to cool, is described as:","opts":["Exothermic","Endothermic","Isothermic","Spontaneous"],"correct":1,"explain":"The text describes heat-absorbing reactions as endothermic."},{"type":"mc","q":"The word 'exothermic' comes from Greek roots meaning:","opts":["Within and heat","Outside and heat","Above and cold","Below and light"],"correct":1,"explain":"The text states exothermic comes from Greek exo (outside) and therme (heat)."},{"type":"mc","q":"The word 'endothermic' comes from the Greek root 'endo' meaning:","opts":["Outside","Within","Above","Cold"],"correct":1,"explain":"The text states endothermic comes from the Greek endo, meaning within."},{"type":"mc","q":"The heat transferred at constant temperature and pressure during a reaction is called the:","opts":["Kinetic energy of reaction","Enthalpy of reaction","Internal energy of reaction","Heat capacity of reaction"],"correct":1,"explain":"The text defines the heat transferred at constant temperature and pressure as the enthalpy of reaction, symbol \u0394H."},{"type":"mc","q":"For an exothermic reaction, the sign of the enthalpy change, \u0394H, is:","opts":["Positive","Negative","Zero","Undefined"],"correct":1,"explain":"The text states \u0394H is negative for exothermic reactions."},{"type":"mc","q":"For an endothermic reaction, the sign of the enthalpy change, \u0394H, is:","opts":["Positive","Negative","Zero","Undefined"],"correct":0,"explain":"The text states \u0394H is positive for endothermic reactions."},{"type":"mc","q":"The device used to measure the heat released or absorbed during a chemical reaction is called a:","opts":["Thermometer","Calorimeter","Barometer","Voltmeter"],"correct":1,"explain":"The text names the calorimeter as the device used to measure heat released or absorbed by a reaction."},{"type":"mc","q":"The quantity of heat required to change the temperature of a substance by 1 K is called its:","opts":["Specific heat capacity","Heat capacity","Enthalpy","Internal energy"],"correct":1,"explain":"The text defines heat capacity as the quantity of heat required to change an object's temperature by 1 K."},{"type":"mc","q":"The unit of heat capacity given in the text is:","opts":["Joule per gram (J/g)","Joule per Kelvin (J/K)","Kelvin per Joule (K/J)","Calorie per mole"],"correct":1,"explain":"The text states the unit of heat capacity is Joule per Kelvin (J/K)."},{"type":"mc","q":"Specific heat capacity (c) is defined in the text as heat capacity divided by:","opts":["Volume","Mass","Temperature","Time"],"correct":1,"explain":"The text defines specific heat capacity as heat capacity divided by mass, or q/(mass x \u0394T)."},{"type":"mc","q":"According to the text, a substance with a low heat capacity, such as iron, will:","opts":["Heat and cool quickly","Heat and cool slowly","Not absorb any heat","Only absorb heat, never release it"],"correct":0,"explain":"The text states substances with low heat capacity, such as iron, heat and cool quickly."},{"type":"mc","q":"According to the text, it takes over how many times as much energy to raise the temperature of a gram of water by 1 K compared to a gram of gold?","opts":["3 times","10 times","30 times","100 times"],"correct":2,"explain":"The text states it takes over 30 times as much energy to raise the temperature of a gram of water by 1 K as it does for a gram of gold."},{"type":"mc","q":"The equation used in the text to calculate the heat absorbed or released, given specific heat capacity, mass, and temperature change, is:","opts":["q = c / (mass x \u0394T)","q = c x mass x \u0394T","q = c x mass / \u0394T","q = mass / (c x \u0394T)"],"correct":1,"explain":"The text gives the formula q = c x mass x \u0394T for calculating heat absorbed or released."},{"type":"mc","q":"Electrical conductivity caused by the movement of electrons through a material is called:","opts":["Electrolytic conductivity","Metallic conductivity","Ionic conductivity","Thermal conductivity"],"correct":1,"explain":"The text names conductivity due to electron movement metallic conductivity."},{"type":"mc","q":"According to the text, which element is described as the best electrical conductor?","opts":["Copper","Gold","Silver","Aluminium"],"correct":2,"explain":"The text states silver is the best electrical conductor."},{"type":"mc","q":"According to the text, graphite conducts electricity well because:","opts":["It contains free ions","Electrons move freely through its hexagonal layers","It is a metal","It dissolves in water"],"correct":1,"explain":"The text explains graphite conducts electricity because electrons move freely through its hexagonal carbon layers."},{"type":"mc","q":"Electrical conductivity caused by the movement of ions through a solution or molten substance is called:","opts":["Metallic conductivity","Electrolytic conductivity","Electronic conductivity","Covalent conductivity"],"correct":1,"explain":"The text names conductivity due to ion movement electrolytic conductivity."},{"type":"mc","q":"According to the text's comparison table, metallic conduction does NOT involve:","opts":["Movement of electrons","A transfer of matter","Any change in chemical properties of the conductor","Passage of electric charge"],"correct":1,"explain":"The text's comparison table states metallic conduction does not involve any transfer of matter, unlike electrolytic conduction."},{"type":"mc","q":"Electrolytes that dissociate completely in solution, producing more ions and brighter light in a conductivity test, are called:","opts":["Weak electrolytes","Strong electrolytes","Nonelectrolytes","Neutral electrolytes"],"correct":1,"explain":"The text describes strong electrolytes as those that dissociate completely, producing brighter light due to more ions."},{"type":"mc","q":"An electrochemical cell in which a spontaneous redox reaction converts chemical energy into electrical energy is called a(n):","opts":["Electrolytic cell","Galvanic (voltaic) cell","Fuel cell only","Capacitor"],"correct":1,"explain":"The text defines a galvanic (voltaic) cell as one converting chemical energy into electrical energy via a spontaneous redox reaction."},{"type":"mc","q":"Galvanic cells are named after which two Italian scientists, according to the text?","opts":["Wohler and Kekul\u00e9","Galvani and Volta","Daniell and Leclanch\u00e9","Faraday and Ohm"],"correct":1,"explain":"The text states galvanic/voltaic cells were named after Italian scientists Luigi Galvani and Alessandro Volta."},{"type":"mc","q":"According to the text, galvanic cells are classified into which three categories?","opts":["Wet, dry, and molten cells","Primary cells, secondary cells, and fuel cells","Anodic, cathodic, and neutral cells","Acidic, basic, and neutral cells"],"correct":1,"explain":"The text classifies galvanic cells into primary cells, secondary cells, and fuel cells."},{"type":"mc","q":"Which of the following is described in the text as an example of a primary cell?","opts":["Lead storage battery","Daniell's cell","Rechargeable NiCd battery","Fuel cell"],"correct":1,"explain":"The text lists the Daniell cell as an example of a primary cell, which is not rechargeable."},{"type":"mc","q":"In the Daniell cell, what is the anode half-reaction?","opts":["Cu2+(aq) + 2e- \u2192 Cu(s)","Zn(s) \u2192 Zn2+(aq) + 2e-","Zn2+(aq) + 2e- \u2192 Zn(s)","Cu(s) \u2192 Cu2+(aq) + 2e-"],"correct":1,"explain":"The text gives the anode reaction in the Daniell cell as Zn(s) \u2192 Zn2+(aq) + 2e-."},{"type":"mc","q":"In the Daniell cell, what is the cathode half-reaction?","opts":["Zn(s) \u2192 Zn2+(aq) + 2e-","Cu2+(aq) + 2e- \u2192 Cu(s)","Cu(s) \u2192 Cu2+(aq) + 2e-","Zn2+(aq) + 2e- \u2192 Zn(s)"],"correct":1,"explain":"The text gives the cathode reaction in the Daniell cell as Cu2+(aq) + 2e- \u2192 Cu(s)."},{"type":"mc","q":"The zinc-carbon dry cell used in flashlights and radios was invented by:","opts":["Alessandro Volta","Luigi Galvani","Georges Leclanch\u00e9","Michael Faraday"],"correct":2,"explain":"The text credits Georges Leclanch\u00e9, a French chemist, with inventing the dry cell."},{"type":"mc","q":"In the zinc-carbon (Leclanch\u00e9) dry cell, what serves as the cathode?","opts":["A zinc can","A graphite rod surrounded by manganese dioxide paste","A copper strip","A lead grid"],"correct":1,"explain":"The text describes the Leclanch\u00e9 cell cathode as a graphite rod surrounded by a paste of manganese dioxide, ammonium and zinc chlorides, and carbon black."},{"type":"mc","q":"According to the text, secondary cells differ from primary cells in that secondary cells are:","opts":["Not rechargeable","Rechargeable","Unable to store energy","Always wet cells only"],"correct":1,"explain":"The text states secondary cells, unlike primary cells, are rechargeable."},{"type":"mc","q":"A lead storage battery, an example of a secondary cell, is bathed in an aqueous solution of:","opts":["Hydrochloric acid","35% sulfuric acid","Sodium hydroxide","Ammonium chloride"],"correct":1,"explain":"The text states the lead storage battery's electrodes are bathed in an aqueous solution of 35% sulfuric acid."},{"type":"mc","q":"According to the text, what is the overall (cell) reaction occurring during discharge of a lead-storage battery?","opts":["Pb(s) + PbO2(s) + 4H+(aq) + 2SO42-(aq) \u2192 2PbSO4(s) + 2H2O(l)","2PbSO4(s) + 2H2O(l) \u2192 Pb(s) + PbO2(s) + 2H2SO4(aq)","Zn(s) + Cu2+(aq) \u2192 Zn2+(aq) + Cu(s)","2NaCl(l) \u2192 2Na(l) + Cl2(g)"],"correct":0,"explain":"The text gives the overall discharge reaction of a lead storage battery as Pb(s) + PbO2(s) + 4H+(aq) + 2SO42-(aq) \u2192 2PbSO4(s) + 2H2O(l)."},{"type":"mc","q":"An electrochemical cell in which electrical energy is used to drive a nonspontaneous reaction is called a(n):","opts":["Galvanic cell","Electrolytic cell","Fuel cell","Primary cell"],"correct":1,"explain":"The text defines an electrolytic cell as one in which electrolysis (driven by electrical energy) occurs for a nonspontaneous reaction."},{"type":"mc","q":"In an electrolytic cell, the electrode connected to the positive terminal of the power source is called the:","opts":["Cathode","Anode","Salt bridge","Half-cell"],"correct":1,"explain":"The text states the electrode connected to the positive terminal in an electrolytic cell is called the anode."},{"type":"mc","q":"In an electrolytic cell, reduction occurs at the:","opts":["Anode","Cathode","Salt bridge","External wire"],"correct":1,"explain":"The text states that in an electrolytic cell, the cathode is the electrode at which reduction occurs."},{"type":"mc","q":"During electrolysis of molten sodium chloride, what forms at the cathode?","opts":["Chlorine gas","Sodium metal","Sodium chloride crystals","Oxygen gas"],"correct":1,"explain":"The text describes globules of sodium metal forming at the electrode connected to the negative pole (cathode) during electrolysis of molten NaCl."},{"type":"mc","q":"During electrolysis of molten sodium chloride, what forms at the anode?","opts":["Sodium metal","Chlorine gas","Hydrogen gas","Sodium hydroxide"],"correct":1,"explain":"The text describes chlorine gas evolving from the anode during electrolysis of molten NaCl."},{"type":"mc","q":"According to the text, which metals are obtained commercially by electrolysis of their molten chlorides?","opts":["Copper, silver, and gold","Lithium, magnesium, and calcium","Iron, nickel, and zinc","Platinum and palladium"],"correct":1,"explain":"The text states lithium, magnesium, and calcium metals are all obtained by electrolysis of their chlorides."},{"type":"mc","q":"According to the text, ionic solids like NaCl must be melted or dissolved to conduct electricity because in the solid state:","opts":["The ions are not free to move","There are no ions present","The compound is a strong conductor","Electrons move freely"],"correct":0,"explain":"The text explains that in the solid state, ions in an ionic compound are fixed in place and not free to move, so it does not conduct electricity until molten or dissolved."},{"type":"mc","q":"According to the text, oxidation always takes place at the:","opts":["Cathode","Anode","Salt bridge","Battery terminal"],"correct":1,"explain":"The text states that oxidation always takes place at the anode, in both galvanic and electrolytic cells."},{"type":"mc","q":"According to the text, the overall cell reaction recharging a lead-storage battery is:","opts":["Pb(s) + PbO2(s) + 4H+(aq) + 2SO42-(aq) \u2192 2PbSO4(s) + 2H2O(l)","2PbSO4(s) + 2H2O(l) \u2192 Pb(s) + PbO2(s) + 2H2SO4(aq)","Zn(s) + 2NH4+(aq) + 2MnO2(s) \u2192 Zn2+(aq) + Mn2O3(s) + H2O(l) + 2NH3(aq)","Na+(l) + Cl-(l) \u2192 Na(l) + 1/2Cl2(g)"],"correct":1,"explain":"The text gives the recharging reaction of a lead-storage battery as 2PbSO4(s) + 2H2O(l) \u2192 Pb(s) + PbO2(s) + 2H2SO4(aq)."},{"type":"fib","q":"A chemical reaction that releases heat to the surroundings is called an _______ reaction.","answer":"exothermic","explain":"The text defines a heat-releasing reaction as exothermic."},{"type":"fib","q":"A chemical reaction that absorbs heat from the surroundings is called an _______ reaction.","answer":"endothermic","explain":"The text defines a heat-absorbing reaction as endothermic."},{"type":"fib","q":"The heat transferred at constant temperature and pressure during a reaction is called the _______ of reaction.","answer":"enthalpy","explain":"The text names this quantity the enthalpy of reaction, symbol \u0394H."},{"type":"fib","q":"The device used to measure the heat released or absorbed during a chemical reaction is called a _______.","answer":"calorimeter","explain":"The text names this measuring device a calorimeter."},{"type":"fib","q":"The quantity of heat required to change the temperature of a substance by 1 K is called its heat _______.","answer":"capacity","explain":"The text defines heat capacity as the heat required to change a substance's temperature by 1 K."},{"type":"fib","q":"The heat capacity per gram of a substance, used to calculate q = c x mass x \u0394T, is called _______ heat capacity.","answer":"specific","explain":"The text names this quantity specific heat capacity (c)."},{"type":"fib","q":"Electrical conductivity due to the movement of free electrons through a material is called _______ conductivity.","answer":"metallic","explain":"The text names conductivity carried by electrons metallic conductivity."},{"type":"fib","q":"Electrical conductivity due to the movement of ions through a solution or molten compound is called _______ conductivity.","answer":"electrolytic","explain":"The text names conductivity carried by ions electrolytic conductivity."},{"type":"fib","q":"According to the text, _______ is described as the best electrical conductor among metals.","answer":"silver","explain":"The text states silver is the best electrical conductor."},{"type":"fib","q":"Electrolytes that dissociate completely, producing many ions in solution, are called _______ electrolytes.","answer":"strong","explain":"The text names electrolytes that fully dissociate strong electrolytes."},{"type":"fib","q":"An electrochemical cell in which a spontaneous redox reaction converts chemical energy into electrical energy is called a _______ cell.","answer":"galvanic","explain":"The text names such a cell a galvanic cell, also called a voltaic cell."},{"type":"fib","q":"Galvanic cells are named after the Italian scientists Luigi Galvani and Alessandro _______.","answer":"Volta","explain":"The text states galvanic cells are named after Galvani and Volta."},{"type":"fib","q":"Galvanic cells that are not rechargeable, such as the Daniell cell, are called _______ cells.","answer":"primary","explain":"The text names non-rechargeable galvanic cells primary cells."},{"type":"fib","q":"Galvanic cells that can be recharged, such as the lead storage battery, are called _______ cells.","answer":"secondary","explain":"The text names rechargeable galvanic cells secondary cells."},{"type":"fib","q":"In the Daniell cell, the electrode compartment is called a _______-cell, and the reactions occurring there are half-cell reactions.","answer":"half","explain":"The text names each compartment of the Daniell cell a half-cell."},{"type":"fib","q":"In the Daniell cell, the two half-cell solutions are linked by a _______ bridge to maintain electrical neutrality.","answer":"salt","explain":"The text names the connecting tube containing KCl-agar gel a salt bridge."},{"type":"fib","q":"In the Daniell cell, the anode (zinc) electrode loses mass and is sometimes called the _______ electrode.","answer":"sacrificial","explain":"The text states the anode of a galvanic cell, which loses mass, is sometimes called the sacrificial electrode."},{"type":"fib","q":"The zinc-carbon dry cell, also called the Leclanch\u00e9 cell, was invented by the French chemist Georges _______.","answer":"Leclanch\u00e9","explain":"The text credits Georges Leclanch\u00e9 with inventing this dry cell."},{"type":"fib","q":"In the zinc-carbon dry cell, the zinc can serves as the _______ of the cell.","answer":"anode","explain":"The text states the zinc can serves as the anode of the Leclanch\u00e9 dry cell."},{"type":"fib","q":"The voltage of a fresh zinc-carbon dry cell is initially about _______ V.","answer":"1.5","explain":"The text states the initial voltage of the dry cell is about 1.5 V."},{"type":"fib","q":"A lead storage battery, a secondary cell, delivers either 6 or _______ volts depending on the number of cells.","answer":"12","explain":"The text states the lead-storage battery usually delivers either 6 or 12 volts."},{"type":"fib","q":"A single lead-storage cell delivers about _______ volts.","answer":"2","explain":"The text states a single lead-storage cell delivers about 2 volts."},{"type":"fib","q":"The process of passing a direct current through a secondary cell to regenerate the original reactants is called _______.","answer":"charging","explain":"The text names this process charging or recharging."},{"type":"fib","q":"An electrochemical cell in which electrical energy drives a nonspontaneous reaction is called an _______ cell.","answer":"electrolytic","explain":"The text names such a cell an electrolytic cell."},{"type":"fib","q":"In an electrolytic cell, the electrode connected to the positive terminal of the source, through which electrons leave the cell, is called the _______.","answer":"anode","explain":"The text names the positively-charged electrode in an electrolytic cell the anode."},{"type":"fib","q":"In an electrolytic cell, the electrode connected to the negative terminal of the source, through which electrons enter the cell, is called the _______.","answer":"cathode","explain":"The text names the negatively-charged electrode in an electrolytic cell the cathode."},{"type":"fib","q":"The process of using electrical energy to break down a compound is called _______.","answer":"electrolysis","explain":"The text names this electrical decomposition process electrolysis."},{"type":"fib","q":"During electrolysis of molten sodium chloride, sodium metal forms at the cathode while _______ gas evolves at the anode.","answer":"chlorine","explain":"The text describes chlorine gas evolving at the anode during electrolysis of molten NaCl."},{"type":"fib","q":"According to the text, positive ions attracted to the cathode during electrolysis are called _______.","answer":"cations","explain":"The text names positive ions attracted to the cathode cations."},{"type":"fib","q":"According to the text, negative ions attracted to the anode during electrolysis are called _______.","answer":"anions","explain":"The text names negative ions attracted to the anode anions."}]},{"unit_number":5,"title":"Metals and Nonmetals","questions":[{"type":"mc","q":"About 80% of the known elements are metals, according to the text.","opts":["True","False"],"correct":0,"explain":"The text states about 80% of the known elements are metals."},{"type":"mc","q":"Metals are generally malleable, meaning they can be beaten into thin sheets.","opts":["True","False"],"correct":0,"explain":"The text states metals are malleable, meaning they can be beaten into thin sheets."},{"type":"mc","q":"Metals are generally poor conductors of heat and electricity.","opts":["True","False"],"correct":1,"explain":"The text describes metals as good conductors, and lists high thermal/electrical conductivity among typical metallic properties, so this statement is false."},{"type":"mc","q":"Lithium, potassium, and sodium are exceptions to the general rule that metals have high density.","opts":["True","False"],"correct":0,"explain":"The text states metals generally have high density except lithium, potassium, and sodium."},{"type":"mc","q":"Metals tend to lose electrons and act as reducing agents in chemical reactions.","opts":["True","False"],"correct":0,"explain":"The text states metals are oxidized by losing electrons and act as reducing agents."},{"type":"mc","q":"In the reactivity series, potassium is described in the text as the strongest reducing agent.","opts":["True","False"],"correct":0,"explain":"The text states potassium is the strongest reducing agent in the reactivity series shown."},{"type":"mc","q":"In the reactivity series, gold is described in the text as the weakest reducing agent.","opts":["True","False"],"correct":0,"explain":"The text states gold is the weakest reducing agent in the reactivity series."},{"type":"mc","q":"Noble metals such as gold, silver, and platinum are typically found in nature in their free, uncombined state.","opts":["True","False"],"correct":0,"explain":"The text states noble metals such as Ag, Au, Bi, Cu, Pd, and Pt exist in nature in an uncombined or free state."},{"type":"mc","q":"The science and technology of extracting metals from their ores is called metallurgy.","opts":["True","False"],"correct":0,"explain":"The text defines metallurgy as the science and technology of extracting metals from their ores."},{"type":"mc","q":"Unwanted impurities such as sand found together with an ore are called gangue.","opts":["True","False"],"correct":0,"explain":"The text names the impurities found with an ore, such as sand, gangue."},{"type":"mc","q":"The most active metals such as potassium, sodium, calcium, and magnesium are extracted mainly by electrolysis.","opts":["True","False"],"correct":0,"explain":"The text states these highly active metals are extracted from their compounds only by electrolysis because there is no economical reducing agent that can reduce them."},{"type":"mc","q":"Alloys are mixtures of two or more metals, or a metal and a nonmetal, that do not separate upon solidifying.","opts":["True","False"],"correct":0,"explain":"The text defines an alloy as a mixture of metals, or metal and nonmetal, that does not separate when solidified."},{"type":"mc","q":"Alloying a metal generally decreases its hardness and strength.","opts":["True","False"],"correct":1,"explain":"The text states alloying increases the hardness and strength of metals, not decreases it."},{"type":"mc","q":"Solder, an alloy used to join wires, contains about 67% tin and 33% lead, according to the text.","opts":["True","False"],"correct":0,"explain":"The text gives the composition of solder as 67% tin and 33% lead."},{"type":"mc","q":"A 24 carat gold alloy is described in the text as pure gold, containing no other metal.","opts":["True","False"],"correct":0,"explain":"The text states 24 carat gold represents pure gold with no other metal."},{"type":"mc","q":"Aluminum is the most abundant metal in the earth's crust, according to the text.","opts":["True","False"],"correct":0,"explain":"The text states aluminum is the most abundant metal in the earth's crust."},{"type":"mc","q":"Aluminum occurs in nature in its free, uncombined metallic state.","opts":["True","False"],"correct":1,"explain":"The text states aluminum does not occur in uncombined or free metal state in nature."},{"type":"mc","q":"Bauxite, Al2O3.2H2O, is described as the main mineral source of aluminum.","opts":["True","False"],"correct":0,"explain":"The text identifies bauxite (Al2O3.2H2O) as the main mineral of aluminum."},{"type":"mc","q":"Aluminum is industrially extracted mainly by the Hall-H\u00e9roult process.","opts":["True","False"],"correct":0,"explain":"The text states aluminum is industrially extracted mainly by the Hall-H\u00e9roult process."},{"type":"mc","q":"Cryolite is added to aluminum oxide during extraction mainly to increase its melting point.","opts":["True","False"],"correct":1,"explain":"The text states cryolite is added to reduce the melting point of aluminum oxide from 2045\u00b0C to 1000\u00b0C, not to increase it."},{"type":"mc","q":"Aluminum reacts with both dilute and concentrated nitric acid readily, releasing hydrogen gas.","opts":["True","False"],"correct":1,"explain":"The text states aluminum does not react with dilute or concentrated HNO3 due to formation of a protective oxide layer."},{"type":"mc","q":"Iron is extracted from its ore mainly through the blast furnace process.","opts":["True","False"],"correct":0,"explain":"The text describes the blast furnace as the primary industrial method for extracting iron from its ore."},{"type":"mc","q":"Steel is essentially an alloy of iron containing a controlled amount of carbon.","opts":["True","False"],"correct":0,"explain":"The text describes steel as an alloy of iron with a controlled small percentage of carbon."},{"type":"mc","q":"Copper is extracted mainly from the ore copper pyrites (chalcopyrite), according to the text.","opts":["True","False"],"correct":0,"explain":"The text identifies copper pyrites (chalcopyrite, CuFeS2) as a major ore from which copper is extracted."},{"type":"mc","q":"Nitrogen gas makes up approximately 80% of the Earth's atmosphere by volume, according to the text.","opts":["True","False"],"correct":0,"explain":"The text states nitrogen constitutes about 80% by volume of the atmosphere."},{"type":"mc","q":"Ammonia is industrially synthesized from nitrogen and hydrogen gases using the Haber process.","opts":["True","False"],"correct":0,"explain":"The text describes the Haber process as the industrial method for synthesizing ammonia from nitrogen and hydrogen."},{"type":"mc","q":"Phosphorus exists in nature mainly in its free elemental form rather than in compounds.","opts":["True","False"],"correct":1,"explain":"The text indicates phosphorus, like most reactive nonmetals, occurs mainly combined in minerals such as phosphate rock rather than free in nature."},{"type":"mc","q":"Oxygen is the most abundant element in the Earth's crust, according to the text.","opts":["True","False"],"correct":0,"explain":"The text states oxygen is the most abundant element in the Earth's crust."},{"type":"mc","q":"Sulphur is a key raw material used in the Contact process for manufacturing sulphuric acid.","opts":["True","False"],"correct":0,"explain":"The text describes sulphur (or sulphur dioxide derived from it) as the starting raw material in the Contact process for making sulphuric acid."},{"type":"mc","q":"Chlorine gas is commercially produced by the electrolysis of concentrated brine (sodium chloride solution).","opts":["True","False"],"correct":0,"explain":"The text describes the electrolysis of brine (concentrated NaCl solution) as a commercial method for producing chlorine gas."},{"type":"mc","q":"According to the text, approximately what percentage of the earth's crust is aluminum?","opts":["2%","8%","25%","50%"],"correct":1,"explain":"The text states approximately eight percent of the earth's crust is aluminum."},{"type":"mc","q":"The science and technology of extracting metals from their ores and compounding alloys is called:","opts":["Mineralogy","Metallurgy","Petrology","Geochemistry"],"correct":1,"explain":"The text defines metallurgy as the science and technology of extracting metals from ores and compounding alloys."},{"type":"mc","q":"Impurities such as sand found mixed with an ore are collectively called:","opts":["Slag","Gangue","Flux","Ore concentrate"],"correct":1,"explain":"The text names impurities such as sand found with an ore gangue."},{"type":"mc","q":"Which three principal steps are described in the text for extracting a metal from its ore?","opts":["Mining, smelting, casting","Preparation (concentration), production of the metal, and purification","Roasting, welding, painting","Mining, transportation, sale"],"correct":1,"explain":"The text lists preparation (concentration) of the ore, production of the metal, and purification of the metal as the three principal extraction steps."},{"type":"mc","q":"Which metals are extracted only by electrolysis, according to the text, because no economic reducing agent can reduce them?","opts":["Copper, silver, gold","Potassium, sodium, calcium, magnesium","Iron, zinc, lead","Platinum, palladium"],"correct":1,"explain":"The text states the most active metals such as K, Na, Ca, and Mg are extracted only by electrolysis."},{"type":"mc","q":"According to the text, gun metal is an alloy composed mainly of:","opts":["Copper, tin, and zinc","Iron and carbon","Aluminum, copper, and magnesium","Lead and tin"],"correct":0,"explain":"The text gives gun metal's composition as copper (87%), tin (10%), and zinc (3%)."},{"type":"mc","q":"Solder, an alloy used to join wires and electrical resistances, melts at what temperature according to the text?","opts":["100 \u00b0C","183 \u00b0C","232 \u00b0C","300 \u00b0C"],"correct":1,"explain":"The text states solder melts at 183\u00b0C, lower than the melting point of tin alone (232\u00b0C)."},{"type":"mc","q":"What mass percent of gold does 22 carat gold contain, according to the text's calculation?","opts":["100%","91.67%","75%","50%"],"correct":1,"explain":"The text calculates the mass % of gold in 22 carat gold as 22x100/24 = 91.67%."},{"type":"mc","q":"Which mineral is identified in the text as the main source of aluminum?","opts":["Hematite","Bauxite","Galena","Magnetite"],"correct":1,"explain":"The text identifies bauxite (Al2O3.2H2O) as aluminum's main mineral."},{"type":"mc","q":"Industrially, aluminum is extracted from bauxite mainly by which process?","opts":["Bessemer process","Contact process","Hall-H\u00e9roult process","Haber process"],"correct":2,"explain":"The text states aluminum is industrially extracted from bauxite mainly by the Hall-H\u00e9roult process."},{"type":"mc","q":"In the purification of bauxite, powdered ore is first heated with sodium hydroxide solution to convert silica into:","opts":["Sodium aluminate","Sodium silicate","Aluminum hydroxide","Aluminum oxide"],"correct":1,"explain":"The text describes SiO2 reacting with NaOH to form soluble sodium silicate (Na2SiO3)."},{"type":"mc","q":"Cryolite, Na3AlF6, is added to aluminum oxide during electrolysis mainly to:","opts":["Increase its melting point","Reduce its melting point and improve conductivity","Remove impurities","Increase its density"],"correct":1,"explain":"The text states cryolite reduces the melting point of Al2O3 from 2045\u00b0C to 1000\u00b0C and provides a good conducting medium."},{"type":"mc","q":"In the Hall-H\u00e9roult electrolytic cell, what happens at the graphite anode?","opts":["Aluminum ions are reduced to aluminum metal","The graphite electrode gradually oxidizes to carbon dioxide","Sodium hydroxide is produced","Bauxite is purified"],"correct":1,"explain":"The text explains that the anode (graphite electrode) gradually oxidizes to CO2 and must be replaced regularly."},{"type":"mc","q":"What is the density of aluminum, according to the text?","opts":["1.0 g/cm3","2.7 g/cm3","5.0 g/cm3","7.9 g/cm3"],"correct":1,"explain":"The text states aluminum has a density of 2.7 g/cm3."},{"type":"mc","q":"Aluminum does not react with dilute or concentrated nitric acid mainly because:","opts":["It is chemically inert","A protective oxide layer forms on its surface","Nitric acid is too weak","Aluminum is a nonmetal"],"correct":1,"explain":"The text explains that aluminum does not react with HNO3 due to formation of a protective oxide layer on its surface."},{"type":"mc","q":"In thermite welding, powdered aluminum reacts with iron (III) oxide because aluminum:","opts":["Is less reactive than iron","Is more reactive than iron and displaces it","Does not react with oxides","Is a nonmetal"],"correct":1,"explain":"The text explains that aluminum, being more reactive than iron, displaces iron from iron oxide in the thermite welding process."},{"type":"mc","q":"Which raw materials are charged into a blast furnace for the extraction of iron, according to the text?","opts":["Iron ore, coke, limestone, and hot air","Bauxite, cryolite, and coke","Iron ore and water only","Coal and iron scrap only"],"correct":0,"explain":"The text lists iron ore, coke, limestone, and hot air as the raw materials for blast furnace extraction of iron."},{"type":"mc","q":"In the blast furnace, carbon monoxide is primarily responsible for:","opts":["Melting the limestone","Reducing the iron oxides to metallic iron","Forming slag directly","Cooling the furnace"],"correct":1,"explain":"The text explains that carbon monoxide reduces the iron oxides to metallic iron in the blast furnace."},{"type":"mc","q":"What is the role of limestone (CaCO3) in the blast furnace, according to the text?","opts":["It acts as the main reducing agent","It decomposes to form CaO, which acts as a flux to remove impurities as slag","It supplies oxygen","It is the main ore of iron"],"correct":1,"explain":"The text explains that limestone decomposes by heat to give CaO, which acts as a flux, reacting with silica impurities to form slag."},{"type":"mc","q":"The iron obtained directly from the blast furnace is called:","opts":["Wrought iron","Pig iron","Steel","Cast iron only"],"correct":1,"explain":"The text names the iron obtained directly from the blast furnace pig iron."},{"type":"mc","q":"According to the text, pig iron typically has a carbon content of about:","opts":["0.1 - 0.5%","3.5 - 4.5%","10 - 15%","20 - 25%"],"correct":1,"explain":"The text states pig iron has a very high carbon content, typically 3.5-4.5%."},{"type":"mc","q":"The purest form of commercial iron, with purity increased to about 99.5%, is called:","opts":["Pig iron","Cast iron","Wrought iron","Stainless steel"],"correct":2,"explain":"The text states wrought iron is the purest commercial form of iron, with purity increased to 99.5%."},{"type":"mc","q":"Which of the following is NOT listed in the text as a technique for converting pig iron into steel?","opts":["Bessemer converter","Open-hearth furnace","Basic oxygen process","Fractional distillation"],"correct":3,"explain":"The text lists the Bessemer converter, open-hearth furnace, and basic oxygen process as steelmaking techniques; fractional distillation is not one of them."},{"type":"mc","q":"Copper is principally extracted from which ore, according to the text?","opts":["Malachite","Chalcopyrite (copper pyrites)","Azurite","Cuprite"],"correct":1,"explain":"The text states copper is principally extracted from chalcopyrite, CuFeS2."},{"type":"mc","q":"The impure copper obtained by roasting chalcopyrite is known as:","opts":["Wrought copper","Blister copper","Pig copper","Cast copper"],"correct":1,"explain":"The text names the impure copper obtained by roasting chalcopyrite blister copper."},{"type":"mc","q":"According to the text, nonmetals generally have which physical property, unlike metals?","opts":["High density and lustrous appearance","Low melting and boiling points and non-lustrous appearance","High tensile strength","Sonorous ringing sound when struck"],"correct":1,"explain":"The text lists low melting and boiling points and a non-lustrous appearance among the general physical properties of nonmetals."},{"type":"mc","q":"According to the text, nonmetals in chemical reactions tend to:","opts":["Lose electrons to form positive ions","Gain electrons to form negative ions","Never form ions","Always form metallic bonds"],"correct":1,"explain":"The text states nonmetals are electronegative and gain electrons to form negative ions."},{"type":"mc","q":"Nitrogen occurs in the atmosphere as a diatomic molecule, N2, making up about what percent by volume of the atmosphere, according to the text?","opts":["21%","50%","80%","95%"],"correct":2,"explain":"The text states nitrogen constitutes about 80% by volume of the atmosphere."},{"type":"mc","q":"Ammonia is industrially synthesized from nitrogen and hydrogen gas by which named process?","opts":["Ostwald process","Haber process","Contact process","Solvay process"],"correct":1,"explain":"The text names the Haber process as the industrial method for synthesizing ammonia from N2 and H2."},{"type":"mc","q":"According to the text, phosphorus occurs naturally only in the combined state, chiefly as:","opts":["Elemental phosphorus","Rock phosphate, Ca3(PO4)2","Phosphoric acid","Phosphine gas"],"correct":1,"explain":"The text states phosphorus exists naturally only in the combined state, such as in rock phosphate, Ca3(PO4)2."},{"type":"mc","q":"Phosphorus is manufactured by heating a mixture of rock phosphate, coke, and which other substance in an electric furnace, according to the text?","opts":["Limestone","Silica (SiO2)","Sodium hydroxide","Sulphuric acid"],"correct":1,"explain":"The text states phosphorus is manufactured by heating rock phosphate, coke, and silica (SiO2) in an electric furnace."},{"type":"mc","q":"Oxygen is described in the text as the most abundant element on earth, constituting about what percent by weight?","opts":["21%","46.6%","78%","8%"],"correct":1,"explain":"The text states oxygen constitutes about 46.6% by weight, making it the most abundant element on earth."},{"type":"mc","q":"Industrially, oxygen is obtained mainly by which method, according to the text?","opts":["Electrolysis of water only","Fractional distillation of liquid air","Heating potassium chlorate only","Roasting of ores"],"correct":1,"explain":"The text states oxygen is industrially obtained mainly by fractional distillation of liquid air."},{"type":"mc","q":"Sulphur is extracted from underground deposits of elemental sulphur by which named process?","opts":["Haber process","Frasch process","Solvay process","Contact process"],"correct":1,"explain":"The text names the Frasch process as the method for extracting elemental sulphur from underground deposits."},{"type":"mc","q":"According to the text, sulphur is the raw material for producing sulphuric acid via which industrial process?","opts":["Haber process","Ostwald process","Contact process","Hall-H\u00e9roult process"],"correct":2,"explain":"The text states sulphur is the raw material for sulphuric acid production by the Contact process."},{"type":"mc","q":"In the Contact process described in the text, sulphur is first oxidized to form:","opts":["Sulphur trioxide","Sulphur dioxide","Oleum","Sulphuric acid directly"],"correct":1,"explain":"The text describes Step 1 of the Contact process as the oxidation of sulphur to sulphur dioxide."},{"type":"mc","q":"In the Contact process, sulphur trioxide is absorbed into concentrated sulphuric acid to produce:","opts":["Oleum","Sulphurous acid","Sodium sulphate","Ammonium sulphate"],"correct":0,"explain":"The text describes the final step of the Contact process as sulphur trioxide being absorbed into concentrated sulphuric acid to produce oleum."},{"type":"mc","q":"The two most important allotropes of sulphur mentioned in the text are:","opts":["Alpha and beta sulphur (rhombic and monoclinic)","Red and white sulphur","Amorphous and crystalline sulphur only","Diamond and graphite sulphur"],"correct":0,"explain":"The text names rhombic (\u03b1) sulphur and monoclinic (\u03b2) sulphur as the most important allotropes of sulphur."},{"type":"mc","q":"Chlorine belongs to which group of the periodic table, according to the text?","opts":["Group IA","Group VIIA (halogens)","Group VIA","Group IIA"],"correct":1,"explain":"The text states chlorine belongs to group VIIA, known as the halogens."},{"type":"mc","q":"Chlorine gas is commercially manufactured by which method, according to the text?","opts":["Roasting of chlorides","Electrolysis of brine","Fractional distillation of air","Thermal decomposition of NaCl"],"correct":1,"explain":"The text states chlorine is manufactured by the electrolysis of brine."},{"type":"fib","q":"About _______% of the known elements are metals, according to the text.","answer":"80","explain":"The text states about 80% of the known elements are metals."},{"type":"fib","q":"Metals that can be beaten into thin sheets are described as _______.","answer":"malleable","explain":"The text states metals are malleable, able to be beaten into thin sheets."},{"type":"fib","q":"Metals that can be drawn into wires are described as _______.","answer":"ductile","explain":"The text states metals are ductile, able to be drawn into wires."},{"type":"fib","q":"The arrangement of metals in decreasing order of chemical activity is called the _______ series.","answer":"reactivity","explain":"The text names this arrangement the reactivity (or activity) series."},{"type":"fib","q":"The constituents of the earth's crust that contain metals or their compounds are known as _______.","answer":"minerals","explain":"The text names the metal-containing constituents of the earth's crust minerals."},{"type":"fib","q":"A mineral from which a metal can be profitably extracted is called an _______.","answer":"ore","explain":"The text defines an ore as a mineral containing a high enough percentage of a metal to be profitably extracted."},{"type":"fib","q":"Unwanted impurities such as sand mixed with an ore are collectively called _______.","answer":"gangue","explain":"The text names the impurities found with an ore gangue."},{"type":"fib","q":"The science and technology of extracting metals from their ores is called _______.","answer":"metallurgy","explain":"The text defines metallurgy as the science and technology of extracting metals from ores."},{"type":"fib","q":"A mixture of two or more metals, or a metal and a nonmetal, that does not separate on solidifying is called an _______.","answer":"alloy","explain":"The text defines an alloy as such a mixture that does not separate when solidified."},{"type":"fib","q":"A carat is equal to the mass unit of gold in _______ mass units of the alloy.","answer":"24","explain":"The text defines a carat as the mass unit of gold in 24 mass units of the alloy."},{"type":"fib","q":"Aluminum's main mineral, with the formula Al2O3.2H2O, is called _______.","answer":"bauxite","explain":"The text identifies bauxite as aluminum's main mineral."},{"type":"fib","q":"Aluminum is industrially extracted from bauxite mainly by the _______ process.","answer":"Hall-H\u00e9roult","explain":"The text names the Hall-H\u00e9roult (Hall) process as the industrial method for extracting aluminum."},{"type":"fib","q":"_______ is added to aluminum oxide during electrolysis to lower its melting point and improve conductivity.","answer":"Cryolite","explain":"The text states cryolite is added to reduce the melting point of Al2O3 and improve conductivity."},{"type":"fib","q":"The density of aluminum, as given in the text, is _______ g/cm3.","answer":"2.7","explain":"The text states aluminum has a density of 2.7 g/cm3."},{"type":"fib","q":"The extraction of iron from its ores is carried out in a _______ furnace.","answer":"blast","explain":"The text names the blast furnace as the apparatus used for extracting iron."},{"type":"fib","q":"The raw materials charged into a blast furnace are iron ore, coke, limestone, and hot _______.","answer":"air","explain":"The text lists iron ore, coke, limestone, and hot air as the raw materials for the blast furnace."},{"type":"fib","q":"The iron obtained directly from the blast furnace is called _______ iron.","answer":"pig","explain":"The text names the iron obtained directly from the blast furnace pig iron."},{"type":"fib","q":"The purest form of commercial iron, with purity around 99.5%, is called _______ iron.","answer":"wrought","explain":"The text names this purified form of iron wrought iron."},{"type":"fib","q":"The glass-like byproduct formed when calcium oxide reacts with silica impurities in the blast furnace is called _______.","answer":"slag","explain":"The text names the byproduct of CaO reacting with sand/silica impurities slag."},{"type":"fib","q":"One technique used to convert pig iron into steel, involving blowing hot air through molten pig iron in a cylindrical vessel, is called the _______ converter.","answer":"Bessemer","explain":"The text names this steelmaking technique the Bessemer converter."},{"type":"fib","q":"Copper is principally extracted from the ore _______, with formula CuFeS2.","answer":"chalcopyrite","explain":"The text identifies chalcopyrite (copper pyrites), CuFeS2, as copper's principal ore."},{"type":"fib","q":"The impure copper obtained after roasting chalcopyrite is called _______ copper.","answer":"blister","explain":"The text names the impure copper produced from roasting chalcopyrite blister copper."},{"type":"fib","q":"Nonmetals, unlike metals, are generally _______ conductors of heat and electricity.","answer":"poor","explain":"The text lists poor conductivity of heat and electricity among the general properties of nonmetals."},{"type":"fib","q":"Nitrogen exists in the atmosphere as a diatomic molecule and makes up about _______% of the atmosphere by volume.","answer":"80","explain":"The text states nitrogen constitutes about 80% by volume of the atmosphere."},{"type":"fib","q":"Ammonia is manufactured industrially from nitrogen and hydrogen gas by the _______ process.","answer":"Haber","explain":"The text names the Haber process for industrial ammonia synthesis."},{"type":"fib","q":"Phosphorus occurs naturally only in the combined state, chiefly as rock _______, Ca3(PO4)2.","answer":"phosphate","explain":"The text identifies rock phosphate, Ca3(PO4)2, as the naturally occurring combined form of phosphorus."},{"type":"fib","q":"Oxygen is the most abundant element on earth, constituting about _______% by weight.","answer":"46.6","explain":"The text states oxygen makes up about 46.6% of the earth by weight."},{"type":"fib","q":"Oxygen is industrially obtained mainly by fractional distillation of liquid _______.","answer":"air","explain":"The text states oxygen is industrially obtained by fractional distillation of liquid air."},{"type":"fib","q":"Elemental sulphur is extracted from underground deposits using the _______ process.","answer":"Frasch","explain":"The text names the Frasch process as the method for extracting underground elemental sulphur."},{"type":"fib","q":"Sulphuric acid is industrially manufactured from sulphur using the _______ process.","answer":"Contact","explain":"The text names the Contact process for industrial sulphuric acid manufacture."}]},{"unit_number":6,"title":"Hydrocarbons and Their Natural Sources","questions":[{"type":"mc","q":"The German chemist Friedrich W\u00f6hler discovered in 1828 that urea could be synthesized in the laboratory from ammonium cyanate.","opts":["True","False"],"correct":0,"explain":"The text states Friedrich W\u00f6hler discovered in 1828 that urea could be synthesized from ammonium cyanate, disproving vitalism."},{"type":"mc","q":"According to Vitalism theory, only living organisms could synthesize organic compounds through a vital force.","opts":["True","False"],"correct":0,"explain":"The text describes Vitalism theory as holding that only living things could synthesize organic compounds through a vital force."},{"type":"mc","q":"Catenation is the ability of atoms of the same element to join together to form chains and rings.","opts":["True","False"],"correct":0,"explain":"The text defines catenation as the ability of atoms of the same element to join together to form chains and rings."},{"type":"mc","q":"Compounds that contain only carbon and hydrogen atoms are called hydrocarbons.","opts":["True","False"],"correct":0,"explain":"The text defines hydrocarbons as compounds containing only carbon and hydrogen atoms."},{"type":"mc","q":"Benzene, C6H6, is described in the text as a typical aliphatic hydrocarbon.","opts":["True","False"],"correct":1,"explain":"The text describes benzene as a typical aromatic hydrocarbon, not aliphatic."},{"type":"mc","q":"Alkanes are described as saturated hydrocarbons because their molecules contain only single bonds.","opts":["True","False"],"correct":0,"explain":"The text describes alkanes as saturated because they contain only single bonds and the maximum possible number of hydrogens per carbon."},{"type":"mc","q":"A homologous series is a group of compounds where each member differs from the next by a constant CH2 unit.","opts":["True","False"],"correct":0,"explain":"The text defines a homologous series as one where each member differs from the next by a constant -CH2- unit."},{"type":"mc","q":"At room temperature, the first four members of the unbranched alkane series (methane to butane) are liquids.","opts":["True","False"],"correct":1,"explain":"The text states the first four members of unbranched alkanes are gases at room temperature, not liquids."},{"type":"mc","q":"According to the text, alkanes as a class are the least dense of all groups of organic compounds.","opts":["True","False"],"correct":0,"explain":"The text states alkanes are the least dense of all groups of organic compounds, with densities less than 1.00 g/mL."},{"type":"mc","q":"Structural isomers have the same molecular formula but different connectivity or structure.","opts":["True","False"],"correct":0,"explain":"The text defines structural isomers as compounds with the same molecular formula but different connectivity/structure."},{"type":"mc","q":"The W\u0171rtz reaction involves the reaction of a halogenated alkane with sodium to form a larger alkane.","opts":["True","False"],"correct":0,"explain":"The text describes the W\u0171rtz reaction as 2R-X + 2Na \u2192 R-R + 2NaX, forming a larger alkane from an alkyl halide and sodium."},{"type":"mc","q":"Alkanes are commonly called paraffins, a term meaning 'great affinity' for other substances.","opts":["True","False"],"correct":1,"explain":"The text states paraffin comes from Latin parum affinis, meaning 'little affinity,' not great affinity."},{"type":"mc","q":"The combustion of alkanes with oxygen produces carbon dioxide, water, and releases heat.","opts":["True","False"],"correct":0,"explain":"The text describes alkane combustion as producing CO2, water, and a large amount of heat."},{"type":"mc","q":"Halogenation of alkanes with chlorine or bromine in the presence of light is an example of a substitution reaction.","opts":["True","False"],"correct":0,"explain":"The text describes halogenation of alkanes as a substitution reaction that proceeds via a free-radical chain mechanism."},{"type":"mc","q":"Cycloalkanes have the general formula CnH2n, the same as alkenes.","opts":["True","False"],"correct":0,"explain":"The text states cycloalkanes have the general formula CnH2n, the same general formula as alkenes, though they are structurally different classes."},{"type":"mc","q":"Alkenes are unsaturated hydrocarbons containing at least one carbon-carbon double bond, represented by general formula CnH2n.","opts":["True","False"],"correct":0,"explain":"The text defines alkenes as unsaturated hydrocarbons with at least one C=C double bond and general formula CnH2n."},{"type":"mc","q":"Ethene occurs naturally as a plant hormone involved in the ripening of fruits such as tomatoes and bananas.","opts":["True","False"],"correct":0,"explain":"The text states ethene occurs naturally as a plant hormone involved in ripening of fruits like tomatoes and bananas."},{"type":"mc","q":"According to Markovnikov's rule, when HX adds to an alkene, the hydrogen adds to the carbon with the fewer hydrogen atoms.","opts":["True","False"],"correct":1,"explain":"The text's statement of Markovnikov's rule says hydrogen adds to the carbon atom of the double bond that has the greater number of hydrogen atoms, not fewer."},{"type":"mc","q":"Alkaline potassium permanganate (Baeyer's reagent) is used as a qualitative test for unsaturation in a compound.","opts":["True","False"],"correct":0,"explain":"The text describes alkaline KMnO4 (Baeyer's reagent) as a test for unsaturation, causing the purple colour to fade in the presence of unsaturated compounds."},{"type":"mc","q":"Cis-trans (geometrical) isomerism in alkenes arises because free rotation about the double bond is possible.","opts":["True","False"],"correct":1,"explain":"The text states geometrical isomerism exists specifically because free rotation about the double bond is NOT possible."},{"type":"mc","q":"Alkynes contain at least one carbon-carbon triple bond and are represented by the general formula CnH2n-2.","opts":["True","False"],"correct":0,"explain":"The text defines alkynes as containing a triple bond with general formula CnH2n-2."},{"type":"mc","q":"The simplest alkyne, ethyne, is also commonly known as acetylene.","opts":["True","False"],"correct":0,"explain":"The text states the simplest alkyne, ethyne, is also known as acetylene."},{"type":"mc","q":"Alkynes can show geometrical (cis-trans) isomerism just like alkenes.","opts":["True","False"],"correct":1,"explain":"The text explicitly states alkynes show chain and position isomerism, but not geometrical or cis-trans isomerism."},{"type":"mc","q":"Calcium carbide reacts with water to produce acetylene gas and calcium hydroxide.","opts":["True","False"],"correct":0,"explain":"The text gives the reaction CaC2(s) + 2H2O(l) \u2192 Ca(OH)2(aq) + C2H2(g), producing acetylene."},{"type":"mc","q":"Prolonged heating of acetylene at 600-700\u00b0C can produce benzene through trimerization.","opts":["True","False"],"correct":0,"explain":"The text describes the trimerization of acetylene at 600-700\u00b0C to yield benzene."},{"type":"mc","q":"Benzene's first structure, proposed by August Kekul\u00e9 in 1872, consisted of a six-membered ring with alternating single and double bonds.","opts":["True","False"],"correct":0,"explain":"The text states August Kekul\u00e9 proposed benzene's first structure in 1872 as a six-membered ring with alternating single and double bonds."},{"type":"mc","q":"Benzene readily decolorizes bromine water and cold alkaline potassium permanganate, just like alkenes.","opts":["True","False"],"correct":1,"explain":"The text states benzene does NOT decolorize bromine water or react with cold alkaline KMnO4, unlike alkenes, due to the stability of the aromatic ring."},{"type":"mc","q":"Natural gas consists chiefly of methane, making up more than 90% of its composition.","opts":["True","False"],"correct":0,"explain":"The text states natural gas consists chiefly of methane, more than 90%."},{"type":"mc","q":"Cracking is the decomposition of large hydrocarbon molecules into smaller ones using heat or catalysts.","opts":["True","False"],"correct":0,"explain":"The text defines cracking as the decomposition of large hydrocarbon molecules into smaller ones by heat or catalysts."},{"type":"mc","q":"Coke, obtained from the destructive distillation of coal, is a solid and relatively pure form of carbon used as a fuel in the blast furnace.","opts":["True","False"],"correct":0,"explain":"The text describes coke as a solid, relatively pure form of carbon used as a fuel in the blast furnace during iron extraction."},{"type":"mc","q":"Which German chemist discovered in 1828 that urea could be synthesized in the laboratory from an inorganic compound?","opts":["August Kekul\u00e9","Friedrich W\u00f6hler","Charles-Adolphe W\u0171rtz","Amedeo Avogadro"],"correct":1,"explain":"The text credits Friedrich W\u00f6hler with the 1828 synthesis of urea from ammonium cyanate."},{"type":"mc","q":"According to the text, W\u00f6hler synthesized urea by evaporating an aqueous solution of which inorganic compound?","opts":["Ammonium chloride","Ammonium cyanate","Sodium cyanide","Calcium carbonate"],"correct":1,"explain":"The text states W\u00f6hler synthesized urea by evaporating an aqueous solution of ammonium cyanate."},{"type":"mc","q":"Organic chemistry is today defined in the text as the study of:","opts":["All compounds containing hydrogen","Carbon compounds, except oxides of carbon, carbonates, and a few related compounds","Only compounds isolated from living organisms","Compounds with no carbon at all"],"correct":1,"explain":"The text defines organic chemistry as the study of carbon compounds except oxides of carbon, carbonates, hydrogen carbonates, cyanides, and cyanates."},{"type":"mc","q":"The property of carbon that allows it to form long chains and rings by bonding to itself is called:","opts":["Catenation","Hybridization","Polymerization","Isomerization"],"correct":0,"explain":"The text names carbon's ability to form chains and rings through self-bonding catenation."},{"type":"mc","q":"A part of a molecule that determines its characteristic chemical behavior is called a:","opts":["Substituent","Functional group","Homologue","Isomer"],"correct":1,"explain":"The text defines a functional group as a group of atoms and/or bonds with characteristic chemical behavior."},{"type":"mc","q":"Compounds that contain only carbon and hydrogen atoms are called:","opts":["Carbohydrates","Hydrocarbons","Hydrides","Alcohols"],"correct":1,"explain":"The text defines hydrocarbons as compounds containing only carbon and hydrogen atoms."},{"type":"mc","q":"Hydrocarbons whose molecules contain only single bonds and the maximum possible number of hydrogens per carbon are called:","opts":["Unsaturated hydrocarbons","Aromatic hydrocarbons","Saturated hydrocarbons","Cyclic hydrocarbons"],"correct":2,"explain":"The text describes saturated hydrocarbons, such as alkanes, as containing only single bonds and the maximum number of hydrogens per carbon."},{"type":"mc","q":"According to the text, alkanes have the general formula:","opts":["CnH2n","CnH2n-2","CnH2n+2","CnHn"],"correct":2,"explain":"The text gives the general formula of alkanes as CnH2n+2."},{"type":"mc","q":"A group of compounds in which each member differs from the next by a constant -CH2- unit is called a:","opts":["Isomeric series","Homologous series","Functional series","Substituent series"],"correct":1,"explain":"The text defines a homologous series as a group where each member differs from the next by a constant -CH2- group."},{"type":"mc","q":"At room temperature (25\u00b0C, 1 atm), which of the following unbranched alkanes is described in the text as a liquid?","opts":["Methane","Ethane","Propane","Pentane"],"correct":3,"explain":"The text's Table 6.3 shows pentane as a liquid at room temperature, while methane through butane are gases."},{"type":"mc","q":"According to the text's Table 6.3, unbranched alkanes with how many or more carbon atoms are solids at room temperature?","opts":["10 or more","14 or more","18 or more","25 or more"],"correct":2,"explain":"The text states unbranched alkanes with 18 or more carbon atoms are solids at room temperature."},{"type":"mc","q":"The chemical name-part that identifies the various substituent groups in an IUPAC alkane name is called the:","opts":["Locant","Prefix","Parent","Suffix"],"correct":1,"explain":"The text states the prefix identifies the various substituent groups in the molecule in IUPAC nomenclature."},{"type":"mc","q":"The part of an IUPAC alkane name that selects the longest chain and tells how many carbons it contains is called the:","opts":["Locant","Prefix","Parent","Suffix"],"correct":2,"explain":"The text states the parent selects the main (longest) chain and tells how many carbon atoms it contains."},{"type":"mc","q":"When removing one hydrogen atom from an alkane, the resulting group is called an:","opts":["Alkoxide","Alkyl group","Alkanoate","Aryl group"],"correct":1,"explain":"The text states removing one hydrogen from an alkane gives an alkyl group or alkyl radical."},{"type":"mc","q":"Compounds with the same molecular formula but different structures, such as butane and isobutane, are called:","opts":["Homologues","Structural isomers","Functional groups","Alkyl radicals"],"correct":1,"explain":"The text defines structural isomers as compounds with the same molecular formula but different connectivity, as with butane and isobutane."},{"type":"mc","q":"According to the text, alkanes are chemically inert to most laboratory reagents and are sometimes called:","opts":["Alkenes","Paraffins","Aromatics","Alcohols"],"correct":1,"explain":"The text states alkanes are sometimes called paraffins, from Latin parum affinis meaning 'little affinity.'"},{"type":"mc","q":"The general combustion equation of alkanes produces carbon dioxide, water, and:","opts":["Nitrogen gas","A large amount of heat","Hydrogen gas","Ammonia"],"correct":1,"explain":"The text states alkane combustion produces CO2 and water, releasing a large amount of heat."},{"type":"mc","q":"Which reaction type describes the halogenation of alkanes with chlorine or bromine in the presence of light?","opts":["Addition reaction","Substitution reaction","Elimination reaction","Polymerization"],"correct":1,"explain":"The text classifies alkane halogenation with chlorine/bromine as a substitution reaction."},{"type":"mc","q":"An atom or group of atoms possessing an unpaired electron, generated during the chain-initiating step of halogenation, is called a:","opts":["Free radical","Carbocation","Carbanion","Nucleophile"],"correct":0,"explain":"The text defines a free radical as an atom or group of atoms possessing an unpaired electron, generated in the chain-initiating step."},{"type":"mc","q":"Which reaction method is named after French chemist Charles-Adolphe W\u0171rtz, involving reaction of an alkyl halide with sodium?","opts":["Hydrogenation of alkenes","W\u0171rtz reaction","Decarboxylation","Cracking"],"correct":1,"explain":"The text names the reaction of a halogenated alkane with sodium metal the W\u0171rtz reaction, after Charles-Adolphe W\u0171rtz."},{"type":"mc","q":"Alkanes containing carbon atoms arranged in a ring, with general formula CnH2n, are called:","opts":["Aromatic hydrocarbons","Cycloalkanes","Alkenes","Alkynes"],"correct":1,"explain":"The text defines cycloalkanes as alkanes with carbon atoms arranged in a ring, general formula CnH2n."},{"type":"mc","q":"Alkenes are unsaturated hydrocarbons that contain at least one carbon-carbon double bond and are also known as:","opts":["Paraffins","Olefins","Acetylenes","Arenes"],"correct":1,"explain":"The text states alkenes are also known as olefins."},{"type":"mc","q":"Ethene is used, according to the text, as a starting material for synthesizing which polymer, among others?","opts":["Nylon","Polyethylene","Polyester","Rubber"],"correct":1,"explain":"The text states ethene is used as a starting material for synthesizing polyethylene, among other industrial compounds."},{"type":"mc","q":"According to Markovnikov's rule as described in the text, when HX adds to an alkene, hydrogen adds to the carbon atom that has:","opts":["The greater number of hydrogen atoms","The fewer number of hydrogen atoms","No hydrogen atoms","Equal numbers on both carbons only"],"correct":0,"explain":"The text's statement of Markovnikov's rule says hydrogen adds to the carbon of the double bond with the greater number of hydrogen atoms."},{"type":"mc","q":"Which reagent is used in the text to detect unsaturation because its reddish-brown colour disappears upon reaction?","opts":["Bromine in CCl4","Sodium hydroxide","Dilute HCl","Silver nitrate"],"correct":0,"explain":"The text describes bromine in CCl4 (bromine water) as used to detect unsaturation because its reddish-brown colour disappears when it adds across a double bond."},{"type":"mc","q":"Geometrical (cis-trans) isomerism in alkenes exists because:","opts":["Free rotation about the double bond is not possible","Alkenes have no functional group","Carbon atoms can only bond to hydrogen","Alkenes are always symmetrical"],"correct":0,"explain":"The text explains that geometrical isomerism exists because free rotation about the C=C double bond is not possible."},{"type":"mc","q":"Alkenes can be prepared in the laboratory by dehydration of alcohols using concentrated sulphuric acid, a process that removes:","opts":["A hydrogen atom only","A water molecule","A halogen atom","An oxygen atom only"],"correct":1,"explain":"The text describes dehydration of alcohols as removing a water molecule to form an alkene."},{"type":"mc","q":"The simplest alkyne, with the common name acetylene, is known by the IUPAC name:","opts":["Methyne","Ethyne","Propyne","Butyne"],"correct":1,"explain":"The text gives ethyne as the IUPAC name for the simplest alkyne, commonly called acetylene."},{"type":"mc","q":"Alkynes are represented by the general formula:","opts":["CnH2n","CnH2n+2","CnH2n-2","CnHn"],"correct":2,"explain":"The text gives the general formula of alkynes as CnH2n-2."},{"type":"mc","q":"Acetylene is prepared in the laboratory by reacting calcium carbide with:","opts":["Dilute hydrochloric acid","Water","Concentrated sulphuric acid","Sodium hydroxide"],"correct":1,"explain":"The text gives the reaction CaC2(s) + 2H2O(l) \u2192 Ca(OH)2(aq) + C2H2(g) for laboratory preparation of acetylene."},{"type":"mc","q":"Partial hydrogenation of alkynes using Lindlar's catalyst produces which type of product?","opts":["Alkanes","Cis-alkenes","Trans-alkenes","Aromatic compounds"],"correct":1,"explain":"The text states partial hydrogenation of alkynes with Lindlar's catalyst always gives the cis-alkene."},{"type":"mc","q":"Prolonged heating of acetylene at 600-700\u00b0C causes trimerization to form which compound?","opts":["Ethene","Propyne","Benzene","Naphthalene"],"correct":2,"explain":"The text describes the trimerization of acetylene at 600-700\u00b0C, producing benzene."},{"type":"mc","q":"Combustion of acetylene with oxygen in an oxy-acetylene torch produces a flame of about what temperature, according to the text?","opts":["300 \u00b0C","1000 \u00b0C","3000 \u00b0C","5000 \u00b0C"],"correct":2,"explain":"The text states combustion of acetylene with oxygen produces an intensely hot flame of about 3000\u00b0C."},{"type":"mc","q":"Benzene's first structural proposal, a six-membered ring with alternating single and double bonds, was made by:","opts":["Friedrich W\u00f6hler","August Kekul\u00e9","Charles W\u0171rtz","Amedeo Avogadro"],"correct":1,"explain":"The text credits August Kekul\u00e9 with proposing the first structure for benzene, in 1872."},{"type":"mc","q":"According to the text, benzene is more stable than alkenes and fails to undergo characteristic alkene addition and oxidation reactions due to:","opts":["Its high molecular weight","The stability of the aromatic ring","Its low boiling point","Its solubility in water"],"correct":1,"explain":"The text explains benzene's resistance to typical alkene reactions is due to the stability of the aromatic ring."},{"type":"mc","q":"Benzene reacts with bromine in the presence of iron(III) chloride catalyst via which type of reaction?","opts":["Addition reaction","Substitution reaction","Elimination reaction","Hydrogenation"],"correct":1,"explain":"The text describes benzene's halogenation with bromine and FeBr3 catalyst as a substitution reaction characteristic of aromatic compounds."},{"type":"mc","q":"Nitration of benzene using concentrated nitric and sulphuric acids at 50\u00b0C produces:","opts":["Benzenesulphonic acid","Nitrobenzene","Bromobenzene","Cyclohexane"],"correct":1,"explain":"The text describes benzene's nitration reaction with HNO3/H2SO4 producing nitrobenzene."},{"type":"mc","q":"Natural gas is composed chiefly of which hydrocarbon, making up more than 90% of it, according to the text?","opts":["Ethane","Propane","Methane","Butane"],"correct":2,"explain":"The text states natural gas is chiefly composed of methane, more than 90%."},{"type":"mc","q":"The word petroleum, derived from Latin, literally means:","opts":["Black liquid","Rock oil","Burning water","Earth's blood"],"correct":1,"explain":"The text explains petroleum comes from Latin 'petra' (rock) and 'oleum' (oil), meaning rock oil."},{"type":"mc","q":"The decomposition of large hydrocarbon molecules into smaller ones by heat or catalysts is called:","opts":["Fractional distillation","Cracking","Reforming","Polymerization"],"correct":1,"explain":"The text defines cracking as the decomposition of large hydrocarbon molecules into smaller ones using heat (thermal cracking) or catalysts."},{"type":"fib","q":"The theory holding that organic compounds could only be synthesized by living organisms through a vital force is called _______.","answer":"vitalism","explain":"The text names this superseded 19th-century theory vitalism."},{"type":"fib","q":"The German chemist who synthesized urea from ammonium cyanate in 1828, disproving vitalism, was Friedrich _______.","answer":"W\u00f6hler","explain":"The text credits Friedrich W\u00f6hler with this 1828 synthesis."},{"type":"fib","q":"The ability of atoms of the same element, especially carbon, to join together to form chains and rings is called _______.","answer":"catenation","explain":"The text names this bonding ability catenation."},{"type":"fib","q":"A group of atoms and/or bonds within a molecule that has characteristic chemical behaviour is called a _______ group.","answer":"functional","explain":"The text defines this structural feature a functional group."},{"type":"fib","q":"Compounds that contain only carbon and hydrogen atoms are called _______.","answer":"hydrocarbons","explain":"The text defines hydrocarbons as compounds of carbon and hydrogen only."},{"type":"fib","q":"Hydrocarbons containing a low hydrogen-to-carbon ratio, such as benzene, are classified as _______ hydrocarbons.","answer":"aromatic","explain":"The text classifies benzene-type hydrocarbons as aromatic hydrocarbons."},{"type":"fib","q":"Hydrocarbons whose molecules contain only single bonds and the maximum number of hydrogens per carbon are called _______ hydrocarbons.","answer":"saturated","explain":"The text defines saturated hydrocarbons as those with only single bonds and the maximum hydrogens per carbon."},{"type":"fib","q":"Alkanes are represented by the general formula Cn H2n+_______.","answer":"2","explain":"The text gives the general formula of alkanes as CnH2n+2."},{"type":"fib","q":"A group of compounds in which each member differs from the next by a constant -CH2- unit is called a _______ series.","answer":"homologous","explain":"The text names such a group a homologous series."},{"type":"fib","q":"Compounds having the same molecular formula but different structures, such as butane and isobutane, are called structural _______.","answer":"isomers","explain":"The text names such compounds structural isomers."},{"type":"fib","q":"The system of chemical nomenclature devised by the International Union of Pure and Applied Chemistry is abbreviated _______.","answer":"IUPAC","explain":"The text names this naming system IUPAC."},{"type":"fib","q":"A group formed by removing one hydrogen atom from an alkane, with names ending in -yl, is called an _______ group.","answer":"alkyl","explain":"The text names such a group an alkyl group or alkyl radical."},{"type":"fib","q":"Alkanes are sometimes called _______, a term derived from Latin words meaning 'little affinity.'","answer":"paraffins","explain":"The text states alkanes are sometimes called paraffins."},{"type":"fib","q":"The most important reaction of alkanes, in which they react with oxygen to release heat, carbon dioxide, and water, is called _______.","answer":"combustion","explain":"The text names the reaction of alkanes with oxygen combustion."},{"type":"fib","q":"The reaction type in which one atom or group in a molecule is replaced by another, as in the halogenation of alkanes, is called a _______ reaction.","answer":"substitution","explain":"The text names this reaction type a substitution reaction."},{"type":"fib","q":"An atom or group of atoms possessing an unpaired electron, formed during the chain-initiating step of halogenation, is called a free _______.","answer":"radical","explain":"The text names such reactive species free radicals."},{"type":"fib","q":"The reaction of a halogenated alkane with sodium metal to form a larger alkane is called the _______ reaction, named after a French chemist.","answer":"W\u0171rtz","explain":"The text names this reaction the W\u0171rtz reaction."},{"type":"fib","q":"Alkanes in which the carbon atoms are arranged in a ring, with the general formula CnH2n, are called _______.","answer":"cycloalkanes","explain":"The text names such ring-shaped alkanes cycloalkanes."},{"type":"fib","q":"Unsaturated hydrocarbons containing at least one carbon-carbon double bond, with the general formula CnH2n, are called _______.","answer":"alkenes","explain":"The text defines alkenes as containing at least one C=C double bond, general formula CnH2n."},{"type":"fib","q":"Alkenes are also commonly known by the older name _______.","answer":"olefins","explain":"The text states alkenes are also known as olefins."},{"type":"fib","q":"The rule stating that hydrogen adds to the carbon atom of an alkene's double bond with the greater number of hydrogen atoms is called _______'s rule.","answer":"Markovnikov","explain":"The text names this rule Markovnikov's rule."},{"type":"fib","q":"The reagent used to test for unsaturation, whose reddish-brown colour fades when it reacts with a double or triple bond, is bromine in _______.","answer":"CCl4","explain":"The text names this reagent bromine in CCl4 (bromine water)."},{"type":"fib","q":"Isomerism arising from the difference in spatial arrangement of groups about a double bond is called _______ isomerism.","answer":"geometrical","explain":"The text names this type of isomerism geometrical (cis-trans) isomerism."},{"type":"fib","q":"Unsaturated hydrocarbons containing at least one carbon-carbon triple bond, with general formula CnH2n-2, are called _______.","answer":"alkynes","explain":"The text defines alkynes as containing a triple bond, general formula CnH2n-2."},{"type":"fib","q":"The simplest alkyne, ethyne, is also commonly known by the name _______.","answer":"acetylene","explain":"The text states ethyne is also commonly called acetylene."},{"type":"fib","q":"Acetylene is prepared in the laboratory by reacting calcium carbide, CaC2, with _______.","answer":"water","explain":"The text describes the reaction of calcium carbide with water to produce acetylene."},{"type":"fib","q":"Prolonged heating of acetylene at 600-700\u00b0C causes trimerization to form the aromatic compound _______.","answer":"benzene","explain":"The text describes acetylene trimerizing under prolonged heating to form benzene."},{"type":"fib","q":"The first structure proposed for benzene, a six-membered ring with alternating single and double bonds, is called a _______ structure.","answer":"Kekul\u00e9","explain":"The text names this proposed benzene structure the Kekul\u00e9 structure, after August Kekul\u00e9."},{"type":"fib","q":"Natural gas consists chiefly of the alkane _______, making up more than 90% of its composition.","answer":"methane","explain":"The text states natural gas is chiefly composed of methane."},{"type":"fib","q":"The decomposition of large hydrocarbon molecules into smaller ones by the application of heat or catalysts is called _______.","answer":"cracking","explain":"The text names this process cracking."}]}]}
