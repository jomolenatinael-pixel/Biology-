<script>
(function(){
  "use strict";
  var quizData = JSON.parse(document.getElementById('quiz-data').textContent);
  var units = quizData.units;

  var screenLanding = document.getElementById('screen-landing');
  var screenQuiz = document.getElementById('screen-quiz');
  var screenSummary = document.getElementById('screen-summary');

  var unitProgress = {}; // unitNumber -> {index, answers:[{selected, correct, checked}]}

  function freshProgress(unit){
    return {
      index:0,
      answers: unit.questions.map(function(){ return {checked:false, selected:null, correct:false}; })
    };
  }

  function letterFor(i){ return String.fromCharCode(65+i); }

  function normalizeAnswer(s){
    return String(s).toLowerCase().trim().replace(/[.,;:!?'"()]/g,'').replace(/\s+/g,' ');
  }

  // ---------------- LANDING ----------------
  function renderLanding(){
    var list = document.getElementById('unit-list');
    list.innerHTML = '';
    units.forEach(function(unit){
      var prog = unitProgress[unit.unit_number];
      var card = document.createElement('div');
      card.className = 'unit-card';
      card.setAttribute('role','button');
      card.setAttribute('tabindex','0');

      var pillHtml = '';
      if(prog){
        var answeredCount = prog.answers.filter(function(a){return a.checked;}).length;
        if(answeredCount === unit.questions.length){
          var correctCount = prog.answers.filter(function(a){return a.correct;}).length;
          var pct = Math.round((correctCount/unit.questions.length)*100);
          pillHtml = '<div class="unit-progress-pill show">'+pct+'% done</div>';
        } else if(answeredCount > 0){
          pillHtml = '<div class="unit-progress-pill show">'+answeredCount+'/'+unit.questions.length+' in progress</div>';
        }
      }

      card.innerHTML =
        '<div class="unit-num">'+unit.unit_number+'</div>' +
        '<div class="unit-info">' +
          '<div class="t">'+escapeHtml(unit.title)+'</div>' +
          '<div class="m">'+unit.questions.length+' questions</div>' +
        '</div>' +
        pillHtml +
        '<div class="unit-chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>';

      card.addEventListener('click', function(){ openUnit(unit.unit_number); });
      card.addEventListener('keydown', function(e){
        if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openUnit(unit.unit_number); }
      });
      list.appendChild(card);
    });
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------------- NAVIGATION BETWEEN SCREENS ----------------
  function showScreen(name){
    screenLanding.classList.add('hidden');
    screenQuiz.classList.add('hidden');
    screenSummary.classList.add('hidden');
    if(name==='landing') screenLanding.classList.remove('hidden');
    if(name==='quiz') screenQuiz.classList.remove('hidden');
    if(name==='summary') screenSummary.classList.remove('hidden');
    window.scrollTo({top:0, behavior:'auto'});
  }

  var currentUnitNumber = null;

  function getUnit(num){
    return units.filter(function(u){ return u.unit_number === num; })[0];
  }

  function openUnit(num){
    currentUnitNumber = num;
    if(!unitProgress[num]){
      unitProgress[num] = freshProgress(getUnit(num));
    }
    var prog = unitProgress[num];
    // if the unit was already fully completed, re-open at question 1 view but keep answers (review mode) OR simply resume.
    if(prog.index >= getUnit(num).questions.length){
      // fully completed previously -> go straight to summary
      showSummaryScreen(num);
      return;
    }
    showScreen('quiz');
    document.getElementById('quiz-unit-title').textContent = 'Unit '+num+': '+getUnit(num).title;
    renderQuestion();
  }

  function backToUnits(){
    renderLanding();
    showScreen('landing');
  }
  document.getElementById('back-to-units-1').addEventListener('click', backToUnits);
  document.getElementById('back-to-units-2').addEventListener('click', backToUnits);

  // ---------------- QUIZ RENDERING ----------------
  function renderQuestion(){
    var unit = getUnit(currentUnitNumber);
    var prog = unitProgress[currentUnitNumber];
    var idx = prog.index;
    var total = unit.questions.length;
    var q = unit.questions[idx];
    var ans = prog.answers[idx];

    // progress bar
    document.getElementById('progress-label').textContent = 'Question '+(idx+1)+' of '+total;
    var pct = Math.round(((idx+1)/total)*100);
    document.getElementById('progress-pct').textContent = pct+'%';
    document.getElementById('progress-fill').style.width = pct+'%';

    // type tag + text
    var isTF = (q.type==='mc' && q.opts && q.opts.length===2 && q.opts[0]==='True' && q.opts[1]==='False');
    var tag = isTF ? 'True / False' : (q.type==='mc' ? 'Multiple Choice' : 'Fill in the Blank');
    document.getElementById('q-type-tag').textContent = tag;
    document.getElementById('q-text').textContent = q.q;

    var optsContainer = document.getElementById('options-container');
    var fibContainer = document.getElementById('fib-container');
    var feedbackContainer = document.getElementById('feedback-container');
    optsContainer.innerHTML = '';
    fibContainer.innerHTML = '';
    feedbackContainer.innerHTML = '';

    if(q.type==='mc'){
      optsContainer.classList.remove('hidden');
      q.opts.forEach(function(optText, i){
        var opt = document.createElement('div');
        opt.className = 'option';
        opt.setAttribute('role','button');
        opt.setAttribute('tabindex', ans.checked ? '-1' : '0');
        opt.innerHTML = '<div class="opt-badge">'+letterFor(i)+'</div><div class="opt-text"></div>';
        opt.querySelector('.opt-text').textContent = optText;
        if(ans.checked){
          opt.classList.add('disabled');
          if(i === q.correct) opt.classList.add('correct-answer');
          else if(i === ans.selected) opt.classList.add('wrong-answer');
        } else {
          opt.addEventListener('click', function(){ selectMcOption(i); });
          opt.addEventListener('keydown', function(e){
            if(e.key==='Enter' || e.key===' '){ e.preventDefault(); selectMcOption(i); }
          });
        }
        if(!ans.checked && i === ans.selected) opt.classList.add('selected');
        optsContainer.appendChild(opt);
      });
      if(ans.checked) showFeedback(q, ans);
      updateNextButton();
    } else if(q.type==='fib'){
      optsContainer.classList.add('hidden');
      var row = document.createElement('div');
      row.className = 'fib-row';
      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'fib-input';
      input.placeholder = 'Type your answer...';
      input.id = 'fib-input-field';
      var btn = document.createElement('button');
      btn.className = 'fib-check-btn';
      btn.textContent = 'Check';
      row.appendChild(input);
      row.appendChild(btn);
      fibContainer.appendChild(row);

      if(ans.checked){
        input.value = ans.selected;
        input.disabled = true;
        btn.disabled = true;
        btn.textContent = 'Checked';
        showFeedback(q, ans);
      } else {
        input.value = '';
        btn.disabled = true;
        input.addEventListener('input', function(){
          btn.disabled = input.value.trim().length === 0;
        });
        input.addEventListener('keydown', function(e){
          if(e.key==='Enter' && !btn.disabled) checkFib(q, input.value);
        });
        btn.addEventListener('click', function(){ checkFib(q, input.value); });
      }
      updateNextButton();
    }

    document.getElementById('prev-btn').disabled = (idx===0);
  }

  function selectMcOption(i){
    var unit = getUnit(currentUnitNumber);
    var prog = unitProgress[currentUnitNumber];
    var q = unit.questions[prog.index];
    var ans = prog.answers[prog.index];
    if(ans.checked) return;
    ans.selected = i;
    ans.checked = true;
    ans.correct = (i === q.correct);
    renderQuestion();
  }

  function checkFib(q, val){
    var prog = unitProgress[currentUnitNumber];
    var ans = prog.answers[prog.index];
    if(ans.checked) return;
    ans.selected = val.trim();
    ans.checked = true;
    ans.correct = normalizeAnswer(val) === normalizeAnswer(q.answer);
    renderQuestion();
  }

  function showFeedback(q, ans){
    var feedbackContainer = document.getElementById('feedback-container');
    var isCorrect = ans.correct;
    var banner = document.createElement('div');
    banner.className = 'feedback-banner ' + (isCorrect ? 'correct' : 'incorrect');
    var icon = isCorrect
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    var titleText = isCorrect ? 'Correct!' : 'Not quite';
    var extra = '';
    if(!isCorrect && q.type==='fib'){
      extra = '<div class="fb-correct-answer">Correct answer: '+escapeHtml(q.answer)+'</div>';
    }
    banner.innerHTML = icon + '<div><div class="fb-title">'+titleText+'</div><div>'+escapeHtml(q.explain)+'</div>'+extra+'</div>';
    feedbackContainer.innerHTML='';
    feedbackContainer.appendChild(banner);
  }

  function updateNextButton(){
    var prog = unitProgress[currentUnitNumber];
    var ans = prog.answers[prog.index];
    document.getElementById('next-btn').disabled = !ans.checked;
  }

  document.getElementById('next-btn').addEventListener('click', function(){
    var unit = getUnit(currentUnitNumber);
    var prog = unitProgress[currentUnitNumber];
    if(prog.index < unit.questions.length - 1){
      prog.index += 1;
      renderQuestion();
    } else {
      showSummaryScreen(currentUnitNumber);
    }
  });

  document.getElementById('prev-btn').addEventListener('click', function(){
    var prog = unitProgress[currentUnitNumber];
    if(prog.index > 0){
      prog.index -= 1;
      renderQuestion();
    }
  });

  // ---------------- SUMMARY ----------------
  function showSummaryScreen(num){
    currentUnitNumber = num;
    var unit = getUnit(num);
    var prog = unitProgress[num];
    var total = unit.questions.length;
    var correctCount = prog.answers.filter(function(a){return a.correct;}).length;
    var pct = Math.round((correctCount/total)*100);

    document.getElementById('summary-title').textContent = 'Unit '+num+' Complete';
    document.getElementById('orb-pct').textContent = pct+'%';
    document.getElementById('orb-frac').textContent = correctCount+' / '+total;

    var circumference = 452.16;
    var offset = circumference - (pct/100)*circumference;
    document.getElementById('orb-arc').style.strokeDashoffset = offset;
    var arcColor = pct>=80 ? '#0f9488' : (pct>=50 ? '#e0a72e' : '#dc4c4c');
    document.getElementById('orb-arc').setAttribute('stroke', arcColor);

    var msg;
    if(pct>=90) msg = "Outstanding work — you've mastered this unit.";
    else if(pct>=75) msg = "Great job! A quick review of the misses below will lock it in.";
    else if(pct>=50) msg = "Good effort. Review the missed questions below and try again.";
    else msg = "This unit needs more review — check the explanations below and retry.";
    document.getElementById('summary-msg').textContent = msg;

    var reviewList = document.getElementById('review-list');
    var reviewSection = document.getElementById('review-section');
    reviewList.innerHTML = '';
    var missed = [];
    unit.questions.forEach(function(q,i){
      var a = prog.answers[i];
      if(!a.correct) missed.push({q:q, a:a});
    });

    if(missed.length===0){
      reviewSection.querySelector('h3').textContent = 'Missed questions';
      var none = document.createElement('div');
      none.className = 'no-missed';
      none.textContent = 'No missed questions — perfect score!';
      reviewList.appendChild(none);
    } else {
      reviewSection.querySelector('h3').textContent = 'Missed questions ('+missed.length+')';
      missed.forEach(function(item){
        var q = item.q, a = item.a;
        var div = document.createElement('div');
        div.className = 'review-item';
        var yourAnswerText, correctAnswerText;
        if(q.type==='mc'){
          yourAnswerText = (a.selected!==null && a.selected!==undefined) ? letterFor(a.selected)+'. '+q.opts[a.selected] : '(no answer)';
          correctAnswerText = letterFor(q.correct)+'. '+q.opts[q.correct];
        } else {
          yourAnswerText = a.selected ? a.selected : '(no answer)';
          correctAnswerText = q.answer;
        }
        div.innerHTML =
          '<div class="review-q">'+escapeHtml(q.q)+'</div>' +
          '<div class="review-row"><span class="lab">Your answer:</span> <span class="review-your">'+escapeHtml(yourAnswerText)+'</span></div>' +
          '<div class="review-row"><span class="lab">Correct answer:</span> <span class="review-correct">'+escapeHtml(correctAnswerText)+'</span></div>' +
          '<div class="review-explain">'+escapeHtml(q.explain)+'</div>';
        reviewList.appendChild(div);
      });
    }

    showScreen('summary');
  }

  document.getElementById('restart-unit-btn').addEventListener('click', function(){
    unitProgress[currentUnitNumber] = freshProgress(getUnit(currentUnitNumber));
    showScreen('quiz');
    document.getElementById('quiz-unit-title').textContent = 'Unit '+currentUnitNumber+': '+getUnit(currentUnitNumber).title;
    renderQuestion();
  });

  // ---------------- INIT ----------------
  renderLanding();
  showScreen('landing');
})();
</script>
</body>
</html>
