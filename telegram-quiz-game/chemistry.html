<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 Chemistry — Full Subject Quiz</title>
<style>
  :root{
    --teal:#0f9488;
    --teal-dark:#0b7c72;
    --teal-light:#e6f6f4;
    --red:#dc4c4c;
    --red-light:#fdecec;
    --bg:#f6f5f1;
    --card:#ffffff;
    --ink:#232323;
    --ink-soft:#5c5c58;
    --line:#e6e4dd;
    --shadow: 0 1px 2px rgba(30,30,25,0.04), 0 6px 20px rgba(30,30,25,0.06);
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    font-size:14px;
    padding:16px 12px 48px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  /* ---------- header ---------- */
  .app-header{
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
  }
  .app-header .logo{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--teal),#5fc9bd);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:15px;flex:none;
  }
  .app-header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-0.01em;}
  .app-header .sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}

  /* ---------- landing ---------- */
  .unit-list{display:flex;flex-direction:column;gap:8px;}
  .unit-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 14px;
    display:flex;align-items:center;gap:12px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .12s ease, box-shadow .12s ease;
    text-align:left;
  }
  .unit-card:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(30,30,25,0.06),0 10px 26px rgba(30,30,25,0.09);}
  .unit-num{
    flex:none;width:38px;height:38px;border-radius:11px;
    background:var(--teal-light);color:var(--teal-dark);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;
  }
  .unit-info{flex:1;min-width:0;}
  .unit-info .t{font-weight:620;font-size:14px;color:var(--ink);}
  .unit-info .m{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .unit-chevron{flex:none;color:var(--ink-soft);opacity:.6;}
  .unit-progress-pill{
    flex:none;font-size:10px;font-weight:600;color:var(--teal-dark);
    background:var(--teal-light);padding:3px 7px;border-radius:999px;
    display:none;
  }
  .unit-progress-pill.show{display:inline-block;}

  .intro-note{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:12px;font-size:12px;color:var(--ink-soft);box-shadow:var(--shadow);
  }

  /* ---------- quiz screen ---------- */
  .hidden{display:none !important;}
  .quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .back-btn{
    background:none;border:none;color:var(--ink-soft);font-size:12px;
    cursor:pointer;display:flex;align-items:center;gap:5px;padding:6px 2px;font-weight:560;
  }
  .back-btn:hover{color:var(--ink);}
  .quiz-unit-title{font-size:12px;font-weight:640;color:var(--ink);flex:1;text-align:right;}

  .progress-block{margin-bottom:12px;}
  .progress-labels{
    display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-bottom:5px;font-weight:560;
  }
  .progress-bar-track{
    height:6px;background:var(--line);border-radius:999px;overflow:hidden;
  }
  .progress-bar-fill{
    height:100%;background:linear-gradient(90deg,var(--teal),#4bbdae);border-radius:999px;
    transition:width .25s ease;
  }

  .q-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 16px;box-shadow:var(--shadow);
  }
  .q-type-tag{
    display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--teal-dark);background:var(--teal-light);padding:3px 7px;border-radius:6px;margin-bottom:8px;
  }
  .q-text{font-size:14px;line-height:1.4;font-weight:560;margin:0 0 14px;color:var(--ink);}

  .options{display:flex;flex-direction:column;gap:7px;}
  .option{
    display:flex;align-items:center;gap:12px;
    border:1.5px solid var(--line);border-radius:13px;
    padding:9px 11px;cursor:pointer;background:#fff;
    font-size:12.5px;line-height:1.35;color:var(--ink);
    transition:border-color .12s ease, background .12s ease;
  }
  .option:hover{border-color:#bcd9d5;background:#fbfefd;}
  .option.selected{border-color:var(--teal);background:var(--teal-light);}
  .option.correct-answer{border-color:var(--teal);background:var(--teal-light);}
  .option.wrong-answer{border-color:var(--red);background:var(--red-light);}
  .option.disabled{cursor:default;}
  .opt-badge{
    flex:none;width:24px;height:24px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--ink-soft);background:#fff;
  }
  .option.selected .opt-badge{border-color:var(--teal);color:var(--teal-dark);background:#fff;}
  .option.correct-answer .opt-badge{border-color:var(--teal);color:#fff;background:var(--teal);}
  .option.wrong-answer .opt-badge{border-color:var(--red);color:#fff;background:var(--red);}
  .opt-text{flex:1;}

  .fib-row{display:flex;gap:10px;}
  .fib-input{
    flex:1;border:1.5px solid var(--line);border-radius:11px;padding:9px 11px;
    font-size:12.5px;font-family:inherit;color:var(--ink);
  }
  .fib-input:focus{outline:none;border-color:var(--teal);}
  .fib-check-btn{
    flex:none;background:var(--teal);color:#fff;border:none;border-radius:13px;
    padding:0 14px;font-size:12px;font-weight:620;cursor:pointer;
  }
  .fib-check-btn:disabled{opacity:.45;cursor:default;}
  .fib-check-btn:hover:not(:disabled){background:var(--teal-dark);}

  .feedback-banner{
    margin-top:12px;border-radius:11px;padding:10px 12px;
    display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.4;
  }
  .feedback-banner.correct{background:var(--teal-light);color:#0b5f57;}
  .feedback-banner.incorrect{background:var(--red-light);color:#8a2b2b;}
  .feedback-banner svg{flex:none;margin-top:1px;}
  .feedback-banner .fb-title{font-weight:700;margin-bottom:2px;}
  .feedback-banner .fb-correct-answer{font-weight:600;margin-top:3px;}

  .nav-row{
    position:sticky;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
    margin:10px -2px 0;padding:8px 2px calc(8px + env(safe-area-inset-bottom));
    background:rgba(246,245,241,.96);border-top:1px solid var(--line);box-shadow:0 -5px 14px rgba(30,30,25,.06);
  }
  .prev-btn{
    background:none;border:none;color:var(--ink-soft);font-size:12px;font-weight:600;cursor:pointer;padding:8px 4px;
  }
  .prev-btn:hover:not(:disabled){color:var(--ink);}
  .prev-btn:disabled{opacity:0;pointer-events:none;}
  .next-btn{
    background:var(--teal);color:#fff;border:none;border-radius:12px;
    padding:9px 17px;font-size:12px;font-weight:640;cursor:pointer;
  }
  .next-btn:hover:not(:disabled){background:var(--teal-dark);}
  .next-btn:disabled{opacity:.4;cursor:default;}

  /* ---------- summary screen ---------- */
  .summary-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:34px 26px 28px;box-shadow:var(--shadow);text-align:center;
  }
  .summary-card h2{font-size:19px;margin:2px 0 22px;font-weight:660;}
  .orb-wrap{position:relative;width:168px;height:168px;margin:0 auto 20px;}
  .orb-wrap svg{transform:rotate(-90deg);}
  .orb-center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .orb-pct{font-size:30px;font-weight:750;color:var(--ink);}
  .orb-frac{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .summary-msg{font-size:13.5px;color:var(--ink-soft);margin-bottom:22px;}
  .summary-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:6px;}
  .btn-solid{
    background:var(--teal);color:#fff;border:none;border-radius:12px;padding:11px 20px;
    font-size:13.5px;font-weight:640;cursor:pointer;
  }
  .btn-solid:hover{background:var(--teal-dark);}
  .btn-outline{
    background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:11px 20px;
    font-size:13.5px;font-weight:620;cursor:pointer;
  }
  .btn-outline:hover{border-color:#c9c7bd;}

  .review-section{margin-top:26px;text-align:left;}
  .review-section h3{font-size:14.5px;font-weight:660;margin:0 0 12px;}
  .review-item{
    border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px;background:#fdfdfb;
  }
  .review-q{font-size:13.5px;font-weight:600;margin-bottom:8px;color:var(--ink);}
  .review-row{font-size:12.5px;margin-bottom:3px;line-height:1.5;}
  .review-row .lab{font-weight:650;}
  .review-your{color:#8a2b2b;}
  .review-correct{color:#0b5f57;}
  .review-explain{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .no-missed{font-size:13.5px;color:var(--ink-soft);text-align:center;padding:10px 0 0;}

  button:focus-visible,.unit-card:focus-visible,.option:focus-visible,.fib-input:focus-visible{
    outline:3px solid rgba(15,148,136,.35);outline-offset:2px;
  }

  @media (max-width:480px){
    body{padding:12px 8px 38px;}
    .q-card{padding:15px 12px 13px;}
    .summary-card{padding:22px 12px 18px;}
    .quiz-unit-title{max-width:62%;}
  }
</style>

<div id="arena-back" style="position:sticky;top:0;z-index:50;background:rgba(247,248,250,.96);border-bottom:1px solid #e3e6eb;padding:8px 12px;display:flex;align-items:center;gap:8px;">
  <a href="index.html" style="text-decoration:none;color:#0f8a7e;font-weight:700;font-size:13px;font-family:system-ui,-apple-system,sans-serif;">‹ Quiz Arena</a>
  <span style="flex:1"></span>
  <span style="font-size:11px;color:#5b6472;font-family:system-ui,-apple-system,sans-serif;">Grade 10 Mini Game</span>
</div>

<div class="wrap">

  <div class="app-header">
    <div class="logo">C</div>
    <div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="hidden">

      <button class="back-btn" id="back-to-units-1">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Units
      </button>
      <div class="quiz-unit-title" id="quiz-unit-title"></div>
    </div>

    <div class="progress-block">
      <div class="progress-labels">

        <span id="progress-pct"></span>

    <div class="q-card">
      <div class="q-type-tag" id="q-type-tag"></div>
      <p class="q-text" id="q-text"></p>
      <div class="options" id="options-container"></div>
      <div id="fib-container"></div>
      <div id="feedback-container"></div>
    </div>

    <div class="nav-row">
      <button class="prev-btn" id="prev-btn">Previous</button>
      <button class="next-btn" id="next-btn" disabled>Next</button>
    </div>
  </div>

  <!-- SUMMARY SCREEN -->
  <div id="screen-summary" class="hidden">
    <div class="summary-card">
      <h2 id="summary-title"></h2>
      <div class="orb-wrap">
        <svg width="168" height="168" viewBox="0 0 168 168">
          <circle cx="84" cy="84" r="72" fill="none" stroke="#e6e4dd" stroke-width="14"/>
          <circle id="orb-arc" cx="84" cy="84" r="72" fill="none" stroke="#0f9488" stroke-width="14" stroke-linecap="round" stroke-dasharray="452.16" stroke-dashoffset="452.16"/>
        </svg>
        <div class="orb-center">
          <div class="orb-pct" id="orb-pct">0%</div>
          <div class="orb-frac" id="orb-frac">0 / 0</div>
        </div>
      </div>
      <div class="summary-msg" id="summary-msg"></div>
      <div class="summary-actions">
        <button class="btn-solid" id="restart-unit-btn">Restart this unit</button>
        <button class="btn-outline" id="back-to-units-2">Back to units</button>
      </div>
      <div class="review-section" id="review-section">
        <h3>Missed questions</h3>
        <div id="review-list"></div>
      </div>
    </div>
  </div>

</div>

<script type="application/json" id="quiz-data">
{"units":[{"unit_number":1,"title":"Chemical Reactions and Stoichiometry","questions":[{"type":"mc","q":"A physical change does not involve the formation of a new substance with a new chemical composition.","opts":["True","False"],"correct":0,"explain":"The text defines a physical change as one that does not involve formation of a new substance with a new chemical composition."},{"type":"mc","q":"Chemical changes occur due to chemical reactions between substances.","opts":["True","False"],"correct":0,"explain":"The text states chemical changes occur due to chemical reactions between substances."},{"type":"mc","q":"In a chemical equation, reactants are written on the right side and products on the left side.","opts":["True","False"],"correct":1,"explain":"The text states reactants are written on the left side and products on the right side of the equation."},{"type":"mc","q":"According to the Law of Conservation of Mass, atoms are neither created nor destroyed during a chemical reaction.","opts":["True","False"],"correct":0,"explain":"The text states that according to the Law of Conservation of Mass, atoms are neither created nor destroyed during a chemical reaction."},{"type":"mc","q":"The inspection method of balancing equations is also known as the trial and error method.","opts":["True","False"],"correct":0,"explain":"The text states the inspection method is also known as a trial and error method or hit and trial method."},{"type":"mc","q":"A combination reaction is also known as a synthesis or composition reaction.","opts":["True","False"],"correct":0,"explain":"The text states such a combination reaction is also known as synthesis or composition reaction."},{"type":"mc","q":"Decomposition reactions are always carried out using electricity only.","opts":["True","False"],"correct":1,"explain":"The text states decomposition can be carried out using heat, light, electricity, or a catalyst, but most are carried out using heat."},{"type":"mc","q":"A double displacement reaction is also known as a metathesis reaction.","opts":["True","False"],"correct":0,"explain":"The text states a double displacement reaction is also known as double replacement reaction or metathesis."},{"type":"mc","q":"Oxidation is defined as the loss of one or more electrons by an atom.","opts":["True","False"],"correct":0,"explain":"The text defines oxidation as the loss of one or more electrons by an atom."},{"type":"mc","q":"The oxidation state of an uncombined element is always +1.","opts":["True","False"],"correct":1,"explain":"Rule 1 states the oxidation state of an uncombined element is zero, not +1."},{"type":"mc","q":"The oxidation number of oxygen in peroxides is -1.","opts":["True","False"],"correct":0,"explain":"The text states the oxidation number of oxygen in peroxides is -1, e.g. Na2O2."},{"type":"mc","q":"The oxidation number of hydrogen in metal hydrides like NaH is -1.","opts":["True","False"],"correct":0,"explain":"The text states hydrogen's oxidation number is +1 except in metal hydrides such as NaH, CaH2, and AlH3, where it is -1."},{"type":"mc","q":"The reducing agent is the substance that gains electrons in a redox reaction.","opts":["True","False"],"correct":1,"explain":"The text states the reducing agent loses electrons and causes reduction; the oxidizing agent gains electrons."},{"type":"mc","q":"Neutralization and double displacement reactions are examples of non-redox reactions.","opts":["True","False"],"correct":0,"explain":"The text explicitly lists neutralization and double displacement reactions as examples of non-redox reactions."},{"type":"mc","q":"Molecular mass is the sum of masses of all the atoms present in a molecule.","opts":["True","False"],"correct":0,"explain":"The text defines molecular mass as the sum of masses of all atoms present in a molecule."},{"type":"mc","q":"A mole of any substance contains 6.02 x 10^23 units of the substance.","opts":["True","False"],"correct":0,"explain":"The text states a mole of any substance equals 6.02x10^23 units of the substance (Avogadro's number)."},{"type":"mc","q":"Empirical formula gives the exact number of atoms of each element present in a molecule.","opts":["True","False"],"correct":1,"explain":"The text states the molecular formula (not the empirical formula) gives the exact number of atoms; the empirical formula gives only the smallest whole-number ratio."},{"type":"mc","q":"The molecular formula of glucose is C6H12O6 while its empirical formula is CH2O.","opts":["True","False"],"correct":0,"explain":"The text's Example 1.21 gives glucose's empirical formula as CH2O and molecular formula as C6H12O6."},{"type":"mc","q":"One mole of any gas occupies 22.4 liters at STP.","opts":["True","False"],"correct":0,"explain":"The text states that at STP, one mole of any gas occupies 22.4 liters, known as the molar volume at STP."},{"type":"mc","q":"The reactant that gives the lower yield of product is called the excess reactant.","opts":["True","False"],"correct":1,"explain":"The text states the reactant that gives lower yield is the limiting reactant, not the excess reactant."},{"type":"mc","q":"The theoretical yield is usually greater than or equal to the actual yield of a reaction.","opts":["True","False"],"correct":0,"explain":"The text states the actual yield is usually less than the theoretical yield."},{"type":"mc","q":"Percentage yield is the ratio of theoretical yield to actual yield multiplied by 100.","opts":["True","False"],"correct":1,"explain":"The text defines percentage yield as the ratio of actual yield to theoretical yield multiplied by 100, the reverse of this statement."},{"type":"mc","q":"Copper cannot displace hydrogen from dilute hydrochloric acid.","opts":["True","False"],"correct":0,"explain":"The text states zinc displaces hydrogen from HCl but copper metal cannot do so."},{"type":"mc","q":"Concentrated nitric acid reacts with copper to produce hydrogen gas.","opts":["True","False"],"correct":1,"explain":"The text states concentrated HNO3 reacts with copper to produce nitrogen dioxide gas (NO2), not hydrogen, because it is an oxidizing acid."},{"type":"mc","q":"Elements such as hydrogen, nitrogen, oxygen, fluorine, chlorine, bromine and iodine exist as diatomic molecules.","opts":["True","False"],"correct":0,"explain":"The text lists hydrogen, nitrogen, oxygen, fluorine, chlorine, bromine, and iodine as elements that exist as diatomic molecules."},{"type":"mc","q":"The oxidation number rules state that group IA elements always have +1 oxidation state in their compounds.","opts":["True","False"],"correct":0,"explain":"Rule 7 in the text states elements of group IA have +1 oxidation states in all their compounds."},{"type":"mc","q":"Stoichiometric calculations are performed on unbalanced chemical equations.","opts":["True","False"],"correct":1,"explain":"The text states that stoichiometric calculations are done for balanced chemical equations."},{"type":"mc","q":"In the reaction Zn + CuSO4 -> ZnSO4 + Cu, zinc is oxidized and copper is reduced.","opts":["True","False"],"correct":0,"explain":"The text's example shows Zn is oxidized (loses electrons) and Cu2+ is reduced (gains electrons) in this reaction."},{"type":"mc","q":"Formula mass is used mostly for ionic compounds.","opts":["True","False"],"correct":0,"explain":"The text states that formula mass (FM) is used mostly for ionic compounds."},{"type":"mc","q":"A borane with empirical formula BH3 and molecular mass 28 amu has the molecular formula B2H6.","opts":["True","False"],"correct":0,"explain":"The text's exercise example concerns a borane with empirical formula BH3 and molecular mass 28 amu, consistent with molecular formula B2H6 (28/13.84\u22482)."},{"type":"mc","q":"What is the quantitative study of reactants and products in a chemical reaction called?","opts":["Reaction's stoichiometry","Chemical kinetics","Reaction mechanism","Chemical equilibrium"],"correct":0,"explain":"The text defines the quantitative study of reactants and products in a chemical reaction as reaction's stoichiometry."},{"type":"mc","q":"Which symbol is placed between reactants and products in a chemical equation to indicate transformation?","opts":["An equal sign (=)","An arrow (\u2192)","A plus sign (+)","A colon (:)"],"correct":1,"explain":"The text states an arrow (\u2192) is placed between the two sides to indicate transformation of reactants into products."},{"type":"mc","q":"In the balancing method that uses total valency and LCM, what is the LCM of the total valencies used for?","opts":["To find the molar mass","To determine the coefficients by dividing LCM by each total valency","To calculate percent yield","To find the empirical formula"],"correct":1,"explain":"The text explains that dividing the LCM by each total valency number gives the coefficients for the balanced equation."},{"type":"mc","q":"In the algebraic method of balancing N2 + H2 -> NH3, what value is assigned to the smallest coefficient 'a' to begin solving?","opts":["0","1","2","3"],"correct":1,"explain":"In the worked example, a is assumed to equal 1 to determine the other coefficients."},{"type":"mc","q":"Which general equation form represents a decomposition reaction?","opts":["A + B \u2192 AB","AB \u2192 A + B","A + BC \u2192 AC + B","AB + CD \u2192 AD + CB"],"correct":1,"explain":"The text gives the general form for decomposition reactions as AB \u2192 A + B."},{"type":"mc","q":"Which of the following correctly represents a single-displacement reaction of a metal with a compound?","opts":["A + B \u2192 AB","AB \u2192 A + B","A + BC \u2192 B + AC","AB + CD \u2192 AD + CB"],"correct":2,"explain":"The text gives the general single-displacement form A + BC \u2192 B + AC when A is a more active metal than B."},{"type":"mc","q":"According to the text, when zinc reacts with copper (II) sulphate solution, what happens?","opts":["No reaction occurs","Zinc displaces copper to form zinc sulphate and copper metal","Copper displaces zinc","Both m hat color is sulphur dioxide gas described as in the text's introductory example on chemical reactions?","opts":["Yellow gas with a sweet odour","Colourless gas with a pungent odour","Brown gas with no odour","Green gas with a sharp smell"],"correct":1,"explain":"The text describes sulphur dioxide as a colourless gas with a pungent odour."},{"type":"fib","q":"A _______ is a symbolic representation of a chemical reaction, showing reactants and products with their respective states.","answer":"chemical equation","explain":"The text defines a chemical equation as the symbolic representation of a chemical reaction."},{"type":"fib","q":"The substances that are present before the chemical reaction takes place are called _______.","answer":"reactants","explain":"The text identifies reactants as the substances present before a chemical reaction occurs, written on the left side of the equation."},{"type":"fib","q":"The substances that are formed as a result of the chemical reaction are called _______.","answer":"products","explain":"The text identifies products as the substances formed by the chemical reaction, written on the right of the equation."},{"type":"fib","q":"According to the Law of Conservation of Mass, mass can neither be created nor _______ during an ordinary chemical reaction.","answer":"destroyed","explain":"The text states that according to the Law of Conservation of Mass, matter/mass can neither be created nor destroyed."},{"type":"fib","q":"The method of balancing a chemical equation by adjusting coefficients through trial and error is called the _______ method.","answer":"inspection","explain":"The text names the trial-and-error approach to balancing equations the inspection method."},{"type":"fib","q":"A reaction in which two or more substances combine to form a single new substance is called a _______ reaction.","answer":"combination","explain":"The text defines a combination reaction as one where two or more substances combine to form a new substance."},{"type":"fib","q":"A reaction in which a single compound breaks down into two or more simpler substances is called a _______ reaction.","answer":"decomposition","explain":"The text defines decomposition reactions as those in which a single compound breaks into two or more simpler substances."},{"type":"fib","q":"A reaction in which a more reactive element displaces a less reactive element from its compound is called a _______ reaction.","answer":"single displacement","explain":"The text defines single displacement (replacement) reactions as those where a more reactive element displaces a less reactive one from its compound."},{"type":"fib","q":"In a double displacement reaction, the positive and negative ions of two compounds _______ places.","answer":"exchange","explain":"The text describes double displacement reactions as ones where the ions of two compounds exchange places."},{"type":"fib","q":"The loss of one or more electrons by an atom, ion, or molecule is called _______.","answer":"oxidation","explain":"The text defines oxidation as the loss of electrons by a substance."},{"type":"fib","q":"The gain of one or more electrons by an atom, ion, or molecule is called _______.","answer":"reduction","explain":"The text defines reduction as the gain of electrons by a substance."},{"type":"fib","q":"A number assigned to an atom in a compound that indicates its degree of oxidation or reduction is called its _______ number.","answer":"oxidation","explain":"The text defines the oxidation number as the number assigned to an atom to indicate its degree of oxidation."},{"type":"fib","q":"According to the oxidation number rules, the oxidation number of hydrogen in most compounds is _______.","answer":"+1","explain":"The text states hydrogen has an oxidation number of +1 in most compounds, except in metal hydrides."},{"type":"fib","q":"According to the oxidation number rules, the oxidation number of oxygen in most compounds is _______.","answer":"-2","explain":"The text states oxygen usually has an oxidation number of -2 in its compounds, with exceptions like peroxides and superoxides."},{"type":"fib","q":"The substance that gains electrons and is itself reduced in a redox reaction is called the _______ agent.","answer":"oxidizing","explain":"The text defines the oxidizing agent as the substance that gains electrons and is reduced."},{"type":"fib","q":"The substance that loses electrons and is itself oxidized in a redox reaction is called the _______ agent.","answer":"reducing","explain":"The text defines the reducing agent as the substance that loses electrons and is oxidized."},{"type":"fib","q":"The sum of the atomic masses of all atoms in a molecule, expressed in atomic mass units, is called the _______ mass.","answer":"molecular","explain":"The text defines molecular mass as the sum of the masses of all atoms present in a molecule."},{"type":"fib","q":"The mass of a formula unit of an ionic compound in atomic mass units is called the _______ mass.","answer":"formula","explain":"The text defines formula mass as the mass of a formula unit, used mostly for ionic compounds."},{"type":"fib","q":"The number 6.02 x 10^23 is known as _______ number.","answer":"Avogadro's","explain":"The text names 6.02x10^23 as Avogadro's number."},{"type":"fib","q":"The mass in grams of one mole of a substance is called its _______ mass.","answer":"molar","explain":"The text defines molar mass as the mass in grams of one mole of a substance."},{"type":"fib","q":"A formula that shows the simplest whole-number ratio of atoms of each element in a compound is called the _______ formula.","answer":"empirical","explain":"The text defines the empirical formula as the formula showing the simplest whole-number ratio of atoms in a compound."},{"type":"fib","q":"A formula that shows the exact/actual number of atoms of each element in a molecule is called the _______ formula.","answer":"molecular","explain":"The text defines the molecular formula as the one showing the actual number of atoms of each element present."},{"type":"fib","q":"The percentage by mass of each element present in a compound is called its percent _______.","answer":"composition","explain":"The text defines percent composition as the percentage by mass of each element in a compound."},{"type":"fib","q":"The volume occupied by one mole of any gas at STP, equal to 22.4 L, is called the _______ volume.","answer":"molar","explain":"The text names 22.4 L at STP as the molar volume of a gas."},{"type":"fib","q":"The reactant that is completely consumed first in a reaction, thereby limiting the amount of product formed, is called the _______ reactant.","answer":"limiting","explain":"The text defines the limiting reactant as the reactant that runs out first and limits the amount of product formed."},{"type":"fib","q":"A reactant present in an amount greater than what is needed to react with the limiting reactant is called the _______ reactant.","answer":"excess","explain":"The text defines the excess reactant as the one present in a greater amount than required to react completely with the limiting reactant."},{"type":"fib","q":"The amount of product predicted by stoichiometric calculation from the balanced equation is called the _______ yield.","answer":"theoretical","explain":"The text defines theoretical yield as the amount of product predicted by calculation from the balanced equation."},{"type":"fib","q":"The amount of product actually obtained from a reaction, usually measured in the laboratory, is called the _______ yield.","answer":"actual","explain":"The text defines actual yield as the amount of product obtained in practice, usually less than the theoretical yield."},{"type":"fib","q":"Reactions in which no change occurs in the oxidation number of atoms, such as neutralization, are called _______ reactions.","answer":"non-redox","explain":"The text uses the term non-redox reactions for reactions where oxidation numbers do not change, giving neutralization as an example."},{"type":"fib","q":"The quantitative relationship between reactants and products in a chemical reaction is generally called _______.","answer":"stoichiometry","explain":"The text names the quantitative study of reactants and products in a chemical reaction stoichiometry."}]},{"unit_number":2,"title":"Solutions","questions":[{"type":"mc","q":"A solution is a homogeneous mixture of two or more substances.","opts":["True","False"],"correct":0,"explain":"The text defines a solution as a homogeneous mixture of two or more substances."},{"type":"mc","q":"In a solution, the substance present in the smaller amount is called the solvent.","opts":["True","False"],"correct":1,"explain":"The text defines the solute as the substance present in the smaller amount, and the solvent as the substance present in the larger amount."},{"type":"mc","q":"Water is often called the universal solvent because it dissolves more substances than any other solvent.","opts":["True","False"],"correct":0,"explain":"The text states water is called the universal solvent because it can dissolve a large number of substances."},{"type":"mc","q":"A saturated solution contains the maximum amount of solute that can dissolve in a given amount of solvent at a given temperature.","opts":["True","False"],"correct":0,"explain":"The text defines a saturated solution as one containing the maximum amount of dissolved solute at a given temperature."},{"type":"mc","q":"A supersaturated solution contains less dissolved solute than a saturated solution at the same temperature.","opts":["True","False"],"correct":1,"explain":"The text states a supersaturated solution contains more dissolved solute than a saturated solution can normally hold, not less."},{"type":"mc","q":"Solubility generally increases with increasing temperature for most solid solutes in water.","opts":["True","False"],"correct":0,"explain":"The text states that the solubility of most solid solutes in water increases with increasing temperature."},{"type":"mc","q":"According to Henry's Law, the solubility of a gas in a liquid decreases as the pressure of the gas above the liquid increases.","opts":["True","False"],"correct":1,"explain":"Henry's Law, as given in the text, states that the solubility of a gas increases with increasing pressure of the gas above the liquid."},{"type":"mc","q":"The rate of dissolution of a solid solute increases when the solid is crushed into smaller pieces.","opts":["True","False"],"correct":0,"explain":"The text states that crushing a solid increases its surface area, which increases the rate of dissolution."},{"type":"mc","q":"Stirring a solution generally decreases the rate at which a solute dissolves.","opts":["True","False"],"correct":1,"explain":"The text states that stirring increases the rate of dissolution by bringing fresh solvent into contact with the solute."},{"type":"mc","q":"Like dissolves like means polar solvents tend to dissolve polar or ionic solutes, and nonpolar solvents dissolve nonpolar solutes.","opts":["True","False"],"correct":0,"explain":"The text explains the like dissolves like rule as polar solvents dissolving polar/ionic solutes and nonpolar solvents dissolving nonpolar solutes."},{"type":"mc","q":"Molarity is defined as the number of moles of solute divided by the volume of solution in liters.","opts":["True","False"],"correct":0,"explain":"The text defines molarity as moles of solute per liter of solution."},{"type":"mc","q":"Molality is defined as the number of moles of solute per liter of solution.","opts":["True","False"],"correct":1,"explain":"The text defines molality as moles of solute per kilogram of solvent, not per liter of solution (that is molarity)."},{"type":"mc","q":"Mole fraction is the ratio of the number of moles of one component to the total number of moles of all components in the solution.","opts":["True","False"],"correct":0,"explain":"The text defines mole fraction as moles of a component divided by the total moles of all components in a solution."},{"type":"mc","q":"Parts per million (ppm) is commonly used to express the concentration of very dilute solutions.","opts":["True","False"],"correct":0,"explain":"The text describes parts per million as a unit used for expressing the concentration of very dilute solutions."},{"type":"mc","q":"The dilution formula M1V1 = M2V2 is used to calculate concentrations when a solution is diluted.","opts":["True","False"],"correct":0,"explain":"The text presents the dilution equation M1V1 = M2V2 for calculating the concentration or volume relationships during dilution."},{"type":"mc","q":"Adding solvent to a solution increases its molarity.","opts":["True","False"],"correct":1,"explain":"The text explains that adding solvent (diluting) decreases the molarity of a solution because the same moles of solute occupy a larger volume."},{"type":"mc","q":"Electrolytes are substances that produce ions in solution and can conduct electricity.","opts":["True","False"],"correct":0,"explain":"The text defines electrolytes as substances that dissolve in water to produce ions that conduct electricity."},{"type":"mc","q":"Nonelectrolytes dissociate completely into ions when dissolved in water.","opts":["True","False"],"correct":1,"explain":"The text states that nonelectrolytes do not dissociate into ions when dissolved in water and therefore do not conduct electricity."},{"type":"mc","q":"Strong electrolytes ionize completely in aqueous solution.","opts":["True","False"],"correct":0,"explain":"The text states that strong electrolytes are those that ionize completely (or almost completely) in solution."},{"type":"mc","q":"A precipitate is an insoluble solid that forms and separates from a solution during a chemical reaction.","opts":["True","False"],"correct":0,"explain":"The text defines a precipitate as an insoluble solid that forms in and separates from a solution."},{"type":"mc","q":"According to solubility rules, all sodium, potassium, and ammonium salt ly become more soluble in water as the temperature of the water increases.","opts":["True","False"],"correct":1,"explain":"The text states that the solubility of gases in water generally decreases as temperature increases, unlike most solids."},{"type":"mc","q":"In preparing a solution of a desired molarity, a volumetric flask is used to ensure accurate final volume.","opts":["True","False"],"correct":0,"explain":"The text describes using a volumetric flask to accurately measure the final total volume when preparing a solution of known molarity."},{"type":"mc","q":"Percent by mass concentration is calculated as the mass of solute divided by the mass of solution, multiplied by 100.","opts":["True","False"],"correct":0,"explain":"The text defines percent by mass as mass of solute divided by total mass of solution, multiplied by 100."},{"type":"mc","q":"In a solution, the substance that is dissolved and present in the smaller amount is called the:","opts":["Solvent","Solute","Precipitate","Colloid"],"correct":1,"explain":"The text defines the solute as the substance dissolved, present in the smaller amount."},{"type":"mc","q":"Which of the following is described in the text as the universal solvent?","opts":["Ethanol","Water","Benzene","Ammonia"],"correct":1,"explain":"The text calls water the universal solvent because it dissolves a great many substances."},{"type":"mc","q":"A solution that contains the maximum amount of solute that can normally dissolve at a given temperature is called:","opts":["Unsaturated","Saturated","Supersaturated","Diluted"],"correct":1,"explain":"The text defines a saturated solution as one containing the maximum dissolvable amount of solute at a given temperature."},{"type":"mc","q":"A solution containing more dissolved solute than a saturated solution normally holds, achieved by careful cooling, is called:","opts":["Unsaturated","Saturated","Supersaturated","Concentrated"],"correct":2,"explain":"The text describes a supersaturated solution  the liquid","Increasing surface area of contact"],"correct":2,"explain":"The text states gas solubility in liquids generally decreases as the temperature of the liquid increases."},{"type":"mc","q":"Percent by mass concentration is calculated using which formula, according to the text?","opts":["(mass of solute / mass of solvent) x 100","(mass of solute / mass of solution) x 100","(mass of solvent / mass of solution) x 100","(moles of solute / mass of solution) x 100"],"correct":1,"explain":"The text defines percent by mass as the mass of solute divided by the total mass of solution, multiplied by 100."},{"type":"mc","q":"According to the text, normality is expressed in terms of:","opts":["Moles of solute per liter of solution","Gram equivalents of solute per liter of solution","Grams of solute per kilogram of solvent","Moles of solute per mole of solvent"],"correct":1,"explain":"The text defines normality as the number of gram equivalents of solute dissolved per liter of solution."},{"type":"mc","q":"Parts per million (ppm) is generally used for expressing the concentration of:","opts":["Very concentrated solutions","Very dilute solutions","Pure solvents","Gaseous mixtures only"],"correct":1,"explain":"The text describes ppm as a concentration unit typically used for expressing very dilute solution concentrations."},{"type":"mc","q":"Which of the following best describes a dilute solution, according to the text?","opts":["A solution with a relatively small amount of solute compared to solvent","A solution with the maximum possible solute","A solution containing no solute","A supersaturated solution"],"correct":0,"explain":"The text describes a dilute solution as one containing a relatively small amount of dissolved solute compared to the solvent."},{"type":"mc","q":"Which of the following best describes a concentrated solution, according to the text?","opts":["A solution with a relatively small amount of solute","A solution with a relatively large amount of solute compared to solvent","A solution with no solute at all","A solution that cannot dissolve any more solute"],"correct":1,"explain":"The text describes a concentrated solution as one that contains a relatively large amount of solute relative to solvent."},{"type":"mc","q":"According to the text, crushing a solid solute into a powder before adding it to a solvent mainly affects the rate of dissolution by:","opts":["Decreasing the surface area","Increasing the surface area exposed to solvent","Changing the solute's chemical identity","Decreasing solvent polarity"],"correct":1,"explain":"The text explains that crushing a solid increases its surface area, allowing more contact with solvent and a faster dissolution rate."},{"type":"mc","q":"According to the text, stirring a mixture of solute and solvent affects dissolution rate by:","opts":["Bringing fresh solvent into contact with the solute surface","Reducing the solute's surface area","Decreasing the solvent's temperature","Reducing the amount of solvent"],"correct":0,"explain":"The text explains that stirring speeds up dissolution by continuously bringing fresh solvent into contact with the solute."},{"type":"mc","q":"According to the text, the process of mixing a concentrated solution with additional solvent to reduce its concentration is called:","opts":["Precipitation","Dilution","Saturation","Titration"],"correct":1,"explain":"The text names the process of adding solvent to reduce a solution's concentration dilution."},{"type":"mc","q":"According to the text's example calculations, solution stoichiometry problems use molarity together with the:","opts":["Balanced chemical equation","Color of the reactants","Boiling point of the solvent","Melting point of the solute"],"correct":0,"explain":"The text's worked solution stoichiometry examples use molarity of solutions together with the balanced chemical equation to find moles/mass of products or reactants."},{"type":"mc","q":"According to the text, ionic equations that show only the ions and molecules that actually participate in a reaction are called:","opts":["Molecular equations","Complete ionic equations","Net ionic equations","Balanced equations"],"correct":2,"explain":"The text defines net ionic equations as those that show only the species that actually participate in the reaction, omitting spectator ions."},{"type":"mc","q":"In the text's discussion of solubility, the amount of solute that dissolves in 100 g of solvent to form a saturated solution at a given temperature is called the solute's:","opts":["Concentration","Solubility","Molarity","Molality"],"correct":1,"explain":"The text defines solubility as the amount of solute that dissolves in a given amount (often 100 g) of solvent to form a saturated solution at that temperature."},{"type":"mc","q":"According to the text, which of these is an example of a supersaturated solution becoming unstable and releasing excess solute?","opts":["Adding a seed crystal causes rapid crystallization","Heating causes more solute to dissolve","Adding more solvent stabilizes it","Stirring has no effect"],"correct":0,"explain":"The text explains that a supersaturated solution is unstable, and adding a seed crystal can trigger the excess solute to crystallize out rapidly."},{"type":"mc","q":"According to the text, a solution's ability to conduct an electric current depends primarily on the presence of:","opts":["Dissolved gases","Free-moving ions","Suspended solids","Color"],"correct":1,"explain":"The text explains that electrolyte solutions conduct electricity because they contain free-moving ions."},{"type":"mc","q":"According to the text, weak electrolytes are substances that:","opts":["Ionize completely in solution","Ionize only partially in solution","Do not ionize at all","Are always insoluble"],"correct":1,"explain":"The text describes weak electrolytes as substances that ionize only partially when dissolved in water."},{"type":"mc","q":"According to the text, which of the following would be classified as a nonelectrolyte in aqueous solution?","opts":["Sodium chloride","Sugar (a molecular compound that does not ionize)","Hydrochloric acid","Sodium hydroxide"],"correct":1,"explain":"The text explains that molecular compounds that dissolve without forming ions, such as sugar, are nonelectrolytes."},{"type":"mc","q":"Given the dilution formula M1V1 = M2V2, if M1 is the concentration before dilution, what does V2 represent?","opts":["The volume before dilution","The volume after dilution","The molarity after dilution","The mass of solute added"],"correct":1,"explain":"In the dilution formula from the text, V2 is the final (after-dilution) volume corresponding to the final concentration M2."},{"type":"mc","q":"According to the text, when preparing a solution of a specific molarity from a solid solute, which quantity must first be calculated using the desired molarity and volume?","opts":["The boiling point of the solvent","The moles (then mass) of solute needed","The density of the solvent","The colour of the solution"],"correct":1,"explain":"The text's procedure for preparing a solution of known molarity begins by calculating the moles, and then the mass, of solute needed."},{"type":"mc","q":"According to the text, solubility curves are graphs that show how the solubility of a solute changes with:","opts":["Pressure only","Temperature","Colour","Electrical conductivity"],"correct":1,"explain":"The text describes solubility curves as plots showing how a solute's solubility changes with temperature."},{"type":"mc","q":"According to the text, the term used for the amount of solute dissolved in a given quantity of solvent or solution is:","opts":["Solubility product","Concentration","Molar mass","Density"],"correct":1,"explain":"The text defines concentration as the measure of the amount of solute dissolved in a given quantity of solvent or solution."},{"type":"fib","q":"A homogeneous mixture of two or more substances is called a _______.","answer":"solution","explain":"The text defines a solution as a homogeneous mixture of two or more substances."},{"type":"fib","q":"In a solution, the substance present in the larger amount, in which the solute dissolves, is called the _______.","answer":"solvent","explain":"The text defines the solvent as the substance present in the larger amount in a solution."},{"type":"fib","q":"Water is called the _______ solvent because it can dissolve a very large number of substances.","answer":"universal","explain":"The text names water the universal solvent for its ability to dissolve many substances."},{"type":"fib","q":"A solution holding the maximum amount of solute possible at a given temperature is called a _______ solution.","answer":"saturated","explain":"The text defines a saturated solution as one holding the maximum dissolvable solute at a given temperature."},{"type":"fib","q":"A solution holding less solute than the maximum amount possible at a given temperature is called an _______ solution.","answer":"unsaturated","explain":"The text defines an unsaturated solution as one holding less solute than the maximum possible amount."},{"type":"fib","q":"A solution holding more dissolved solute than a saturated solution normally can, usually achieved by slow cooling, is called a _______ solution.","answer":"supersaturated","explain":"The text defines a supersaturated solution as one containing more solute than a saturated solution would normally hold."},{"type":"fib","q":"The amount of a substance that will dissolve in a given amount of solvent at a specific temperature to form a saturated solution is called its _______.","answer":"solubility","explain":"The text defines solubility as the amount of solute that dissolves in a given amount of solvent to form a saturated solution at a given temperature."},{"type":"fib","q":"_______'s Law states that the solubility of a gas in a liquid is proportional to the pressure of the gas above the liquid.","answer":"Henry","explain":"The text names this relationship Henry's Law."},{"type":"fib","q":"The rule that states polar solvents dissolve polar solutes while nonpolar solvents dissolve nonpolar solutes is commonly called _______.","answer":"like dissolves like","explain":"The text describes this generalization as the like dissolves like rule."},{"type":"fib","q":"The number of moles of solute dissolved per liter of solution is called _______.","answer":"molarity","explain":"The text defines molarity as moles of solute per liter of solution."},{"type":"fib","q":"The number of moles of solute dissolved per kilogram of solvent is called _______.","answer":"molality","explain":"The text defines molality as moles of solute per kilogram of solvent."},{"type":"fib","q":"The ratio of the number of moles of one component to the total moles of all components in a solution is called _______.","answer":"mole fraction","explain":"The text defines mole fraction as the moles of one component divided by the total moles of all components."},{"type":"fib","q":"The number of gram equivalents of solute dissolved per liter of solution is called _______.","answer":"normality","explain":"The text defines normality as gram equivalents of solute per liter of solution."},{"type":"fib","q":"The concentration unit used for expressing extremely dilute solute concentrations, abbreviated ppm, is called parts per _______.","answer":"million","explain":"The text names this unit parts per million (ppm)."},{"type":"fib","q":"The process of adding more solvent to a solution to lower its concentration is called _______.","answer":"dilution","explain":"The text names the process of lowering a solution's concentration by adding solvent dilution."},{"type":"fib","q":"The equation M1V1 = M2V2 used to calculate concentrations or volumes before and after dilution is called the _______ formula.","answer":"dilution","explain":"The text presents M1V1=M2V2 as the dilution formula."},{"type":"fib","q":"A piece of laboratory glassware used to prepare a solution of precisely known volume and molarity is called a _______ flask.","answer":"volumetric","explain":"The text describes the volumetric flask as the glassware used to accurately prepare a solution of known molarity."},{"type":"fib","q":"A substance that dissolves in water to produce ions and conduct electricity is called an _______.","answer":"electrolyte","explain":"The text defines an electrolyte as a substance that produces ions in solution and conducts electricity."},{"type":"fib","q":"A substance that dissolves in water without forming ions and therefore does not conduct electricity is called a _______.","answer":"nonelectrolyte","explain":"The text defines a nonelectrolyte as a substance that dissolves without producing ions and does not conduct electricity."},{"type":"fib","q":"An electrolyte that ionizes completely, or almost completely, in solution is called a _______ electrolyte.","answer":"strong","explain":"The text defines a strong electrolyte as one that ionizes completely or nearly completely in solution."},{"type":"fib","q":"An electrolyte that ionizes only partially in solution is called a _______ electrolyte.","answer":"weak","explain":"The text defines a weak electrolyte as one that ionizes only partially in solution."},{"type":"fib","q":"An insoluble solid that forms and separates out of a solution during a chemical reaction is called a _______.","answer":"precipitate","explain":"The text defines a precipitate as the insoluble solid formed and separated during such a reaction."},{"type":"fib","q":"A reaction in which two solutions combine to form an insoluble solid is called a _______ reaction.","answer":"precipitation","explain":"The text names such reactions precipitation reactions."},{"type":"fib","q":"Ions that appear unchanged on both sides of a complete ionic equation and take no part in the actual reaction are called _______ ions.","answer":"spectator","explain":"The text defines spectator ions as those that appear on both sides unchanged and are omitted from the net ionic equation."},{"type":"fib","q":"An equation that shows only the species that actually participate in a chemical reaction, omitting spectator ions, is called the _______ ionic equation.","answer":"net","explain":"The text names the equation that omits spectator ions the net ionic equation."},{"type":"fib","q":"The measure of the amount of solute dissolved in a given amount of solvent or solution is called _______.","answer":"concentration","explain":"The text defines concentration as the measure of the amount of dissolved solute in a solvent or solution."},{"type":"fib","q":"A solution containing a relatively small amount of dissolved solute compared to the solvent is called a _______ solution.","answer":"dilute","explain":"The text describes a dilute solution as one with a relatively small amount of solute compared to solvent."},{"type":"fib","q":"A solution containing a relatively large amount of dissolved solute compared to the solvent is called a _______ solution.","answer":"concentrated","explain":"The text describes a concentrated solution as one with a relatively large amount of solute compared to solvent."},{"type":"fib","q":"The percent by mass concentration formula divides the mass of solute by the total mass of the _______, then multiplies by 100.","answer":"solution","explain":"The text's percent by mass formula divides mass of solute by mass of solution and multiplies by 100."},{"type":"fib","q":"A graph that shows how the solubility of a solute changes with temperature is called a solubility _______.","answer":"curve","explain":"The text describes such a graph as a solubility curve."}]},{"unit_number":3,"title":"Important Inorganic Compounds","questions":[{"type":"mc","q":"Oxides are binary compounds formed between oxygen and another element.","opts":["True","False"],"correct":0,"explain":"The text defines oxides as binary compounds of oxygen with another element."},{"type":"mc","q":"Basic oxides are generally formed by metals and react with acids to form salt and water.","opts":["True","False"],"correct":0,"explain":"The text states basic oxides are typically metal oxides that react with acids to form a salt and water."},{"type":"mc","q":"Acidic oxides are generally formed by nonmetals and react with bases to form salt and water.","opts":["True","False"],"correct":0,"explain":"The text states acidic oxides are typically nonmetal oxides that react with bases to form a salt and water."},{"type":"mc","q":"Amphoteric oxides can react with both acids and bases to form salt and water.","opts":["True","False"],"correct":0,"explain":"The text defines amphoteric oxides as those that can react with both acids and bases."},{"type":"mc","q":"Neutral oxides react with both acids and bases to form salts.","opts":["True","False"],"correct":1,"explain":"The text states neutral oxides do not react with acids or bases to form salts; they are neither acidic nor basic."},{"type":"mc","q":"Carbon monoxide, CO, is given in the text as an example of a neutral oxide.","opts":["True","False"],"correct":0,"explain":"The text lists carbon monoxide as an example of a neutral oxide."},{"type":"mc","q":"Peroxides contain the peroxide ion, which has oxygen in the -1 oxidation state.","opts":["True","False"],"correct":0,"explain":"The text describes peroxides as containing oxygen in the -1 oxidation state, e.g., in hydrogen peroxide."},{"type":"mc","q":"According to the Arrhenius theory, an acid is a substance that produces hydroxide ions (OH-) in aqueous solution.","opts":["True","False"],"correct":1,"explain":"The Arrhenius theory defines an acid as a substance that produces hydrogen ions (H+) in aqueous solution; a base produces hydroxide ions."},{"type":"mc","q":"According to the Bronsted-Lowry theory, an acid is a proton (H+) donor and a base is a proton acceptor.","opts":["True","False"],"correct":0,"explain":"The text states that according to Bronsted-Lowry theory, an acid donates a proton mus paper:","opts":["Blue","Red","Green","Colourless"],"correct":1,"explain":"The text states acids turn blue litmus paper red."},{"type":"mc","q":"Bases generally turn red litmus paper:","opts":["Red","Blue","Yellow","Colourless"],"correct":1,"explain":"The text states bases turn red litmus paper blue."},{"type":"mc","q":"When acids react with active metals, they typically produce which gas?","opts":["Oxygen","Hydrogen","Nitrogen","Carbon dioxide"],"correct":1,"explain":"The text states acids react with active metals to produce hydrogen gas."},{"type":"mc","q":"A salt formed by the complete neutralization of an acid and a base, with no replaceable hydrogen or hydroxide remaining, is called a:","opts":["Acid salt","Basic salt","Normal salt","Double salt"],"correct":2,"explain":"The text classifies a fully neutralized salt as a normal salt."},{"type":"mc","q":"A salt that still contains one or more replaceable hydrogen atoms from the original acid is called a(n):","opts":["Acid salt","Normal salt","Basic salt","Complex salt"],"correct":0,"explain":"The text describes an acid salt as one that still retains replaceable hydrogen atoms from the parent acid."},{"type":"mc","q":"Water molecules that are chemically incorporated into the crystal structure of a salt are called:","opts":["Hydration shells","Water of crystallization","Solvate water","Free water"],"correct":1,"explain":"The text names water incorporated into a crystalline salt's structure water of crystallization."},{"type":"mc","q":"A salt containing water of crystallization is called a:","opts":["Anhydrous salt","Hydrated salt","Double salt","Complex salt"],"correct":1,"explain":"The text names a salt that contains water of crystallization a hydrated salt."},{"type":"mc","q":"The reaction of a salt with water that can produce an acidic, basic, or neutral solution is called:","opts":["Neutralization","Hydrolysis","Oxidation","Dilution"],"correct":1,"explain":"The text names the reaction of a salt with water tha  when reacting with a base, forms:","opts":["Only water","A salt (e.g., aluminate) and water","Hydrogen gas","No reaction occurs"],"correct":1,"explain":"The text describes amphoteric oxides like aluminium oxide as reacting with a base to form a salt (such as an aluminate) and water, just as with an acid."},{"type":"mc","q":"Sulphur dioxide reacting with water is described in the text as forming which acid?","opts":["Sulphuric acid","Sulphurous acid","Nitric acid","Hydrochloric acid"],"correct":1,"explain":"The text describes sulphur dioxide dissolving in water to form sulphurous acid (H2SO3)."},{"type":"mc","q":"According to the text, carbonic acid, H2CO3, forms when carbon dioxide dissolves in water, illustrating that CO2 in water acts as a(n):","opts":["Basic oxide in water","Acidic oxide in water","Neutral oxide in water","Amphoteric oxide in water"],"correct":1,"explain":"The text explains that carbon dioxide, an acidic oxide, dissolves in water to form carbonic acid (H2CO3)."},{"type":"fib","q":"Binary compounds formed between oxygen and another element are called _______.","answer":"oxides","explain":"The text defines oxides as binary compounds of oxygen with another element."},{"type":"fib","q":"Oxides that are typically formed by metals and react with acids to give a salt and water are called _______ oxides.","answer":"basic","explain":"The text names metal oxides that react with acids basic oxides."},{"type":"fib","q":"Oxides that are typically formed by nonmetals and react with bases to give a salt and water are called _______ oxides.","answer":"acidic","explain":"The text names nonmetal oxides that react with bases acidic oxides."},{"type":"fib","q":"Oxides that can react with both acids and bases to form a salt and water are called _______ oxides.","answer":"amphoteric","explain":"The text names oxides that react with both acids and bases amphoteric oxides."},{"type":"fib","q":"Oxides that do not react with either acids or bases to form salts are called _______ oxides.","answer":"neutral","explain":"The text names oxides that react with neither acids nor bases neutral oxides."},{"type":"fib","q":"Compounds containing oxygen in the -1 oxidation state, such as hydrogen peroxide, are called _______.","answer":"peroxides","explain":"The text names such oxygen-containing compounds with oxygen in the -1 state peroxides."},{"type":"fib","q":"According to the _______ theory, an acid is a substance that produces hydrogen ions (H+) in aqueous solution.","answer":"Arrhenius","explain":"The text attributes this definition of acids and bases to the Arrhenius theory."},{"type":"fib","q":"According to the Bronsted-Lowry theory, an acid is defined as a proton _______.","answer":"donor","explain":"The text states the Bronsted-Lowry theory defines an acid as a proton donor."},{"type":"fib","q":"According to the Bronsted-Lowry theory, a base is defined as a proton _______.","answer":"acceptor","explain":"The text states the Bronsted-Lowry theory defines a base as a proton acceptor."},{"type":"fib","q":"According to the _______ theory, an acid is defined as an electron-pair acceptor.","answer":"Lewis","explain":"The text attributes this electron-pair based definition of acids and bases to the Lewis theory."},{"type":"fib","q":"An acid that ionizes completely, or nearly completely, in aqueous solution is called a _______ acid.","answer":"strong","explain":"The text defines a strong acid as one that ionizes completely or nearly completely in solution."},{"type":"fib","q":"An acid that ionizes only partially in aqueous solution is called a _______ acid.","answer":"weak","explain":"The text defines a weak acid as one that ionizes only partially in solution."},{"type":"fib","q":"The scale used to measure the acidity or basicity of a solution, generally ranging from 0 to 14, is called the _______ scale.","answer":"pH","explain":"The text names this measurement scale the pH scale."},{"type":"fib","q":"On the pH scale, a value of exactly 7 represents a _______ solution.","answer":"neutral","explain":"The text states pH 7 represents a neutral solution."},{"type":"fib","q":"The reaction between an acid and a base that produces a salt and water is called a _______ reaction.","answer":"neutralization","explain":"The text names the acid-base reaction that produces a salt and water a neutralization reaction."},{"type":"fib","q":"Acids generally turn blue litmus paper the colour _______.","answer":"red","explain":"The text states acids turn blue litmus paper red."},{"type":"fib","q":"Bases generally turn red litmus paper the colour _______.","answer":"blue","explain":"The text states bases turn red litmus paper blue."},{"type":"fib","q":"When acids react with active metals, they release _______ gas.","answer":"hydrogen","explain":"The text states acids react with active metals to release hydrogen gas."},{"type":"fib","q":"Ionic compounds that result, along with water, from the reaction of an acid with a base are called _______.","answer":"salts","explain":"The text describes salts as the ionic compounds that result, with water, from acid-base reactions."},{"type":"fib","q":"A salt formed by the complete neutralization of an acid and a base is called a _______ salt.","answer":"normal","explain":"The text names a fully neutralized salt a normal salt."},{"type":"fib","q":"A salt that still retains one or more replaceable hydrogen atoms from the parent acid is called an _______ salt.","answer":"acid","explain":"The text names a partially neutralized salt retaining replaceable hydrogens an acid salt."},{"type":"fib","q":"Water molecules chemically incorporated within the crystal structure of certain salts are called water of _______.","answer":"crystallization","explain":"The text names water incorporated into a salt's crystal structure water of crystallization."},{"type":"fib","q":"A salt that contains water of crystallization within its structure is called a _______ salt.","answer":"hydrated","explain":"The text names a salt containing water of crystallization a hydrated salt."},{"type":"fib","q":"The reaction of a salt with water, which can make its solution acidic, basic, or neutral, is called salt _______.","answer":"hydrolysis","explain":"The text names the reaction of a salt with water that determines solution pH salt hydrolysis."},{"type":"fib","q":"A salt formed from a strong acid and a weak base gives a solution that is _______.","answer":"acidic","explain":"The text states that salts of strong acids and weak bases hydrolyze to give acidic solutions."},{"type":"fib","q":"A salt formed from a weak acid and a strong base gives a solution that is _______.","answer":"basic","explain":"The text states that salts of weak acids and strong bases hydrolyze to give basic solutions."},{"type":"fib","q":"The industrial method used to manufacture ammonia from nitrogen and hydrogen gases is called the _______ process.","answer":"Haber","explain":"The text names this industrial ammonia synthesis method the Haber process."},{"type":"fib","q":"The industrial method used to manufacture nitric acid, starting from ammonia, is called the _______ process.","answer":"Ostwald","explain":"The text names this industrial nitric acid manufacturing method the Ostwald process."},{"type":"fib","q":"The industrial method used to manufacture sulphuric acid is called the _______ process.","answer":"Contact","explain":"The text names this industrial sulphuric acid manufacturing method the Contact process."},{"type":"fib","q":"A substance whose colour changes depending on the pH of the solution it is added to is called a pH _______.","answer":"indicator","explain":"The text names such a colour-changing substance a pH indicator."}]},{"unit_number":4,"title":"Energy Changes and Electrochemistry","questions":[{"type":"mc","q":"A chemical reaction that releases heat to the surroundings is called an exothermic reaction.","opts":["True","False"],"correct":0,"explain":"The text defines a reaction that releases heat as exothermic."},{"type":"mc","q":"A chemical reaction that absorbs heat from the surroundings is called an exothermic reaction.","opts":["True","False"],"correct":1,"explain":"The text defines a reaction that absorbs heat from the surroundings as endothermic, not exothermic."},{"type":"mc","q":"Enthalpy change (\u0394H) is negative for exothermic reactions and positive for endothermic reactions.","opts":["True","False"],"correct":0,"explain":"The text states \u0394H is negative (\u0394H<0) for exothermic reactions and positive (\u0394H>0) for endothermic reactions."},{"type":"mc","q":"When NaOH dissolves in water, the test tube becomes warm, showing the dissolving process is exothermic.","opts":["True","False"],"correct":0,"explain":"The text describes NaOH dissolving in water and the test tube becoming warm, describing this as exothermic."},{"type":"mc","q":"When KNO3 dissolves in water, the mixture gets colder, showing the process is endothermic.","opts":["True","False"],"correct":0,"explain":"The text describes KNO3 dissolving in water making the mixture colder, describing this as endothermic."},{"type":"mc","q":"The device used to measure the heat released or absorbed by a chemical reaction is called a calorimeter.","opts":["True","False"],"correct":0,"explain":"The text names the calorimeter as the device used to measure heat released or absorbed in a reaction."},{"type":"mc","q":"Heat capacity is defined as the quantity of heat required to change the temperature of a substance by 1 K.","opts":["True","False"],"correct":0,"explain":"The text defines heat capacity as the quantity of heat required to change an object's temperature by 1 K."},{"type":"mc","q":"Water has a lower specific heat capacity than most metals such as iron.","opts":["True","False"],"correct":1,"explain":"The text states water has a high specific heat capacity, much higher than metals like gold and iron, which have relatively low specific heat capacities."},{"type":"mc","q":"Metallic conductivity is caused by the movement of ions through the metal lattice.","opts":["True","False"],"correct":1,"explain":"The text states metallic conductivity is due to the movement of electrons, not ions; electrolytic conductivity is due to ion movement."},{"type":"mc","q":"Silver is described in the text as the best electrical conductor.","opts":["True","False"],"correct":0,"explain":"The text states silver is the best electrical conductor."},{"type":"mc","q":"Graphite is a good conductor of electricity because electrons can move freely through its hexagonal layers.","opts":["True","False"],"correct":0,"explain":"The text explains that graphite conducts electricity because electrons move freely through its hexagonal carbon layers."},{"type":"mc","q":"According to the text's comparison table, the resistance of electrolytic solutions is influenced by factors such as concentration, inter-ionic attractions, and the viscosity of the solvent.","opts":["True","False"],"correct":0,"explain":"The text's comparison table states the resistance of electrolytic solutions is due to factors like concentration, inter-ionic attractions, and the viscosity of the solvent."},{"type":"mc","q":"According to the text, electrolytic conduction involves a transfer of matter as ions, while metallic conduction does not.","opts":["True","False"],"correct":0,"explain":"The text's comparison table states electrolytic conduction involves the transfer of matter as ions, while metallic conduction does not."},{"type":"mc","q":"Strong electrolytes dissociate completely in solution and produce brighter light in a conductivity test than weak electrolytes.","opts":["True","False"],"correct":0,"explain":"The text states strong electrolytes dissociate completely and produce more ions, resulting in brighter light than weak electrolytes."},{"type":"mc","q":"A galvanic (voltaic) cell converts electrical energy into chemical energy via a nonspontaneous redox reaction.","opts":["True","False"],"correct":1,
