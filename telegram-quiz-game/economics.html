0,"explain":"Capital-side progress raises the marginal product of capital more than that of labor."},{"type":"mc","q":"Labor-side technical progress is also called:","opts":["Capital-using technical progress","Labor-using technical progress","Neutral progress","Decreasing returns"],"correct":0,"explain":"The text calls labor-side progress labor saving or capital using."},{"type":"mc","q":"Neutral technical progress increases MPL and MPK by:","opts":["The same percentage","Different negative percentages","Only changing capital's price","Zero percent in all cases"],"correct":0,"explain":"Neutral progress raises both marginal products by the same percentage and leaves MRTS along a radius constant."},{"type":"mc","q":"Cost of production refers to:","opts":["Expenditures on the inputs used in production","Only the firm's profit","The output per worker","The distance between isoquants"],"correct":0,"explain":"Input prices or expenditures incurred on inputs are called the cost of production."},{"type":"mc","q":"A cost function describes the cheapest way to produce each output level given:","opts":["Input prices and technology","Only consumer tastes","Only the firm's tax rate","The number of isoquant labels"],"correct":0,"explain":"Cost functions derive from production functions and incorporate factor prices and technology."},{"type":"mc","q":"In the short run, total cost is divided into:","opts":["Total fixed cost and total variable cost","Average product and marginal product","Land and utility","Profit and revenue only"],"correct":0,"explain":"The textbook gives TC = TFC + TVC in the short run."},{"type":"mc","q":"Which is an example of a fixed cost in the textbook?","opts":["Building depreciation and repairs","Raw materials","Hourly labor used for output","Extra packaging for each unit"],"correct":0,"explain":"Administrative salaries and building depreciation and repairs are examples of fixed costs."},{"type":"mc","q":"Which is an example of a variable cost?","opts":["Raw materials","Building depreciation","Administrative staff salary fixed by contract","A fixed plant lease"],"correct":0,"explain":"Raw materials and labor are listed as variable costs that change with output."},{"type":"mc","q":"A total fixed cost is independent of:","opts":["The level of output","The existence of the firm","The fixed inputs","The production period"],"correct":0,"explain":"TFC does not vary with the quantity of output."},{"type":"mc","q":"If total fixed cost is Birr 100 and total variable cost is Birr 90, total cost is:","opts":["Birr 190","Birr 10","Birr 90","Birr 1000"],"correct":0,"explain":"TC = TFC + TVC = 100 + 90 = Birr 190."},{"type":"mc","q":"Average fixed cost is calculated as:","opts":["TFC divided by output","TVC divided by output","TC multiplied by output","Change in TC divided by change in output"],"correct":0,"explain":"AFC = TFC/Q."},{"type":"mc","q":"If TFC is Birr 100 and output is 4, AFC equals:","opts":["Birr 25","Birr 104","Birr 400","Birr 4"],"correct":0,"explain":"AFC = 100/4 = Birr 25."},{"type":"mc","q":"As output increases while TFC stays constant, AFC:","opts":["Falls and approaches the output axis","Rises continuously","Remains exactly constant","Becomes equal to TVC"],"correct":0,"explain":"Dividing constant TFC by larger Q reduces AFC."},{"type":"mc","q":"Average variable cost is:","opts":["TVC divided by output","TFC divided by output","TC divided by change in output","Output divided by TVC"],"correct":0,"explain":"AVC = TVC/Q."},{"type":"mc","q":"Average total cost can be written as:","opts":["AFC + AVC","AFC − AVC","TFC × TVC","MP + AP"],"correct":0,"explain":"Because TC = TFC + TVC, ATC = AFC + AVC."},{"type":"mc","q":"Marginal cost is the:","opts":["Additional total cost from producing one more unit of output","Total fixed cost per worker","Total output divided by labor","Cost that never changes with output"],"correct":0,"explain":"MC is the change in total cost resulting from a change in output, especially one additional unit."},{"type":"mc","q":"In the short run, marginal cost can be calculated as ΔTVC/ΔQ because:","opts":["ΔTFC is zero","TVC is always zero","Output is fixed","AFC equals AVC"],"correct":0,"explain":"With fixed cost unchanged, ΔTC = ΔTVC, so MC = ΔTVC/ΔQ."},{"type":"mc","q":"Using Table 3.4, what is marginal cost when output rises from 4 to 5?","opts":["Birr 5","Birr 10","Birr 18","Birr 38"],"correct":0,"explain":"MC = (TC at 5 − TC at 4) = 190−185 = Birr 5."},{"type":"mc","q":"Which short-run cost curve continuously declines as output increases?","opts":["AFC","AVC","MC","TVC"],"correct":0,"explain":"Since fixed cost is spread over more output, AFC falls continuously."},{"type":"mc","q":"The AVC curve is generally:","opts":["U-shaped","Horizontal at all outputs","Always downward sloping","Identical to the TFC curve"],"correct":0,"explain":"AVC first declines, reaches a minimum, and then rises, giving a U-shape."},{"type":"mc","q":"The MC curve passes through the minimum point of:","opts":["Both AVC and ATC","Only AFC","Only TFC","The production function"],"correct":0,"explain":"The textbook states that MC crosses the minimum points of AVC and ATC."},{"type":"mc","q":"The ATC curve lies above the AVC curve by a distance equal to:","opts":["AFC","TFC multiplied by Q","MP","MRTS"],"correct":0,"explain":"ATC = AVC + AFC, so their vertical difference is AFC at each output."},{"type":"mc","q":"In the long run, fixed costs are absent because:","opts":["All factors of production can be varied","Output must be zero","Only labor is fixed","TFC is always larger than TVC"],"correct":0,"explain":"Long-run planning permits changes in all inputs, so there are no fixed costs."},{"type":"mc","q":"The long-run average-cost and marginal-cost curves are described as:","opts":["U-shaped but flatter than short-run cost curves","Always vertical","Identical to TFC","Downward sloping only"],"correct":0,"explain":"The textbook says LAC and LMC are U-shaped and flatter than short-run curves."},{"type":"mc","q":"The economies-of-scale range is the range:","opts":["From the left up to the minimum point of LAC","Only after the minimum point of LAC","Where output is zero","Where AFC rises"],"correct":0,"explain":"The range to the left of minimum LAC is called economies of scale."},{"type":"mc","q":"In the economies-of-scale range, doubling output requires:","opts":["Less than a doubling of cost","More than a doubling of cost","Exactly zero cost","No change in inputs"],"correct":0,"explain":"Economies of scale mean output can double for less than double the cost."},{"type":"mc","q":"In the diseconomies-of-scale range, doubling output requires:","opts":["More than a doubling of cost","Less than a doubling of cost","No variable cost","A fixed output"],"correct":0,"explain":"The range to the right of minimum LAC is diseconomies of scale because cost more than doubles."},{"type":"mc","q":"The relationship between product and cost curves is described as:","opts":["Mirror images","Identical curves","Unrelated curves","Both always upward sloping"],"correct":0,"explain":"The textbook calls production and cost curves mirror images of each other."},{"type":"mc","q":"When average product rises, average cost generally:","opts":["Falls","Rises","Becomes fixed","Becomes negative"],"correct":0,"explain":"The stated inverse relationship is AP rising while AC falls."},{"type":"mc","q":"When marginal product is at its maximum, marginal cost is:","opts":["At its minimum","At its maximum","Equal to total fixed cost","Negative"],"correct":0,"explain":"Product and cost curves are mirror images: maximum MP corresponds to minimum MC."},{"type":"fib","q":"The three basic production concepts are total product, average product, and ______ product.","answer":"marginal","explain":"The textbook lists TP, AP, and MP as the three basic production concepts."},{"type":"fib","q":"Average product of labor equals total product divided by the number of ______.","answer":"workers","explain":"AP_L = TP/L, where L is the number of workers."},{"type":"fib","q":"Marginal product is the change in total product resulting from an additional unit of a ______ input.","answer":"variable","explain":"MP measures the additional output from one more unit of the variable input, other inputs held constant."},{"type":"fib","q":"The short run is a period in which at least one factor of production is ______.","answer":"fixed","explain":"This is the textbook's definition of the short run."},{"type":"fib","q":"The long run is sufficient for the quantities of ______ inputs to be changed.","answer":"all","explain":"In the long run, all input quantities are variable."},{"type":"fib","q":"With fixed capital, increasing labor eventually causes the marginal contribution of labor to ______.","answer":"decline","explain":"This is the law of diminishing marginal productivity."},{"type":"fib","q":"Stage II is the stage of ______ returns.","answer":"diminishing","explain":"Stage II is defined by positive but decreasing marginal product."},{"type":"fib","q":"Stage III is the stage of ______ returns.","answer":"negative","explain":"Stage III has negative MP and decreasing total product."},{"type":"fib","q":"Average product rises when marginal product is ______ than average product.","answer":"greater","explain":"AP rises when MP > AP."},{"type":"fib","q":"Average product reaches its maximum when marginal product is ______ to average product.","answer":"equal","explain":"AP is at its maximum when MP = AP."},{"type":"fib","q":"An isoquant shows input combinations that yield an ______ level of output.","answer":"equal","explain":"All points on one isoquant produce the same output."},{"type":"fib","q":"An isoquant is normally ______ to the origin in traditional economic theory.","answer":"convex","explain":"The textbook identifies standard isoquants as convex to the origin."},{"type":"fib","q":"The slope of an isoquant is called the marginal rate of technical ______.","answer":"substitution","explain":"The slope is the MRTS of the factors."},{"type":"fib","q":"An isoquant map is a graph combining several ______.","answer":"isoquants","explain":"That is the definition of an isoquant map."},{"type":"fib","q":"Increasing returns to scale occur when output increases by ______ than the proportionate increase in all inputs.","answer":"more","explain":"Output rises by more than m when all inputs rise by m."},{"type":"fib","q":"Constant returns to scale occur when output increases in the ______ proportion as all inputs.","answer":"same","explain":"Constant returns mean input and output proportions change equally."},{"type":"fib","q":"Technical progress shifts the production function ______.","answer":"upward","explain":"The textbook describes an upward shift after technical progress."},{"type":"fib","q":"Technical progress that increases MPK more than MPL is called ______-side technical progress.","answer":"capital","explain":"Capital-side progress raises MPK by more than MPL."},{"type":"fib","q":"Technical progress that increases MPL more than MPK is called ______-side technical progress.","answer":"labor","explain":"Labor-side progress raises MPL by more than MPK."},{"type":"fib","q":"Technical progress that increases MPL and MPK by the same percentage is called ______ technical progress.","answer":"neutral","explain":"Neutral progress leaves MRTS constant along a radius."},{"type":"fib","q":"Total cost is the sum of total fixed cost and total ______ cost.","answer":"variable","explain":"TC = TFC + TVC."},{"type":"fib","q":"A cost that does not vary with output is called a ______ cost.","answer":"fixed","explain":"Fixed cost is independent of output in the short run."},{"type":"fib","q":"A cost that varies directly with output is called a ______ cost.","answer":"variable","explain":"Variable cost rises or falls as output changes."},{"type":"fib","q":"Average fixed cost is total fixed cost divided by ______.","answer":"output","explain":"AFC = TFC/Q."},{"type":"fib","q":"Average variable cost is total variable cost divided by ______.","answer":"output","explain":"AVC = TVC/Q."},{"type":"fib","q":"Average total cost equals average fixed cost plus average ______ cost.","answer":"variable","explain":"ATC = AFC + AVC."},{"type":"fib","q":"Marginal cost is the change in total cost divided by the change in ______.","answer":"output","explain":"MC = ΔTC/ΔQ."},{"type":"fib","q":"In the short run, marginal cost equals ΔTVC/ΔQ because ΔTFC equals ______.","answer":"zero","explain":"Fixed cost does not change with output in the short run."},{"type":"fib","q":"The range to the right of minimum long-run average cost is called ______ of scale.","answer":"diseconomies","explain":"The textbook defines this range as diseconomies of scale."},{"type":"fib","q":"When marginal product rises, marginal cost ______.","answer":"falls","explain":"Product and cost curves have an inverse, mirror-image relationship."}]},{"unit_number":4,"title":"Market Structure","questions":[{"type":"mc","q":"A perfectly competitive market is one in which an individual buyer or seller has no ___.","opts":["market power","access to information","need for a product","production cost"],"correct":0,"explain":"Perfect competition is defined by the absence of market power for individual buyers and sellers."},{"type":"mc","q":"Which market condition makes the decision of one seller too small to affect the market price?","opts":["A large number of buyers and sellers","A single seller","Restricted entry","Product differentiation"],"correct":0,"explain":"With many buyers and sellers, one participant is too small relative to the market to change price."},{"type":"mc","q":"In perfect competition, products supplied by different firms are assumed to be ___.","opts":["homogeneous","patented","highly branded","unique"],"correct":0,"explain":"Product homogeneity means the products are the same and buyers cannot distinguish their source."},{"type":"mc","q":"A firm that accepts the market price as given is called a ___.","opts":["price taker","price maker","monopolist","cartel leader"],"correct":0,"explain":"A competitive firm cannot influence price, so it takes the market price as given."},{"type":"mc","q":"Which feature permits firms to enter or leave a perfectly competitive market freely?","opts":["Free entry and exit","Patent protection","Strategic input ownership","Large capital barriers"],"correct":0,"explain":"Perfect competition assumes no barrier restricts firms' entry into or exit from the market."},{"type":"mc","q":"Perfect information in a perfectly competitive market means buyers and sellers know the product's quality and ___.","opts":["current and future prices","only the seller's profit","only government policy","the identity of every buyer"],"correct":0,"explain":"The textbook includes knowledge of quality, nature, current and future prices, input prices, and other attributes."},{"type":"mc","q":"The objective of firms in perfect competition, according to the unit, is to ___.","opts":["maximize profit","eliminate all buyers","restrict entry","make products different"],"correct":0,"explain":"Firms seek to increase revenue and minimize costs to maximize profit."},{"type":"mc","q":"The farmers' market selling identical maize at an equal price illustrates ___.","opts":["perfect competition","pure monopoly","duopoly","price discrimination"],"correct":0,"explain":"The unit uses a farmers' market with similar products and equal prices as an illustration of perfect competition."},{"type":"mc","q":"The demand curve faced by an individual perfectly competitive firm is ___.","opts":["horizontal at the market price","vertical at the market price","downward sloping and identical to monopoly demand","upward sloping"],"correct":0,"explain":"A competitive firm can sell any amount at the ongoing market price, so its demand curve is horizontal."},{"type":"mc","q":"At the market price, a perfectly competitive firm can sell ___.","opts":["whatever quantity it wishes to sell","only one unit","no output","only the quantity set by a rival"],"correct":0,"explain":"The firm faces a horizontal demand curve and can supply whatever amount it chooses at that price."},{"type":"mc","q":"Which expression gives total revenue?","opts":["TR = P × Q","TR = P + Q","TR = Q ÷ P","TR = P − Q"],"correct":0,"explain":"Total revenue is the unit price multiplied by the quantity sold."},{"type":"mc","q":"A farmer sells 100 kg of coffee at Birr 200 per kg. What is total revenue?","opts":["Birr 20,000","Birr 2,000","Birr 300","Birr 200"],"correct":0,"explain":"Using TR = P × Q, total revenue is 200 × 100 = Birr 20,000."},{"type":"mc","q":"Average revenue is calculated as ___.","opts":["TR ÷ Q","TR × Q","P + Q","ΔQ ÷ ΔTR"],"correct":0,"explain":"Average revenue is revenue per unit, calculated by dividing total revenue by quantity sold."},{"type":"mc","q":"For a perfectly competitive firm, average revenue equals ___.","opts":["price","total cost","quantity","fixed cost"],"correct":0,"explain":"Because AR = (P × Q) ÷ Q, average revenue equals the product price."},{"type":"mc","q":"Marginal revenue is the additional revenue obtained from selling ___.","opts":["one more unit","all existing units","a different product","at least two fewer units"],"correct":0,"explain":"Marginal revenue is the change in total revenue from a one-unit increase in sales."},{"type":"mc","q":"Under perfect competition, which equality is correct?","opts":["AR = MR = P = the firm's demand","AR > P > MR","MR = 0 for every output","P = total revenue"],"correct":0,"explain":"The unit states that average revenue, marginal revenue, price, and the firm's demand are equal."},{"type":"mc","q":"The formula MR = ΔTR/ΔQ measures ___.","opts":["the change in total revenue per change in quantity","total revenue per unit price","the price multiplied by quantity","the number of buyers per seller"],"correct":0,"explain":"Marginal revenue is the ratio of the change in total revenue to the change in sales quantity."},{"type":"mc","q":"In perfect competition, the firm's AR and MR curves are horizontal because both are ___.","opts":["constant at the market price","downward sloping with quantity","equal to total cost","determined by patents"],"correct":0,"explain":"The firm receives the same market price for each additional unit, so AR and MR are constant and horizontal."},{"type":"mc","q":"A pure monopoly is a market structure with ___.","opts":["one supplier","many identical suppliers","two buyers only","free entry by all firms"],"correct":0,"explain":"Monopoly means a single firm supplies the market."},{"type":"mc","q":"The word 'monopoly' combines Greek terms meaning ___.","opts":["single seller","many buyers","free entry","different products"],"correct":0,"explain":"The unit explains monos as single and polus as seller."},{"type":"mc","q":"In a pure monopoly, the firm and the industry are ___.","opts":["one and the same","completely separate","both price takers","two competing sellers"],"correct":0,"explain":"The sole producer is the entire industry in a pure monopoly."},{"type":"mc","q":"A monopoly product is described as having ___.","opts":["no close substitutes","many identical substitutes","free substitutes from rivals","only branded substitutes"],"correct":0,"explain":"The absence of close substitutes prevents consumers from readily switching to another product."},{"type":"mc","q":"In contrast with a competitive firm, a monopolist is generally a ___.","opts":["price maker","price taker","quantity taker only","perfect-information buyer"],"correct":0,"explain":"The sole producer controls supply and can exercise considerable control over price."},{"type":"mc","q":"In a pure monopoly, consumers are described as ___.","opts":["price takers","price makers","sole producers","entry regulators"],"correct":0,"explain":"The monopolist is the price maker, while consumers take the price set through the firm's market control."},{"type":"mc","q":"The demand curve faced by a monopoly firm is ___.","opts":["downward sloping","horizontal at one fixed price","vertical for all quantities","upward sloping"],"correct":0,"explain":"A monopolist faces market demand, which slopes downward as price and quantity demanded move oppositely."},{"type":"mc","q":"If a monopolist raises its price, the quantity consumers buy will generally ___.","opts":["fall","rise without limit","remain exactly unchanged","become equal to total revenue"],"correct":0,"explain":"The downward-sloping demand curve means a higher price reduces quantity demanded."},{"type":"mc","q":"Selling the same product at different prices to different customers is called ___.","opts":["price discrimination","product homogeneity","free entry","perfect information"],"correct":0,"explain":"Price discrimination is the monopoly practice of charging different customers different prices."},{"type":"mc","q":"Which is a legal barrier that may restrict entry into a monopoly?","opts":["Licensing or patent rights","Many sellers","Identical products","Perfect information"],"correct":0,"explain":"The unit identifies licensing and patent rights as legal restrictions on entry."},{"type":"mc","q":"Economies of scale may support monopoly because the incumbent can ___.","opts":["produce at lower unit cost as output expands","make all products heterogeneous","remove all demand","avoid selling any output"],"correct":0,"explain":"When long-run average cost declines, a large incumbent may produce at lower unit cost and deter entrants."},{"type":"mc","q":"Ownership of the entire supply of a raw material needed for production is a monopoly source called ___.","opts":["ownership of strategic or key inputs","perfect information","free entry","non-price competition"],"correct":0,"explain":"Control of a crucial input can prevent other firms from producing the commodity."},{"type":"mc","q":"Which policy can limit the number of sellers and help create monopoly power?","opts":["A government-granted license or import quota","Free entry and exit","A horizontal firm demand curve","Product homogeneity alone"],"correct":0,"explain":"The textbook lists licenses and foreign-trade restrictions such as quotas as ways to limit sellers."},{"type":"mc","q":"The unit gives ELPA's electric power supply as an example of a possible ___.","opts":["monopoly","perfectly competitive market","monopolistic competition market","duopoly"],"correct":0,"explain":"ELPA is cited as a state-owned firm that can be considered a monopoly example."},{"type":"mc","q":"The unit cites control of natural mineral water as an example involving ___.","opts":["Ambo mineral water","a wheat market","a farmers' maize market","a clothing store"],"correct":0,"explain":"The text states that Ambo mineral water has monopolized natural mineral water."},{"type":"mc","q":"If a monopoly demand function is linear, it can be written as ___.","opts":["P = a − bQ","P = a + bQ","Q = a − bP only","TR = P + Q"],"correct":0,"explain":"The unit presents the linear monopoly demand function P = a − bQ, with positive a and b."},{"type":"mc","q":"Substituting P = a − bQ into TR = P × Q gives ___.","opts":["TR = aQ − bQ²","TR = a + bQ","TR = aQ + bQ²","TR = Q ÷ P"],"correct":0,"explain":"Multiplying (a − bQ) by Q produces TR = aQ − bQ²."},{"type":"mc","q":"For a monopoly, average revenue is equal to ___.","opts":["price","marginal cost by definition","fixed cost","quantity supplied"],"correct":0,"explain":"Since AR = TR/Q and TR = P×Q, AR equals P."},{"type":"mc","q":"In the textbook's monopoly revenue table, what is marginal revenue at Q = 6?","opts":["0","2","6","−2"],"correct":0,"explain":"At Q = 6, total revenue is 30 and the table lists marginal revenue as 0."},{"type":"mc","q":"The total-revenue curve of a monopolist is described as ___.","opts":["inverse U-shaped","horizontal throughout","vertical throughout","a straight line increasing forever"],"correct":0,"explain":"Monopoly total revenue first rises, reaches a maximum, and then falls as sales quantity increases."},{"type":"mc","q":"The AR and MR curves of a monopoly firm are both ___.","opts":["downward sloping","horizontal and equal to market price","upward sloping","unrelated to sales quantity"],"correct":0,"explain":"Both average revenue and marginal revenue decrease as the monopolist sells more output."},{"type":"mc","q":"Which statement best describes a monopolistically competitive market?","opts":["Many sellers offer differentiated products with free entry and exit","One seller offers a product with no substitutes","Two sellers offer identical goods with blocked entry","Many sellers offer identical goods with no information"],"correct":0,"explain":"Monopolistic competition combines many firms, product differentiation, and free entry and exit."},{"type":"mc","q":"In monopolistic competition, products may differ in ___.","opts":["style, brand name, or quality","only quantity sold","only government ownership","whether buyers exist"],"correct":0,"explain":"The unit gives style, brand name, and quality as sources of product differentiation."},{"type":"mc","q":"Compared with perfect competition, the number of sellers and buyers in monopolistic competition is ___.","opts":["relatively large, though generally less","exactly one seller and one buyer","always two sellers","zero"],"correct":0,"explain":"The text says there are many sellers and buyers, though relatively fewer than in perfect competition."},{"type":"mc","q":"A firm in monopolistic competition can leave the market when it is not profitable because of ___.","opts":["free exit","patent protection","a single supplier","strategic input ownership"],"correct":0,"explain":"There is no barrier preventing a firm from exiting monopolistic competition."},{"type":"mc","q":"Which is an example of non-price competition in monopolistic competition?","opts":["Advertising","A legal entry quota","A horizontal demand curve","Owning all raw materials"],"correct":0,"explain":"Non-price competition includes advertising, product quality, brand name, and customer service."},{"type":"mc","q":"Advertising can help a monopolistically competitive firm develop ___.","opts":["brand loyalty","a legal monopoly","a fixed cost only","perfect homogeneity"],"correct":0,"explain":"The textbook says advertising communicates unique characteristics, attracts buyers, and develops brand loyalty."},{"type":"mc","q":"A firm in monopolistic competition is a limited price maker because its product is ___.","opts":["differentiated","identical to every rival's product","legally unavailable","a key raw material"],"correct":0,"explain":"Differentiation gives a seller limited monopoly power over customers who prefer its product."},{"type":"mc","q":"The demand curve of a monopolistically competitive firm is ___.","opts":["downward sloping","horizontal at the market price","vertical at every output","upward sloping"],"correct":0,"explain":"Product differentiation lets each firm face a downward-sloping demand curve."},{"type":"mc","q":"Compared with the monopoly firm's demand curve, the monopolistically competitive firm's demand curve is ___.","opts":["flatter","steeper","vertical","identical in every case"],"correct":0,"explain":"Because it has rivals and close substitutes, its demand curve is flatter than a monopoly firm's."},{"type":"mc","q":"The demand curve of a monopolistically competitive firm is not ___.","opts":["the market demand curve as in monopoly","downward sloping","related to its differentiated product","its average-revenue curve"],"correct":0,"explain":"The text distinguishes it from monopoly market demand; it is the individual firm's downward-sloping demand curve."},{"type":"mc","q":"In monopolistic competition, the firm's average-revenue curve is ___.","opts":["downward sloping","horizontal and fixed","vertical","always zero"],"correct":0,"explain":"The firm's demand curve is also its AR curve, and it slopes downward."},{"type":"mc","q":"In monopolistic competition, marginal revenue is generally ___.","opts":["less than average revenue","greater than average revenue","equal to total revenue","unrelated to average revenue"],"correct":0,"explain":"The unit states that MR is less than AR and both curves slope downward."},{"type":"mc","q":"Choosing among different pens on a stationery shelf illustrates ___.","opts":["monopolistic competition","pure monopoly","perfectly competitive wheat selling","a duopoly"],"correct":0,"explain":"Different pen types provide differentiated products sold by competing sellers."},{"type":"mc","q":"An oligopoly is a market with ___.","opts":["few firms","one firm only","millions of firms with no interdependence","one buyer only"],"correct":0,"explain":"An oligopoly has more than one seller, but few enough that each firm's contribution matters."},{"type":"mc","q":"The key strategic feature of oligopoly is ___.","opts":["mutual interdependence","complete absence of rivals","free information only","identical prices by law"],"correct":0,"explain":"Oligopolists recognize that their decisions are affected by and affect rival firms."},{"type":"mc","q":"The world market for crude oil is used in the unit as an example of ___.","opts":["oligopoly","perfect competition","monopolistic competition","pure monopoly"],"correct":0,"explain":"The text notes that a few Middle Eastern countries control much of the world's oil reserves."},{"type":"mc","q":"Cement and sugar factories are cited as Ethiopian examples of ___.","opts":["oligopoly firms","perfectly competitive firms","monopolies with no rivals","non-price buyers"],"correct":0,"explain":"The unit identifies cement and sugar factories as examples of oligopoly firms in Ethiopia."},{"type":"mc","q":"Why do oligopoly firms recognize one another's actions?","opts":["The number of firms is small enough for each action to matter","There are no buyers","All products are legally identical","Entry is completely free"],"correct":0,"explain":"Few dominant firms make each firm's decisions relevant to the others."},{"type":"mc","q":"Which can make entry difficult in an oligopoly?","opts":["Economies of scale and large capital requirements","Free movement of every firm","Perfectly homogeneous information","Many small buyers"],"correct":0,"explain":"The textbook lists economies of scale and large capital requirements as entry barriers."},{"type":"mc","q":"Oligopoly entry may also be blocked by access to ___.","opts":["patents, technology, or raw materials","many buyers only","free exit","horizontal demand only"],"correct":0,"explain":"Patents or control of technology or raw materials may exclude potential competitors."},{"type":"mc","q":"Products in an oligopoly may be ___.","opts":["homogeneous or differentiated","always homogeneous only","always differentiated only","absent from the market"],"correct":0,"explain":"The unit explicitly allows either homogeneous or differentiated oligopoly products."},{"type":"mc","q":"A duopoly is ___.","opts":["an oligopoly with two firms","a monopoly with two buyers","a market with no firms","perfect competition with two million sellers"],"correct":0,"explain":"A duopoly is the simplest oligopoly and has only two firms."},{"type":"mc","q":"Ethio-Telecom and Safaricom Ethiopia are given as examples of firms in a ___.","opts":["duopoly","pure monopoly","perfectly competitive market","monopolistic competition market"],"correct":0,"explain":"The unit gives these two firms as an example of a duopoly."},{"type":"mc","q":"In an oligopoly, a firm that changes price may cause ___.","opts":["rival firms to change their prices","all entry barriers to disappear","the product to become homogeneous automatically","demand to become horizontal permanently"],"correct":0,"explain":"Rivals may respond to a firm's price change, reflecting interdependence."},{"type":"mc","q":"The demand curve faced by an oligopolist can keep shifting because of ___.","opts":["rival firms' responses","perfect information alone","the absence of buyers","fixed product quality"],"correct":0,"explain":"Price changes by one firm may trigger rival price changes, shifting the demand it faces."},{"type":"mc","q":"In oligopoly, the firm's average-revenue curve is also its ___.","opts":["demand curve","total-cost curve","fixed-cost curve","supply of raw materials"],"correct":0,"explain":"As in the unit's other imperfect-market discussion, the firm's AR curve is the same as its demand curve."},{"type":"mc","q":"Which statement about oligopoly marginal revenue is correct?","opts":["It is less than average revenue","It is always greater than average revenue","It equals total revenue","It is always zero"],"correct":0,"explain":"The textbook states that the oligopolist's MR curve is less than its AR curve."},{"type":"mc","q":"Which three criteria are used in the unit to classify market structures?","opts":["Numbers of buyers and sellers, product type, and entry/exit conditions","Only price, income, and taxes","Only production technology, wages, and rent","Only advertising, profit, and imports"],"correct":0,"explain":"The summary identifies numbers of buyers and sellers, homogeneity or heterogeneity, and free or restricted entry and exit."},{"type":"mc","q":"Which market structure has full information transparency as a listed characteristic?","opts":["Perfect competition","Pure monopoly","Oligopoly only","Monopolistic competition only"],"correct":0,"explain":"The summary lists full information transparency under perfect competition."},{"type":"mc","q":"Which market structure combines competition from many firms with monopoly features from differentiated products?","opts":["Monopolistic competition","Pure monopoly","Perfect competition","Duopoly only"],"correct":0,"explain":"Monopolistic competition has many firms and free entry, but differentiation gives each seller limited monopoly power."},{"type":"mc","q":"Which statement correctly compares perfect competition and monopoly?","opts":["A competitive firm is a price taker, while a monopolist is a price maker","Both firms are always price takers","A competitive firm is the whole industry, while a monopolist is one of many firms","Both face horizontal demand curves"],"correct":0,"explain":"The unit contrasts the competitive price taker with the monopoly price maker."},{"type":"fib","q":"In perfect competition, individual buyers and sellers have no market ___.","answer":"power","explain":"The defining distinction of perfect competition is that no buyer or seller has market power."},{"type":"fib","q":"The assumption that products are the same across firms is called product ___.","answer":"homogeneity","explain":"Homogeneous products are identical or indistinguishable across sellers."},{"type":"fib","q":"The freedom of firms to enter and leave a perfectly competitive market is called free entry and ___.","answer":"exit","explain":"Perfect competition has no barrier restricting entry into or exit from the market."},{"type":"fib","q":"Complete knowledge of quality, prices, and other market attributes is called perfect ___.","answer":"information","explain":"The textbook assumes both consumers and producers have perfect information."},{"type":"fib","q":"The formula for total revenue is TR = P × ___.","answer":"Q","explain":"Total revenue equals the unit price multiplied by the quantity sold."},{"type":"fib","q":"Average revenue is total revenue divided by ___.","answer":"quantity (Q)","explain":"AR = TR/Q, so it is revenue per unit sold."},{"type":"fib","q":"In perfect competition, average revenue equals the product ___.","answer":"price","explain":"Since AR = (P×Q)/Q, AR equals P."},{"type":"fib","q":"Marginal revenue is calculated as ΔTR divided by Δ___.","answer":"Q","explain":"MR = ΔTR/ΔQ measures the additional revenue per additional unit sold."},{"type":"fib","q":"A pure monopoly has only one ___.","answer":"seller (or supplier)","explain":"A monopoly is a market in which a single firm supplies the product."},{"type":"fib","q":"Because it controls market supply, a monopolist is a price ___.","answer":"maker","explain":"The sole producer can influence price by changing the quantity supplied."},{"type":"fib","q":"A monopoly product has no close ___.","answer":"substitutes","explain":"The absence of close alternatives is a characteristic of pure monopoly."},{"type":"fib","q":"Charging different customers different prices is called price ___.","answer":"discrimination","explain":"Price discrimination is possible under the conditions of monopoly."},{"type":"fib","q":"Licensing and patent rights are examples of legal entry ___.","answer":"barriers","explain":"Legal restrictions can prevent new competitors from entering a monopoly market."},{"type":"fib","q":"Declining long-run average cost as output increases is called economies of ___.","answer":"scale","explain":"Economies of scale can let an incumbent produce at lower unit cost and deter entry."},{"type":"fib","q":"Control of a crucial raw material is ownership of a strategic or key ___.","answer":"input","explain":"Owning a key input can prevent other firms from producing the commodity."},{"type":"fib","q":"The linear monopoly demand function in the unit is P = a − b___.","answer":"Q","explain":"The unit defines P as price and Q as quantity in P = a − bQ."},{"type":"fib","q":"For a linear monopoly demand function, total revenue is TR = aQ − b___.","answer":"Q²","explain":"Multiplying P = a − bQ by Q gives TR = aQ − bQ²."},{"type":"fib","q":"In the monopoly table, marginal revenue is zero at a quantity of ___.","answer":"6","explain":"At Q = 6, total revenue reaches 30 and the table reports MR = 0."},{"type":"fib","q":"The monopoly firm's demand curve slopes ___.","answer":"downward","explain":"A monopolist must lower price to sell more output, producing a downward-sloping demand curve."},{"type":"fib","q":"In a pure monopoly, the firm and the industry are one and the ___.","answer":"same","explain":"The single producer is the entire industry."},{"type":"fib","q":"Products that differ by style, brand name, or quality are called ___.","answer":"differentiated (or heterogeneous)","explain":"Product differentiation is central to monopolistic competition."},{"type":"fib","q":"Advertising and customer service are forms of __-price competition.","answer":"non","explain":"Monopolistically competitive firms compete through quality, advertising, brand names, and service as well as price."},{"type":"fib","q":"A monopolistically competitive market has relatively large numbers of sellers and ___.","answer":"buyers","explain":"Many buyers and sellers are one of its characteristics."},{"type":"fib","q":"In monopolistic competition, firms have free entry and ___.","answer":"exit","explain":"The market has no barrier preventing willing and able firms from entering or leaving."},{"type":"fib","q":"The demand curve of a monopolistically competitive firm is also its __ curve.","answer":"AR (average revenue)","explain":"The text states that the firm's demand curve is its downward-sloping average-revenue curve."},{"type":"fib","q":"In monopolistic competition, marginal revenue is less than average ___.","answer":"revenue","explain":"The unit states that MR is less than AR in this market."},{"type":"fib","q":"An oligopoly is a market with a __ number of firms.","answer":"few","explain":"Oligopoly has few firms whose actions are significant to one another."},{"type":"fib","q":"The situation in which each oligopoly firm's decision affects and is affected by rivals is called mutual ___.","answer":"interdependence","explain":"Mutual interdependence is the defining strategic feature of oligopoly."},{"type":"fib","q":"A market with exactly two firms is called a ___.","answer":"duopoly","explain":"A duopoly is the simplest form of oligopoly and contains two firms."},{"type":"fib","q":"Oligopoly products may be homogeneous or ___.","answer":"differentiated","explain":"The unit allows both identical and differentiated products in oligopoly."}]},{"unit_number":5,"title":"Money and Banking","questions":[{"type":"mc","q":"What is a financial intermediary?","opts":["An entity that acts as a middleman between parties in a financial transaction","A rule that organizes social behavior","A market for goods and services only","A government tax office"],"correct":0,"explain":"The text defines a financial intermediary as a middleman between parties in a financial transaction."},{"type":"mc","q":"Financial intermediation transfers funds from a surplus spending unit to a:","opts":["Deficit spending unit","Central bank only","Tax authority","Retail shop only"],"correct":0,"explain":"Financial intermediation moves funds from providers with excess money to users with a shortage of money."},{"type":"mc","q":"Which is a benefit of financial intermediaries to depositors?","opts":["Safety and interest earning","Guaranteed free loans","Removal of all taxes","Ownership of every borrower’s business"],"correct":0,"explain":"The text identifies safety of deposited money and interest earning as depositor benefits."},{"type":"mc","q":"People who borrow money from banks and other financial intermediaries for investment are called:","opts":["Investors","Depositors","Regulators","Currency issuers"],"correct":0,"explain":"The lesson calls people who borrow finance for investment investors."},{"type":"mc","q":"What do financial intermediaries charge borrowers on money borrowed?","opts":["Annual interest","A lottery fee only","A maturity value of zero","No charge in every case"],"correct":0,"explain":"The text states that intermediaries charge borrowers annual interest."},{"type":"mc","q":"Why does increased borrowing by investors potentially help a country?","opts":["It can support more investment and production","It eliminates the need for saving","It prevents all business risk","It closes financial institutions"],"correct":0,"explain":"The lesson links more borrowing for investment with more production, which is useful for the country."},{"type":"mc","q":"Which institution is used in the text as an example of a financial intermediary?","opts":["Commercial Bank of Ethiopia","A shoe factory","A funeral committee","A school examination board"],"correct":0,"explain":"Commercial Bank of Ethiopia is the example given in the definition."},{"type":"fib","q":"Financial intermediaries mediate between providers with excess money and users with a ______ of money.","answer":"shortage","explain":"The text describes users of financial capital as having a shortage of money."},{"type":"fib","q":"The transfer of funds from a surplus spending unit to a deficit spending unit is called financial ______.","answer":"intermediation","explain":"The text names this transfer financial intermediation."},{"type":"fib","q":"For depositors, banks provide safety and ______ earning.","answer":"interest","explain":"Interest earning is listed as a benefit to depositors."},{"type":"mc","q":"What is the main function of financial markets?","opts":["Providing channels for allocating savings to investment","Setting prices for every consumer good","Replacing all financial institutions","Collecting only household taxes"],"correct":0,"explain":"Financial markets provide channels through which savings are allocated to investment."},{"type":"mc","q":"Financial markets help decouple the acts of:","opts":["Saving and investment","Buying and consuming","Taxing and spending","Producing and transporting"],"correct":0,"explain":"The text says financial markets decouple saving from investment."},{"type":"mc","q":"How many major components do financial markets have in the lesson?","opts":["Two","One","Three","Four"],"correct":0,"explain":"The two components are the money market and the capital market."},{"type":"mc","q":"A money market instrument has an original maturity at issuance of:","opts":["One year or less","Exactly five years","More than ten years only","No maturity in every case"],"correct":0,"explain":"Money markets include instruments with a maturity date of one year or less at issuance."},{"type":"mc","q":"Which is a money market instrument?","opts":["Treasury bill","Common stock","Perpetual preferred stock","A house deed"],"correct":0,"explain":"Treasury bills are listed among money market instruments."},{"type":"mc","q":"Treasury bills are issued by:","opts":["Governments","Only households","Only insurance customers","Informal moneylenders"],"correct":0,"explain":"The text defines Treasury bills as financial instruments issued by governments."},{"type":"mc","q":"How does a holder of a Treasury bill realize a return according to the text?","opts":["By buying below maturity value and receiving maturity value","By receiving ownership of the government","By paying interest to the issuer","By exchanging it for a microloan"],"correct":0,"explain":"A T-bill is bought for less than its maturity value and pays the maturity value at maturity."},{"type":"mc","q":"Commercial paper is a promissory note issued by:","opts":["A large, creditworthy corporation or municipality","Only a central bank","Any child with a savings account","An iddir committee only"],"correct":0,"explain":"The text identifies large creditworthy corporations or municipalities as issuers."},{"type":"mc","q":"The original maturity range of commercial paper stated in the lesson is:","opts":["One day to 270 days","One year to ten years","Ten to fifty years","Exactly one month"],"correct":0,"explain":"Commercial paper may have an original maturity from one day to 270 days."},{"type":"mc","q":"A certificate of deposit is a written promise by a bank to pay a:","opts":["Depositor","Tax collector","Stock exchange","Foreign government"],"correct":0,"explain":"A CD is a bank's written promise to pay a depositor."},{"type":"mc","q":"Which statement describes the capital market?","opts":["It issues long-term instruments with maturity greater than a year or perpetual securities","It contains only instruments maturing within a week","It is limited to informal savings clubs","It issues no securities"],"correct":0,"explain":"Capital markets deal in instruments with original maturity greater than one year and perpetual securities."},{"type":"mc","q":"A syndicated bank loan is provided by:","opts":["A group or syndicate of banks","One household only","A single insurance policyholder","An iddir's funeral committee"],"correct":0,"explain":"The text defines a syndicated loan as one funded by a group of banks."},{"type":"fib","q":"The two major components of financial markets are the money market and the ______ market.","answer":"capital","explain":"The lesson identifies money and capital markets as the two components."},{"type":"fib","q":"Money market instruments have a maturity date of one year or ______ at issuance.","answer":"less","explain":"The stated money-market maturity is one year or less."},{"type":"fib","q":"Treasury bills are bought for less than their ______ value and redeemed at that value.","answer":"maturity","explain":"The return on a T-bill comes from the difference between purchase price and maturity value."},{"type":"fib","q":"Common stock represents ownership of a perpetual ______.","answer":"corporation","explain":"The text describes common stock as ownership in a perpetual corporation."},{"type":"fib","q":"Debt securities with maturity at issuance of ten years or less are called ______.","answer":"notes","explain":"The lesson calls securities maturing in ten years or less notes; those over ten years are bonds."},{"type":"mc","q":"Institutions are best described in the text as:","opts":["Underlying rules of the game in society or an organization","Only buildings where money is stored","Short-term securities","Personal consumption choices"],"correct":0,"explain":"Institutions are norms that organize relations and are called the underlying rules of the game."},{"type":"mc","q":"Which is a formal institution?","opts":["Written laws enforced by official authorities","An unwritten custom only","A friendship group","A personal habit"],"correct":0,"explain":"Formal institutions include written constitutions, laws, policies, rights, and regulations enforced by authorities."},{"type":"mc","q":"Informal institutions are usually:","opts":["Unwritten social norms, customs, or traditions","Government-issued banknotes","Long-term debt securities","Bank branches"],"correct":0,"explain":"The text defines informal institutions as usually unwritten norms, customs, or traditions."},{"type":"mc","q":"Financial institutions are institutions that:","opts":["Serve as financial intermediaries","Issue only school certificates","Produce all consumer goods","Operate only as informal clubs"],"correct":0,"explain":"The lesson directly defines financial institutions as institutions serving as financial intermediaries."},{"type":"mc","q":"Which is a depositary institution?","opts":["A bank","An insurance company only","A brokerage firm only","A municipality"],"correct":0,"explain":"Depositary institutions accept and manage deposits and make loans; banks are an example."},{"type":"mc","q":"Contractual institutions include:","opts":["Insurance companies and pension funds","Banks and credit unions only","Investment banks and brokers only","Informal moneylenders only"],"correct":0,"explain":"The text lists insurance companies and pension funds as contractual institutions."},{"type":"mc","q":"Which is an example of an investment institution?","opts":["A brokerage firm","A pension fund","A credit union","A household savings box"],"correct":0,"explain":"Investment institutions include investment banks, underwriters, and brokerage firms."},{"type":"mc","q":"A bank accepts deposits and gives money as a:","opts":["Loan","Tax","Dividend to every citizen","Treasury bill only"],"correct":0,"explain":"The text defines a bank as an intermediary that accepts deposits and gives loans."},{"type":"mc","q":"Which combination is identified as important for bank efficiency?","opts":["Competition and the nature of regulation","Weather and population size","Exports and rainfall","Advertising and school enrollment"],"correct":0,"explain":"Bank efficiency depends on the degree of competition and the nature of regulation."},{"type":"mc","q":"One expected result of competition among banks is:","opts":["Lower interest rates for borrowers","Fewer services for customers","Lower interest rates for depositors","A ban on deposits"],"correct":0,"explain":"The text lists lower borrower rates, higher depositor rates, greater technical efficiency, and more services as results of competition."},{"type":"fib","q":"The two forms of institutions are formal and ______.","answer":"informal","explain":"The lesson distinguishes formal and informal institutions."},{"type":"fib","q":"Deposit-taking institutions accept and manage deposits and make ______.","answer":"loans","explain":"This is the defining activity of depositary institutions."},{"type":"fib","q":"A non-bank financial institution does not have a full banking ______.","answer":"license","explain":"The text defines an NBFI as lacking a full banking license or banking-regulatory supervision."},{"type":"mc","q":"According to the historical note, modern banking in Ethiopia started in:","opts":["1905","1931","1963","1991"],"correct":0,"explain":"The historical note states that modern banking started in 1905 with the Abyssinian Bank agreement."},{"type":"mc","q":"The first modern bank described in the history section was:","opts":["Bank of Abyssinia","Commercial Bank of Ethiopia","Development Bank of Ethiopia","Agricultural and Industrial Development Bank"],"correct":0,"explain":"The Bank of Abyssinia was founded as the first modern bank in the account."},{"type":"mc","q":"The Bank of Abyssinia was given a concession lasting:","opts":["50 years","5 years","10 years","100 years"],"correct":0,"explain":"The text says the bank was given a 50-year concession."},{"type":"mc","q":"Which activity was the Bank of Abyssinia engaged in?","opts":["Issuing notes, collecting deposits, and granting loans","Only selling insurance","Only financing funerals","Only collecting taxes"],"correct":0,"explain":"The history states that it issued notes, collected deposits, and granted loans."},{"type":"mc","q":"Which town received a Bank of Abyssinia branch in 1906?","opts":["Harar","Gore","Dessie","Gambella"],"correct":0,"explain":"The listed branch dates show Harar in 1906, Dire Dawa in 1908, and Gore in 1912."},{"type":"mc","q":"Bank of Abyssinia was liquidated in:","opts":["1931","1905","1943","1974"],"correct":0,"explain":"The text states that Bank of Abyssinia was liquidated in 1931."},{"type":"mc","q":"Which bank legally replaced Bank of Abyssinia in 1931?","opts":["Bank of Ethiopia","State Bank of Ethiopia","National Bank of Ethiopia","Addis Bank"],"correct":0,"explain":"Bank of Ethiopia legally replaced Bank of Abyssinia in 1931."},{"type":"mc","q":"The Bank of Ethiopia was notable because it was:","opts":["Under Ethiopian government control","Managed entirely by a foreign bank","An informal savings club","A private insurance company"],"correct":0,"explain":"The text calls it the first independent bank under total Ethiopian government control."},{"type":"mc","q":"Which group introduced Banca d’Italia, Banco di Roma, Banco di Napoli, and Banca Nazionale del lavoro during 1936-1941?","opts":["The Italians during the occupation","The British troops","Local iddir members","Microfinance borrowers"],"correct":0,"explain":"The text identifies these as Italian banks introduced during the 1936-1941 invasion period."},{"type":"mc","q":"The State Bank of Ethiopia was established in:","opts":["1943","1931","1963","1980"],"correct":0,"explain":"The State Bank of Ethiopia was established in 1943."},{"type":"mc","q":"The State Bank of Ethiopia had the power to issue:","opts":["Bank notes and coins","Only insurance contracts","Only common stock","Only foreign passports"],"correct":0,"explain":"It issued bank notes and coins as agent of the Ministry of Finance."},{"type":"mc","q":"In 1963, the State Bank of Ethiopia was split into:","opts":["National Bank of Ethiopia and Commercial Bank of Ethiopia","CBE and DBE only","Addis Bank and AIDB only","Two microfinance institutions"],"correct":0,"explain":"The 1963 change created the National Bank as central bank and the Commercial Bank of Ethiopia."},{"type":"mc","q":"During the socialist period from 1974 to 1991, the financial sector was characterized by:","opts":["Strong government control and nationalization","Complete financial liberalization","No banks at all","Only informal lending"],"correct":0,"explain":"The government extended control over the economy and nationalized large corporations."},{"type":"mc","q":"The three dominant banks during the 1974-1991 period included NBE, CBE, and:","opts":["Agricultural and Industrial Development Bank","Bank of Abyssinia","Barclays Bank","Banco di Napoli"],"correct":0,"explain":"The text lists NBE, CBE, and AIDB as the three dominant banks."},{"type":"mc","q":"The Commercial Bank of Ethiopia was formed as the sole commercial bank in the country after the merger in:","opts":["1980","1963","1991","1994"],"correct":0,"explain":"The text says Addis Bank and CBE were merged in 1980, forming the sole commercial bank until private banks in 1994."},{"type":"mc","q":"The licensing and supervision of banking business was formulated in:","opts":["1994","1905","1943","1979"],"correct":0,"explain":"The text identifies the 1994 Monetary and Banking Proclamation No. 83/1994."},{"type":"mc","q":"Which is a role of the National Bank of Ethiopia?","opts":["Regulating money supply and interest rates","Providing only funeral assistance","Running every private business","Selling household goods"],"correct":0,"explain":"NBE regulates money supply, interest rates, and other financial-sector activities."},{"type":"mc","q":"Which is a function of the Development Bank of Ethiopia?","opts":["Providing development loans and supervising financed projects","Issuing all currency for households","Operating an iddir","Offering only debit cards"],"correct":0,"explain":"DBE provides short-, medium-, and long-term development credits and supervises financed projects."},{"type":"fib","q":"The first modern bank in Ethiopia was founded as the Bank of ______.","answer":"Abyssinia","explain":"The history section identifies Bank of Abyssinia as the first modern bank."},{"type":"fib","q":"Bank of Ethiopia was authorized to issue notes and ______.","answer":"coins","explain":"The bank took over commercial activities and was authorized to issue notes and coins."},{"type":"fib","q":"The State Bank of Ethiopia functioned as the central bank until ______.","answer":"1963","explain":"The text states that it remained the central bank until 1963."},{"type":"fib","q":"The National Bank of Ethiopia began operation in January ______.","answer":"1964","explain":"The 1963 proclamation established NBE, which began operation in January 1964."},{"type":"fib","q":"The socialist period in Ethiopian banking history is identified as ______ to 1991.","answer":"1974","explain":"The text labels 1974-1991 as the socialist period."},{"type":"fib","q":"The Agricultural and Industrial Bank was renamed Agricultural and Industrial Development Bank in ______.","answer":"1979","explain":"The history states that the 1970 bank was renamed AIDB in 1979."},{"type":"fib","q":"The National Bank of Ethiopia aims, among other things, to bring price stability or control ______.","answer":"inflation","explain":"The text links control of the financial sector to price stability and inflation control."},{"type":"fib","q":"The Commercial Bank of Ethiopia provides safe custody for household and individual ______.","answer":"valuables","explain":"Safe custody for valuables is listed among CBE functions."},{"type":"mc","q":"Why did microfinance arise as an important idea for poor borrowers?","opts":["Traditional banks often required collateral","Poor borrowers always preferred bonds","Banks offered unlimited free loans","Microfinance replaced all savings"],"correct":0,"explain":"The lesson explains that collateral requirements excluded many poor people from traditional banks."},{"type":"mc","q":"Muhammad Yunus's microfinance work led to the establishment of:","opts":["Grameen Bank","State Bank of Ethiopia","Addis Bank","Banco di Roma"],"correct":0,"explain":"The text links Yunus's idea of microfinancing and microcredit to Grameen Bank."},{"type":"mc","q":"Microfinance institutions give access to services for people otherwise unserved by:","opts":["The traditional banking system","Every informal family","Only stock exchanges","Government ministries"],"correct":0,"explain":"MFIs serve people excluded from traditional banks that ask for collateral."},{"type":"mc","q":"A microcredit is:","opts":["A small credit given by a microfinance institution","A long-term government bond","A deposit held by a central bank","An insurance premium only"],"correct":0,"explain":"The text defines microcredit as a small credit provided by an MFI."},{"type":"mc","q":"In group lending, the group is treated as:","opts":["Collateral","A central bank","A stock exchange","A tax office"],"correct":0,"explain":"Group lending uses the group as collateral."},{"type":"mc","q":"What happens when one group member defaults under the described group-lending mechanism?","opts":["Other group members must make up the payment","The loan automatically disappears","The bank pays the group","The member receives a larger loan"],"correct":0,"explain":"The text says other members must make up the payment when one member defaults."},{"type":"mc","q":"The main clients of microfinance are:","opts":["Economically active poor with opportunities and entrepreneurial skills","Only the destitute without productive opportunities","Only large corporations","Only central banks"],"correct":0,"explain":"MFIs target economically active poor people who can use funds productively."},{"type":"mc","q":"Why are the poorest of the poor generally excluded from the microfinance circle?","opts":["They generally lack economic opportunities or entrepreneurial skills","They already own commercial banks","They are all government employees","They cannot save any money at all"],"correct":0,"explain":"The text says destitute people are generally excluded because they lack opportunities or entrepreneurial skills."},{"type":"mc","q":"Compared with MFIs, informal moneylenders usually charge:","opts":["Much higher interest","No interest in every case","Exactly the same interest","Only government-set interest"],"correct":0,"explain":"The text states that informal moneylenders' interest almost always exceeds MFI charges."},{"type":"mc","q":"Which is a positive feature of informal moneylenders noted in the lesson?","opts":["Simple procedures and timely disbursement","Strong formal regulatory protection","Free insurance for all","Long complicated applications"],"correct":0,"explain":"The text lists simple procedures, clear terms, and timely disbursement as positive features."},{"type":"fib","q":"Microfinance institutions provide savings, credit, insurance, and money ______ services.","answer":"transfer","explain":"Money transfer is one of the financial services listed for MFIs."},{"type":"fib","q":"The group lending mechanism uses peer ______ as an incentive to repay.","answer":"pressure","explain":"The text says repayment incentives are based on peer pressure."},{"type":"fib","q":"Micro-entrepreneurs are also called the economically ______ poor.","answer":"active","explain":"The lesson uses the term economically active poor for micro-entrepreneurs."},{"type":"fib","q":"In Ethiopia, 41 microfinance institutions were operational by ______/21.","answer":"2020","explain":"The stated figure is for the 2020/21 Gregorian year."},{"type":"fib","q":"MFIs help low-income people use microcredit to support micro______.","answer":"businesses","explain":"The text says microcredit supports microbusinesses."},{"type":"mc","q":"Electronic banking is also known as:","opts":["Electronic fund transfer (EFT)","Equity financial tax","Emergency finance tariff","Economic firm trading"],"correct":0,"explain":"The text states that electronic banking is also called electronic fund transfer."},{"type":"mc","q":"Which is one of the three key aspects of electronic banking?","opts":["Automated teller machines","Informal moneylenders","Common stock ownership","Funeral contributions"],"correct":0,"explain":"The three aspects are ATMs, direct deposits, and debit card purchases."},{"type":"mc","q":"ATMs allow customers to:","opts":["Withdraw cash and perform other basic transactions","Issue national monetary policy","Set all interest rates","Create corporations"],"correct":0,"explain":"ATMs permit withdrawals, transfers, deposits, bill payments, and currency exchange."},{"type":"mc","q":"Direct deposit means an employer:","opts":["Deposits a worker's salary directly into the worker's bank account","Gives only cash at a branch","Sends a Treasury bill to a borrower","Deposits money into an iddir"],"correct":0,"explain":"Direct deposit is the electronic transfer of salary into an employee's account."},{"type":"mc","q":"In a debit card purchase, the money is:","opts":["Taken directly from the linked bank account","Borrowed from the card company and billed later","Created by the merchant","Paid by the central bank"],"correct":0,"explain":"Debit purchases draw directly on the linked account, unlike credit-card borrowing."},{"type":"mc","q":"Which is an advantage and a disadvantage of mobile banking stated in the text?","opts":["Banking anywhere/anytime and security concerns","No access anywhere and no security concerns","Unlimited capabilities and no network","Only cash withdrawals and no convenience"],"correct":0,"explain":"Mobile banking offers access anywhere and anytime but has security concerns and limited capabilities."},{"type":"fib","q":"The electronic network used for direct deposits between banks is called the automated clearing ______.","answer":"house","explain":"The text names the network the automated clearing house (ACH)."},{"type":"fib","q":"Debit card purchases cannot spend more than the amount you ______.","answer":"have","explain":"The text says debit users cannot spend more than they have in the linked account."},{"type":"fib","q":"Mobile banking is making financial transactions on a mobile ______.","answer":"device","explain":"This is the lesson's definition of mobile banking."},{"type":"mc","q":"Which pair is identified as traditional indigenous financial institutions in Ethiopia?","opts":["Iqqub and iddir","NBE and CBE","Treasury bills and bonds","ATMs and debit cards"],"correct":0,"explain":"The text identifies iqqub and iddir/mahiber as traditional indigenous systems."},{"type":"mc","q":"The money of an iqqub is used mostly for:","opts":["Social occasions and unfinished activities such as building a house","Issuing national currency","Regulating commercial banks","Purchasing only government bonds"],"correct":0,"explain":"The lesson lists weddings, funerals, sickness, and unfinished house building among iqqub uses."},{"type":"mc","q":"Iddir is mainly associated with:","opts":["Funeral and related services","Long-term corporate bonds","ATM withdrawals","Foreign exchange regulation"],"correct":0,"explain":"Iddir contributions and assistance are primarily for funerals and associated services."},{"type":"mc","q":"Membership in an iqqub is generally based on:","opts":["Pre-established social ties","A national banking license","Ownership of a commercial bank","A Treasury bill maturity"],"correct":0,"explain":"Iqqub groups are formed through social ties such as workplace, neighborhood, trade, or background."},{"type":"mc","q":"Which is a reason people may prefer iqqub to the formal financial sector?","opts":["Flexibility and low or nearly nonexistent transaction costs","Mandatory high administration costs","A required large minimum investment","No social ties"],"correct":0,"explain":"The text lists flexibility, adaptability, and low administrative and transaction costs as preferences."},{"type":"mc","q":"An iddir may provide assistance for losses due to:","opts":["Fire or theft","Only stock-price changes","Only foreign exchange","Only school fees"],"correct":0,"explain":"The text says some iddirs cover risks such as medical expenses, fire, or theft."},{"type":"mc","q":"Savings and credit cooperatives (SACCs) are designated as:","opts":["Semi-formal financial institutions","Central banks","Informal moneylenders only","Capital-market securities"],"correct":0,"explain":"The text describes SACCs as semi-formal institutions outside central authorities' control over ownership and management."},{"type":"fib","q":"An iqqub is also described as a saving ______.","answer":"club","explain":"The section labels the iqqub as a saving club."},{"type":"fib","q":"Iddir contributions are generally made ______.","answer":"monthly","explain":"The text says iddir membership contributions are monthly."},{"type":"fib","q":"SACCs have potential for financing short-term loans for agricultural production and ______-farm income-generating activities.","answer":"off","explain":"The text says SACCs can finance agricultural production technologies and off-farm income-generating activities."}]},{"unit_number":6,"title":"Economic Growth","questions":[{"type":"mc","q":"Which of the following is a major macroeconomic variable identified in Unit 6?","opts":["Utility","Inflation","Marginal cost","Consumer surplus"],"correct":1,"explain":"The unit identifies current account balance, inflation, economic growth, and unemployment as major macroeconomic variables."},{"type":"mc","q":"Macroeconomics primarily analyzes decisions made at which level?","opts":["The individual household only","The individual firm only","The country level","A single market stall"],"correct":2,"explain":"The text contrasts microeconomic individual decisions with macroeconomic decisions at country level."},{"type":"mc","q":"Which is a stated macroeconomic goal of governments?","opts":["Increasing unemployment","Maintaining high inflation","Reducing unemployment","Reducing all production"],"correct":2,"explain":"Reduced unemployment is one of the goals listed in the unit."},{"type":"mc","q":"The current account or trade balance is calculated as:","opts":["Imports minus exports","Exports minus imports","Exports plus imports","GDP minus population"],"correct":1,"explain":"The unit gives current account balance = exports (X) − imports (M)."},{"type":"mc","q":"When a country’s exports are greater than its imports, it has a:","opts":["Trade deficit","Trade surplus","Budget deficit","Current price fall"],"correct":1,"explain":"Exports greater than imports produce a trade surplus, described as desirable in the text."},{"type":"mc","q":"When imports exceed exports, the country experiences a:","opts":["Trade surplus","Trade deficit","Productivity boom","Capital gain"],"correct":1,"explain":"Exports less than imports are defined as a trade deficit."},{"type":"mc","q":"Inflation is best defined as:","opts":["A fall in the total population","An increase in the overall price level over time","An increase in exports only","A decline in employment only"],"correct":1,"explain":"Inflation is an increase in the overall price level of goods and services over a period."},{"type":"mc","q":"Inflation reduces the:","opts":["Productivity of every worker automatically","Purchasing power of currency","Number of imports automatically","Size of the labor force"],"correct":1,"explain":"The text states that inflation makes a unit of currency buy less, lowering purchasing power."},{"type":"mc","q":"Cost-push inflation occurs when:","opts":["Production costs rise and producers raise prices","Demand disappears completely","Exports exceed imports","Workers receive more training"],"correct":0,"explain":"Higher production costs can lead producers to increase prices to remain profitable."},{"type":"mc","q":"Demand-pull inflation is associated with:","opts":["Growing demand that allows firms to raise prices","Falling demand and falling prices","A fall in the workforce","More leisure time"],"correct":0,"explain":"The unit describes demand-pull inflation as rising demand enabling firms to increase prices."},{"type":"mc","q":"Unemployment refers to people who are:","opts":["Unable and unwilling to work","Willing and able to work but without a job at the going wage","Employed only part-time by choice","Retired from the labor force"],"correct":1,"explain":"The unit defines unemployment as willing and able people who do not have a job at the going wage."},{"type":"mc","q":"Frictional unemployment is caused by:","opts":["A recession","Searching for a new job or moving between jobs","The decline of a particular industry","The time of year"],"correct":1,"explain":"Frictional unemployment arises from job search or transition between jobs."},{"type":"mc","q":"Structural unemployment may result from:","opts":["The decline of a specific industry","Weekend leisure","A trade surplus","A rise in exports"],"correct":0,"explain":"The text gives the decline of industries such as typewriting or coal mining as structural unemployment."},{"type":"mc","q":"Seasonal unemployment is caused by:","opts":["Changes in the time of year","A worker’s education","A trade surplus","Higher physical capital"],"correct":0,"explain":"Seasonal unemployment is linked to the time of year, such as drought time for farmers."},{"type":"mc","q":"Cyclical unemployment is caused by:","opts":["A recession and reduced output","Changing jobs voluntarily","A school holiday","A new mineral deposit"],"correct":0,"explain":"The text links cyclical unemployment to a recession, a reduction in output."},{"type":"mc","q":"In the short run, economic growth occurs when:","opts":["Nominal prices fall","Real GDP increases","Population becomes constant","Imports equal exports"],"correct":1,"explain":"Short-run growth is defined as an increase in real GDP (RGDP)."},{"type":"mc","q":"Which expression gives the short-run economic growth rate?","opts":["(RGDPt − RGDPt−1) / RGDPt−1 × 100%","RGDPt / population × 100%","Population / RGDPt × 100%","Exports + imports"],"correct":0,"explain":"The unit gives growth as the change in RGDP divided by previous RGDP, multiplied by 100%."},{"type":"mc","q":"If RGDP rises from 500 to 550, the growth rate is:","opts":["5%","10%","50%","110%"],"correct":1,"explain":"(550 − 500) / 500 × 100% = 10%."},{"type":"mc","q":"Per-capita real GDP is calculated by dividing RGDP by:","opts":["Exports","The total population of the year","Imports","The price level"],"correct":1,"explain":"Per-capita RGDP equals the year’s RGDP divided by that year’s total population."},{"type":"mc","q":"Long-run economic growth includes a sustained increase in per-capita income and:","opts":["Structural changes in the economy","A permanent trade deficit","A decline in technology","A fall in all employment"],"correct":0,"explain":"The long-run definition combines sustained per-capita income growth with structural change."},{"type":"mc","q":"A typical structural change described in the unit is a shift from:","opts":["Manufacturing to subsistence only","Agriculture toward manufacturing and services","Services toward unpaid work only","Exports toward imports only"],"correct":1,"explain":"Structural change involves a declining agricultural share and rising industrial and service shares."},{"type":"mc","q":"Which statement correctly distinguishes growth from development?","opts":["They are exactly synonymous","Growth is broader than development","Development involves wider social, political, institutional, and economic transformation","Development can occur without any growth being necessary"],"correct":2,"explain":"Development is broader; growth is necessary but not sufficient for development."},{"type":"mc","q":"According to the unit, economic growth is a necessary but not sufficient condition for:","opts":["Inflation","Economic development","A trade deficit","Frictional unemployment"],"correct":1,"explain":"The text states that growth is necessary but not sufficient for economic development."},{"type":"mc","q":"Economic growth can occur when resources are:","opts":["Wasted and left idle","Recreated, reorganized, and reallocated more efficiently","Removed from production","Used only in agriculture"],"correct":1,"explain":"The summary describes growth as resulting from more efficient recreation, reorganization, and reallocation of resources."},{"type":"mc","q":"Technological improvement supports growth mainly because it:","opts":["Increases productivity","Eliminates all scarcity","Always reduces demand","Stops structural change"],"correct":0,"explain":"The unit explicitly links technological improvement to higher productivity."},{"type":"mc","q":"Replacing oxen with tractors illustrates how technology can:","opts":["Reduce the amount produced in a given time","Increase productivity in farming","Create a trade deficit","Measure inflation"],"correct":1,"explain":"The tractor example shows more output can be produced in a shorter period."},{"type":"mc","q":"An increase in which set of factors of production can bring economic growth?","opts":["Land, labor, and capital","Prices, utility, and demand only","Imports, taxes, and leisure only","Population, inflation, and money only"],"correct":0,"explain":"The text names increases in land, labor, and capital as sources of growth."},{"type":"mc","q":"Productivity is central to living standards because a nation must be able to:","opts":["Produce a large quantity of goods and services","Avoid all international trade","Keep all workers in agriculture","Have no natural resources"],"correct":0,"explain":"The unit says a high standard of living requires producing large quantities of goods and services."},{"type":"mc","q":"GDP measures, for the economy as a whole, total income and total:","opts":["Population","Expenditure on output","Leisure","Natural resources"],"correct":1,"explain":"GDP measures total income earned and total expenditure on the economy’s output."},{"type":"mc","q":"Why are total income and total expenditure equal for the economy as a whole?","opts":["Income is the economy’s output","Prices never change","All production is unpaid","Imports are always zero"],"correct":0,"explain":"The text summarizes the equality as: an economy’s income is the economy’s output."},{"type":"mc","q":"Physical capital per worker means the amount of _____ available for each worker:","opts":["Leisure","Tools and machinery","Natural disasters","Government policy"],"correct":1,"explain":"Physical capital per worker is defined as tools and machinery available per worker."},{"type":"mc","q":"Human capital consists primarily of workers’ knowledge and skills acquired through:","opts":["Education, training, and experience","Imports only","Price controls only","Natural deposits"],"correct":0,"explain":"The unit defines human capital as knowledge and skills gained through education, training, and experience."},{"type":"mc","q":"Which is an input needed to produce human capital?","opts":["Teachers","Trade deficits","Pollution","Black-market transactions"],"correct":0,"explain":"The text lists teachers, libraries, and student time as inputs for human capital."},{"type":"mc","q":"Which is a natural resource?","opts":["A library","A river","A worker’s training","A machine"],"correct":1,"explain":"Natural resources are supplied by nature, including land, rivers, and mineral deposits."},{"type":"mc","q":"Japan demonstrates that natural resources are:","opts":["Necessary for every productive economy","Not necessary for an economy to be highly productive","Always more important than trade","The same as human capital"],"correct":1,"explain":"The unit notes that Japan is rich despite few natural resources, using trade to import inputs and export manufactures."},{"type":"mc","q":"Technological knowledge means understanding:","opts":["The best ways to produce goods and services","Only how to raise prices","How to eliminate all labor","How to classify incomes only"],"correct":0,"explain":"The unit defines technological knowledge as understanding the best production methods."},{"type":"mc","q":"Advances in farming technology can free labor to produce:","opts":["Only agricultural land","Other goods and services","Less output","Trade deficits"],"correct":1,"explain":"The text says modern farming technology lets a small share produce food and makes labor available for other goods and services."},{"type":"mc","q":"Which is one of Simon Kuznets’ characteristics of modern economic growth?","opts":["High rates of increase in per-capita income","Permanent reduction in saving","Declining factor productivity","Less scientific knowledge"],"correct":0,"explain":"High per-capita income growth is the first characteristic listed."},{"type":"mc","q":"Modern economic growth requires increasing productivity of:","opts":["Only labor","All factors of production","Only imports","Only consumers"],"correct":1,"explain":"The characteristics include increased productivity of all factors of production."},{"type":"mc","q":"Structural transformation shifts activity from less productive agriculture toward more productive:","opts":["Industrial areas","Unpaid household work","Black markets","Leisure"],"correct":0,"explain":"The text describes a shift from agricultural to industrial activities."},{"type":"mc","q":"Which is an essential prerequisite for structural transformation in the unit?","opts":["A growing entrepreneurial class","Falling investment","Permanent recession","Lower productivity"],"correct":0,"explain":"Growth of an entrepreneurial class willing and able to undertake new activities is identified as essential."},{"type":"mc","q":"Economic growth is associated with increases in domestic savi
