ng and:","opts":["Investment","Unemployment","Pollution only","Imports only"],"correct":0,"explain":"The unit lists rising domestic saving and investment rates as a characteristic of growth."},{"type":"mc","q":"Modern financial services help growth by:","opts":["Mobilizing domestic resources","Eliminating human capital","Reducing all production","Hiding GDP"],"correct":0,"explain":"The text says modern financial services are necessary for mobilizing domestic resources."},{"type":"mc","q":"Scientific knowledge in production can improve resource use and provide:","opts":["Substitutes for scarce resources","Permanent trade deficits","Less efficient methods","Only leisure"],"correct":0,"explain":"The unit states that scientific knowledge raises efficiency and provides substitutes for scarce resources."},{"type":"mc","q":"World countries are commonly classified as developed or developing using:","opts":["Per-capita income","Climate alone","Number of cities only","Size of land only"],"correct":0,"explain":"The unit says the common classification uses per-capita income."},{"type":"mc","q":"In the World Bank classification given, a low-income country had 2008 per-capita GNI of:","opts":["$975 or less","$976–$3,855","$3,856–$11,906","$11,907 or more"],"correct":0,"explain":"LICs are defined in the text as $975 or less per capita GNI in 2008."},{"type":"mc","q":"The stated range for lower-middle-income countries is:","opts":["$975 or less","$976–$3,855","$3,856–$11,906","$11,907 or more"],"correct":1,"explain":"The unit gives $976 to $3,855 for lower-middle-income countries."},{"type":"mc","q":"The stated range for upper-middle-income countries is:","opts":["$976–$3,855","$3,856–$11,906","$11,907 or more","$975 or less"],"correct":1,"explain":"Upper-middle-income countries are listed as $3,856 to $11,906."},{"type":"mc","q":"A country with per-capita GNI of $12,000 falls in which stated category?","opts":["Low-income","Lower-middle-income","Upper-middle-income","High-income"],"correct":3,"explain":"The high-income category begins at $11,907 or more in the unit’s classification."},{"type":"mc","q":"The UN description of Least Developed Countries includes low income, low human capital, and:","opts":["High economic vulnerability","High exports only","High leisure","A trade surplus"],"correct":0,"explain":"The unit defines LDCs using low income, low human capital, and high economic vulnerability."},{"type":"mc","q":"According to the unit’s 2010 UN classification, the number of LDCs was:","opts":["33","49","15","210"],"correct":1,"explain":"The unit states that the LDC classification included 49 countries."},{"type":"mc","q":"GDP per person is a natural measure of average economic well-being because it indicates average income and:","opts":["Expenditure","Leisure","Natural resources","Population growth"],"correct":0,"explain":"GDP per person tells the income and expenditure of the average person."},{"type":"mc","q":"Why can GDP rise without people necessarily becoming better off?","opts":["A rise may be accompanied by reduced leisure","GDP always falls with production","GDP includes all unpaid work","Income distribution is always equal"],"correct":0,"explain":"The unit’s example says more work can raise GDP while loss of leisure offsets the gain."},{"type":"mc","q":"Which activity is generally omitted from GDP because it takes place outside markets?","opts":["A restaurant meal sold to customers","A parent’s child care at home","Child care in a day-care center","Manufactured goods sold abroad"],"correct":1,"explain":"GDP omits the value of unpaid home production, including child care by parents at home."},{"type":"mc","q":"A chef’s meal prepared and sold in a restaurant is included in GDP because it:","opts":["Uses no inputs","Has a market value","Is unpaid volunteer work","Is produced at home"],"correct":1,"explain":"GDP uses market prices; the sold restaurant meal has a market value."},{"type":"mc","q":"GDP does not reflect the value of:","opts":["Volunteer work","Marketed day-care services","Sold restaurant meals","Manufactured exports"],"correct":0,"explain":"The unit explicitly says volunteer work contributes to well-being but is not reflected in GDP."},{"type":"mc","q":"If environmental regulations are eliminated and pollution rises, GDP might rise while:","opts":["Well-being falls","Leisure rises automatically","Income distribution becomes equal","Human capital disappears"],"correct":0,"explain":"The text notes that more production may raise GDP while environmental deterioration lowers well-being."},{"type":"mc","q":"GDP per person fails to show:","opts":["The distribution of income","Whether any output exists","The market value of sold goods","Total expenditure"],"correct":0,"explain":"GDP per person describes an average and says nothing about income distribution."},{"type":"mc","q":"Two societies can have the same GDP per person but:","opts":["Very different income distributions","Exactly the same living conditions","No production","No population"],"correct":0,"explain":"The unit compares equal averages with one society highly unequal, showing the limitation of averages."},{"type":"mc","q":"Black-market transactions are excluded from GDP primarily because they are:","opts":["Illegal and not counted","Always unpaid","Always exports","Always environmentally friendly"],"correct":0,"explain":"The unit says valuable black-market transactions are not counted because they are illegal."},{"type":"mc","q":"A business cycle is best described as:","opts":["Regular, precisely predictable price changes","Irregular, largely unpredictable fluctuations in economic activity","A permanent increase in GDP","A measure of only imports"],"correct":1,"explain":"The text defines it as irregular and largely unpredictable fluctuations in output or employment."},{"type":"mc","q":"Changes in aggregate demand can change output, employment, income, and:","opts":["Price","Land area","School enrollment only","Natural deposits"],"correct":0,"explain":"The unit links aggregate-demand changes to changes in output, employment, income, and prices."},{"type":"mc","q":"Which sequence lists the four phases of the business cycle?","opts":["Boom, recession, depression, recovery","Recovery, inflation, surplus, boom","Deficit, boom, utility, recession","Growth, saving, trade, depression"],"correct":0,"explain":"The four listed phases are prosperity/boom, recession, depression/slump, and recovery."},{"type":"mc","q":"During prosperity or boom, which combination generally rises?","opts":["Demand, prices, investment, employment, and incomes","Unemployment and idle resources only","Imports only while all else falls","Leisure only"],"correct":0,"explain":"The boom phase is characterized by rising demand, prices, investment, employment, incomes, and purchasing power."},{"type":"mc","q":"During a recession, cuts in investment tend to cause:","opts":["Cuts in employment and falling incomes","Rising employment and demand","A guaranteed trade surplus","Higher human capital immediately"],"correct":0,"explain":"The text connects reduced investment in recession with lower employment, incomes, purchasing power, and demand."},{"type":"mc","q":"In a depression or slump, business confidence and investment are generally:","opts":["At their lowest","At their highest","Unchanged by definition","Equal to exports"],"correct":0,"explain":"The depression phase is described as having the lowest business confidence, with investment, employment, output, income, and prices at the bottom."},{"type":"mc","q":"During recovery, investment, employment, output, income, and prices generally:","opts":["Move upward","Touch the bottom","Disappear","Become impossible to measure"],"correct":0,"explain":"Sustained recovery moves these indicators upward and may lead to boom conditions."},{"type":"mc","q":"Which outcome is described as desirable when a country benefits from exporting expensive manufactured commodities?","opts":["A trade surplus","A trade deficit","Cyclical unemployment","Cost-push inflation"],"correct":0,"explain":"The unit describes a trade surplus as desirable and notes it can occur when expensive manufactured goods are exported."},{"type":"mc","q":"Which measure is a good indicator of economic prosperity according to the unit?","opts":["The level of real GDP","The level of unpaid work","The number of black-market transactions","The amount of leisure alone"],"correct":0,"explain":"The text states that the level of real GDP is a good indicator of economic prosperity."},{"type":"mc","q":"A country’s average income doubling in about ten years is associated in the unit with an annual growth rate of about:","opts":["1%","7%","25%","50%"],"correct":1,"explain":"The unit says some East Asian countries growing at about 7% per year doubled average income every ten years."},{"type":"fib","q":"The difference between the dollar value of exports and imports is the current account or ______ balance.","answer":"trade","explain":"The unit gives current account or trade balance as exports minus imports."},{"type":"fib","q":"A country has a trade surplus when the value of its exports ______ the value of its imports.","answer":"exceeds","explain":"Exports greater than imports create a trade surplus."},{"type":"fib","q":"An increase in the overall price level over time is called ______.","answer":"inflation","explain":"Inflation is defined as a rise in the general price level."},{"type":"fib","q":"Inflation causes the purchasing power of currency to ______ over time.","answer":"fall","explain":"When prices rise, one unit of currency buys less."},{"type":"fib","q":"Unemployment is the number of people willing and able to work but without a job at the going ______ rate.","answer":"wage","explain":"The definition uses the phrase going wage rate."},{"type":"fib","q":"A recession causes cyclical unemployment through a reduction in the level of ______.","answer":"output","explain":"The unit links cyclical unemployment to recession and reduced output."},{"type":"fib","q":"In the short run, economic growth occurs when ______ GDP increases.","answer":"real","explain":"Short-run growth is an increase in real GDP (RGDP)."},{"type":"fib","q":"Per-capita RGDP equals RGDP divided by the total ______ of the year.","answer":"population","explain":"The formula divides real GDP by that year’s population."},{"type":"fib","q":"Long-run growth includes sustained per-capita income increases and associated ______ changes.","answer":"structural","explain":"The long-run definition includes structural changes in the economy."},{"type":"fib","q":"Growth is a necessary but not sufficient condition for economic ______.","answer":"development","explain":"The text distinguishes growth from the broader process of development."},{"type":"fib","q":"Economic growth results when resources are recreated, reorganized, and reallocated more ______.","answer":"efficiently","explain":"The unit describes more efficient resource use as a source of growth."},{"type":"fib","q":"The amount of tools and machinery available for each worker is physical ______ per worker.","answer":"capital","explain":"That is the unit’s definition of physical capital per worker."},{"type":"fib","q":"Knowledge and skills acquired through education, training, and experience are called ______ capital.","answer":"human","explain":"Human capital is the knowledge and skills workers acquire."},{"type":"fib","q":"Land, rivers, and mineral deposits are examples of ______ resources.","answer":"natural","explain":"Natural resources are production inputs provided by nature."},{"type":"fib","q":"Understanding the best ways to produce goods and services is ______ knowledge.","answer":"technological","explain":"The unit defines technological knowledge this way."},{"type":"fib","q":"Modern economic growth requires high rates of increase in factor ______.","answer":"productivity","explain":"Increasing productivity of all factors is one of Kuznets’ characteristics."},{"type":"fib","q":"Growth of the ______ class is an essential prerequisite for structural transformation.","answer":"entrepreneurial","explain":"The unit identifies the entrepreneurial class as important for new economic activities."},{"type":"fib","q":"Economic growth is associated with increased domestic saving and ______ rates.","answer":"investment","explain":"Rising saving and investment rates are listed as a growth characteristic."},{"type":"fib","q":"The World Bank category with 2008 per-capita GNI of $975 or less is ______-income countries.","answer":"low","explain":"The unit labels this group low-income countries (LICs)."},{"type":"fib","q":"The stated 2008 threshold for high-income countries is $______ or more per capita GNI.","answer":"11,907","explain":"The high-income category begins at $11,907 or more in the provided classification."},{"type":"fib","q":"The UN’s 2010 classification listed ______ Least Developed Countries.","answer":"49","explain":"The unit states that the LDC group included 49 countries."},{"type":"fib","q":"GDP per person does not show how income is ______ among people.","answer":"distributed","explain":"GDP per person gives an average and says nothing about distribution."},{"type":"fib","q":"GDP excludes the value of almost all activity that takes place outside ______.","answer":"markets","explain":"GDP uses market prices and omits most nonmarket activity."},{"type":"fib","q":"Child care provided by parents at home is generally ______ from GDP.","answer":"excluded","explain":"The unit contrasts unpaid home child care with marketed day-care services."},{"type":"fib","q":"GDP does not capture the quality of the ______.","answer":"environment","explain":"Environmental quality and deterioration are listed among GDP’s omissions."},{"type":"fib","q":"The business cycle is irregular and largely ______ fluctuations in economic activity.","answer":"unpredictable","explain":"The text says fluctuations are almost impossible to predict accurately."},{"type":"fib","q":"The phase characterized by rising demand, prices, investment, employment, and incomes is a ______ or boom.","answer":"prosperity","explain":"Prosperity, also called boom or peak, has these rising indicators."},{"type":"fib","q":"The phase in which investment, employment, output, income, and prices touch the bottom is a ______.","answer":"depression","explain":"The unit calls this phase depression, slump, or trough."},{"type":"fib","q":"As an economy moves out of depression, it enters the phase of ______.","answer":"recovery","explain":"Recovery follows depression and moves major indicators upward."},{"type":"fib","q":"The four business-cycle phases include boom, recession, depression, and ______.","answer":"recovery","explain":"Recovery is the fourth phase listed in the unit."}]},{"unit_number":7,"title":"The Ethiopian Economy","questions":[{"type":"mc","q":"Before 1974, Ethiopia's economy was primarily based on which sector?","opts":["Agriculture","Mining","Tourism","Banking"],"correct":0,"explain":"The textbook states that from the Monarchy up to 1974 the economy was primarily agricultural."},{"type":"mc","q":"Under the feudal system described in the unit, farmland ownership was mainly characterized by:","opts":["Highly equal ownership","Highly inequitable ownership","Complete state ownership","Ownership by cooperatives"],"correct":1,"explain":"The textbook describes land ownership under the feudal system as highly inequitable, with much farmland held by wealthy landlords."},{"type":"mc","q":"During the Military Regime (1974–1991), Ethiopia shifted toward what type of economy?","opts":["Command economy","Pure barter economy","Tourism economy","Free-trade economy"],"correct":0,"explain":"The unit says the Military Regime shifted the economy to a command economy guided by socialist principles."},{"type":"mc","q":"During the Military Regime, which set of institutions did the government own?","opts":["Only retail shops","Large-scale manufacturing industries, banks, and insurance companies","Only farms owned by households","Only foreign companies"],"correct":1,"explain":"The government owned all large-scale manufacturing industries, banks, and insurance companies during that period."},{"type":"mc","q":"After 1991, the Ethiopian government followed which broad economic orientation?","opts":["Market-oriented economy","Feudal economy","Closed subsistence economy","Command economy"],"correct":0,"explain":"After 1991, the government followed a market-oriented economy."},{"type":"mc","q":"Which policy was part of the post-1991 economic reform described in the textbook?","opts":["Privatization of state enterprises","Abolition of agricultural exports","Nationalization of all private firms","Ending deregulation"],"correct":0,"explain":"The reforms included privatization of state enterprises, promotion of agricultural exports, and deregulation."},{"type":"mc","q":"Which expression gives GDP as the sum of its expenditure components?","opts":["Y = C + I + G + NX","Y = C - I - G - NX","Y = C + I - G + NX","Y = C + G - I - NX"],"correct":0,"explain":"The unit defines GDP as Y = C + I + G + NX."},{"type":"mc","q":"How is net exports (NX) calculated?","opts":["Imports minus exports","Exports minus imports","Consumption minus investment","Government purchases minus consumption"],"correct":1,"explain":"The textbook gives NX = total exports (E) minus total imports (M)."},{"type":"mc","q":"Which household expenditure is excluded from consumption and classified as investment?","opts":["Food purchases","Clothing purchases","A newly built house","A haircut"],"correct":2,"explain":"Purchases of new housing are excluded from consumption and counted as investment."},{"type":"mc","q":"Which is an example of a durable good included in household consumption?","opts":["An automobile","A haircut","Medical advice","A restaurant service"],"correct":0,"explain":"The text lists automobiles and appliances as durable consumer goods."},{"type":"mc","q":"Which item is a nondurable consumer good in the textbook's examples?","opts":["A factory building","Food","A new house","A delivery truck used by a firm"],"correct":1,"explain":"Food and clothing are given as examples of nondurable goods in consumption."},{"type":"mc","q":"Which expenditure is an example of a household consumption service?","opts":["A haircut","A new factory","An inventory addition","A government bridge"],"correct":0,"explain":"Haircuts and medical care are listed as intangible services included in consumption."},{"type":"mc","q":"In GDP accounting, investment means purchasing goods that will:","opts":["Be used in the future to produce more goods and services","Immediately be given as transfer payments","Only be resold abroad","Replace all household consumption"],"correct":0,"explain":"Investment is the purchase of goods used in the future to produce more goods and services."},{"type":"mc","q":"Which purchase is categorized as investment rather than consumption by convention?","opts":["A family's new house","A family's food","A family's clothing","A family's haircut"],"correct":0,"explain":"The purchase of a new house is the household spending item classified as investment."},{"type":"mc","q":"When a firm adds an unsold computer to its inventory, GDP accounting treats it as:","opts":["Investment by the firm","A transfer payment","An import","A reduction in production"],"correct":0,"explain":"Inventory accumulation is treated as investment so that goods produced during the period are counted."},{"type":"mc","q":"Which financial item does not represent GDP investment in the textbook's distinction?","opts":["Capital equipment","Inventories","A new structure","Stocks and bonds"],"correct":3,"explain":"GDP investment refers to capital equipment, structures, and inventories, not financial investments such as stocks and bonds."},{"type":"mc","q":"Government purchases include which of the following?","opts":["Salaries of government workers","Only pension transfers","Only private household spending","Only imports by households"],"correct":0,"explain":"Government purchases include government-worker salaries and public-works expenditures."},{"type":"mc","q":"Why are unemployment insurance benefits excluded from government purchases?","opts":["They are transfer payments, not payment for currently produced goods or services","They are always exports","They are private investment","They are counted twice as consumption"],"correct":0,"explain":"Transfer payments change household income but are not exchanged for currently produced output."},{"type":"mc","q":"A domestic firm's sale of a car to a buyer in another country directly increases:","opts":["Net exports","Imports","Transfer payments","Household consumption only"],"correct":0,"explain":"A foreign purchase of a domestically produced good is an export and increases net exports."},{"type":"mc","q":"If a household buys an imported car, what is the direct effect on net exports?","opts":["Net exports increase by the purchase value","Net exports decrease by the purchase value","Net exports do not change","Net exports become equal to investment"],"correct":1,"explain":"Imports are subtracted from exports, so an imported car reduces net exports."},{"type":"mc","q":"GDP expenditure accounting is an identity because:","opts":["Every included expenditure is placed in one of four components","GDP is always zero","Prices never change","Only exports are counted"],"correct":0,"explain":"The four components contain every expenditure included in GDP, so their total must equal GDP."},{"type":"mc","q":"In the numerical GDP table, which component has the largest percentage of total GDP?","opts":["Consumption","Investment","Government purchases","Net exports"],"correct":0,"explain":"The table assigns consumption 71%, the largest share, compared with investment 11%, government purchases 21%, and net exports -3%."},{"type":"mc","q":"Nominal GDP values current production using:","opts":["Current prices","Only base-year prices","No prices","Only export prices"],"correct":0,"explain":"Nominal GDP uses current prices to value production."},{"type":"mc","q":"Real GDP is calculated by valuing production at:","opts":["Constant prices from a chosen base year","Only current prices","Import prices only","Random yearly prices"],"correct":0,"explain":"Real GDP uses base-year prices held constant across years."},{"type":"mc","q":"The main purpose of real GDP is to measure changes in:","opts":["The quantity of goods and services produced","Only the price level","Only government salaries","The number of imports"],"correct":0,"explain":"Holding prices constant means changes in real GDP reflect changes in amounts produced."},{"type":"mc","q":"The first step in calculating real GDP is to:","opts":["Designate a base year","Subtract consumption from exports","Count only transfer payments","Use the highest current price"],"correct":0,"explain":"The textbook says to first designate one year as the base year, then use its prices."},{"type":"mc","q":"In the base year, real GDP is always:","opts":["Equal to nominal GDP","Zero","Less than nominal GDP","Equal to net exports"],"correct":0,"explain":"Both measures use the same prices and quantities in the base year."},{"type":"mc","q":"Which formula is the GDP deflator?","opts":["(Nominal GDP / Real GDP) × 100","(Real GDP / Nominal GDP) × 100","(Exports / Imports) × 100","(Consumption / GDP) × 100"],"correct":0,"explain":"The unit defines the GDP deflator as nominal GDP divided by real GDP times 100."},{"type":"mc","q":"The GDP deflator in the base year is always:","opts":["0","50","100","200"],"correct":2,"explain":"Nominal and real GDP are equal in the base year, making the deflator 100."},{"type":"mc","q":"If quantities rise while prices remain unchanged, the GDP deflator will generally:","opts":["Remain constant","Double automatically","Fall to zero","Become equal to imports"],"correct":0,"explain":"When prices stay the same, nominal and real GDP rise together, leaving the deflator constant."},{"type":"mc","q":"If prices rise while quantities remain unchanged, what happens?","opts":["Nominal GDP rises, real GDP stays the same, and the deflator rises","Real GDP rises but nominal GDP falls","Both GDP measures stay unchanged","The deflator becomes zero"],"correct":0,"explain":"With fixed quantities, current-price GDP rises while base-price GDP stays unchanged, so the deflator rises."},{"type":"mc","q":"Using the table's 2011 data, the GDP deflator is approximately:","opts":["100","131","148","200"],"correct":1,"explain":"The table calculates (62,000 / 47,500) × 100, approximately 131."},{"type":"mc","q":"Inflation refers to:","opts":["A rise in the economy's overall price level","A fall in all production","A rise in exports only","A fall in government purchases"],"correct":0,"explain":"The textbook defines inflation as a situation in which the overall price level is rising."},{"type":"mc","q":"According to the unit, economic growth is measured as the percentage change in:","opts":["Real GDP","Nominal GDP only","Imports only","Transfer payments"],"correct":0,"explain":"The unit says growth is measured by the percentage change in real GDP between periods."},{"type":"mc","q":"Why is real GDP a better gauge of economic well-being than nominal GDP?","opts":["It reflects production without the effect of price changes","It counts only imports","It excludes all services","It always exceeds nominal GDP"],"correct":0,"explain":"Real GDP reflects the economy's production because it is not affected by price changes."},{"type":"mc","q":"From the table, nominal GDP in 2012 is:","opts":["Birr 27,500","Birr 47,500","Birr 67,500","Birr 100,000"],"correct":3,"explain":"The 2012 current-price calculation is 40,000 + 60,000 = Birr 100,000."},{"type":"mc","q":"Using 2010 as the base year, real GDP in 2011 in the table is:","opts":["Birr 27,500","Birr 47,500","Birr 62,000","Birr 100,000"],"correct":1,"explain":"The table values 2011 quantities at 2010 prices: 22,500 + 25,000 = Birr 47,500."},{"type":"mc","q":"Using 2010 as the base year, the table's 2012 GDP deflator is approximately:","opts":["100","131","148","240"],"correct":2,"explain":"The table calculates (100,000 / 67,500) × 100, approximately 148."},{"type":"mc","q":"According to NBE 2019/20 data cited in the unit, agriculture's GDP share over 2014/15–2019/20:","opts":["Rose from 21% to 29%","Decreased from 40% to 33%","Stayed exactly at 45%","Increased from 33% to 40%"],"correct":1,"explain":"The unit reports agriculture's share declining from 40% to 33% over those six years."},{"type":"mc","q":"Over the same six-year period cited by NBE, industry's GDP share:","opts":["Decreased from 40% to 33%","Increased from 21% to 29%","Stayed at 10%","Fell from 29% to 21%"],"correct":1,"explain":"The unit reports industry's share rising from 21% to 29%."},{"type":"mc","q":"In the NBE 2019/20 comparison, the service sector's GDP share was approximately:","opts":["10%","21%","33%","40%"],"correct":3,"explain":"The unit says the service sector's share was almost 40% during the period."},{"type":"mc","q":"Why is agriculture called the backbone of the Ethiopian economy?","opts":["Many activities and people's economic well-being rely heavily on it","It produces no raw materials","It employs only a small minority","It is entirely independent of rainfall"],"correct":0,"explain":"The text calls agriculture the backbone because it strongly affects well-being and supports transport and manufacturing."},{"type":"mc","q":"The unit states that agriculture contributes approximately what share of overall GDP?","opts":["13%","25%","45%","70%"],"correct":2,"explain":"The main features section gives agriculture's contribution as about 45% of GDP."},{"type":"mc","q":"Agriculture generates more than what share of Ethiopia's export earnings according to the unit?","opts":["10%","40%","60%","80%"],"correct":3,"explain":"The textbook states that agriculture generates more than 80% of export earnings."},{"type":"mc","q":"Agriculture employs approximately what share of the population in the main-features description?","opts":["9.5%","45%","70%","85%"],"correct":3,"explain":"The unit states that agriculture employs about 85% of the population."},{"type":"mc","q":"Agriculture supplies about what share of raw materials to secondary activities?","opts":["18%","25%","70%","90%"],"correct":2,"explain":"The unit attributes about 70% of raw-material supply to agriculture."},{"type":"mc","q":"Which pair represents two broad outputs of Ethiopia's agricultural sector?","opts":["Crops and livestock","Banking and insurance","Cement and paper","Telecommunication and tourism"],"correct":0,"explain":"The agricultural sector produces both crops and livestock."},{"type":"mc","q":"Which is listed as a major problem of Ethiopian agriculture?","opts":["Frequent drought","Excessive modern technology","Too many paved roads","Excessive foreign exchange"],"correct":0,"explain":"Frequent drought is one of the sector's major problems in the textbook."},{"type":"mc","q":"Soil degradation in the unit is largely caused by:","opts":["Overgrazing and overpopulation","Tourism and banking","Exports and imports","Education and health"],"correct":0,"explain":"The text identifies overgrazing and overpopulation as major causes of soil degradation."},{"type":"mc","q":"Which problem contributes to poor agricultural marketing facilities?","opts":["Poor road networks","Too many efficient roads","Excess industrial capacity","Low household size"],"correct":0,"explain":"Poor road networks are cited as a reason for poor marketing facilities."},{"type":"mc","q":"Which is a direct role of agriculture in the Ethiopian economy?","opts":["Supplying food grains, dairy, and meat","Producing only financial assets","Providing only imported machinery","Eliminating all urban wages"],"correct":0,"explain":"The text identifies agriculture as a source of food, including grains, dairy, and meat."},{"type":"mc","q":"In the unit's terminology, an efficient agricultural sector's supply of food and raw materials to industry is a:","opts":["Backward linkage","Transfer payment","GDP deflator","Nominal price"],"correct":0,"explain":"The section labels agriculture's supply of food and raw materials to industry as a backward linkage."},{"type":"mc","q":"One forward linkage from higher agricultural productivity is that it can:","opts":["Reduce urban living costs and pressure on wages","Eliminate all industrial investment","Reduce the supply of raw materials","Stop rural incomes from rising"],"correct":0,"explain":"The textbook says productivity can reduce urban living costs, pressure on wages, and industrial costs."},{"type":"mc","q":"Which is one modality for transferring agricultural surplus to other sectors?","opts":["Taxation","Abolishing all prices","Reducing all exports to zero","Counting only services"],"correct":0,"explain":"The three modalities listed are tax, terms of trade/price controls, and compulsory delivery."},{"type":"mc","q":"Compulsory delivery transfers agricultural surplus through:","opts":["Agricultural commodities delivered at fixed prices","Foreign shares purchased by households","Free medical services","Nominal GDP calculations"],"correct":0,"explain":"The textbook describes compulsory delivery as delivering agricultural commodities at fixed prices."},{"type":"mc","q":"Approximately what share of the agricultural sector's GDP comes from crop production?","opts":["10%","25%","65%","95%"],"correct":2,"explain":"The structure section states that crop production contributes about 65% of agricultural-sector GDP."},{"type":"mc","q":"Animal husbandry contributes approximately what share of agricultural-sector GDP?","opts":["10%","25%","65%","90%"],"correct":1,"explain":"Animal husbandry contributes about 25%, according to the textbook's agricultural structure figures."},{"type":"mc","q":"Which farming system accounts for more than 90% of agricultural production?","opts":["Smallholder farming system","Pastoral/nomadic system","State-farm system","Foreign commercial system"],"correct":0,"explain":"The smallholder system accounts for more than 90% of agricultural production in the unit."},{"type":"mc","q":"The smallholder farming system is characterized by:","opts":["Mixed farming","Only deep-sea fishing","Only factory production","No household participation"],"correct":0,"explain":"The textbook identifies mixed farming as a characteristic of smallholder farming."},{"type":"mc","q":"Why is pastoral production important in Ethiopia's lowlands?","opts":["Erratic low rainfall makes rain-fed crop production difficult","The lowlands have unlimited crop irrigation","Pastoralists depend mainly on banking","All lowlands are densely urbanized"],"correct":0,"explain":"The unit explains that low, erratic rainfall makes rain-fed crop production difficult, so people rely on livestock."},{"type":"mc","q":"Pastoralists commonly move seasonally with livestock in search of:","opts":["Pasture and water","Factories and banks","Ports and airports","Schools and hospitals only"],"correct":0,"explain":"The pastoral system is described as seasonal movement in search of pasture and water."},{"type":"mc","q":"Commercial farming was officially introduced during which plan?","opts":["The third five-year plan (1968–73)","The first post-1991 annual plan","The 2019/20 NBE plan","The 1974 drought plan"],"correct":0,"explain":"The commercial farming system was officially introduced during the third five-year plan, 1968–73."},{"type":"mc","q":"State farms and cooperatives together accounted for less than what share of total agricultural production in the cited period?","opts":["5%","10%","25%","50%"],"correct":1,"explain":"The unit says state farms, comprising about 5% of cropland, with cooperatives produced less than 10%."},{"type":"mc","q":"Which industrial sub-sector had the largest listed share of the industrial sector?","opts":["Manufacturing","Construction","Mining and quarrying","Water supply"],"correct":0,"explain":"The unit lists manufacturing at 38%, larger than construction at 25% and the other listed sub-sectors."},{"type":"mc","q":"The industrial sector contributes approximately what share of Ethiopia's GDP in the unit's main-features figures?","opts":["9.5%","13%","29%","45%"],"correct":1,"explain":"The textbook states that industry contributes about 13% of GDP."},{"type":"mc","q":"Which is identified as a major problem of Ethiopia's industrial sector?","opts":["Very low technology and dependence on imported technology","Excessively high domestic technology","Too much foreign exchange","No need for raw materials"],"correct":0,"explain":"Low technology and high dependence on imported technology are listed industrial problems."},{"type":"mc","q":"Between 2002 and 2010, which industrial sub-sector registered the highest growth rate?","opts":["Construction","Mining","Handicrafts","Water supply"],"correct":0,"explain":"The construction sector recorded the highest growth rate in the period described."},{"type":"mc","q":"Manufacturing is defined in the unit as the physical or chemical transformation of materials into:","opts":["New products","Transfer payments","Pastoral routes","Price indexes"],"correct":0,"explain":"The ISIC-based definition describes manufacturing as transforming materials or components into new products."},{"type":"mc","q":"In 2007/08, food and beverages accounted for about what share of gross manufacturing output?","opts":["9%","17%","48%","74%"],"correct":2,"explain":"Food and beverages represented about 48% of gross manufacturing output in the cited year."},{"type":"mc","q":"Which manufacturing group generated the largest share of industrial foreign exchange in the cited figures?","opts":["Textiles","Chemicals","Wood and furniture","Paper and printing"],"correct":0,"explain":"Textiles generated 41.5% of the sector's foreign exchange, the largest listed contribution."},{"type":"fib","q":"In the GDP expenditure identity, Y = _____.","answer":"C + I + G + NX","explain":"GDP is divided into consumption, investment, government purchases, and net exports."},{"type":"fib","q":"Net exports equal total exports minus total _____.","answer":"imports","explain":"The unit defines NX as exports (E) minus imports (M)."},{"type":"fib","q":"Consumption is spending by _____ on goods and services, excluding new housing purchases.","answer":"households","explain":"Household spending on goods and services is consumption; new housing is classified as investment."},{"type":"fib","q":"Investment is the purchase of goods used in the future to produce more goods and _____.","answer":"services","explain":"The definition of investment includes future production of goods and services."},{"type":"fib","q":"Government purchases include spending by local, state, and _____ governments.","answer":"federal","explain":"The textbook lists local, state, and federal government spending."},{"type":"fib","q":"Social Security and unemployment insurance benefits are called _____ payments.","answer":"transfer","explain":"They are not exchanged for currently produced goods or services, so they are transfer payments."},{"type":"fib","q":"Real GDP is calculated using prices from a chosen _____ year.","answer":"base","explain":"Real GDP values all years using the prices of the designated base year."},{"type":"fib","q":"Nominal GDP uses _____ prices to value production.","answer":"current","explain":"Nominal GDP uses current prices, unlike real GDP's constant base-year prices."},{"type":"fib","q":"Real GDP uses _____ prices to value production.","answer":"constant","explain":"The unit defines real GDP as production valued at constant prices."},{"type":"fib","q":"The GDP deflator equals nominal GDP divided by real GDP, multiplied by _____.","answer":"100","explain":"The formula is (nominal GDP / real GDP) × 100."},{"type":"fib","q":"The GDP deflator in the base year always equals _____.","answer":"100","explain":"Nominal and real GDP are equal in the base year, so the deflator is 100."},{"type":"fib","q":"Inflation is a situation in which the economy's overall _____ level is rising.","answer":"price","explain":"The textbook defines inflation as a rise in the overall price level."},{"type":"fib","q":"Agriculture is described as the _____ of the Ethiopian economy.","answer":"backbone","explain":"The unit calls agriculture the backbone because it supports well-being and many other activities."},{"type":"fib","q":"The agricultural sector is composed of crop production, livestock, forestry, and _____.","answer":"fishery","explain":"These four sub-sectors are listed in the structure of Ethiopian agriculture."},{"type":"fib","q":"The smallholder farming system is characterized by _____ farming.","answer":"mixed","explain":"The unit states that smallholder farming is characterized by mixed farming."},{"type":"fib","q":"The average smallholder household size cited in the unit is around _____ members.","answer":"5","explain":"The textbook reports an average household size of around five members."},{"type":"fib","q":"Pastoralists move seasonally with their livestock in search of pasture and _____.","answer":"water","explain":"Seasonal movement is described as a search for pasture and water."},{"type":"fib","q":"The three widely practiced Ethiopian farming systems include smallholder, pastoral/nomadic, and _____ farming.","answer":"modern commercial","explain":"The unit lists the smallholder, pastoral/nomadic, and modern commercial systems."},{"type":"fib","q":"The industrial sector is dominated by manufacturing, construction, and electric and _____ supply.","answer":"water","explain":"The main-features section lists manufacturing, construction, and electric and water supply."},{"type":"fib","q":"Manufacturing transforms materials or components into _____ products.","answer":"new","explain":"The ISIC-based definition describes physical or chemical transformation into new products."},{"type":"fib","q":"Food and beverages accounted for about _____ percent of gross manufacturing output in 2007/08.","answer":"48","explain":"The cited manufacturing figures give food and beverages approximately 48%."},{"type":"fib","q":"The service sector produces services, also known as _____ goods.","answer":"intangible","explain":"The basic characteristic of the service sector is production of services or intangible goods."},{"type":"fib","q":"In the Ethiopian National Income Account classification, the first five service sub-sectors are called _____ services.","answer":"distributive","explain":"Trade; hotels and restaurants; transport and communication; education; and banking and insurance are called distributive services."},{"type":"fib","q":"The service sector's GDP share was 45.1% during _____.","answer":"2008/09","explain":"The main-features section gives 45.1% for 2008/09."},{"type":"fib","q":"In employment, the service sector is the _____ largest sector after agriculture.","answer":"second","explain":"The text calls services the second-largest sector after agriculture in absorbing labor."},{"type":"fib","q":"In 2008/09, service providers and service sub-sectors earned nearly _____ billion dollars in foreign exchange.","answer":"2","explain":"The unit reports nearly $2 billion from services in 2008/09."},{"type":"fib","q":"Repairing cars, hairdressing, and cooking are examples of _____ activities in services.","answer":"physical","explain":"Physical service activities involve working with objects; these are the textbook's examples."},{"type":"fib","q":"Providing education or training is an example of an _____ service activity.","answer":"intellectual","explain":"The unit classifies education and training as intellectual activities."},{"type":"fib","q":"Museums, theater performances, art shows, and musical performances are examples of _____ activities.","answer":"aesthetic","explain":"The unit defines aesthetic activities as providing artistic experiences."},{"type":"fib","q":"The Ethiopian strategy that places agriculture as the leading sector for industrialization is called _____.","answer":"Agricultural Development-Led Industrialization (ADLI)","explain":"The unit identifies ADLI as Ethiopia's strategy of using agricultural development to lead industrialization."}]},{"unit_number":8,"title":"Business Startups and Innovation","questions":[{"type":"mc","q":"According to the Oslo Manual, an innovation is a new or improved product or process that differs significantly from previous ones and is what?","opts":["Made available to potential users or brought into use","Kept secret from all users","Used only for accounting","Produced without any change"],"correct":0,"explain":"The Oslo Manual definition requires availability to potential users for a product or implementation by the unit for a process."},{"type":"mc","q":"The two key elements that summarize innovation are:","opts":["Creativity and implementation","Profit and taxation","Ownership and liability","Advertising and borrowing"],"correct":0,"explain":"The textbook summarizes innovation as something new, improved, or introduced that creates value through creativity and implementation."},{"type":"mc","q":"Which example best represents organizational innovation?","opts":["Adopting a four-day working week","Replacing plastic with a new product material","Introducing a new electric vehicle battery","Changing a product's package"],"correct":0,"explain":"Organizational innovation changes business practices or workplace organization; the four-day week is the textbook example."},{"type":"mc","q":"Allowing employees to work from home, depending on their roles, is presented as an example of:","opts":["Organizational innovation","Product innovation","Marketing innovation","Cost-benefit analysis"],"correct":0,"explain":"The textbook lists digitally enabled work from home as an organizational innovation."},{"type":"mc","q":"Process innovation mainly concerns a new or improved:","opts":["Production or delivery approach","Ownership structure only","Tax schedule","Personal objective"],"correct":0,"explain":"Process innovation changes production or delivery methods, techniques, equipment, or software."},{"type":"mc","q":"A firm changes the equipment and software used in its operations to improve delivery. This is most directly:","opts":["Process innovation","Sole proprietorship","Marketing innovation","A feasibility question"],"correct":0,"explain":"Changes to operational methods, equipment, or software are included in process innovation."},{"type":"mc","q":"Product innovation is the introduction of:","opts":["A new or improved good or service","A new court procedure","Only a new working schedule","Only a new source of finance"],"correct":0,"explain":"The textbook defines product innovation as introducing a new or improved good or service."},{"type":"mc","q":"Which statement about product innovation is correct?","opts":["It need not improve every function or performance specification","It must generate sales immediately","It cannot change materials","It is only an error correction"],"correct":0,"explain":"A product innovation may improve or add one function even if another specification is reduced, and it need not immediately generate sales."},{"type":"mc","q":"Routine changes or updates that only correct errors are generally:","opts":["Not product innovations","Always eco-innovations","Corporations","Business plans"],"correct":0,"explain":"The textbook excludes routine corrections and seasonal changes from product innovations."},{"type":"mc","q":"Changing Lego bricks to biodegradable oil-based plastics illustrates:","opts":["Product innovation","Partnership formation","A market boundary","A business plan timeline"],"correct":0,"explain":"The textbook uses Lego's material change as an example of product innovation."},{"type":"mc","q":"The first electric vehicles introduced into the car market are an example of:","opts":["Product innovation","Sole ownership","A feasibility study","Organizational liability"],"correct":0,"explain":"The textbook identifies early electric vehicles and longer-range batteries as product innovations."},{"type":"mc","q":"Marketing innovation involves a new marketing strategy that may change product design, packaging, price, or:","opts":["Promotion","Personal liability","Legal personality","Partner eligibility"],"correct":0,"explain":"Marketing innovation changes design, packaging, pricing, promotion, or related marketing decisions."},{"type":"mc","q":"Haagen-Dazs' new waste-free container is used in the textbook as an example of:","opts":["Marketing innovation","A partnership agreement","Process costing","A feasibility question"],"correct":0,"explain":"The waste-free container is the marketing innovation example given in the lesson."},{"type":"mc","q":"Eco-innovation is intended to make significant progress toward:","opts":["The UN 2030 sustainable development goals","A firm's unlimited liability","A partnership's registration limit","Only short-run profits"],"correct":0,"explain":"The textbook defines eco-innovation in relation to progress toward the UN 2030 sustainable development goals."},{"type":"mc","q":"Which action is most clearly eco-innovation?","opts":["Reducing environmental impacts and using natural resources more efficiently","Increasing waste to reduce prices","Removing all product functions","Avoiding any change in production"],"correct":0,"explain":"Eco-innovation reduces environmental impacts, strengthens resilience, and promotes efficient and responsible resource use."},{"type":"mc","q":"One possible business benefit of eco-innovation is:","opts":["Access to new markets and stronger competitiveness","Guaranteed elimination of all costs","Unlimited personal liability","Fewer possible customers by definition"],"correct":0,"explain":"The textbook says greener processes, technologies, and services can open markets, raise productivity, and strengthen competitiveness."},{"type":"mc","q":"In the textbook's examples, IKEA's change to an electric-vehicle fleet is classified as:","opts":["Process innovation","Marketing innovation","Sole proprietorship","A business plan appendix"],"correct":0,"explain":"IKEA's electric-vehicle fleet is identified as an eco-innovation that is specifically a process innovation."},{"type":"mc","q":"Nestle's paper-based straws are presented as an example of:","opts":["Marketing innovation","Unlimited liability","A corporation charter","A cash-flow projection"],"correct":0,"explain":"The textbook classifies Nestle's paper-based straws as a marketing innovation in its eco-innovation examples."},{"type":"mc","q":"Schumpeter's term 'creative destruction' describes how innovation can:","opts":["Replace existing products, firms, or industries while creating new solutions","Prevent all market change","Guarantee equilibrium in every market","Make every old product more valuable"],"correct":0,"explain":"Creative destruction involves new ideas and processes taking over the status quo, making some products or firms obsolete while creating new solutions."},{"type":"mc","q":"According to the textbook, a possible consequence of creative destruction is:","opts":["Products becoming obsolete and some companies closing","All firms receiving equal profits","No changes in employment","The end of innovation"],"correct":0,"explain":"The text notes that innovation can create market chaos, obsolescence, company closures, and unemployment as new solutions emerge."},{"type":"mc","q":"Which pair of companies is cited as having once been market leaders but failing to see changes in their industries?","opts":["Nokia and Kodak","Uber and IKEA","Lego and Nestle","Macy's and Haagen-Dazs"],"correct":0,"explain":"The creative-destruction discussion names Nokia and Kodak as former leaders that missed major industry changes."},{"type":"mc","q":"In the textbook's innovation examples, Nikola Tesla worked on:","opts":["The production, transmission, and application of electric power","The first mechanical dishwasher","Vacuum canning","A computer programming compiler"],"correct":0,"explain":"The list of famous innovators associates Tesla with electric power production, transmission, and application."},{"type":"mc","q":"A startup is generally a company that is:","opts":["In its initial operating stages and expecting significant near-term growth","Already a mature corporation with no growth goal","Owned only by a government","Required to have exactly one employee"],"correct":0,"explain":"The textbook defines a startup as a company in the initial stages of operations that expects significant growth soon."},{"type":"mc","q":"A small business is characterized in the text mainly by:","opts":["A limited number of employees, with the maximum varying by industry","A requirement for rapid global expansion","Never having any employees","Always operating at a loss"],"correct":0,"explain":"The text defines a small business by employee limits that differ by industry."},{"type":"mc","q":"Compared with a small business, a startup focuses primarily on:","opts":["Top-end revenue and growth potential","Remaining in a small market portion","Avoiding all outside investment","Maintaining a fixed employee limit"],"correct":0,"explain":"Startups emphasize rapid growth, top-end revenue, and growth potential, unlike small businesses content with a small market portion."},{"type":"mc","q":"The textbook describes a startup as a temporary business model focused on:","opts":["Rapid growth","Avoiding any product development","Sharing profits among partners","Keeping operations unchanged"],"correct":0,"explain":"The startup model is described as temporary and oriented toward rapid growth."},{"type":"mc","q":"Why may a startup take years to earn its first dollar of profit?","opts":["It prioritizes rapid growth and product development before initial profitability","It is prohibited from selling products","It has no possible market","It must always be a nonprofit"],"correct":0,"explain":"Startups may sacrifice early profitability while developing and placing a product or service in the market for long-run growth."},{"type":"mc","q":"The main goal of a startup is to create a product or service that:","opts":["Can be successfully placed on the market","Avoids all investment","Is sold only to its owners","Cannot be improved"],"correct":0,"explain":"The textbook states that the startup's main goal is a marketable product or service that may generate substantial long-run profit."},{"type":"mc","q":"Startup funding commonly includes seed funding from:","opts":["Angel investors","Only customers after ten years","Courts of law","Competitors who receive no share"],"correct":0,"explain":"The text says startups often approach angel investors for seed funding."},{"type":"mc","q":"In exchange for startup funding, angel investors usually receive:","opts":["A share of the business","A guarantee of no risk","The right to close every competitor","Only a product brochure"],"correct":0,"explain":"The textbook says angel investors receive a share of the business, usually about 5–10 percent in the example."},{"type":"mc","q":"A form of business organization refers to the arrangement of:","opts":["Ownership and management","Only product packaging","Only market prices","Only employee schedules"],"correct":0,"explain":"The textbook defines the ownership and management arrangement as the form of business organization."},{"type":"mc","q":"The three usual forms of business organization listed in Unit 8 are:","opts":["Sole ownership, partnership, and corporations","Consumer, producer, and government","Retail, wholesale, and export","Bank, insurer, and school"],"correct":0,"explain":"Unit 8 lists sole ownership, partnership business, and corporations."},{"type":"mc","q":"A sole proprietorship is owned and managed by:","opts":["One individual","Two or more partners only","An elected board of directors only","A government ministry"],"correct":0,"explain":"Sole means single; the sole proprietor owns and manages the business alone."},{"type":"mc","q":"In a sole proprietorship, who bears the profits and losses?","opts":["The single owner","All customers equally","An elected board","Only outside lenders"],"correct":0,"explain":"The sole proprietor takes the profits and bears the losses and risks of the enterprise."},{"type":"mc","q":"Which is a characteristic of sole proprietorship?","opts":["No separation between ownership and management","Mandatory board elections","Shares traded by stockholders","A separate legal personality from the owner"],"correct":0,"explain":"The owner personally manages the sole proprietorship, so ownership and management are not separated."},{"type":"mc","q":"A sole proprietorship generally has:","opts":["Less legal formality in formation and operation","A compulsory board of directors","Unlimited shareholders","A required partnership contract"],"correct":0,"explain":"The textbook says forming and operating a sole proprietorship involves few legal formalities, though some businesses need permission."},{"type":"mc","q":"What does 'no separate entity' mean for a sole proprietorship?","opts":["The owner and business are legally treated as one in the description","The owner has no control","The business is owned by shareholders","The business cannot earn profits"],"correct":0,"explain":"The text states that the business unit has no entity separate from its owner, who is responsible for what happens in it."},{"type":"mc","q":"Unlimited liability means that a sole proprietor's personal property may be used when:","opts":["Business assets cannot cover business liabilities","The owner wants a new logo","Sales increase unexpectedly","A partner joins the firm"],"correct":0,"explain":"If business assets are insufficient to pay liabilities, the sole proprietor's personal property can also be used."},{"type":"mc","q":"Which is an advantage of sole proprietorship?","opts":["Quick decision and prompt action","Unlimited managerial expertise","Large-scale suitability in every case","Unlimited financial resources"],"correct":0,"explain":"Quick decisions and prompt action are listed advantages of sole proprietorship."},{"type":"mc","q":"Which is a disadvantage of sole proprietorship?","opts":["Limited managerial expertise","Maximum authority","Maintenance of business secrets","Personal touch"],"correct":0,"explain":"Limited managerial expertise is one of the disadvantages listed for sole proprietorship."},{"type":"mc","q":"A partnership is a business owned by:","opts":["Two or more persons who contribute resources","One person who bears all losses","Only a board of directors","Only government shareholders"],"correct":0,"explain":"The textbook defines partnership as a business owned by two or more persons who contribute resources."},{"type":"mc","q":"In a general partnership, the partners normally have:","opts":["Unlimited liability","No responsibility for debts","Limited liability in every case","No right to profits"],"correct":0,"explain":"The text states that all partners in general partnerships have unlimited liability."},{"type":"mc","q":"In a limited partnership, creditors cannot go after the personal assets of:","opts":["Limited partners","Every general partner","Customers","The government"],"correct":0,"explain":"The textbook specifically distinguishes limited partnerships by protecting limited partners' personal assets from creditors."},{"type":"mc","q":"A partnership must be created by:","opts":["An agreement among persons competent to contract","A single owner's decision","A product advertisement","A cost-benefit ratio only"],"correct":0,"explain":"Partnership is created by an agreement among persons who are competent to contract."},{"type":"mc","q":"According to the text, the maximum number of partners is ten for banking businesses and how many for other businesses?","opts":["Twenty","Two","Five","One hundred"],"correct":0,"explain":"The partnership limits stated are ten for banking and twenty for other businesses."},{"type":"mc","q":"A minor may be admitted to a partnership's benefits but may have:","opts":["A share in profits without an obligation for losses","Unlimited liability for every debt","No share in profits","The sole right to manage"],"correct":0,"explain":"The text allows a minor to share in profits without being obligated for losses."},{"type":"mc","q":"For a partnership, the business whose profits are shared must be:","opts":["Lawful","Secret and illegal","A jointly owned property only","Unregistered in every case"],"correct":0,"explain":"An agreement to share profits from unlawful activities such as smuggling is not recognized as partnership business."},{"type":"mc","q":"In the principal-agent relationship of a partnership, each partner is:","opts":["Both principal and agent of the firm","Only a customer","Only an employee with no authority","Only a creditor"],"correct":0,"explain":"Every partner is the principal as well as the agent of the firm when dealing with other parties."},{"type":"mc","q":"Which is a limitation of an unregistered partnership?","opts":["It cannot sue outsiders, although outsiders can sue it","It can never be sued","It automatically becomes a corporation","It receives unlimited capital"],"correct":0,"explain":"The text lists inability to sue outsiders, while outsiders may sue it, as a limitation of an unregistered firm."},{"type":"mc","q":"Which is an advantage of partnership?","opts":["Availability of larger resources","Unlimited liability as a benefit","Instability","Possibility of conflicts"],"correct":0,"explain":"Larger resources are listed as an advantage; instability and conflicts are limitations."},{"type":"mc","q":"Which is a limitation of partnership?","opts":["Non-transferability of share","Benefits of specialization","Sharing of risks","Better decisions"],"correct":0,"explain":"Non-transferability of share is listed among partnership limitations."},{"type":"mc","q":"A corporation has:","opts":["A separate legal personality from its owners","No legal personality at all","Only one owner by definition","Unlimited liability for all stockholders"],"correct":0,"explain":"The textbook defines a corporation as having a legal personality separate from its owners."},{"type":"mc","q":"Ownership in a stock corporation is represented by:","opts":["Shares of stock","A sole proprietor's personal property","Only verbal promises","A feasibility questionnaire"],"correct":0,"explain":"The text states that ownership in a stock corporation is represented by shares of stock."},{"type":"mc","q":"Who controls the activities of a corporation?","opts":["An elected board of directors","One partner acting alone","Only the customers","A feasibility-study writer"],"correct":0,"explain":"The board of directors, elected from stockholders, controls the corporation's activities."},{"type":"mc","q":"The owners of a corporation generally enjoy:","opts":["Limited liability","Unlimited personal liability for all corporate debts","No ownership rights","Sole control of daily operations"],"correct":0,"explain":"The textbook states that stockholders enjoy limited liability and usually have limited involvement in operations."},{"type":"mc","q":"The recommended order before commissioning a business plan is to complete a:","opts":["Feasibility study","Share issue","Product advertisement","Partnership dispute"],"correct":0,"explain":"The textbook gives the rule of thumb to complete a feasibility study before commissioning a business plan."},{"type":"mc","q":"A feasibility study is also called a:","opts":["Proof of business concept","Board of directors","Market share","Personal objective"],"correct":0,"explain":"The textbook identifies a feasibility study as a proof of business concept."},{"type":"mc","q":"Compared with a business plan, a feasibility study is normally:","opts":["Less than 20% of the cost and less detailed","More expensive and more detailed","A list of only employee salaries","A legal charter"],"correct":0,"explain":"The text says a feasibility study is normally less than 20% of the cost of a business plan and is less in-depth."},{"type":"mc","q":"The central purpose of a feasibility study is to discover whether a project:","opts":["Warrants further investment and study","Must immediately hire all staff","Can avoid all research","Has the largest number of shareholders"],"correct":0,"explain":"A feasibility study tests whether a project is feasible and merits further time, money, and study."},{"type":"mc","q":"If a project is feasible, the next logical step is to:","opts":["Commission a full business plan","Abandon all research","Guarantee a profit","Convert automatically to a partnership"],"correct":0,"explain":"The textbook identifies commissioning a full business plan as the next logical step after a feasible study."},{"type":"mc","q":"A business plan is designed to plan in advance how a business will be:","opts":["Started, implemented, and managed","Closed without analysis","Owned by a single person only","Advertised without costs"],"correct":0,"explain":"The business plan maps how a business or project will be started, implemented, and managed."},{"type":"mc","q":"Which is one reason a business plan may be commissioned?","opts":["Investment or funding","To avoid setting objectives","To eliminate competition by law","To make a feasibility study unnecessary"],"correct":0,"explain":"The text gives re-organization, investment/funding, and a management blueprint as reasons for a business plan."},{"type":"mc","q":"Which item belongs in a typical feasibility study?","opts":["A cash-flow projection based on averages","A complete stock exchange listing","Only a company slogan","A guaranteed profit contract"],"correct":0,"explain":"Typical feasibility studies include general business details, competition, financial projections, and an average-based cash-flow projection."},{"type":"mc","q":"Which question is one of the five questions a feasibility study should answer?","opts":["Is it worth doing?","Who will be the sole owner forever?","Will every competitor close?","Can the business avoid customers?"],"correct":0,"explain":"The five listed questions include whether the idea will work, be profitable, cost to start, be worth doing, and merit a business plan."},{"type":"mc","q":"A business plan differs from a feasibility study because it includes:","opts":["Specific timelines and detailed budgets with forecasts","Only a one-sentence business idea","No supporting documentation","No information about competition"],"correct":0,"explain":"The business plan contains the feasibility study material plus timelines, detailed budgets, forecasts, and supporting documents."},{"type":"mc","q":"A well-written business plan can help maximize potential and minimize:","opts":["Overheads, liabilities, and risk","Customers and sales","All innovation","The need for any staff"],"correct":0,"explain":"The text explicitly says a well-written plan can maximize potential and minimize overheads, liabilities, and risk."},{"type":"mc","q":"In an SME feasibility study, the business idea should explain how it differs from:","opts":["Existing businesses","Every legal requirement","All personal objectives","The board of directors"],"correct":0,"explain":"The study asks what the idea is, whether it will work, how it differs from existing businesses, and who will buy."},{"type":"mc","q":"Profiles of key people in a feasibility study should identify their:","opts":["Skills, strengths, experience, training, and qualifications","Favorite products only","Personal liabilities only","Market prices only"],"correct":0,"explain":"The text recommends a resume-like profile showing relevant strengths, skills, experience, training, and qualifications."},{"type":"mc","q":"Personal objectives in the feasibility study should be organized as short, medium, and:","opts":["Long term","Seasonal only","Legal only","Unmeasurable"],"correct":0,"explain":"The text distinguishes short term up to one year, medium term one to three years, and long term greater than three years."},{"type":"mc","q":"When studying the market, an entrepreneur should identify market segments as:","opts":["Groups of potential customers","Only suppliers","The firm's personal assets","Types of legal liability"],"correct":0,"explain":"Market segments are groups whose likely purchases, frequency, and average purchase should be studied."},{"type":"fib","q":"Innovation is something new, improved, or introduced that creates _____.","answer":"value","explain":"The textbook defines innovation as something new, improved, or introduced that creates value."},{"type":"fib","q":"The Oslo Manual is an international reference guide from the ____ for collecting and using innovation data.","answer":"OECD","explain":"The text identifies the Oslo Manual as an OECD reference guide."},{"type":"fib","q":"The type of innovation that changes workplace organization and relationships with external stakeholders is called _____ innovation.","answer":"organizational","explain":"Organizational innovation changes business practices, workplace organization, and external relationships."},{"type":"fib","q":"A new or improved production or delivery approach is a _____ innovation.","answer":"process","explain":"Process innovation concerns production or delivery methods, techniques, equipment, or software."},{"type":"fib","q":"The introduction of a new or improved good or service is _____ innovation.","answer":"product","explain":"Product innovation introduces a new or improved good or service."},{"type":"fib","q":"A new strategy involving product design, packaging, price, or promotion is _____ innovation.","answer":"marketing","explain":"Marketing innovation changes marketing strategy, including design, packaging, price, or promotion."},{"type":"fib","q":"Eco-innovation promotes sustainability throughout a product's entire _____.","answer":"life cycle","explain":"The text says eco-innovation promotes sustainability throughout a product's entire life cycle."},{"type":"fib","q":"Schumpeter called the replacement of old models by new ideas and processes creative _____.","answer":"destruction","explain":"Schumpeter's concept is called creative destruction."},{"type":"fib","q":"A startup is a company in the initial stages of operations that expects significant _____ in the near future.","answer":"growth","explain":"This is the textbook's general definition of a startup."},{"type":"fib","q":"Startup funding obtained from potential angel investors is often called _____ funding.","answer":"seed","explain":"The textbook says funding for most startups involves seed funding."},{"type":"fib","q":"In a sole proprietorship, the owner bears the profits, losses, and _____.","answer":"risks","explain":"The sole proprietor alone bears the risks and reaps the profits."},{"type":"fib","q":"A sole proprietor's liability is described as _____.","answer":"unlimited","explain":"Personal property may be used if business assets cannot cover liabilities."},{"type":"fib","q":"A partnership requires at least _____ persons.","answer":"two","explain":"The partnership characteristics state that at least two persons are required."},{"type":"fib","q":"In a partnership, the partners agree to share profits and _____.","answer":"losses","explain":"The partnership agreement must provide for sharing business profits and losses."},{"type":"fib","q":"The maximum number of partners stated for non-banking businesses is _____.","answer":"20","explain":"The textbook states a maximum of 20 for other businesses, compared with 10 for banking."},{"type":"fib","q":"A corporation has a legal personality _____ from its owners.","answer":"separate","explain":"Separate legal personality is a defining feature of a corporation."},{"type":"fib","q":"Corporation ownership in a stock corporation is represented by shares of _____.","answer":"stock","explain":"The text states that stock corporation ownership is represented by shares of stock."},{"type":"fib","q":"The elected group from stockholders that controls a corporation is the board of _____.","answer":"directors","explain":"The board of directors controls corporate activities."},{"type":"fib","q":"A feasibility study is also known as a proof of business _____.","answer":"concept","explain":"The textbook uses proof of business concept as another name for a feasibility study."},{"type":"fib","q":"A feasibility study should be completed before commissioning a business _____.","answer":"plan","explain":"The recommended sequence is feasibility study first, then business plan if the project is feasible."},{"type":"fib","q":"One of the five feasibility questions asks whether the project is _____.","answer":"profitable","explain":"The five questions include whether it will work, be profitable, and be worth doing."},{"type":"fib","q":"A business plan is a detailed _____ for building a company.","answer":"road map","explain":"The text defines a business plan as a detailed road map for building a company."},{"type":"fib","q":"A feasibility study can show whether a business idea is _____.","answer":"viable","explain":"The SME feasibility study should show whether the idea is viable."},{"type":"fib","q":"In a feasibility study, potential customers are grouped into market _____.","answer":"segments","explain":"The market section asks the entrepreneur to identify market segments or groups."},{"type":"fib","q":"A feasibility study should identify preferred and alternative _____.","answer":"suppliers","explain":"The market section directs the entrepreneur to list preferred and alternative suppliers."},{"type":"fib","q":"Cost-benefit analysis compares the total benefits of an action with its total _____.","answer":"costs","explain":"CBA weighs benefits against the costs associated with an action."},{"type":"fib","q":"The net present value method expresses future benefits or costs in terms of their _____ value.","answer":"present","explain":"NPV calculates future benefits or costs in present-value terms."},{"type":"fib","q":"The benefit/cost ratio is simplified as _____.","answer":"b/c","explain":"The textbook gives the simplified benefit/cost notation as b/c."},{"type":"fib","q":"The first step of CBA is to compile lists of all associated costs and _____.","answer":"benefits","explain":"Step 1 is compiling comprehensive lists of costs and benefits."},{"type":"fib","q":"In the third CBA step, if benefits outweigh costs, it is generally advisable to _____ with the decision.","answer":"proceed","explain":"The text advises proceeding when the numerical benefits outweigh the costs."}]}]}
</script>

<script>
(function(){
  "use strict";
  var quizData = JSON.parse(document.getElementById('quiz-data').textContent);
  var units = quizData.units;

  var screenLanding = document.getElementById('screen-landing');
  var screenQuiz = document.getElementById('screen-quiz');
  var screenSummary = document.getElementById('screen-summary');

  var unitProgress = {}; // unitNumber -> {index, answers:[{selected, correct, checked}]}

  function freshProgress(unit){
    return {
      index:0,
      answers: unit.questions.map(function(){ return {checked:false, selected:null, correct:false}; })
    };
  }

  function letterFor(i){ return String.fromCharCode(65+i); }

  function normalizeAnswer(s){
    return String(s).toLowerCase().trim().replace(/[.,;:!?'"()]/g,'').replace(/\s+/g,' ');
  }

  // ---------------- LANDING ----------------
  function renderLanding(){
    var list = document.getElementById('unit-list');
    list.innerHTML = '';
    units.forEach(function(unit){
      var prog = unitProgress[unit.unit_number];
      var card = document.createElement('div');
      card.className = 'unit-card';
      card.setAttribute('role','button');
      card.setAttribute('tabindex','0');

      var pillHtml = '';
      if(prog){
        var answeredCount = prog.answers.filter(function(a){return a.checked;}).length;
        if(answeredCount === unit.questions.length){
          var correctCount = prog.answers.filter(function(a){return a.correct;}).length;
          var pct = Math.round((correctCount/unit.questions.length)*100);
          pillHtml = '<div class="unit-progress-pill show">'+pct+'% done</div>';
        } else if(answeredCount > 0){
          pillHtml = '<div class="unit-progress-pill show">'+answeredCount+'/'+unit.questions.length+' in progress</div>';
        }
      }

      card.innerHTML =
        '<div class="unit-num">'+unit.unit_number+'</div>' +
        '<div class="unit-info">' +
          '<div class="t">'+escapeHtml(unit.title)+'</div>' +
          '<div class="m">'+unit.questions.length+' questions</div>' +
        '</div>' +
        pillHtml +
        '<div class="unit-chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>';

      card.addEventListener('click', function(){ openUnit(unit.unit_number); });
      card.addEventListener('keydown', function(e){
        if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openUnit(unit.unit_number); }
      });
      list.appendChild(card);
    });
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------------- NAVIGATION BETWEEN SCREENS ----------------
  function showScreen(name){
    screenLanding.classList.add('hidden');
    screenQuiz.classList.add('hidden');
    screenSummary.classList.add('hidden');
    if(name==='landing') screenLanding.classList.remove('hidden');
    if(name==='quiz') screenQuiz.classList.remove('hidden');
    if(name==='summary') screenSummary.classList.remove('hidden');
    window.scrollTo({top:0, behavior:'auto'});
  }

  var currentUnitNumber = null;

  function getUnit(num){
    return units.filter(function(u){ return u.unit_number === num; })[0];
  }

  function openUnit(num){
    currentUnitNumber = num;
    if(!unitProgress[num]){
      unitProgress[num] = freshProgress(getUnit(num));
    }
    var prog = unitProgress[num];
    // if the unit was already fully completed, re-open at question 1 view but keep answers (review mode) OR simply resume.
    if(prog.index >= getUnit(num).questions.length){
      // fully completed previously -> go straight to summary
      showSummaryScreen(num);
      return;
    }
    showScreen('quiz');
    document.getElementById('quiz-unit-title').textContent = 'Unit '+num+': '+getUnit(num).title;
    renderQuestion();
  }

  function backToUnits(){
    renderLanding();
    showScreen('landing');
  }
  document.getElementById('back-to-units-1').addEventListener('click', backToUnits);
  document.getElementById('back-to-units-2').addEventListener('click', backToUnits);

  // ---------------- QUIZ RENDERING ----------------
  function renderQuestion(){
    var unit = getUnit(currentUnitNumber);
    var prog = unitProgress[currentUnitNumber];
    var idx = prog.index;
    var total = unit.questions.length;
    var q = unit.questions[idx];
    var ans = prog.answers[idx];

    // progress bar
    document.getElementById('progress-label').textContent = 'Question '+(idx+1)+' of '+total;
    var pct = Math.round(((idx+1)/total)*100);
    document.getElementById('progress-pct').textContent = pct+'%';
    document.getElementById('progress-fill').style.width = pct+'%';

    // type tag + text
    var isTF = (q.type==='mc' && q.opts && q.opts.length===2 && q.opts[0]==='True' && q.opts[1]==='False');
    var tag = isTF ? 'True / False' : (q.type==='mc' ? 'Multiple Choice' : 'Fill in the Blank');
    document.getElementById('q-type-tag').textContent = tag;
    document.getElementById('q-text').textContent = q.q;

    var optsContainer = document.getElementById('options-container');
    var fibContainer = document.getElementById('fib-container');
    var feedbackContainer = document.getElementById('feedback-container');
    optsContainer.innerHTML = '';
    fibContainer.innerHTML = '';
    feedbackContainer.innerHTML = '';

    if(q.type==='mc'){
      optsContainer.classList.remove('hidden');
      q.opts.forEach(function(optText, i){
        var opt = document.createElement('div');
        opt.className = 'option';
        opt.setAttribute('role','button');
        opt.setAttribute('tabindex', ans.checked ? '-1' : '0');
        opt.innerHTML = '<div class="opt-badge">'+letterFor(i)+'</div><div class="opt-text"></div>';
        opt.querySelector('.opt-text').textContent = optText;
        if(ans.checked){
          opt.classList.add('disabled');
          if(i === q.correct) opt.classList.add('correct-answer');
          else if(i === ans.selected) opt.classList.add('wrong-answer');
        } else {
          opt.addEventListener('click', function(){ selectMcOption(i); });
          opt.addEventListener('keydown', function(e){
            if(e.key==='Enter' || e.key===' '){ e.preventDefault(); selectMcOption(i); }
          });
        }
        if(!ans.checked && i === ans.selected) opt.classList.add('selected');
        optsContainer.appendChild(opt);
      });
      if(ans.checked) showFeedback(q, ans);
      updateNextButton();
    } else if(q.type==='fib'){
      optsContainer.classList.add('hidden');
      var row = document.createElement('div');
      row.className = 'fib-row';
      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'fib-input';
      input.placeholder = 'Type your answer...';
      input.id = 'fib-input-field';
      var btn = document.createElement('button');
      btn.className = 'fib-check-btn';
      btn.textContent = 'Check';
      row.appendChild(input);
      row.appendChild(btn);
      fibContainer.appendChild(row);

      if(ans.checked){
