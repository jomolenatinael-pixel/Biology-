<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 Economics — Full Subject Quiz</title>
<style>
  :root{
    --teal:#0f9488;
    --teal-dark:#0b7c72;
    --teal-light:#e6f6f4;
    --red:#dc4c4c;
    --red-light:#fdecec;
    --bg:#f6f5f1;
    --card:#ffffff;
    --ink:#232323;
    --ink-soft:#5c5c58;
    --line:#e6e4dd;
    --shadow: 0 1px 2px rgba(30,30,25,0.04), 0 6px 20px rgba(30,30,25,0.06);
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    font-size:14px;
    padding:16px 12px 48px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  /* ---------- header ---------- */
  .app-header{
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
  }
  .app-header .logo{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--teal),#5fc9bd);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:15px;flex:none;
  }
  .app-header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-0.01em;}
  .app-header .sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}

  /* ---------- landing ---------- */
  .unit-list{display:flex;flex-direction:column;gap:8px;}
  .unit-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 14px;
    display:flex;align-items:center;gap:12px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .12s ease, box-shadow .12s ease;
    text-align:left;
  }
  .unit-card:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(30,30,25,0.06),0 10px 26px rgba(30,30,25,0.09);}
  .unit-num{
    flex:none;width:38px;height:38px;border-radius:11px;
    background:var(--teal-light);color:var(--teal-dark);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;
  }
  .unit-info{flex:1;min-width:0;}
  .unit-info .t{font-weight:620;font-size:14px;color:var(--ink);}
  .unit-info .m{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .unit-chevron{flex:none;color:var(--ink-soft);opacity:.6;}
  .unit-progress-pill{
    flex:none;font-size:10px;font-weight:600;color:var(--teal-dark);
    background:var(--teal-light);padding:3px 7px;border-radius:999px;
    display:none;
  }
  .unit-progress-pill.show{display:inline-block;}

  .intro-note{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:12px;font-size:12px;color:var(--ink-soft);box-shadow:var(--shadow);
  }

  /* ---------- quiz screen ---------- */
  .hidden{display:none !important;}
  .quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .back-btn{
    background:none;border:none;color:var(--ink-soft);font-size:12px;
    cursor:pointer;display:flex;align-items:center;gap:5px;padding:6px 2px;font-weight:560;
  }
  .back-btn:hover{color:var(--ink);}
  .quiz-unit-title{font-size:12px;font-weight:640;color:var(--ink);flex:1;text-align:right;}

  .progress-block{margin-bottom:12px;}
  .progress-labels{
    display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-bottom:5px;font-weight:560;
  }
  .progress-bar-track{
    height:6px;background:var(--line);border-radius:999px;overflow:hidden;
  }
  .progress-bar-fill{
    height:100%;background:linear-gradient(90deg,var(--teal),#4bbdae);border-radius:999px;
    transition:width .25s ease;
  }

  .q-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 16px;box-shadow:var(--shadow);
  }
  .q-type-tag{
    display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--teal-dark);background:var(--teal-light);padding:3px 7px;border-radius:6px;margin-bottom:8px;
  }
  .q-text{font-size:14px;line-height:1.4;font-weight:560;margin:0 0 14px;color:var(--ink);}

  .options{display:flex;flex-direction:column;gap:7px;}
  .option{
    display:flex;align-items:center;gap:12px;
    border:1.5px solid var(--line);border-radius:13px;
    padding:9px 11px;cursor:pointer;background:#fff;
    font-size:12.5px;line-height:1.35;color:var(--ink);
    transition:border-color .12s ease, background .12s ease;
  }
  .option:hover{border-color:#bcd9d5;background:#fbfefd;}
  .option.selected{border-color:var(--teal);background:var(--teal-light);}
  .option.correct-answer{border-color:var(--teal);background:var(--teal-light);}
  .option.wrong-answer{border-color:var(--red);background:var(--red-light);}
  .option.disabled{cursor:default;}
  .opt-badge{
    flex:none;width:24px;height:24px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--ink-soft);background:#fff;
  }
  .option.selected .opt-badge{border-color:var(--teal);color:var(--teal-dark);background:#fff;}
  .option.correct-answer .opt-badge{border-color:var(--teal);color:#fff;background:var(--teal);}
  .option.wrong-answer .opt-badge{border-color:var(--red);color:#fff;background:var(--red);}
  .opt-text{flex:1;}

  .fib-row{display:flex;gap:10px;}
  .fib-input{
    flex:1;border:1.5px solid var(--line);border-radius:11px;padding:9px 11px;
    font-size:12.5px;font-family:inherit;color:var(--ink);
  }
  .fib-input:focus{outline:none;border-color:var(--teal);}
  .fib-check-btn{
    flex:none;background:var(--teal);color:#fff;border:none;border-radius:13px;
    padding:0 14px;font-size:12px;font-weight:620;cursor:pointer;
  }
  .fib-check-btn:disabled{opacity:.45;cursor:default;}
  .fib-check-btn:hover:not(:disabled){background:var(--teal-dark);}

  .feedback-banner{
    margin-top:12px;border-radius:11px;padding:10px 12px;
    display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.4;
  }
  .feedback-banner.correct{background:var(--teal-light);color:#0b5f57;}
  .feedback-banner.incorrect{background:var(--red-light);color:#8a2b2b;}
  .feedback-banner svg{flex:none;margin-top:1px;}
  .feedback-banner .fb-title{font-weight:700;margin-bottom:2px;}
  .feedback-banner .fb-correct-answer{font-weight:600;margin-top:3px;}

  .nav-row{
    position:sticky;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
    margin:10px -2px 0;padding:8px 2px calc(8px + env(safe-area-inset-bottom));
    background:rgba(246,245,241,.96);border-top:1px solid var(--line);box-shadow:0 -5px 14px rgba(30,30,25,.06);
  }
  .prev-btn{
    background:none;border:none;color:var(--ink-soft);font-size:12px;font-weight:600;cursor:pointer;padding:8px 4px;
  }
  .prev-btn:hover:not(:disabled){color:var(--ink);}
  .prev-btn:disabled{opacity:0;pointer-events:none;}
  .next-btn{
    background:var(--teal);color:#fff;border:none;border-radius:12px;
    padding:9px 17px;font-size:12px;font-weight:640;cursor:pointer;
  }
  .next-btn:hover:not(:disabled){background:var(--teal-dark);}
  .next-btn:disabled{opacity:.4;cursor:default;}

  /* ---------- summary screen ---------- */
  .summary-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:34px 26px 28px;box-shadow:var(--shadow);text-align:center;
  }
  .summary-card h2{font-size:19px;margin:2px 0 22px;font-weight:660;}
  .orb-wrap{position:relative;width:168px;height:168px;margin:0 auto 20px;}
  .orb-wrap svg{transform:rotate(-90deg);}
  .orb-center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .orb-pct{font-size:30px;font-weight:750;color:var(--ink);}
  .orb-frac{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .summary-msg{font-size:13.5px;color:var(--ink-soft);margin-bottom:22px;}
  .summary-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:6px;}
  .btn-solid{
    background:var(--teal);color:#fff;border:none;border-radius:12px;padding:11px 20px;
    font-size:13.5px;font-weight:640;cursor:pointer;
  }
  .btn-solid:hover{background:var(--teal-dark);}
  .btn-outline{
    background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:11px 20px;
    font-size:13.5px;font-weight:620;cursor:pointer;
  }
  .btn-outline:hover{border-color:#c9c7bd;}

  .review-section{margin-top:26px;text-align:left;}
  .review-section h3{font-size:14.5px;font-weight:660;margin:0 0 12px;}
  .review-item{
    border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px;background:#fdfdfb;
  }
  .review-q{font-size:13.5px;font-weight:600;margin-bottom:8px;color:var(--ink);}
  .review-row{font-size:12.5px;margin-bottom:3px;line-height:1.5;}
  .review-row .lab{font-weight:650;}
  .review-your{color:#8a2b2b;}
  .review-correct{color:#0b5f57;}
  .review-explain{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .no-missed{font-size:13.5px;color:var(--ink-soft);text-align:center;padding:10px 0 0;}

  button:focus-visible,.unit-card:focus-visible,.option:focus-visible,.fib-input:focus-visible{
    outline:3px solid rgba(15,148,136,.35);outline-offset:2px;
  }

  @media (max-width:480px){
    body{padding:12px 8px 38px;}
    .q-card{padding:15px 12px 13px;}
    .summary-card{padding:22px 12px 18px;}
    .quiz-unit-title{max-width:62%;}
  }
</style>

<body>
<div id="arena-back" style="position:sticky;top:0;z-index:50;background:rgba(247,248,250,.96);border-bottom:1px solid #e3e6eb;padding:8px 12px;display:flex;align-items:center;gap:8px;">
  <a href="index.html" style="text-decoration:none;color:#0f8a7e;font-weight:700;font-size:13px;font-family:system-ui,-apple-system,sans-serif;">‹ Quiz Arena</a>
  <span style="flex:1"></span>
  <span style="font-size:11px;color:#5b6472;font-family:system-ui,-apple-system,sans-serif;">Grade 10 Mini Game</span>
</div>

<div class="wrap">

  <div class="app-header">
    <div class="logo">C</div>
    <div>
      <h1>Grade 10 Economics — Practice Quiz</h1>
      <div class="sub">Ethiopian new curriculum · full subject coverage</div>
    </div>
  </div>

  <!-- LANDING SCREEN -->
  <div id="screen-landing">
    <div class="intro-note">Choose a unit below to begin. Each unit has its own 100-question quiz with its own progress and score — answers are checked instantly as you go.</div>
    <div class="unit-list" id="unit-list"></div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="hidden">
    <div class="quiz-top">
      <button class="back-btn" id="back-to-units-1">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Units
      </button>
      <div class="quiz-unit-title" id="quiz-unit-title"></div>
    </div>

    <div class="progress-block">
      <div class="progress-labels">
        <span id="progress-label"></span>
        <span id="progress-pct"></span>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
    </div>

    <div class="q-card">
      <div class="q-type-tag" id="q-type-tag"></div>
      <p class="q-text" id="q-text"></p>
      <div class="options" id="options-container"></div>
      <div id="fib-container"></div>
      <div id="feedback-container"></div>
    </div>

    <div class="nav-row">
      <button class="prev-btn" id="prev-btn">Previous</button>
      <button class="next-btn" id="next-btn" disabled>Next</button>
    </div>
  </div>

  <!-- SUMMARY SCREEN -->
  <div id="screen-summary" class="hidden">
    <div class="summary-card">
      <h2 id="summary-title"></h2>
      <div class="orb-wrap">
        <svg width="168" height="168" viewBox="0 0 168 168">
          <circle cx="84" cy="84" r="72" fill="none" stroke="#e6e4dd" stroke-width="14"/>
          <circle id="orb-arc" cx="84" cy="84" r="72" fill="none" stroke="#0f9488" stroke-width="14" stroke-linecap="round" stroke-dasharray="452.16" stroke-dashoffset="452.16"/>
        </svg>
        <div class="orb-center">
          <div class="orb-pct" id="orb-pct">0%</div>
          <div class="orb-frac" id="orb-frac">0 / 0</div>
        </div>
      </div>
      <div class="summary-msg" id="summary-msg"></div>
      <div class="summary-actions">
        <button class="btn-solid" id="restart-unit-btn">Restart this unit</button>
        <button class="btn-outline" id="back-to-units-2">Back to units</button>
      </div>
      <div class="review-section" id="review-section">
        <h3>Missed questions</h3>
        <div id="review-list"></div>
      </div>
    </div>
  </div>

</div>

<script type="application/json" id="quiz-data">
{"units":[{"unit_number":1,"title":"Theory of Consumer Behaviour","questions":[{"type":"mc","q":"In the textbook, a consumer is defined as a decision-making unit that:","opts":["Produces commodities for sale","Uses or consumes a commodity or service","Sets all market prices","Collects taxes from households"],"correct":1,"explain":"A consumer is an individual or household that uses or consumes a commodity or service."},{"type":"mc","q":"The theory of consumer behaviour mainly examines how a consumer:","opts":["Maximizes satisfaction from a basket of goods and services","Determines the money supply","Chooses a production technology","Measures national income"],"correct":0,"explain":"The theory concerns how consumers choose a basket to maximize satisfaction or utility."},{"type":"mc","q":"Which assumption about the consumer is stated in the unit introduction?","opts":["Income is unlimited","The consumer is rational","Prices are always zero","Information is unavailable"],"correct":1,"explain":"The consumer is assumed to be rational and to seek the highest possible satisfaction within income and prices."},{"type":"mc","q":"Given income and market prices, a rational consumer is assumed to spend income on goods that give:","opts":["The lowest possible utility","The highest possible satisfaction","The largest physical size","The most advertising"],"correct":1,"explain":"Rationality means pursuing the highest possible satisfaction or utility within the budget."},{"type":"mc","q":"The consumer is assumed to know his or her:","opts":["Income, available commodities, and their prices","Future weather exactly","All producers’ profits","Government tax revenue"],"correct":0,"explain":"The unit states that the consumer has relevant information about income, available commodities, and prices."},{"type":"mc","q":"Utility is best defined as the:","opts":["Market price of a commodity","Power of a commodity to satisfy human wants","Cost of producing a commodity","Quantity supplied by a seller"],"correct":1,"explain":"Utility is the power of a commodity to satisfy human wants."},{"type":"mc","q":"According to the example in the unit, bread has utility because it can:","opts":["Satisfy hunger","Set the price of water","Increase a producer’s rent","Measure temperature"],"correct":0,"explain":"Bread is used as an example of a commodity with the power to satisfy hunger."},{"type":"mc","q":"The relativity of utility means that utility is:","opts":["Identical for every person","Subjective to a person’s needs","Unrelated to consumption","Determined only by weight"],"correct":1,"explain":"Utility is subjective; the same commodity can provide different utilities to different consumers."},{"type":"mc","q":"Why may a non-smoker derive no utility from cigarettes?","opts":["Utility is subjective to individual needs","Cigarettes have no physical form","Prices determine all utility","Non-smokers have unlimited income"],"correct":0,"explain":"The textbook uses non-smokers to illustrate that utility depends on a person’s needs."},{"type":"mc","q":"The utility of a jacket may be greater in a cold season than in a hot season because utility varies by:","opts":["Place and time","The number of producers only","The textbook edition only","The commodity’s color only"],"correct":0,"explain":"The unit states that a product’s utility can differ at different places and times, such as a jacket across seasons."},{"type":"mc","q":"Which statement correctly distinguishes utility from usefulness?","opts":["They are always synonymous","Usefulness concerns the product, while utility concerns the consumer","Utility concerns only producers","Usefulness can be measured only in utils"],"correct":1,"explain":"The text says usefulness is a concern of the product, whereas utility is a concern of the consumer."},{"type":"mc","q":"Economists use which two approaches to quantify utility?","opts":["Cardinal and ordinal","Fiscal and monetary","Demand and supply","Short-run and long-run"],"correct":0,"explain":"The unit presents cardinal utility and ordinal utility as two approaches."},{"type":"mc","q":"Cardinal utility theory assumes that utility can be:","opts":["Measured and expressed in numbers","Only ranked and never compared","Ignored by consumers","Measured only by quantity supplied"],"correct":0,"explain":"The cardinal school treats utility as measurable and expressible in numbers."},{"type":"mc","q":"The suggested subjective unit for measuring utility under the cardinal approach is the:","opts":["Birr only","Util","Kilogram","Percent"],"correct":1,"explain":"The cardinal school uses subjective units called utils."},{"type":"mc","q":"Cardinal utility may also be expressed in monetary units using the amount of money a consumer is willing to pay for:","opts":["Another unit of a commodity","A producer’s wage","A tax refund","A market license"],"correct":0,"explain":"The text says money can measure utility through willingness to pay for another unit of a commodity."},{"type":"mc","q":"Which is an assumption of cardinal utility theory?","opts":["The consumer is irrational","Utility is a cardinal concept","Income changes after every purchase","Prices are unknown"],"correct":1,"explain":"Cardinal theory assumes utility is cardinal and each commodity’s utility is measurable."},{"type":"mc","q":"Constant marginal utility of money means that the utility from each successive unit of money income:","opts":["Remains constant","Always becomes negative","Must equal the commodity price","Cannot be compared"],"correct":0,"explain":"This assumption states that utility from each successive unit of money income remains constant."},{"type":"mc","q":"The law of diminishing marginal utility is also an assumption of:","opts":["Cardinal utility theory","Only the market-demand theory","Only production-cost theory","No utility approach"],"correct":0,"explain":"Diminishing marginal utility is listed among the assumptions of cardinal utility theory."},{"type":"mc","q":"For a basket with quantities X1 through Xn, total utility is represented in the unit as:","opts":["TU = f(X1, X2, …, Xn)","TU = price ÷ income","TU = income − price","TU = MU × time only"],"correct":0,"explain":"The textbook writes total utility of a basket as a function of the quantities of its commodities."},{"type":"mc","q":"Total utility refers to the:","opts":["Additional satisfaction from one more unit","Total satisfaction from specified quantities at a particular time","Price paid for the first unit","Difference between two prices"],"correct":1,"explain":"Total utility is the total satisfaction from consuming or possessing specified quantities at a particular time."},{"type":"mc","q":"Marginal utility is the:","opts":["Change in total utility from one more unit","Total price of all units","Average income of a consumer","Utility of money only"],"correct":0,"explain":"Marginal utility is the additional utility or change in total utility from consuming one more unit."},{"type":"mc","q":"The formula for marginal utility given in the unit is:","opts":["MU = ΔTU/ΔQ","MU = TU + Q","MU = Q/price","MU = income − TU"],"correct":0,"explain":"The textbook defines MU as the change in total utility divided by the change in quantity."},{"type":"mc","q":"If total utility rises from 10 utils at two oranges to 12 utils at three oranges, the marginal utility of the third orange is:","opts":["1 util","2 utils","10 utils","22 utils"],"correct":1,"explain":"MU = (12 − 10)/(3 − 2) = 2 utils."},{"type":"mc","q":"As a consumer consumes more of a commodity, total utility initially tends to:","opts":["Increase","Remain permanently zero","Equal the price automatically","Become negative immediately"],"correct":0,"explain":"The unit states that total utility increases as more of a good is consumed, up to a saturation point."},{"type":"mc","q":"The saturation point for a commodity is reached when the consumer:","opts":["Cannot obtain greater satisfaction from more of it","Has not consumed any of it","Pays no price","Has maximum income"],"correct":0,"explain":"Saturation is the point after which consuming more cannot provide greater satisfaction."},{"type":"mc","q":"In the banana schedule, total utility reaches its maximum of 37 utils at:","opts":["3 bananas","5 bananas","7 bananas","10 bananas"],"correct":2,"explain":"The table shows total utility of 37 at seven bananas, the saturation point."},{"type":"mc","q":"At the banana schedule’s saturation point of seven units, marginal utility is:","opts":["12 utils","5 utils","1 util","Zero"],"correct":3,"explain":"At seven bananas, TU is at its maximum and MU is zero."},{"type":"mc","q":"When consumption goes beyond the saturation point, marginal utility becomes:","opts":["Positive and increasing","Negative","Constant at the price","Impossible to calculate"],"correct":1,"explain":"After maximum total utility, additional consumption gives negative marginal utility."},{"type":"mc","q":"In the banana example, consuming the eighth banana gives marginal utility of:","opts":["12 utils","7 utils","Zero","−1 util"],"correct":3,"explain":"The table records MU = −1 at eight bananas."},{"type":"mc","q":"If total utility is increasing at a decreasing rate, marginal utility is:","opts":["Increasing","Decreasing but positive","Zero throughout","Negative throughout"],"correct":1,"explain":"A rising TU at a decreasing rate means MU is positive but diminishing."},{"type":"mc","q":"The law of diminishing marginal utility states that, with other goods constant, successive units of a commodity provide:","opts":["Increasing utility","Decreasing utility","Exactly the same utility always","No utility at all"],"correct":1,"explain":"As quantity consumed increases over a time period, utility from successive units decreases."},{"type":"mc","q":"In the law of diminishing marginal utility, the condition that other goods remain constant is important because it isolates changes due to:","opts":["The quantity of the commodity consumed","National income","The number of sellers","The weather forecast"],"correct":0,"explain":"The law examines how marginal utility changes as the quantity of the commodity changes while other goods are fixed."},{"type":"mc","q":"For the activity table with TU values 0, 10, 16, 20, 22, 22, 20, the MU of the second unit is:","opts":["4 utils","6 utils","10 utils","16 utils"],"correct":1,"explain":"MU of the second unit is 16 − 10 = 6 utils."},{"type":"mc","q":"For that same activity table, total utility is maximized at quantity:","opts":["2","3","4","6"],"correct":2,"explain":"TU reaches its highest value, 22, at quantities four and five; the first maximum point is quantity four and MU is zero there."},{"type":"mc","q":"For the activity table with TU values 0, 10, 16, 20, 22, 22, 20, the MU of the sixth unit is:","opts":["2 utils","0 utils","−2 utils","6 utils"],"correct":2,"explain":"MU of the sixth unit is 20 − 22 = −2 utils."},{"type":"mc","q":"A consumer reaches equilibrium when the allocation of expenditure makes the last birr spent on each commodity yield:","opts":["The same utility","The highest price","Zero total utility","Different marginal utilities per birr"],"correct":0,"explain":"Consumer equilibrium requires the last birr spent on each commodity to yield the same utility."},{"type":"mc","q":"A consumer budget shows the:","opts":["Number of goods and services the consumer can afford at given prices","Total utility after saturation","Utility ranking of all commodities","Quantity produced by firms"],"correct":0,"explain":"The budget is purchasing potential and shows what goods and services can be afforded at given prices."},{"type":"mc","q":"Which is an assumption used in developing consumer equilibrium?","opts":["Consumer income is given and remains constant","Prices change after every unit","The consumer has no objective","Utility cannot be compared in any way"],"correct":0,"explain":"The equilibrium assumptions include given, constant income and given, constant commodity prices."},{"type":"mc","q":"For one commodity X, the consumer is in equilibrium when:","opts":["MUx = Px","TUx = Px","MUx > Px always","Income = MUx only"],"correct":0,"explain":"The one-commodity equilibrium condition is marginal utility of X equal to its price."},{"type":"mc","q":"If MUx is greater than Px, the consumer can increase welfare by:","opts":["Buying more units of X","Buying fewer units of X","Stopping all consumption","Increasing the price of X"],"correct":0,"explain":"When MUx > Px, another unit gives more utility than its price, so consumption should increase."},{"type":"mc","q":"If MUx is less than Px, welfare can be increased by:","opts":["Reducing consumption of X","Buying more X","Doubling the price","Ignoring the budget"],"correct":0,"explain":"When marginal utility is below price, the consumer should reduce consumption."},{"type":"mc","q":"The single-commodity budget equation is:","opts":["PxQx = income/budget","Px + Qx = income","MUx = income","TUx = price × time"],"correct":0,"explain":"The unit states that expenditure PxQx equals the consumer’s income or budget."},{"type":"mc","q":"The demand curve for a single commodity is derived from the relationship between:","opts":["Price and quantity demanded","Income and total utility only","Quantity and producer rent","Utility and weather"],"correct":0,"explain":"The demand curve is the graphical relationship between price and quantity demanded."},{"type":"mc","q":"For more than one commodity, utility is maximized when:","opts":["MU/P is equal across commodities","All quantities are equal","All prices are zero","Total utility is negative"],"correct":0,"explain":"The multi-commodity condition requires equality of marginal utility-to-price ratios."},{"type":"mc","q":"The expression MU_A/P_A = MU_B/P_B means that the consumer gets equal:","opts":["Utility from each additional unit of money spent","Prices of all goods","Quantities of all goods","Total utility from each good"],"correct":0,"explain":"Each ratio is utility derived from spending an additional unit of money on that commodity."},{"type":"mc","q":"If one commodity yields greater utility per birr than others, the consumer should:","opts":["Spend more on that commodity and less on others","Stop buying that commodity","Raise all prices","Keep the unequal ratios permanently"],"correct":0,"explain":"The text says spending shifts toward the commodity with greater utility per unit of money until equality is reached."},{"type":"mc","q":"For several commodities, the consumer’s budget equation is represented by:","opts":["Income = AP_A + BP_B + CP_C + … + NP_N","Income = MU_A + MU_B only","Income = price − quantity","Income = total utility ÷ price"],"correct":0,"explain":"The textbook writes income as the sum of expenditure on each commodity."},{"type":"mc","q":"In the bread example, bread costs Birr 2 and the consumer is in equilibrium at:","opts":["Zero units","One unit","Two units","Five units"],"correct":2,"explain":"The table and explanation show equilibrium at two breads, where MU of bread equals its price."},{"type":"mc","q":"At two breads in the bread example, MU_bread/P_bread equals:","opts":["0","0.5","1","2"],"correct":2,"explain":"At two breads, MU is 2 and price is 2, so MU/P = 1, equal to marginal utility of money."},{"type":"mc","q":"In the two-commodity example with income Birr 22, Px = 2, and Py = 4, the utility-maximizing bundle is:","opts":["X=2, Y=5","X=3, Y=4","X=4, Y=3","X=5, Y=2"],"correct":1,"explain":"The textbook solution identifies three units of X and four units of Y as the equilibrium bundle."},{"type":"mc","q":"The expenditure check for that bundle is:","opts":["2(3) + 4(4) = 22","2(4) + 4(3) = 10","3(2) + 4(4) = 28","2(3) + 4(4) = 40"],"correct":0,"explain":"The equilibrium bundle spends 6 + 16 = Birr 22, exactly the income."},{"type":"mc","q":"At the two-commodity equilibrium in the example, MU_X/P_X and MU_Y/P_Y are both:","opts":["0","0.5","1","4"],"correct":2,"explain":"At X=3 and Y=4, the relevant marginal utilities are 2 and 4; dividing by prices 2 and 4 gives 1 for each."},{"type":"mc","q":"The maximum total utility from X=3 and Y=4 in the example is:","opts":["22 utils","28 utils","40 utils","44 utils"],"correct":2,"explain":"The textbook sums TU_X = 12 and TU_Y = 28 to obtain 40 utils."},{"type":"mc","q":"In Activity 1.4, with income Birr 10, Px=2 and Py=1, which bundle uses all income?","opts":["X=1, Y=8","X=2, Y=5","X=3, Y=4","X=4, Y=3"],"correct":1,"explain":"The budget equation is 2X + Y = 10; X=2 and Y=5 uses all Birr 10."},{"type":"mc","q":"In Activity 1.4, for X=2 and Y=5, MUx/Px and MUy/Py are:","opts":["3 and 4","3 and 4/1","6/2 and 4/1","10/2 and 5/1"],"correct":2,"explain":"At X=2, MUx=6 so MUx/Px=3; at Y=5, MUy=4 so MUy/Py=4, so this option states the ratios directly."},{"type":"mc","q":"The ordinal approach says utility cannot be measured:","opts":["Absolutely in units such as utils","In relative preference order","By any consumer choice","Through ranking of bundles"],"correct":0,"explain":"Ordinal utility rejects absolute measurement but permits relative ranking of bundles."},{"type":"mc","q":"Under ordinal utility, consumers need to be able to:","opts":["Rank baskets according to preference","Assign exact utils to every good","Keep prices constant forever","Calculate total national output"],"correct":0,"explain":"Ordinal theory requires consumers to rank bundles by the satisfaction they provide."},{"type":"mc","q":"Which assumption is common to cardinal and ordinal utility approaches?","opts":["The consumer is rational","Utility is measured in utils","Utility is never compared","Marginal utility of money is constant"],"correct":0,"explain":"Rationality is common to both approaches; cardinal-only assumptions include utils and constant marginal utility of money."},{"type":"mc","q":"The diminishing marginal rate of substitution describes a rate at which a consumer:","opts":["Substitutes one commodity for another while keeping satisfaction constant","Changes income into prices","Calculates total utility from one good only","Produces two goods"],"correct":0,"explain":"MRS is the rate at which one good is substituted for another while total satisfaction remains the same."},{"type":"mc","q":"Under diminishing MRS, as a consumer gets more of Y in exchange for X, the consumer is prepared to give up:","opts":["Fewer units of X for each additional Y","More units of X forever","All units of Y","No units of either good"],"correct":0,"explain":"The text states that the consumer gives up fewer units of X for each additional unit of Y."},{"type":"mc","q":"Consistency of choice means that if a consumer chooses A over B under exactly the same conditions, the consumer will:","opts":["Not choose B over A","Always choose C over both","Assign A zero utility","Change prices"],"correct":0,"explain":"Consistency rules out reversing the choice between A and B when conditions and availability are unchanged."},{"type":"mc","q":"Transitivity means that if A is preferred to B and B is preferred to C, then:","opts":["C is preferred to A","A is preferred to C","A and C cannot be compared","B is preferred to A"],"correct":1,"explain":"The transitivity assumption is A>B and B>C, therefore A>C."},{"type":"mc","q":"Which statement best summarizes the difference between cardinal and ordinal utility?","opts":["Cardinal measures utility; ordinal ranks preferences","Cardinal ranks preferences; ordinal measures utils","Both require exact utils","Neither considers consumer choice"],"correct":0,"explain":"Cardinal utility is measurable and quantifiable, while ordinal utility ranks bundles by preference."},{"type":"mc","q":"When total utility reaches its maximum point, marginal utility is:","opts":["Positive and increasing","Zero","Equal to total income","Always negative before the maximum"],"correct":1,"explain":"The summary and examples state that MU becomes zero at maximum total utility."},{"type":"mc","q":"Which review statement is correct?","opts":["Total utility increases as long as marginal utility is positive","Total utility must fall whenever MU is positive","Ordinal utility is measured in money","MUx=Px is the two-good condition"],"correct":0,"explain":"Positive marginal utility adds to total utility, so TU increases while MU remains positive."},{"type":"mc","q":"In the review table, if TU_X rises from 34 at Q_X=4 to 40 at Q_X=5, MU_X of the fifth unit is:","opts":["4","5","6","40"],"correct":2,"explain":"MU_X = 40 − 34 = 6."},{"type":"mc","q":"In the review table, TU_Y reaches 91 at Q_Y=7 and remains 91 at Q_Y=8. The MU_Y of the eighth unit is:","opts":["−1","0","1","8"],"correct":1,"explain":"MU_Y = 91 − 91 = 0."},{"type":"mc","q":"Using the review table’s prices Px=1 and Py=3 and budget Birr 10, which bundle satisfies the budget exactly?","opts":["X=1, Y=3","X=4, Y=2","X=7, Y=1","X=10, Y=1"],"correct":1,"explain":"The bundle X=4, Y=2 costs 1(4)+3(2)=10."},{"type":"mc","q":"Which statement about total utility and marginal utility is correct?","opts":["Total utility is the sum of marginal utilities","Total utility is always less than marginal utility","Marginal utility never changes","Total utility is unrelated to consumption"],"correct":0,"explain":"Total utility can be obtained by summing the marginal utilities of the consumed units."},{"type":"mc","q":"Which statement about the ordinal approach is correct?","opts":["It ranks bundles by preference without absolute utility units","It requires utility to be measured in utils","It assumes marginal utility of money is constant","It rejects rational consumer choice"],"correct":0,"explain":"Ordinal utility ranks consumption bundles according to preference rather than assigning absolute numerical units."},{"type":"fib","q":"The power of a commodity to satisfy human wants is called _____.","answer":"utility","explain":"The unit defines utility as the power of a commodity to satisfy human wants."},{"type":"fib","q":"An individual or household that uses or consumes a commodity or service is a _____.","answer":"consumer","explain":"A consumer is the decision-making unit that uses or consumes goods or services."},{"type":"fib","q":"The satisfaction or pleasure derived from consuming a good or service is called _____.","answer":"utility","explain":"Utility is the level of satisfaction or pleasure from consumption."},{"type":"fib","q":"Utility is _____ to a person’s needs rather than objectively determined for everyone.","answer":"subjective","explain":"The relativity of utility means it is subjective to each person’s needs."},{"type":"fib","q":"Usefulness concerns the product, whereas _____ concerns the consumer.","answer":"utility","explain":"The textbook distinguishes product usefulness from consumer utility."},{"type":"fib","q":"The cardinal school uses the subjective unit called the _____.","answer":"util","explain":"Cardinal utility is expressed in utils."},{"type":"fib","q":"The total satisfaction obtained from specified quantities of a commodity is called _____ utility.","answer":"total","explain":"Total utility is the total amount of satisfaction from specified quantities."},{"type":"fib","q":"The additional utility obtained from consuming one more unit is called _____ utility.","answer":"marginal","explain":"Marginal utility is the additional utility from an additional unit."},{"type":"fib","q":"The formula for marginal utility is MU = ΔTU divided by _____.","answer":"ΔQ","explain":"The unit gives MU = ΔTU/ΔQ, where ΔQ is the change in quantity."},{"type":"fib","q":"The point after which consuming more of a commodity cannot provide greater satisfaction is the _____ point.","answer":"saturation","explain":"The saturation point is where no greater satisfaction can be obtained from more consumption."},{"type":"fib","q":"At the maximum point of total utility, marginal utility is _____.","answer":"zero","explain":"MU becomes zero when TU reaches its maximum."},{"type":"fib","q":"Beyond the saturation point, marginal utility becomes _____.","answer":"negative","explain":"Additional units beyond saturation reduce total utility and have negative MU."},{"type":"fib","q":"The law stating that utility from successive units decreases as consumption increases is the law of _____ marginal utility.","answer":"diminishing","explain":"This is the law of diminishing marginal utility."},{"type":"fib","q":"A consumer’s actual purchasing potential at given prices is the consumer’s _____.","answer":"budget","explain":"The consumer budget is the purchasing potential with which goods and services can be bought."},{"type":"fib","q":"For one commodity, consumer equilibrium occurs when MUx equals _____.","answer":"Px","explain":"The one-commodity equilibrium condition is MUx = Px."},{"type":"fib","q":"If MUx is greater than Px, the consumer should purchase _____ units of X to increase welfare.","answer":"more","explain":"When MU exceeds price, buying more raises welfare."},{"type":"fib","q":"If MUx is less than Px, welfare can be increased by _____ consumption of X.","answer":"reducing","explain":"When MU is below price, the consumer should reduce consumption."},{"type":"fib","q":"For several commodities, equilibrium requires equality of the ratios of marginal utility to _____.","answer":"price","explain":"The multi-commodity condition is MU/P equal across commodities."},{"type":"fib","q":"The expenditure equation for several goods states that consumer income equals the sum of price times _____.","answer":"quantity","explain":"Income equals AP_A + BP_B + …, where each term is price times quantity."},{"type":"fib","q":"In the bread example, the price of one unit of bread is Birr _____.","answer":"2","explain":"Table 1.4 uses a bread price of Birr 2 per unit."},{"type":"fib","q":"In the two-commodity example, the equilibrium quantities are 3 units of bread and _____ units of injera.","answer":"4","explain":"The worked solution identifies X=3 and Y=4 as the maximizing bundle."},{"type":"fib","q":"The total utility of the equilibrium bundle in the two-commodity example is _____ utils.","answer":"40","explain":"TU is 12 utils from bread plus 28 utils from injera, totaling 40."},{"type":"fib","q":"Under ordinal utility, bundles are _____ according to preference rather than assigned absolute utility numbers.","answer":"ranked","explain":"Ordinal utility permits relative ranking of consumption bundles."},{"type":"fib","q":"The ordinal assumption that a rational consumer aims to maximize satisfaction is called _____.","answer":"rationality","explain":"Rationality is one of the assumptions of ordinal utility theory."},{"type":"fib","q":"The rate at which one commodity is substituted for another while satisfaction remains constant is the marginal rate of _____.","answer":"substitution","explain":"The marginal rate of substitution measures this trade-off between commodities."},{"type":"fib","q":"The ordinal assumption that a consumer does not reverse a choice under identical conditions is called _____.","answer":"consistency","explain":"Consistency means maintaining the same choice when conditions are unchanged."},{"type":"fib","q":"If A is preferred to B and B is preferred to C, the transitivity assumption implies A is preferred to _____.","answer":"C","explain":"The textbook states A>B and B>C, therefore A>C."},{"type":"fib","q":"The unit presents _____ and ordinal utility as the two approaches to measuring utility.","answer":"cardinal","explain":"The two approaches are cardinal utility and ordinal utility."},{"type":"fib","q":"In the banana schedule, the saturation quantity is _____ bananas.","answer":"7","explain":"TU reaches its maximum of 37 utils at seven bananas."},{"type":"fib","q":"If total utility rises from 10 to 16 when quantity rises by one unit, the marginal utility of that unit is _____ utils.","answer":"6","explain":"MU = ΔTU/ΔQ = (16−10)/(2−1) = 6 utils."}]},{"unit_number":2,"title":"Theories of Demand and Supply","questions":[{"type":"mc","q":"Which combination is required for demand for a commodity?","opts":["A desire only","Willingness and ability to pay","Ability to produce","A government order"],"correct":1,"explain":"The text defines demand as willingness to buy together with ability to pay."},{"type":"mc","q":"A demand schedule is best described as a table showing:","opts":["Costs of producing a good at one price","Different quantities consumers will buy at different prices over a period","Only the income of consumers","The quantities firms sell at different technologies"],"correct":1,"explain":"A demand schedule lists quantities consumers are willing to buy at different prices during a given time."},{"type":"mc","q":"In the demand function Qd = a - bP, Qd represents:","opts":["Quantity demanded","Consumer income","A constant price","Quantity supplied"],"correct":0,"explain":"The notation in the textbook identifies Qd as quantity demanded."},{"type":"mc","q":"On the conventional demand graph in Unit 2, price is measured on the:","opts":["Horizontal axis","Vertical axis","Both axes equally","Neither axis"],"correct":1,"explain":"Price, the independent variable, is placed on the vertical axis."},{"type":"mc","q":"If all other things remain constant, what happens to quantity demanded when price falls?","opts":["It rises","It falls","It becomes zero","It is unchanged by definition"],"correct":0,"explain":"The law of demand states that quantity demanded rises when price decreases."},{"type":"mc","q":"Why does a usual demand curve slope downward?","opts":["Price and quantity demanded are inversely related","Price and quantity demanded are always equal","Supply is fixed","Income is measured vertically"],"correct":0,"explain":"A lower price increases quantity demanded, producing a negative slope."},{"type":"mc","q":"In Amina's coffee schedule, how much coffee does she buy at Birr 20 per kg?","opts":["3 kg","5 kg","7 kg","9 kg"],"correct":1,"explain":"The table gives 5 kg at a price of Birr 20 per kg."},{"type":"mc","q":"In Amina's coffee schedule, what quantity is demanded at Birr 45 per kg?","opts":["9 kg","5 kg","1 kg","0 kg"],"correct":3,"explain":"At Birr 45, the table shows that Amina buys no coffee."},{"type":"mc","q":"Which is a substitute pair in the textbook's examples?","opts":["Tea and sugar","Phone and SIM card","Coffee and tea","Cars and petrol"],"correct":2,"explain":"Coffee and tea can be used in place of one another to satisfy a want."},{"type":"mc","q":"Which is a complementary pair?","opts":["Pens and pencils","Butter and oil","Phone and SIM card","Coffee and tea"],"correct":2,"explain":"Complementary goods are used together; the text gives phone and SIM card as an example."},{"type":"mc","q":"If the price of coffee rises, what normally happens to demand for tea, a substitute?","opts":["It rises","It falls","It becomes perfectly inelastic","It is necessarily zero"],"correct":0,"explain":"A rise in one substitute's price increases demand for the other substitute."},{"type":"mc","q":"If the price of a complement rises, demand for the related good generally:","opts":["Rises","Falls","Stays fixed in every case","Becomes supply"],"correct":1,"explain":"The text explains that complementary goods are used together, so a higher price of one reduces demand for the other."},{"type":"mc","q":"Consumer income is generally related to demand for most commodities how?","opts":["Directly","Inversely in every case","Not at all","Only through technology"],"correct":0,"explain":"The textbook says an increase in consumer income generally increases demand."},{"type":"mc","q":"What effect can a larger population have on market demand?","opts":["It generally increases demand","It always eliminates demand","It changes only supply","It makes price irrelevant"],"correct":0,"explain":"A larger population means more users and generally greater market demand."},{"type":"mc","q":"Demand for woolen clothes is expected to increase mainly during:","opts":["Hot seasons","Cold seasons","Harvest seasons only","Periods of zero income"],"correct":1,"explain":"The textbook uses cold seasons as an example of seasonal demand for woolens."},{"type":"mc","q":"If consumers expect a future price increase, their current demand may:","opts":["Rise","Fall to zero","Become supply","Remain fixed regardless of expectations"],"correct":0,"explain":"Consumers may buy more now when they expect prices to rise later."},{"type":"mc","q":"A movement from one point to another on a fixed demand curve is called a change in:","opts":["Demand","Quantity demanded","Population","Technology"],"correct":1,"explain":"A price change causes movement along the same curve, called a change in quantity demanded."},{"type":"mc","q":"An upward movement along a demand curve is called:","opts":["Extension of demand","Contraction of demand","An increase in supply","Market equilibrium"],"correct":1,"explain":"The text calls upward movement along demand a contraction of demand."},{"type":"mc","q":"Which event shifts a demand curve rather than causing movement along it?","opts":["A change in the good's own price","A change in consumer income","Reading a different point at the same schedule","A change from one price-quantity pair to another"],"correct":1,"explain":"Income is a non-price determinant and therefore shifts the demand curve."},{"type":"mc","q":"An increase in demand is represented by a shift of the demand curve:","opts":["Upward and to the right","Downward and to the left","Only vertically downward","Along the unchanged curve"],"correct":0,"explain":"The text describes an increase as an outward, upward-right shift."},{"type":"mc","q":"A decrease in demand is represented by a shift:","opts":["Upward to the right","Downward to the left","Only along the supply curve","To a higher price with no curve change"],"correct":1,"explain":"A decrease in demand is an inward, downward-left shift."},{"type":"mc","q":"If Mr. Adamu buys 2 kg of bananas weekly at Birr 20 per kg, that is an example of:","opts":["Individual demand","Market supply","Excess supply","Cross elasticity"],"correct":0,"explain":"Individual demand is the quantity one person is willing and able to buy at a price over a period."},{"type":"mc","q":"Market demand at a given price is found by:","opts":["Vertical subtraction of prices","Horizontal summation of individual quantities demanded","Adding all consumers' incomes","Multiplying price by population only"],"correct":1,"explain":"Market demand is the sum of individual demands at each price, represented horizontally."},{"type":"mc","q":"Three wheat consumers demand 2, 1, and 0 quintals at a price. Their market demand is:","opts":["0 quintals","1 quintal","2 quintals","3 quintals"],"correct":3,"explain":"Market demand is the sum: 2 + 1 + 0 = 3 quintals."},{"type":"mc","q":"If one identical buyer has QI = 50 - 5P and there are 100 buyers, the market demand function is:","opts":["Qm = 50 - 500P","Qm = 5000 - 500P","Qm = 100 - 5P","Qm = 5000 + 500P"],"correct":1,"explain":"Multiplying the individual function by 100 gives Qm = 5000 - 500P."},{"type":"mc","q":"Supply is the quantity a producer is willing and able to:","opts":["Consume at any price","Produce and make available for sale over a specified period","Demand from households","Store without considering price"],"correct":1,"explain":"Supply concerns amounts a producer can and will offer for sale at given prices and over time."},{"type":"mc","q":"A supply function states the relationship between quantity supplied and:","opts":["Its determinants, such as price","Only consumer tastes","Only population","The equilibrium quantity alone"],"correct":0,"explain":"A supply function relates quantity supplied to determinants, with price commonly the independent variable."},{"type":"mc","q":"In Qs = a + bP, the positive sign before bP reflects the usual:","opts":["Inverse demand law","Direct price-quantity relationship of supply","Definition of shortage","Income effect"],"correct":1,"explain":"The law of supply says price and quantity supplied are positively related."},{"type":"mc","q":"A supply schedule is a:","opts":["Graph of demand only","Tabular presentation of the law of supply","List of consumer incomes","Table of equilibrium shifts only"],"correct":1,"explain":"The textbook defines it as a table showing the supply relationship at relevant prices."},{"type":"mc","q":"The usual supply curve slopes:","opts":["Downward","Upward","Horizontally left","Randomly"],"correct":1,"explain":"A positive price-quantity relationship gives the supply curve a positive slope."},{"type":"mc","q":"In the textbook supply schedule, what quantity is supplied at Birr 35 per kg?","opts":["0 kg","2 kg","4 kg","9 kg"],"correct":2,"explain":"The supply table pairs Birr 35 with 4 kg supplied."},{"type":"mc","q":"Movement along a fixed supply curve is caused by a change in:","opts":["The good's own price","Technology only","The price of factors only","The number of sellers only"],"correct":0,"explain":"A change in the commodity's own price changes quantity supplied along the same curve."},{"type":"mc","q":"A shift of the supply curve is caused by a change in:","opts":["The good's own price only","Something other than the commodity's own price","The chosen point on the same curve","Quantity demanded only"],"correct":1,"explain":"Changes in other goods' prices, factor prices, technique, or producer goals shift supply."},{"type":"mc","q":"An increase in the cost of factors of production generally:","opts":["Increases supply","Reduces supply","Leaves production cost unchanged","Makes demand perfectly elastic"],"correct":1,"explain":"Higher factor cost raises production cost and reduces supply."},{"type":"mc","q":"Advanced technology generally affects supply by:","opts":["Reducing productivity and supply","Increasing productivity and supply","Changing only consumer taste","Creating a shortage automatically"],"correct":1,"explain":"The text states that advanced technology increases productivity and supply."},{"type":"mc","q":"A flood affecting agricultural production is an example of a factor that generally:","opts":["Increases supply","Reduces supply","Raises market demand directly","Makes all goods substitutes"],"correct":1,"explain":"Floods are external factors that can reduce agricultural supply."},{"type":"mc","q":"An increase in government subsidies generally results in:","opts":["Less production and lower supply","More production and higher supply","No change in supply","A contraction of demand"],"correct":1,"explain":"The textbook links higher subsidies with more production and supply."},{"type":"mc","q":"Better transport facilities tend to:","opts":["Increase supply","Decrease supply","Eliminate the supply curve","Reduce population"],"correct":0,"explain":"Better transport is listed as a factor that increases supply."},{"type":"mc","q":"Market supply is derived by summing:","opts":["Individual quantities supplied at each possible price","All prices only","Consumer incomes","Equilibrium prices across countries"],"correct":0,"explain":"Market supply is the sum of individual suppliers' quantities at each price."},{"type":"mc","q":"For identical sellers, market supply can be obtained by multiplying one seller's quantity by:","opts":["The equilibrium price","The number of sellers","Consumer income","The number of substitutes"],"correct":1,"explain":"With identical sellers, the representative quantity is multiplied by the number of sellers."},{"type":"mc","q":"With 120 sellers and individual supply Qs = 20P - 5, the market supply function is:","opts":["Qm = 20P - 600","Qm = 2400P - 600","Qm = 2400P + 5","Qm = 120P - 5"],"correct":1,"explain":"Multiplying 20P - 5 by 120 gives Qm = 2400P - 600."},{"type":"mc","q":"Using that market supply function, quantity supplied at P = 4 is:","opts":["900 tons","2,400 tons","8,000 tons","9,000 tons"],"correct":3,"explain":"Qm = 2400(4) - 600 = 9,000 tons."},{"type":"mc","q":"A supply curve is shifted by a change in production technique because technique is:","opts":["The commodity's own price","A non-price determinant of supply","A measure of demand","An equilibrium condition"],"correct":1,"explain":"Production technique is listed among factors other than own price that shift supply."},{"type":"mc","q":"Market equilibrium occurs when:","opts":["Quantity demanded equals quantity supplied","Price is always zero","Demand is greater than supply","Supply is greater than demand"],"correct":0,"explain":"Equilibrium is the market condition in which quantity demanded equals quantity supplied."},{"type":"mc","q":"The price at which a market clears is called the:","opts":["Shortage price","Equilibrium or market-clearing price","Factor price","Substitution price"],"correct":1,"explain":"The equilibrium price is also called the market-clearing price."},{"type":"mc","q":"In the shirt schedule, the equilibrium price and quantity are:","opts":["Birr 15 and 2 shirts","Birr 20 and 3 shirts","Birr 25 and 4 shirts","Birr 30 and 5 shirts"],"correct":1,"explain":"At Birr 20, quantity demanded and supplied are both 3 shirts."},{"type":"mc","q":"At a shirt price of Birr 15, with demand 4 and supply 2, the market has:","opts":["A surplus of 2","A shortage of 2","Equilibrium","A shortage of 6"],"correct":1,"explain":"Quantity demanded exceeds quantity supplied by 2, creating a shortage."},{"type":"mc","q":"At a shirt price of Birr 25, with demand 2 and supply 4, the market has:","opts":["A shortage of 2","A surplus of 2","Equilibrium","A surplus of 6"],"correct":1,"explain":"Quantity supplied exceeds quantity demanded by 2, creating a surplus."},{"type":"mc","q":"A shortage normally puts pressure on price to:","opts":["Rise","Fall","Remain permanently fixed","Become negative"],"correct":0,"explain":"Unsatisfied buyers bid the price up when quantity demanded exceeds supply."},{"type":"mc","q":"A surplus normally puts pressure on price to:","opts":["Rise","Fall","Double immediately","Become independent of supply"],"correct":1,"explain":"Unsatisfied sellers bid the price down when supply exceeds demand."},{"type":"mc","q":"Excess demand is another name for a market:","opts":["Surplus","Shortage","Equilibrium","Supply shift"],"correct":1,"explain":"Excess demand means quantity demanded is greater than quantity supplied, producing a shortage."},{"type":"mc","q":"Excess supply results when:","opts":["Quantity demanded exceeds quantity supplied","Quantity supplied exceeds quantity demanded","Both quantities are zero","Demand and supply curves coincide at every price"],"correct":1,"explain":"Excess supply is defined as quantity supplied exceeding quantity demanded."},{"type":"mc","q":"For Qd = 80 - 3P and Qs = 9P - 40, the equilibrium price is:","opts":["Birr 5/kg","Birr 10/kg","Birr 20/kg","Birr 40/kg"],"correct":1,"explain":"Equating the functions gives 80 - 3P = 9P - 40, so P = 10."},{"type":"mc","q":"For those same wheat functions, the equilibrium quantity is:","opts":["30 kg","40 kg","50 kg","90 kg"],"correct":2,"explain":"At P = 10, Qd = 80 - 30 = 50 kg."},{"type":"mc","q":"For those wheat functions, a price above Birr 10 creates:","opts":["Excess demand","Excess supply","No market","A leftward demand shift"],"correct":1,"explain":"Prices above equilibrium produce supply greater than demand, or a surplus."},{"type":"mc","q":"If supply is constant and demand increases, equilibrium price and quantity generally:","opts":["Both rise","Both fall","Price rises and quantity falls","Price falls and quantity rises"],"correct":0,"explain":"The Unit 2 table shows an increase in demand raises both equilibrium price and quantity."},{"type":"mc","q":"If demand is constant and supply increases, equilibrium price and quantity generally:","opts":["Price rises and quantity falls","Price falls and quantity rises","Both fall","Both rise"],"correct":1,"explain":"An outward supply shift lowers the clearing price and raises equilibrium quantity."},{"type":"mc","q":"If demand is constant and supply decreases, equilibrium price and quantity generally:","opts":["Price rises and quantity falls","Price falls and quantity rises","Both rise","Both remain unchanged"],"correct":0,"explain":"A supply decrease raises the new price and lowers the equilibrium quantity."},{"type":"mc","q":"Price elasticity of demand measures responsiveness of quantity demanded to:","opts":["The commodity's own price","Only population","Only technology","The number of sellers"],"correct":0,"explain":"It measures consumers' response to changes in the good's own price."},{"type":"mc","q":"Price elasticity of demand is calculated as the percentage change in quantity demanded divided by the percentage change in:","opts":["Income","Price","Population","Supply"],"correct":1,"explain":"That ratio is the textbook's definition of price elasticity of demand."},{"type":"mc","q":"Point elasticity measures responsiveness:","opts":["At a given point or for a very small price change","Only across an entire market","Only for income changes","Only after equilibrium"],"correct":0,"explain":"Point elasticity is measured at a point or for a very small change in price."},{"type":"mc","q":"Arc elasticity measures responsiveness:","opts":["Over a range of prices on the demand curve","At zero price only","Only for supply shifts","Only when demand is perfectly inelastic"],"correct":0,"explain":"Arc elasticity measures average responsiveness over a distance or range on the curve."},{"type":"mc","q":"Why is the usual price elasticity coefficient of demand negative?","opts":["Price and quantity demanded move inversely","Supply is upward sloping","Income is always negative","Market demand is horizontal"],"correct":0,"explain":"The inverse price-quantity relationship makes the coefficient negative; the text often uses its absolute value."},{"type":"mc","q":"If a percentage change in price causes a larger percentage change in quantity demanded, demand is:","opts":["Elastic","Inelastic","Unitary elastic","Perfectly inelastic"],"correct":0,"explain":"Elastic demand has an absolute elasticity coefficient greater than 1."},{"type":"mc","q":"If a 10% price increase causes a 2% decrease in quantity demanded, the absolute price elasticity is:","opts":["0.02","0.2","2","5"],"correct":1,"explain":"The example computes 0.02 divided by 0.10 = 0.2, which is less than 1."},{"type":"mc","q":"Demand is unitary elastic when the percentage changes in price and quantity demanded are:","opts":["Equal","Opposite in size and unequal","Both zero only","Infinite"],"correct":0,"explain":"Unitary elasticity has an absolute coefficient equal to 1."},{"type":"mc","q":"Perfectly inelastic demand has an elasticity coefficient of:","opts":["0","0.5","1","Infinity"],"correct":0,"explain":"Quantity demanded does not change with price, so the coefficient is zero."},{"type":"mc","q":"Perfectly elastic demand means consumers will buy:","opts":["No quantity at any price","All possible quantities at the given price and none at other prices","The same quantity at every price","Only necessities"],"correct":1,"explain":"The textbook gives this definition of perfectly elastic demand."},{"type":"mc","q":"Which commodity is likely to have relatively inelastic demand according to the text?","opts":["A necessity","A luxury with many substitutes","A durable with many alternatives","A frequently postponed purchase"],"correct":0,"explain":"Necessities are less responsive to price changes than luxuries."},{"type":"mc","q":"A commodity with many close substitutes tends to have:","opts":["More elastic demand","More inelastic demand","Zero demand","Perfectly fixed demand"],"correct":0,"explain":"Availability of close substitutes makes demand relatively elastic."},{"type":"fib","q":"Demand equals willingness to buy plus ability to ______.","answer":"pay","explain":"The textbook states: Demand = willingness to buy + ability to pay."},{"type":"fib","q":"A demand curve shows quantity demanded at each ______.","answer":"price","explain":"The demand curve represents the quantity chosen at each price."},{"type":"fib","q":"The usual demand curve has a ______ slope.","answer":"negative","explain":"The law of demand produces a downward, negative slope."},{"type":"fib","q":"The assumption that all other things remain constant is called ______ paribus.","answer":"ceteris","explain":"The textbook repeatedly uses ceteris paribus for holding other factors constant."},{"type":"fib","q":"Coffee and tea are examples of ______ goods.","answer":"substitute","explain":"Substitutes can be used in place of one another."},{"type":"fib","q":"Tea and sugar are examples of ______ goods.","answer":"complementary","explain":"Complements are used together to satisfy a want."},{"type":"fib","q":"A change in the good's own price causes a movement along the demand curve, called a change in quantity ______.","answer":"demanded","explain":"Own-price changes move from one point to another on a fixed demand curve."},{"type":"fib","q":"A non-price determinant that shifts the demand curve is consumer ______.","answer":"income","explain":"Income is listed among the demand-shifting factors."},{"type":"fib","q":"The total quantity all consumers are willing and able to buy is called ______ demand.","answer":"market","explain":"Market demand is the horizontal sum of individual demands."},{"type":"fib","q":"For 100 identical buyers with QI = 50 - 5P, the market demand function is Qm = ______.","answer":"5000 - 500P","explain":"Multiplying the individual function by 100 gives the stated market function."},{"type":"fib","q":"Supply is the amount a producer is willing and able to make available for ______.","answer":"sale","explain":"The supply definition concerns goods made available for sale in a market."},{"type":"fib","q":"The usual supply curve has a ______ slope.","answer":"positive","explain":"Price and quantity supplied are directly related, giving a positive slope."},{"type":"fib","q":"A change in a commodity's own price causes a movement along the same ______ curve.","answer":"supply","explain":"Own-price changes alter quantity supplied along the existing supply curve."},{"type":"fib","q":"Advanced technology increases productivity and generally increases ______.","answer":"supply","explain":"Technology is a supply determinant that can raise output offered."},{"type":"fib","q":"An increase in factor cost generally ______ supply.","answer":"reduces","explain":"Higher factor costs raise production cost and reduce supply."},{"type":"fib","q":"The market supply curve is obtained by the ______ summation of individual supply curves.","answer":"horizontal","explain":"The textbook describes market supply as horizontal summation."},{"type":"fib","q":"For 120 sellers with Qs = 20P - 5, the market supply equation is Qm = ______.","answer":"2400P - 600","explain":"Multiplying the individual equation by 120 gives 2400P - 600."},{"type":"fib","q":"For that market, quantity supplied at P = 4 is ______ tons.","answer":"9000","explain":"Substitution gives 2400(4) - 600 = 9000 tons."},{"type":"fib","q":"At market equilibrium, quantity demanded equals quantity ______.","answer":"supplied","explain":"Equality of quantity demanded and quantity supplied defines equilibrium."},{"type":"fib","q":"A price below equilibrium creates a market ______.","answer":"shortage","explain":"Below equilibrium, buyers want more than sellers offer."},{"type":"fib","q":"A price above equilibrium creates a market ______.","answer":"surplus","explain":"Above equilibrium, sellers offer more than buyers want."},{"type":"fib","q":"A shortage tends to push the market price ______.","answer":"upward","explain":"Unsatisfied buyers bid prices up when there is excess demand."},{"type":"fib","q":"A surplus tends to push the market price ______.","answer":"downward","explain":"Unsatisfied sellers bid prices down when there is excess supply."},{"type":"fib","q":"For Qd = 80 - 3P and Qs = 9P - 40, the equilibrium price is Birr ______ per kg.","answer":"10","explain":"Equating the two functions gives 120 = 12P, hence P = 10."},{"type":"fib","q":"For those wheat functions, the equilibrium quantity is ______ kg.","answer":"50","explain":"At P = 10, Qd = 80 - 3(10) = 50 kg."},{"type":"fib","q":"Price elasticity of demand is the percentage change in quantity demanded divided by the percentage change in ______.","answer":"price","explain":"This is the definition of price elasticity of demand."},{"type":"fib","q":"Demand with an absolute elasticity coefficient greater than one is relatively ______.","answer":"elastic","explain":"A larger quantity response than price response is elastic demand."},{"type":"fib","q":"Demand with an elasticity coefficient equal to one is ______ elastic.","answer":"unitary","explain":"Equal percentage changes characterize unitary elasticity."},{"type":"fib","q":"A positive cross elasticity indicates that two goods are ______.","answer":"substitutes","explain":"Demand for one rises when the other's price rises for substitutes."},{"type":"fib","q":"A negative cross elasticity indicates that two goods are ______.","answer":"complements","explain":"Complementary goods have negative cross elasticity."}]},{"unit_number":3,"title":"Theories of Production and Cost","questions":[{"type":"mc","q":"What is production in economics?","opts":["Transforming inputs into desired goods or services by adding economic value","Buying finished goods only for household use","Measuring the price level of all goods","Dividing income among consumers"],"correct":0,"explain":"The textbook defines production as transforming raw materials and other inputs into desired products or services by adding economic value."},{"type":"mc","q":"Which expression represents the production function when labor and capital are the inputs?","opts":["Q = f(L, K)","Q = L + K + price","Q = TFC + TVC","Q = income − saving"],"correct":0,"explain":"With labor (L) and capital (K), the production function is written Q = f(L,K)."},{"type":"mc","q":"A production function shows the highest output a firm can produce for:","opts":["Each specified combination of inputs","Only the maximum possible price","A fixed amount of profit","Every consumer's income"],"correct":0,"explain":"The production function gives the maximum output obtainable from specified input quantities using the best technique."},{"type":"mc","q":"Which situation describes the short run?","opts":["At least one factor of production is fixed","All factors can be changed immediately","No factor can be used","Only output, never inputs, can change"],"correct":0,"explain":"The short run is a period in which at least one factor, commonly land or capital, is fixed."},{"type":"mc","q":"In the textbook's short-run wheat example, which input is variable?","opts":["Labor","Land","Capital","Technology"],"correct":0,"explain":"Labor is variable while land, capital, and technology are held constant in the example."},{"type":"mc","q":"What does total product (TP) measure?","opts":["Total output produced by a given amount of a variable input with other inputs fixed","Output per worker only","The extra output from one more worker","Total spending on fixed inputs"],"correct":0,"explain":"TP is the overall output produced by employed factors over a given period, with other inputs held fixed in the short run."},{"type":"mc","q":"If a farm produces 48 quintals with 6 workers, what is average product of labor?","opts":["8 quintals per worker","6 quintals per worker","42 quintals per worker","54 quintals per worker"],"correct":0,"explain":"AP_L = TP/L = 48/6 = 8 quintals per worker, matching Table 3.1."},{"type":"mc","q":"If total product rises from 40 to 48 when labor increases from 5 to 6 workers, what is marginal product of the sixth worker?","opts":["8","6","40","48"],"correct":0,"explain":"MP_L = change in TP/change in L = (48−40)/(6−5) = 8."},{"type":"mc","q":"Marginal product is best defined as:","opts":["The additional output from one extra unit of a variable input, other inputs constant","Total output divided by all inputs","The cost of all fixed inputs","The output produced when all inputs are doubled"],"correct":0,"explain":"MP is the extra output obtained from one additional unit of the variable input while other variables remain constant."},{"type":"mc","q":"The marginal product of labor is equal to the:","opts":["Slope of the total-product curve","Height of the average-fixed-cost curve","Area under the cost curve","Intercept of the isoquant map"],"correct":0,"explain":"The textbook states that marginal product is the slope of the TP curve."},{"type":"mc","q":"In the wheat table, what is the average product when 4 workers produce 30 quintals?","opts":["7.5 quintals per worker","4 quintals per worker","26 quintals per worker","30 quintals per worker"],"correct":0,"explain":"AP = TP/L = 30/4 = 7.5 quintals per worker."},{"type":"mc","q":"When total product increases at an increasing rate, marginal product is:","opts":["Increasing","Zero","Negative","Constant at the average product"],"correct":0,"explain":"MPL increases when TP increases at an increasing rate."},{"type":"mc","q":"When total product is at its maximum, marginal product is:","opts":["Zero","At its maximum positive value","Always negative","Equal to total fixed cost"],"correct":0,"explain":"MPL reaches zero when TP is maximum."},{"type":"mc","q":"When total product is falling, marginal product is:","opts":["Negative","Positive and increasing","Zero throughout","Equal to average fixed cost"],"correct":0,"explain":"A falling TP means the extra input reduces output, so MP is negative."},{"type":"mc","q":"According to the law of diminishing marginal productivity, adding more labor to fixed capital eventually causes:","opts":["The marginal contribution of labor to decline","All output to become zero immediately","Fixed capital to become variable","Average fixed cost to rise"],"correct":0,"explain":"With fixed inputs, extra variable inputs eventually yield lower marginal contributions and may reduce total output."},{"type":"mc","q":"Which stage is called the increasing-returns stage?","opts":["Stage I","Stage II","Stage III","The long-run stage"],"correct":0,"explain":"Stage I is identified as the increasing returns stage."},{"type":"mc","q":"In Stage II of production, marginal product is:","opts":["Positive but decreasing","Negative and total product is falling","Always rising","Equal to total product"],"correct":0,"explain":"Stage II covers the range where MP remains positive but decreases."},{"type":"mc","q":"What characterizes Stage III?","opts":["Negative marginal product and decreasing total product","Rising marginal product and rising average product","Zero total product at every input level","All inputs are variable"],"correct":0,"explain":"Stage III is the negative-returns stage: additional variable input lowers TP because MP is negative."},{"type":"mc","q":"A rational firm would normally avoid operating in Stage III because:","opts":["Additional variable inputs reduce total output","Average product must be at its maximum","Fixed cost becomes zero","All isoquants cross"],"correct":0,"explain":"In Stage III, extra variable inputs have negative marginal product and decrease TP."},{"type":"mc","q":"Using Table 3.1, what is the marginal product when labor rises from 10 to 11 workers?","opts":["0 quintals","1 quintal","5.4 quintals","60 quintals"],"correct":0,"explain":"TP remains 60 at 10 and 11 workers, so MP = (60−60)/(11−10) = 0."},{"type":"mc","q":"Using Table 3.1, what is the marginal product when labor rises from 11 to 12 workers?","opts":["−2 quintals","0 quintals","2 quintals","58 quintals"],"correct":0,"explain":"TP falls from 60 to 58, so MP = 58−60 = −2."},{"type":"mc","q":"Average product rises when marginal product is:","opts":["Greater than average product","Less than average product","Negative only","Equal to zero only"],"correct":0,"explain":"The textbook states that AP rises when MP is greater than AP."},{"type":"mc","q":"Average product falls when marginal product is:","opts":["Less than average product","Greater than average product","Equal to total fixed cost","Always zero"],"correct":0,"explain":"An addition below the current average pulls the average down, so AP falls when MP < AP."},{"type":"mc","q":"Average product is at its maximum when:","opts":["MP equals AP","MP is negative","TP is zero","TFC equals TVC"],"correct":0,"explain":"AP is maximum at the point where MP = AP."},{"type":"mc","q":"The long run is a period sufficient for a firm to:","opts":["Change the quantities of all inputs","Keep all inputs fixed","Change only labor","Eliminate all production"],"correct":0,"explain":"In the long run all input quantities are variable."},{"type":"mc","q":"An isoquant shows:","opts":["All efficient input combinations producing the same output","All prices charged for one product","The total cost at different output prices","Different outputs from one fixed input"],"correct":0,"explain":"An isoquant is a curve of efficient labor-capital combinations yielding an equal output level."},{"type":"mc","q":"In the isoquant schedule, which combination produces 100 units using 3 units of labor?","opts":["C: 3 labor and 4 capital","A: 1 labor and 11 capital","D: 4 labor and 2 capital","E: 5 labor and 11 capital"],"correct":0,"explain":"Table 3.2 identifies combination C as L=3, K=4, Q=100."},{"type":"mc","q":"Moving to an isoquant farther from the origin generally indicates:","opts":["A greater output level","A lower output level","The same output necessarily","Zero capital use"],"correct":0,"explain":"The farther an isoquant lies from the origin, the greater the output it denotes."},{"type":"mc","q":"Which statement about isoquants is correct?","opts":["They do not cross each other","They are always upward sloping","They represent different prices","They are concave to the origin in the standard case"],"correct":0,"explain":"The textbook lists non-crossing, downward-sloping, convex isoquants among their properties."},{"type":"mc","q":"Why are standard isoquants downward sloping?","opts":["More of one input can replace some of the other while output stays constant","Output must fall whenever labor rises","All input prices must decline","Fixed costs are independent of output"],"correct":0,"explain":"A downward slope reflects substitution between labor and capital at the same output."},{"type":"mc","q":"The usual traditional-theory shape of an isoquant is:","opts":["Smooth and convex to the origin","Horizontal only","Vertical only","A straight line through every origin"],"correct":0,"explain":"The textbook generally uses smooth, convex isoquants."},{"type":"mc","q":"The marginal rate of technical substitution (MRTS) of labor for capital measures:","opts":["How much capital can be reduced when one more labor unit is used at constant output","How much output rises when price rises","How much fixed cost is paid per worker","How much labor is lost when capital rises"],"correct":0,"explain":"MRTS_L,K is the amount of capital that can be reduced for one extra labor unit while holding output constant."},{"type":"mc","q":"Diminishing MRTS means that, moving down an isoquant as labor increases, the amount of capital replaceable by another labor unit:","opts":["Gets smaller","Gets larger without limit","Becomes total fixed cost","Makes output change to zero"],"correct":0,"explain":"The textbook describes MRTS as decreasing as labor increases along a convex isoquant."},{"type":"mc","q":"An isoquant map is:","opts":["A graph combining several isoquants","A table of only fixed costs","A single TP value","A graph of consumer utility only"],"correct":0,"explain":"An isoquant map combines a set of isoquants and describes a production function."},{"type":"mc","q":"Increasing returns to scale occur when all inputs are multiplied by m and output increases by:","opts":["More than m","Exactly zero","Less than m","Exactly the original amount"],"correct":0,"explain":"Increasing returns mean output rises by more than the proportionate input increase."},{"type":"mc","q":"If all inputs double and output also doubles, the firm has:","opts":["Constant returns to scale","Increasing returns to scale","Decreasing returns to scale","Negative marginal product"],"correct":0,"explain":"Constant returns occur when output changes in the same proportion as all inputs."},{"type":"mc","q":"Decreasing returns to scale may result from:","opts":["Difficulties organizing and running a large-scale operation","A fixed input becoming smaller when output rises","An isoquant moving through the origin","Average product always exceeding marginal product"],"correct":0,"explain":"The textbook links decreasing returns to organizational difficulties in large-scale operations."},{"type":"mc","q":"Returns to scale examine the effect on output of:","opts":["Increasing all input quantities by a given proportion","Changing only labor while capital is fixed","Changing only the product price","Dividing total cost by output"],"correct":0,"explain":"Returns to scale are a long-run concept involving proportionate changes in all inputs."},{"type":"mc","q":"Graphically, technical progress shifts the production function:","opts":["Upward","Downward","Only along the price axis","Into a cost curve"],"correct":0,"explain":"The textbook describes an upward shift of the production function after technical progress."},{"type":"mc","q":"After technical progress, the same output may be produced with:","opts":["Fewer factor inputs","More fixed costs necessarily","No capital or labor","A higher marginal cost necessarily"],"correct":0,"explain":"Technical progress can produce the same output with fewer inputs, or more output with the same inputs."},{"type":"mc","q":"Capital-side technical progress increases:","opts":["MPK by more than MPL","MPL by more than MPK","MPL and MPK by exactly zero","Only total fixed cost"],"correct":
