 Ethiopia", "Egypt and Kenya"], "correct": 0, "explain": "The 1959 Agreement strengthened a monopoly on the waters of the Nile by Egypt and Sudan."}, {"type": "mc", "q": "How many countries does the Nile traverse, according to the unit?", "opts": ["Six", "Eight", "Eleven", "Fifteen"], "correct": 2, "explain": "The Nile traverses eleven countries in Africa, known as the Nile riparian countries."}, {"type": "mc", "q": "What was a key criticism leveled at the FDRE Constitution's origins, according to the unit?", "opts": ["It was drafted entirely by foreign powers", "It was seen as a formalization of the EPRDF's political program", "It was never ratified", "It abolished all regional states"], "correct": 1, "explain": "The constitution was seen more as a formalization of the EPRDF's political program than a fresh political start."}, {"type": "mc", "q": "The Tekeze River, one of the Nile's tributaries, originates from which mountains?", "opts": ["The Simien Mountains", "The Bale Mountains", "The Atlas Mountains", "The Ahmar Mountains"], "correct": 0, "explain": "The Tekeze River originates from the Siemen (Simien) Mountains, north-east of Lake Tana."}, {"type": "mc", "q": "What did the Cooperative Framework Agreement (CFA) notably omit, according to the unit?", "opts": ["Any mention of Ethiopia", "The 1959 Agreement and the principle of fair and equitable utilization", "The GERD project", "The Nile Basin Initiative"], "correct": 1, "explain": "The CFA mentioned neither the 1959 Agreement nor the principle of 'fair and equitable utilization' that Ethiopia called for."}, {"type": "fib", "q": "The Marxist military junta (Derg) was toppled in 1991 by the coalition known as the _______.", "answer": "EPRDF", "explain": "The Derg was toppled by a coalition of ethno-nationalist forces, the EPRDF."}, {"type": "fib", "q": "The EPRDF coalition was dominated by the party known by the acronym _______.", "answer": "TPLF", "explain": "The EPRDF was dominated by the Tigray People's Liberation Front (TPLF)."}, {"type": "fib", "q": "The May 1991 London Conference was sponsored by the _______.", "answer": "United States of America", "explain": "The May 1991 London Conference was sponsored by the United States of America."}, {"type": "fib", "q": "_______ served as the US mediator at the 1991 London Conference.", "answer": "Herman Cohen", "explain": "Herman Cohen, the US Assistant Secretary for African Affairs, served as mediator."}, {"type": "fib", "q": "Addis Ababa was occupied by the insurgents on May 28, _______.", "answer": "1991", "explain": "Addis Ababa was occupied by insurgents on May 28, 1991."}, {"type": "fib", "q": "The Transitional Charter established _______ self-governing regions of nations, nationalities, and peoples.", "answer": "14", "explain": "The Transitional Charter established 14 self-governing regions."}, {"type": "fib", "q": "The 1995 Constitution established the Federal Democratic Republic of Ethiopia, composed of nine states and _______ city administrations.", "answer": "two", "explain": "The federal constitution made Ethiopia a composite of nine states and two city administrations."}, {"type": "fib", "q": "The 1995 FDRE Constitution contains _______ articles across eleven chapters.", "answer": "106", "explain": "The 1995 Federal Constitution is a document of 106 articles."}, {"type": "fib", "q": "Article _______ of the FDRE Constitution recognizes the right of nations, nationalities and peoples to self-determination, up to secession.", "answer": "39", "explain": "The right to self-determination, including secession, is recognized in Article 39."}, {"type": "fib", "q": "The body known as the _______ (HPR) is the supreme political organ under the FDRE Constitution, with members elected for five years.", "answer": "House of Peoples' Representatives", "explain": "The House of Peoples' Representatives (HPR) is the supreme political organ in the country."}, {"type": "fib", "q": "The main task of the House of Federation is _______ interpretation.", "answer": "constitutional", "explain": "The House of Federation's main task is constitutional interpretation."}, {"type": "fib", "q": "_______ State accounts for about one-third of Ethiopia's total landmass.", "answer": "Oromia", "explain": "Oromia State accounts for one-third of the country's total landmass."}, {"type": "fib", "q": "_______ State is the smallest regional state in the Ethiopian federation, at 340 square kilometers.", "answer": "Harari", "explain": "The Harari State is by far the smallest at only 340 square kilometers."}, {"type": "fib", "q": "_______ was chosen as the working language at the federal level of Ethiopia.", "answer": "Amharic", "explain": "Amharic was chosen as the working language at the federal level."}, {"type": "fib", "q": "The Nile River flows for about _______ km from south to north.", "answer": "6,825", "explain": "The Nile is the world's longest river, flowing south to north for about 6,825 km."}, {"type": "fib", "q": "The _______ Nile contributes about 86% of the annual volume of water to the Nile.", "answer": "Blue", "explain": "The Blue Nile contributes about 86% of the annual volume of water to the Nile."}, {"type": "fib", "q": "The 1929 Agreement gave _______ the right to veto any Nile project affecting its interests.", "answer": "Egypt", "explain": "The 1929 Agreement gave Egypt the right to veto any project on the Nile affecting its interests."}, {"type": "fib", "q": "Under the 1959 Agreement, Sudan's share of Nile water increased to _______ billion cubic meters.", "answer": "18.5", "explain": "The 1959 Agreement gave Sudan's share as 18.5 billion cubic meters."}, {"type": "fib", "q": "The Nile Basin Initiative (NBI) was established on 22 February _______.", "answer": "1999", "explain": "The Nile Basin Initiative was established on 22 February 1999."}, {"type": "fib", "q": "The Cooperative Framework Agreement was signed by Ethiopia's Meles Zenawi and Egypt's _______.", "answer": "Hosni Mubarak", "explain": "The CFA was signed between Ethiopia's Meles Zenawi and Egypt's Hosni Mubarak."}, {"type": "fib", "q": "Construction of the Grand Ethiopian Renaissance Dam began in April _______.", "answer": "2011", "explain": "Construction of the Grand Renaissance Dam started in April 2011."}, {"type": "fib", "q": "The GERD is being built in the _______ region of Ethiopia on the Abay River.", "answer": "Benishangul-Gumuz", "explain": "Ethiopia is constructing the GERD in the Benishangul-Gumuz region on the Abay River."}, {"type": "fib", "q": "In 1992, the TGE adopted a _______-market economic model, departing from the previous socialist system.", "answer": "free", "explain": "In 1992, the TGE adopted a free-market economic model."}, {"type": "fib", "q": "The strategy adopted to industrialize Ethiopia's agrarian economy was known by the acronym _______.", "answer": "ALDI", "explain": "The Agricultural-led Development of Industrialization (ALDI) strategy aimed to industrialize the agrarian economy."}, {"type": "fib", "q": "Ethiopia's economy grew at around _______% per annum from 2005 to 2015.", "answer": "10.9", "explain": "The economy grew to impressive levels of around 10.9% per annum from 2005 to 2015."}, {"type": "fib", "q": "Ethiopia's road network grew from 18,000 km in 1991 to over _______ km in recent years.", "answer": "120,000", "explain": "The road network grew from 18,000 km in 1991 to over 120,000 km nowadays."}, {"type": "fib", "q": "About _______ million Ethiopians, around a quarter of the population, still live below the poverty line.", "answer": "25", "explain": "About 25 million people, around a quarter of the population, still live below the poverty line."}, {"type": "fib", "q": "In the 2005 election, the opposition and EPRDF each declared victory before all _______ had been counted.", "answer": "votes", "explain": "The ruling EPRDF and major opposition alliances declared themselves winners before all the votes had even been counted."}, {"type": "fib", "q": "Violent protests after the 2005 election claimed the lives of more than _______ protesters.", "answer": "200", "explain": "The controversy surrounding the 2005 election sparked violent protests that claimed more than 200 lives."}, {"type": "fib", "q": "The opposition coalition known as CUD refused to take up their seats in the _______ following the 2005 election.", "answer": "parliament", "explain": "Members of the CUD coalition refused to take up their seats in parliament."}]}, {"num": 9, "title": "Indigenous Knowledge and Heritages of Ethiopia", "questions": [{"type": "mc", "q": "Indigenous knowledge is often referred to as 'local knowledge' passed down through oral tradition.", "opts": ["True", "False"], "correct": 0, "explain": "Indigenous knowledge is often known as 'local knowledge', passed down through generation via oral tradition."}, {"type": "mc", "q": "Indigenous knowledge systems have been proven to be socially undesirable and economically unviable.", "opts": ["True", "False"], "correct": 1, "explain": "Indigenous knowledge systems have been proven to be socially desired, economically viable, and sustainable."}, {"type": "mc", "q": "Indigenous knowledge is typically expressed in universal, globally standardized languages.", "opts": ["True", "False"], "correct": 1, "explain": "Indigenous knowledge is expressed in local languages, not universal ones."}, {"type": "mc", "q": "Mada'a is the indigenous mechanism of conflict resolution among the Afar people.", "opts": ["True", "False"], "correct": 0, "explain": "The indigenous mechanism of conflict resolution among the Afar is known as Mada'a."}, {"type": "mc", "q": "Dagu is an indigenous information exchange system used by the Afar people.", "opts": ["True", "False"], "correct": 0, "explain": "Dagu is an indigenous, unique information exchange system used by the pastoral Afar."}, {"type": "mc", "q": "The Gadaa system organizes the Oromo people into five classes that succeed each other every eight years.", "opts": ["True", "False"], "correct": 0, "explain": "In the Gadaa system, people are organized into five Gadaa classes that succeed each other every eight years."}, {"type": "mc", "q": "Jaarsummaa is the Oromo process of reconciliation carried out by a group of elders (Jaarsaas).", "opts": ["True", "False"], "correct": 0, "explain": "Jaarsummaa is the process of reconciliation between conflicting individuals or groups by a group of Jaarsaas (elders)."}, {"type": "mc", "q": "Gumaa refers to blood money paid to a slain person's family or compensation to seriously injured individuals among the Oromo.", "opts": ["True", "False"], "correct": 0, "explain": "Gumaa refers to the blood money paid to the slain's family or payment to seriously injured individuals."}, {"type": "mc", "q": "Siinqee is a stick symbolizing socially sanctioned rights exercised by Oromo women.", "opts": ["True", "False"], "correct": 0, "explain": "Siinqee (Siiqee) is a stick symbolizing a socially sanctioned set of rights exercised by women."}, {"type": "mc", "q": "Shimgelina is the main indigenous conflict resolution mechanism among the Amhara people.", "opts": ["True", "False"], "correct": 0, "explain": "Among the Amhara people, the main indigenous conflict resolution mechanism is Shimgelina."}, {"type": "mc", "q": "In Shimgelina, five Shimageles (elders) are appointed by the disputing parties themselves.", "opts": ["True", "False"], "correct": 0, "explain": "In Shimgelina, five Shimageles (elders) would be appointed by the disputing parties themselves."}, {"type": "mc", "q": "The Sidama Luwa system has five rotating age grades, each lasting eight years.", "opts": ["True", "False"], "correct": 0, "explain": "The Luwa system has five rotating age grades: Darara, Fullassa, Hirobora, Wawassa, and Mogissa, each rotating every 8 years."}, {"type": "mc", "q": "The Sidama moral code of 'halale' refers to the ultimate truth, distinguishing good from evil.", "opts": ["True", "False"], "correct": 0, "explain": "The Sidama moral code halale provides the basis for distinguishing 'good' and 'evil'."}, {"type": "mc", "q": "In Kambata and Hadiya culture, Seera refers to the code of behaviour followed and internalized by the people.", "opts": ["True", "False"], "correct": 0, "explain": "Seera refers to the code of behaviour that is followed and internalized by the people in Kambata and Hadiya culture."}, {"type": "mc", "q": "Tangible heritage refers only to intangible practices like songs and rituals.", "opts": ["True", "False"], "correct": 1, "explain": "Tangible Heritage refers to physical artifacts, buildings, historic places, and monuments — not intangible practices."}, {"type": "mc", "q": "The Rock-hewn Churches of Lalibela were registered by UNESCO as a World Heritage Site in 1978.", "opts": ["True", "False"], "correct": 0, "explain": "The Rock-hewn Churches of Lalibela were registered by UNESCO as a World Heritage Site in 1978."}, {"type": "mc", "q": "Axum and its archaeological sites were included in the List of World Heritage Sites in 1980.", "opts": ["True", "False"], "correct": 0, "explain": "Axum and its archaeological sites were included in the List of World Heritage Sites in 1980."}, {"type": "mc", "q": "The Simien Mountains National Park is home to the Gelada baboon, the Simien fox, and the Walia ibex.", "opts": ["True", "False"], "correct": 0, "explain": "The Park is home to rare animals such as the Gelada baboon, the Simien fox, and the Walia ibex."}, {"type": "mc", "q": "Harar Jugol was registered by UNESCO as a World Heritage Site in 2006.", "opts": ["True", "False"], "correct": 0, "explain": "The Historic City of Harar (Jugol) was registered by UNESCO as a World Heritage Site in 2006."}, {"type": "mc", "q": "The Konso Cultural Landscape was inscribed on the World Heritage list in 2011.", "opts": ["True", "False"], "correct": 0, "explain": "The Konso Cultural Landscape was inscribed on the world heritage list in 2011."}, {"type": "mc", "q": "The Gadaa system was inscribed on the UNESCO representative list of intangible cultural heritage in 2016.", "opts": ["True", "False"], "correct": 0, "explain": "Gadaa was inscribed on the representative list of the intangible cultural heritage of humanity in 2016."}, {"type": "mc", "q": "Fichee-Chambalaalla is a New Year celebration of the Sidama people, inscribed by UNESCO in 2015.", "opts": ["True", "False"], "correct": 0, "explain": "Fichee-Chambalaalla was inscribed on the representative list of intangible cultural heritage of humanity in 2015."}, {"type": "mc", "q": "Timket (Ethiopian Epiphany) was inscribed on the UNESCO intangible cultural heritage list in 2019.", "opts": ["True", "False"], "correct": 0, "explain": "Timket became Ethiopia's fourth entry in the UNESCO intangible cultural heritage list in 2019."}, {"type": "mc", "q": "Ashenda/Ashendiye is a festival primarily celebrated by boys and young men.", "opts": ["True", "False"], "correct": 1, "explain": "Ashenda, Ashendiye, Shaday or Solel is a festival solely for girls and young women in Tigray and Amhara."}, {"type": "mc", "q": "Irreecha is the annual Oromo thanksgiving celebrated at the beginning of the spring season (Birra).", "opts": ["True", "False"], "correct": 0, "explain": "Irreecha is the annual thanksgiving day of Oromo celebrated at the beginning of Birra (spring)."}, {"type": "mc", "q": "Ethiopian manuscripts have traditionally been written in the Ge'ez language.", "opts": ["True", "False"], "correct": 0, "explain": "Ethiopia has a written tradition in the Ge'ez language, with manuscripts flourishing after Christianity's introduction."}, {"type": "mc", "q": "The Temple of Yeha is dated to around 700 BC, built in the Sabaean style.", "opts": ["True", "False"], "correct": 0, "explain": "The Temple of Yeha is a tower built in the Sabaean style, dated to around 700 BC."}, {"type": "mc", "q": "The Sof Omar cave system was formed by the Weyb River carving a channel through limestone.", "opts": ["True", "False"], "correct": 0, "explain": "The Sof Omar cave system was formed by the Weyb River as it carved a new channel through limestone foothills."}, {"type": "mc", "q": "The Halala Keela (Halala Kab) wall of Dawuro was constructed during the reign of King Halala.", "opts": ["True", "False"], "correct": 0, "explain": "The construction of the Dawuro dry-stone walls was probably completed during the reign of King Halala."}, {"type": "mc", "q": "Ethiopia has a written manuscript tradition dating back to the introduction of Christianity in the 4th century.", "opts": ["True", "False"], "correct": 0, "explain": "After the introduction of Christianity in the 4th century, Ethiopian manuscripts flourished."}, {"type": "mc", "q": "What is indigenous knowledge often referred to as?", "opts": ["Global knowledge", "Local knowledge", "Formal education", "Scientific method"], "correct": 1, "explain": "Indigenous knowledge is often known as 'local knowledge', passed down orally from generation to generation."}, {"type": "mc", "q": "How is indigenous knowledge typically transmitted, according to the unit?", "opts": ["Through formal written textbooks only", "Orally from generation to generation", "Only through government institutions", "Exclusively through the internet"], "correct": 1, "explain": "Indigenous knowledge has been passed from generation to generation through oral tradition and practice."}, {"type": "mc", "q": "Which of the following is NOT listed as a characteristic of indigenous knowledge?", "opts": ["It is simple and practical", "It is expressed in local languages", "It developed over a long period", "It is standardized in a universal written language"], "correct": 3, "explain": "Indigenous knowledge is expressed in local languages and is often oral, not standardized in a universal written form."}, {"type": "mc", "q": "What is the indigenous conflict resolution mechanism of the Afar people called?", "opts": ["Gumaa", "Mada'a", "Shimgelina", "Seera"], "correct": 1, "explain": "The indigenous mechanism of conflict resolution among the Afar is known as Mada'a."}, {"type": "mc", "q": "What is the name of the Afar people's indigenous information exchange system?", "opts": ["Dagu", "Siinqee", "Gadaa", "Luwa"], "correct": 0, "explain": "The Afar have an indigenous, unique information exchange system called Dagu."}, {"type": "mc", "q": "The Gadaa system organizes the Oromo people into how many classes that succeed each other every eight years?", "opts": ["Three", "Four", "Five", "Six"], "correct": 2, "explain": "In the Gadaa system, the people are grouped into five Gadaa classes that succeed each other every eight years."}, {"type": "mc", "q": "The foundation of the Gadaa system is rooted in which customary Oromo institutions?", "opts": ["Aadaa, seera, safuu, and heera", "Mada'a and Dagu", "Shimgelina and Jaarsummaa", "Luwa and Seera"], "correct": 0, "explain": "The Gadaa system is rooted in aadaa (custom), seera (laws), safuu (moral category/ethics), and heera (justice)."}, {"type": "mc", "q": "What Oromo term refers to the process of reconciliation carried out by a group of elders (Jaarsaas)?", "opts": ["Jaarsummaa", "Gumaa", "Siinqee", "Shimgelina"], "correct": 0, "explain": "Jaarsummaa is the process of reconciliation between conflicting individuals or groups by Jaarsaas (elders)."}, {"type": "mc", "q": "Among the Oromo, what does 'Gumaa' refer to?", "opts": ["A women's rights institution", "Blood money/compensation paid in cases of homicide or serious injury", "A New Year festival", "An age-grade system"], "correct": 1, "explain": "Gumaa refers to the blood money paid to the slain's family or compensation to seriously injured individuals."}, {"type": "mc", "q": "What is 'heera' in the context of the Oromo Gumaa conflict resolution system?", "opts": ["A festival", "Customary law and justice procedure", "A type of stick", "A New Year celebration"], "correct": 1, "explain": "The nominated elder examines whether procedures followed are in line with heera (customary law and justice procedure)."}, {"type": "mc", "q": "What is Siinqee (Siiqee) among the Oromo people?", "opts": ["A council of male elders only", "A stick symbolizing a socially sanctioned set of rights for women", "A type of cave", "A form of currency"], "correct": 1, "explain": "Siinqee is a stick symbolizing a socially sanctioned set of rights exercised by women."}, {"type": "mc", "q": "What is the main indigenous conflict resolution mechanism among the Amhara people, comparable to Oromo Jaarsummaa?", "opts": ["Gumaa", "Shimgelina", "Dagu", "Seera"], "correct": 1, "explain": "Among the Amhara people, the main indigenous conflict resolution mechanism is Shimgelina."}, {"type": "mc", "q": "How many Shimageles (elders) are typically appointed by disputing parties in Shimgelina?", "opts": ["Three", "Four", "Five", "Seven"], "correct": 2, "explain": "In Shimgelina, five Shimageles (elders) would be appointed by the disputing parties themselves."}, {"type": "mc", "q": "Who often serves as chairman to make the Shimgelina process more acceptable to society?", "opts": ["A government official", "A priest of the local church", "A police officer", "A university professor"], "correct": 1, "explain": "In most cases, a priest of the local church serves as chairman to make Shimgelina more acceptable."}, {"type": "mc", "q": "The Sidama Luwa system is administered by an age grade system where each grade rotates every how many years?", "opts": ["Five years", "Eight years", "Ten years", "Twelve years"], "correct": 1, "explain": "The Luwa system is administered by an age grade system where each grade rotates every 8 years."}, {"type": "mc", "q": "Which of the following is NOT one of the five rotating age grades in the Sidama Luwa system?", "opts": ["Darara", "Fullassa", "Hirobora", "Gumaa"], "correct": 3, "explain": "The five Luwa age grades are Darara, Fullassa, Hirobora, Wawassa, and Mogissa — Gumaa is an Oromo term, not a Luwa grade."}, {"type": "mc", "q": "What is the primary objective of the Sidama Luwa system regarding able-bodied men?", "opts": ["Recruitment and training for national defence", "Organizing trade caravans", "Building irrigation systems", "Managing agricultural taxes"], "correct": 0, "explain": "The first and most important objective of the Luwa system is recruiting and training able-bodied men for national defence."}, {"type": "mc", "q": "The Sidama moral code that provides the basis for distinguishing good from evil is called:", "opts": ["Heera", "Halale", "Safuu", "Seera"], "correct": 1, "explain": "The Sidama moral code halale provides the basis for distinguishing 'good' and 'evil'."}, {"type": "mc", "q": "In Kambata and Hadiya culture, what governs political administration, social involvement, and dispute resolution?", "opts": ["Gadaa", "Seera", "Luwa", "Mada'a"], "correct": 1, "explain": "In Kambata and Hadiya culture, Seera is the basis for political administration and dispute resolution."}, {"type": "mc", "q": "What are the three main types of heritage identified in the unit?", "opts": ["Natural, tangible, and intangible", "Cultural, political, and economic", "Ancient, medieval, and modern", "Religious, secular, and royal"], "correct": 0, "explain": "There are different types of heritage: natural, tangible, and intangible heritages."}, {"type": "mc", "q": "Which of the following is an example of intangible heritage?", "opts": ["The Stelae of Aksum", "Fasil Ghebbi", "Fichee-Chambalaalla", "Harar Jugol"], "correct": 2, "explain": "Fichee-Chambalaalla, a Sidama New Year celebration, is an intangible cultural heritage — the others are tangible sites."}, {"type": "mc", "q": "The Stelae of Aksum were included in the UNESCO List of World Heritage Sites in which year?", "opts": ["1978", "1980", "2006", "2011"], "correct": 1, "explain": "Axum and its archaeological sites were included in the List of World Heritage Sites in 1980."}, {"type": "mc", "q": "The Rock-hewn Churches of Lalibela were registered by UNESCO as a World Heritage Site in which year?", "opts": ["1978", "1980", "1996", "2013"], "correct": 0, "explain": "The Rock-hewn Churches of Lalibela were registered by UNESCO as a World Heritage Site in 1978."}, {"type": "mc", "q": "Fasil Ghebbi, the premise of King Fasiledes, is located in which town?", "opts": ["Axum", "Lalibela", "Gondar", "Harar"], "correct": 2, "explain": "Fasil Ghebbi is found in Gondar town, the Royal enclosure of King Fasiledes."}, {"type": "mc", "q": "The Simien Mountains National Park is home to which rare animals?", "opts": ["The Gelada baboon, Simien fox, and Walia ibex", "Lions, elephants, and zebras", "Gorillas and chimpanzees", "Giraffes and rhinos"], "correct": 0, "explain": "The Park is home to rare animals such as the Gelada baboon, the Simien fox, and the Walia ibex."}, {"type": "mc", "q": "The Lower Valley of Awash, a UNESCO World Heritage Site, is significant for what kind of research?", "opts": ["Marine biology", "Paleo-anthropological research", "Volcanic geology", "Medieval architecture"], "correct": 1, "explain": "The Lower Valley of Awash is a site of Paleo-anthropological research."}, {"type": "mc", "q": "The Tiya archaeological site, listed as a World Heritage Site in 1980, contains how many monuments?", "opts": ["16", "24", "36", "50"], "correct": 2, "explain": "The Tiya site contains 36 monuments, including 32 carved stelae covered with symbols."}, {"type": "mc", "q": "The historic walled city of Harar (Jugol) was built during the time of which ruler?", "opts": ["King Fasiledes", "Emir Nur Ibn Mujahid", "King Halala", "Emperor Menilek"], "correct": 1, "explain": "The wall (Jugol) of Harar was built during the time of Emir Nur Ibn Mujahid in the 16th century."}, {"type": "mc", "q": "The Konso Cultural Landscape, inscribed on the World Heritage list in 2011, is characterized by:", "opts": ["Rock-hewn churches", "Stone-walled terraces and fortified settlements", "Underground caves", "Royal palaces"], "correct": 1, "explain": "Konso Cultural Landscape is an arid property of stone-walled terraces and fortified settlements."}, {"type": "mc", "q": "Meskel (the Finding of the True Cross) was inscribed on the UNESCO intangible cultural heritage list in which year?", "opts": ["2011", "2013", "2015", "2019"], "correct": 1, "explain": "Meskel was inscribed on the UNESCO Representative List of the Intangible Cultural Heritage of Humanity in 2013."}, {"type": "mc", "q": "Gadaa, the indigenous democratic socio-political system of the Oromo, was inscribed on UNESCO's intangible heritage list in which year?", "opts": ["2013", "2015", "2016", "2019"], "correct": 2, "explain": "Gadaa was inscribed on the representative list of the intangible cultural heritage of humanity in 2016."}, {"type": "mc", "q": "Timket (Ethiopian Epiphany) became Ethiopia's how many-th entry on the UNESCO intangible cultural heritage list, inscribed in 2019?", "opts": ["Second", "Third", "Fourth", "Fifth"], "correct": 2, "explain": "Timket became the fourth entry for Ethiopia in the list of UNESCO intangible cultural heritage in 2019."}, {"type": "mc", "q": "Which festival is described as being solely for girls and young women in Tigray and Amhara regions?", "opts": ["Irreecha", "Timket", "Ashenda (Ashendiye)", "Meskel"], "correct": 2, "explain": "Ashenda, Ashendiye, Shaday or Solel is the biggest cultural festival solely for girls and young women."}, {"type": "mc", "q": "Irreecha, the Oromo thanksgiving festival, is celebrated annually near which kind of location?", "opts": ["Mountain peaks only", "River banks or water and trees", "Deep forests only", "Desert plains only"], "correct": 1, "explain": "Irreecha is celebrated near the river bank or water and tree, at the beginning of Birra (spring)."}, {"type": "mc", "q": "Ethiopian manuscripts have traditionally been written in which language?", "opts": ["Amharic", "Ge'ez", "Tigrigna", "Oromiffa"], "correct": 1, "explain": "Ethiopia has a written tradition in the Ge'ez language, and manuscripts flourished after Christianity's introduction."}, {"type": "mc", "q": "What were the traditional writing materials for Ethiopian manuscripts?", "opts": ["Papyrus and charcoal", "Parchment from goatskin and ink from plants/minerals", "Clay tablets and stone chisels", "Bamboo paper and synthetic ink"], "correct": 1, "explain": "Writing materials included parchment from goatskin, ink from plants and minerals, and pens from reed or bamboo."}, {"type": "mc", "q": "The Temple of Yeha, dated to around 700 BC, was built in which architectural style?", "opts": ["Gothic style", "Sabaean style", "Byzantine style", "Axumite obelisk style"], "correct": 1, "explain": "The Temple of Yeha is a tower built in the Sabaean style, dated to around 700 BC."}, {"type": "mc", "q": "The Sof Omar cave system was formed by which river changing its course?", "opts": ["The Awash River", "The Weyb River", "The Omo River", "The Abay River"], "correct": 1, "explain": "The Sof Omar cave system was formed by the Weyb River as it carved a new channel through limestone."}, {"type": "mc", "q": "The Halala Keela (Halala Kab) wall of Dawuro was bordered by which two rivers?", "opts": ["The Omo and Gojeb Rivers", "The Awash and Wabe Rivers", "The Blue Nile and Tekeze Rivers", "The Baro and Akobo Rivers"], "correct": 0, "explain": "The Dawuro wall was constructed on strategic defense positions, bordered by the Omo and Gojeb Rivers."}, {"type": "mc", "q": "What did Ethiopia have special schools for, in Gondar and Shewa, related to manuscript production?", "opts": ["Calligraphy and bookbinding", "Metalworking", "Pottery", "Weaving"], "correct": 0, "explain": "There were special schools for calligraphy in Gondar and Shewa, and a school for bookbinding."}, {"type": "fib", "q": "Indigenous knowledge is often known as '_______ knowledge'.", "answer": "local", "explain": "Indigenous knowledge is often known as 'local knowledge'."}, {"type": "fib", "q": "The Afar people's indigenous conflict resolution mechanism is called _______.", "answer": "Mada'a", "explain": "The indigenous mechanism of conflict resolution among the Afar is known as Mada'a."}, {"type": "fib", "q": "The Afar people's indigenous information exchange system is called _______.", "answer": "Dagu", "explain": "The Afar have an indigenous, unique information exchange system called Dagu."}, {"type": "fib", "q": "In the Gadaa system, the Oromo people are organized into five classes that succeed each other every _______ years.", "answer": "eight", "explain": "The five Gadaa classes succeed each other every eight years."}, {"type": "fib", "q": "The Oromo process of reconciliation carried out by a group of elders is called _______.", "answer": "Jaarsummaa", "explain": "Jaarsummaa is the process of reconciliation between conflicting individuals or groups by Jaarsaas."}, {"type": "fib", "q": "Among the Oromo, _______ refers to the blood money paid to a slain person's family.", "answer": "Gumaa", "explain": "Gumaa refers to the blood money paid to the slain's family or compensation to injured individuals."}, {"type": "fib", "q": "The Oromo term for customary law and justice procedure is _______.", "answer": "heera", "explain": "Heera refers to customary law and justice procedure among the Oromo."}, {"type": "fib", "q": "_______ is a stick symbolizing a socially sanctioned set of rights exercised by Oromo women.", "answer": "Siinqee", "explain": "Siinqee (Siiqee) is a stick symbolizing a socially sanctioned set of rights exercised by women."}, {"type": "fib", "q": "The main indigenous conflict resolution mechanism among the Amhara people is called _______.", "answer": "Shimgelina", "explain": "Among the Amhara people, the main indigenous conflict resolution mechanism is Shimgelina."}, {"type": "fib", "q": "In Shimgelina, _______ elders (Shimageles) are appointed by the disputing parties.", "answer": "five", "explain": "In Shimgelina, five Shimageles (elders) would be appointed by the disputing parties."}, {"type": "fib", "q": "The Sidama age-grade institution, with grades rotating every 8 years, is called the _______ system.", "answer": "Luwa", "explain": "The Sidama Luwa system is an age-related institution with grades rotating every 8 years."}, {"type": "fib", "q": "The Sidama moral code providing the basis for distinguishing good and evil is called _______.", "answer": "halale", "explain": "The Sidama moral code halale provides the basis for distinguishing good and evil."}, {"type": "fib", "q": "In Kambata and Hadiya culture, the code of behaviour governing social life is called _______.", "answer": "Seera", "explain": "Seera refers to the code of behaviour that is followed and internalized in Kambata and Hadiya culture."}, {"type": "fib", "q": "_______ Heritage refers to physical artifacts, buildings, and monuments passed from generation to generation.", "answer": "Tangible", "explain": "Tangible Heritage refers to physical artifacts, buildings and historic places transmitted from generation to generation."}, {"type": "fib", "q": "The Stelae of Aksum were included in the UNESCO List of World Heritage Sites in _______.", "answer": "1980", "explain": "Axum and its archaeological sites were included in the List of World Heritage Sites in 1980."}, {"type": "fib", "q": "The Rock-hewn Churches of _______ were registered by UNESCO as a World Heritage Site in 1978.", "answer": "Lalibela", "explain": "The Rock-hewn Churches of Lalibela were registered by UNESCO as a World Heritage Site in 1978."}, {"type": "fib", "q": "Fasil Ghebbi, the premise of King Fasiledes, is found in the town of _______.", "answer": "Gondar", "explain": "Fasil Ghebbi is found in Gondar town."}, {"type": "fib", "q": "The Simien Mountains National Park is home to the Gelada baboon, the Simien fox, and the _______ ibex.", "answer": "Walia", "explain": "The Park is home to the Gelada baboon, Simien fox, and Walia ibex."}, {"type": "fib", "q": "The Lower Valley of _______ is significant for Paleo-anthropological research, located in Afar Regional State.", "answer": "Awash", "explain": "The Lower Valley of Awash is a site of Paleo-anthropological research located in Afar Regional State."}, {"type": "fib", "q": "The _______ archaeological site, listed in 1980, contains 36 monuments including 32 carved stelae.", "answer": "Tiya", "explain": "The Tiya site contains 36 monuments, including 32 carved stelae covered with symbols."}, {"type": "fib", "q": "The historic walled city of _______ (Jugol) was registered by UNESCO as a World Heritage Site in 2006.", "answer": "Harar", "explain": "The Historic City of Harar (Jugol) was registered by UNESCO as a World Heritage Site in 2006."}, {"type": "fib", "q": "The Konso Cultural Landscape was inscribed on the World Heritage list in _______.", "answer": "2011", "explain": "The Konso Cultural Landscape was inscribed on the world heritage list in 2011."}, {"type": "fib", "q": "_______, the commemoration of the finding of the True Cross, was inscribed as intangible heritage in 2013.", "answer": "Meskel", "explain": "Meskel was inscribed on the UNESCO Representative List of the Intangible Cultural Heritage of Humanity in 2013."}, {"type": "fib", "q": "The _______ system, the Oromo indigenous democratic socio-political system, was inscribed by UNESCO in 2016.", "answer": "Gadaa", "explain": "Gadaa was inscribed on the representative list of the intangible cultural heritage of humanity in 2016."}, {"type": "fib", "q": "Fichee-Chambalaalla, the Sidama New Year celebration, was inscribed as intangible heritage in _______.", "answer": "2015", "explain": "Fichee-Chambalaalla was inscribed on the representative list of intangible cultural heritage of humanity in 2015."}, {"type": "fib", "q": "_______, the festival marking the baptism of Jesus, became Ethiopia's fourth UNESCO intangible heritage entry in 2019.", "answer": "Timket", "explain": "Timket (Ethiopian Epiphany) became Ethiopia's fourth entry on the UNESCO intangible cultural heritage list in 2019."}, {"type": "fib", "q": "Ethiopian manuscripts have traditionally been written in the _______ language.", "answer": "Ge'ez", "explain": "Ethiopia has a written tradition in the Ge'ez language."}, {"type": "fib", "q": "The Temple of _______, dated to around 700 BC, is built in the Sabaean architectural style.", "answer": "Yeha", "explain": "The Temple of Yeha is a tower built in the Sabaean style, dated to around 700 BC."}, {"type": "fib", "q": "The Sof Omar cave system was formed by the _______ River carving a channel through limestone.", "answer": "Weyb", "explain": "The Sof Omar cave system was formed by the Weyb River."}, {"type": "fib", "q": "There were special schools for _______ in Gondar and Shewa for manuscript production.", "answer": "calligraphy", "explain": "There were special schools for calligraphy in Gondar and Shewa."}]}]</script>
<script>
(function(){
  "use strict";
  var UNITS = JSON.parse(document.getElementById('quiz-data').textContent);

  // state per unit, kept in memory for the session
  var unitState = {}; // unitNum -> {index, answers:[{selected, isCorrect, textAnswer}], done}

  function getState(unitNum){
    if(!unitState[unitNum]){
      var unit = UNITS[unitNum-1];
      unitState[unitNum] = {
        index: 0,
        answers: new Array(unit.questions.length).fill(null),
        finished: false
      };
    }
    return unitState[unitNum];
  }

  function unitScore(unitNum){
    var st = unitState[unitNum];
    if(!st) return {answered:0, correct:0, total: UNITS[unitNum-1].questions.length};
    var correct = 0, answered = 0;
    st.answers.forEach(function(a){ if(a){ answered++; if(a.isCorrect) correct++; } });
    return {answered: answered, correct: correct, total: UNITS[unitNum-1].questions.length};
  }

  var appEl = document.getElementById('app');
  var currentUnitNum = null;

  function normalize(str){
    return String(str)
      .toLowerCase()
      .trim()
      .replace(/[.,!?;:'"()\-_]/g, '')
      .replace(/\s+/g, ' ');
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function letterFor(idx){
    return String.fromCharCode(65 + idx);
  }

  // ---------------- Landing screen ----------------
  function renderLanding(){
    currentUnitNum = null;
    var html = '';
    html += '<div class="app-header"><div class="header-block">' +
      '<h1>Grade 10 History — Full Subject Practice Quiz</h1>' +
      '<div class="subtitle">' + UNITS.length + ' units · ' +
      UNITS.reduce(function(s,u){return s+u.questions.length;},0) + ' questions · pick a unit to begin</div>' +
      '</div></div>';
    html += '<div class="unit-grid">';
    UNITS.forEach(function(u){
      var sc = unitScore(u.num);
      var pct = sc.total ? Math.round((sc.answered/sc.total)*100) : 0;
      var label = sc.answered > 0
        ? (sc.answered === sc.total ? ('Completed · ' + sc.correct + '/' + sc.total) : (sc.answered + '/' + sc.total))
        : (sc.total + ' questions');
      html += '<button class="unit-card" data-unit="' + u.num + '">' +
        '<div class="unit-num">' + u.num + '</div>' +
        '<div class="unit-info">' +
          '<div class="unit-title">' + escapeHtml(u.title) + '</div>' +
          '<div class="unit-progress-row">' +
            '<div class="unit-progress-track"><div class="unit-progress-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="unit-progress-label">' + label + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="unit-chevron">&#8250;</div>' +
      '</button>';
    });
    html += '</div>';
    appEl.innerHTML = html;

    var cards = appEl.querySelectorAll('.unit-card');
    cards.forEach(function(card){
      card.addEventListener('click', function(){
        var n = parseInt(card.getAttribute('data-unit'), 10);
        startUnit(n);
      });
    });
  }

  function startUnit(unitNum){
    currentUnitNum = unitNum;
    getState(unitNum); // ensures initialized
    renderQuiz();
  }

  // ---------------- Quiz screen ----------------
  function renderQuiz(){
    var unit = UNITS[currentUnitNum - 1];
    var st = getState(currentUnitNum);

    if(st.finished){
      renderSummary();
      return;
    }

    var qIndex = st.index;
    var total = unit.questions.length;
    var q = unit.questions[qIndex];
    var existingAnswer = st.answers[qIndex];
    var pct = Math.round(((qIndex+1)/total)*100);

    var html = '';
    html += '<button class="back-link" id="backBtn">&#8249; Back to units</button>';
    html += '<div class="progress-wrap">' +
      '<div class="progress-meta"><span>Question ' + (qIndex+1) + ' of ' + total + '</span><span>' + pct + '% complete</span></div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '</div>';

    html += '<div class="q-card">';
    var typeLabel = q.type === 'fib' ? 'FILL IN THE BLANK' : (q.opts.length === 2 ? 'TRUE / FALSE' : 'MULTIPLE CHOICE');
    html += '<div class="q-type-tag">' + typeLabel + '</div>';
    html += '<p class="q-text">' + escapeHtml(q.q) + '</p>';

    if(q.type === 'mc'){
      html += '<div class="options" id="optionsWrap">';
      q.opts.forEach(function(opt, i){
        var cls = 'option';
        var locked = !!existingAnswer;
        if(locked){
          cls += ' locked';
          if(i === q.correct) cls += ' correct-answer';
          else if(existingAnswer.selected === i) cls += ' wrong-answer';
        }
        html += '<button class="' + cls + '" data-idx="' + i + '" ' + (locked ? 'disabled' : '') + '>' +
          '<span class="option-badge">' + letterFor(i) + '</span>' +
          '<span>' + escapeHtml(opt) + '</span>' +
        '</button>';
      });
      html += '</div>';
    } else {
      // fib
      var locked = !!existingAnswer;
      html += '<div class="fib-row">' +
        '<input type="text" class="fib-input" id="fibInput" autocomplete="off" ' +
        (locked ? 'disabled value="' + escapeHtml(existingAnswer.textAnswer) + '"' : 'placeholder="Type your answer"') + '>' +
        '<button class="fib-submit" id="fibSubmit" ' + (locked ? 'disabled' : '') + '>Check</button>' +
      '</div>';
    }

    if(existingAnswer){
      html += renderFeedback(q, existingAnswer);
    }

    html += '</div>'; // q-card

    html += '<div class="nav-row">' +
      '<button class="btn-prev" id="prevBtn" ' + (qIndex === 0 ? 'disabled' : '') + '>&#8249; Previous</button>' +
      '<button class="btn-next" id="nextBtn" ' + (existingAnswer ? '' : 'disabled') + '>' + (qIndex === total-1 ? 'Finish unit' : 'Next') + '</button>' +
      '</div>';

    appEl.innerHTML = html;
    wireQuizEvents(q, qIndex);
  }

  function renderFeedback(q, answer){
    var cls = answer.isCorrect ? 'correct' : 'incorrect';
    var icon = answer.isCorrect ? '&#10003;' : '&#10007;';
    var headline = answer.isCorrect ? 'Correct!' : 'Not quite.';
    var extra = '';
    if(q.type === 'fib' && !answer.isCorrect){
      extra = '<div style="margin-top:4px;">Correct answer: <strong>' + escapeHtml(q.answer) + '</strong></div>';
    }
    return '<div class="feedback-banner ' + cls + '">' +
      '<span class="feedback-icon">' + icon + '</span>' +
      '<span class="feedback-text">' + headline + extra +
        '<div class="explain-text">' + escapeHtml(q.explain) + '</div>' +
      '</span>' +
    '</div>';
  }

  function wireQuizEvents(q, qIndex){
    var backBtn = document.getElementById('backBtn');
    if(backBtn) backBtn.addEventListener('click', renderLanding);

    var prevBtn = document.getElementById('prevBtn');
    if(prevBtn) prevBtn.addEventListener('click', function(){
      var st = getState(currentUnitNum);
      if(st.index > 0){ st.index--; renderQuiz(); }
    });

    var nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.addEventListener('click', function(){
      var st = getState(currentUnitNum);
      var unit = UNITS[currentUnitNum - 1];
      if(st.index < unit.questions.length - 1){
        st.index++;
        renderQuiz();
      } else {
        st.finished = true;
        renderSummary();
      }
    });

    if(q.type === 'mc'){
      var opts = document.querySelectorAll('#optionsWrap .option');
      opts.forEach(function(btn){
        btn.addEventListener('click', function(){
          var idx = parseInt(btn.getAttribute('data-idx'), 10);
          submitMcAnswer(qIndex, idx);
        });
      });
    } else {
      var input = document.getElementById('fibInput');
      var submitBtn = document.getElementById('fibSubmit');
      if(submitBtn){
        submitBtn.addEventListener('click', function(){ submitFibAnswer(qIndex, input.value); });
      }
      if(input){
        input.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){ submitFibAnswer(qIndex, input.value); }
        });
        input.focus();
      }
    }
  }

  function submitMcAnswer(qIndex, selectedIdx){
    var st = getState(currentUnitNum);
    if(st.answers[qIndex]) return; // already locked
    var q = UNITS[currentUnitNum-1].questions[qIndex];
    var isCorrect = (selectedIdx === q.correct);
    st.answers[qIndex] = { selected: selectedIdx, isCorrect: isCorrect };
    renderQuiz();
  }

  function submitFibAnswer(qIndex, rawValue){
    var st = getState(currentUnitNum);
    if(st.answers[qIndex]) return;
    if(!rawValue || !rawValue.trim()) return;
    var q = UNITS[currentUnitNum-1].questions[qIndex];
    var isCorrect = normalize(rawValue) === normalize(q.answer);
    st.answers[qIndex] = { textAnswer: rawValue, isCorrect: isCorrect };
    renderQuiz();
  }

  // ---------------- Summary screen ----------------
  function renderSummary(){
    var unit = UNITS[currentUnitNum - 1];
    var st = getState(currentUnitNum);
    var sc = unitScore(currentUnitNum);
    var pct = sc.total ? Math.round((sc.correct/sc.total)*100) : 0;

    var r = 54, circ = 2 * Math.PI * r;
    var offset = circ * (1 - pct/100);
    var orbColor = pct >= 70 ? 'var(--teal)' : (pct >= 40 ? '#d99a2b' : 'var(--red)');

    var html = '';
    html += '<button class="back-link" id="backBtn2">&#8249; Back to units</button>';
    html += '<div class="summary-card">';
    html += '<h2 class="summary-title">Unit ' + unit.num + ' complete</h2>';
    html += '<div class="score-orb-wrap"><svg width="140" height="140" viewBox="0 0 140 140">' +
      '<circle cx="70" cy="70" r="' + r + '" fill="none" stroke="var(--border)" stroke-width="12"/>' +
      '<circle cx="70" cy="70" r="' + r + '" fill="none" stroke="' + orbColor + '" stroke-width="12" ' +
        'stroke-dasharray="' + circ + '" stroke-dashoffset="' + offset + '" stroke-linecap="round" ' +
        'transform="rotate(-90 70 70)"/>' +
      '<text x="70" y="66" text-anchor="middle" class="score-count">' + sc.correct + '/' + sc.total + '</text>' +
      '<text x="70" y="86" text-anchor="middle" class="score-pct">' + pct + '% correct</text>' +
      '</svg></div>';
    html += '<div class="score-orb-label">' + escapeHtml(unit.title) + '</div>';
    html += '<div class="summary-actions">' +
      '<button class="btn-secondary" id="restartBtn">Restart this unit</button>' +
      '<button class="btn-primary" id="backToUnitsBtn">Back to units</button>' +
      '</div>';

    // missed question review
    var missed = [];
    st.answers.forEach(function(a, i){
      if(a && !a.isCorrect){ missed.push({q: unit.questions[i], a: a, i: i}); }
    });
    html += '<div class="review-section">';
    html += '<div class="review-heading">Missed questions (' + missed.length + ')</div>';
    if(missed.length === 0){
      html += '<div class="no-missed">No missed questions — nice work!</div>';
    } else {
      missed.forEach(function(m){
        var q = m.q, a = m.a;
        var yourAnswerText, correctAnswerText;
        if(q.type === 'mc'){
          yourAnswerText = letterFor(a.selected) + '. ' + q.opts[a.selected];
          correctAnswerText = letterFor(q.correct) + '. ' + q.opts[q.correct];
        } else {
          yourAnswerText = a.textAnswer;
          correctAnswerText = q.answer;
        }
        html += '<div class="review-item">' +
          '<div class="review-q">' + escapeHtml(q.q) + '</div>' +
          '<div class="review-your">Your answer: ' + escapeHtml(yourAnswerText) + '</div>' +
          '<div class="review-correct">Correct answer: ' + escapeHtml(correctAnswerText) + '</div>' +
          '<div class="review-explain">' + escapeHtml(q.explain) + '</div>' +
        '</div>';
      });
    }
    html += '</div>'; // review-section

    html += '</div>'; // summary-card

    appEl.innerHTML = html;

    document.getElementById('backBtn2').addEventListener('click', renderLanding);
    document.getElementById('backToUnitsBtn').addEventListener('click', renderLanding);
    document.getElementById('restartBtn').addEventListener('click', function(){
      unitState[currentUnitNum] = {
        index: 0,
        answers: new Array(unit.questions.length).fill(null),
        finished: false
      };
      renderQuiz();
    });
  }

  renderLanding();
})();
</script>

<!-- Telegram Games integration: the share action only runs after an explicit user tap. -->
<script src="https://telegram.org/js/games.js"></script>
<script>
(function () {
  function addShareButton() {
    if (!window.TelegramGameProxy || typeof window.TelegramGameProxy.shareScore !== 'function') return;
    var actions = document.querySelector('.summary-actions');
    if (!actions || actions.querySelector('.telegram-share-score')) return;
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn-outline telegram-share-score';
    button.textContent = 'Share score';
    button.addEventListener('click', function () {
      window.TelegramGameProxy.shareScore();
    });
    actions.appendChild(button);
  }
  addShareButton();
  new MutationObserver(addShareButton).observe(document.body, { childList: true, subtree: true });
})();
</script>
</body>
</html>
