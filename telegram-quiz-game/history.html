<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 10 History — Full Subject Practice Quiz</title>
<style>
  :root{
    --teal:#0f8a7e;
    --teal-dark:#0b6c62;
    --teal-light:#e6f5f3;
    --red:#d64545;
    --red-light:#fbe9e9;
    --ink:#1f2430;
    --ink-soft:#5b6472;
    --paper:#f7f8fa;
    --card:#ffffff;
    --border:#e3e6eb;
    --shadow: 0 1px 2px rgba(17,24,39,.04), 0 8px 24px rgba(17,24,39,.06);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height:100vh;
    line-height:1.5;
  }
  #app{
    max-width: 760px;
    margin: 0 auto;
    padding: 21px 14px 45px;
    min-height: 100vh;
  }
  .app-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 22px;
    gap:9px;
  }
  .app-header h1{
    font-size:1.1rem;
    font-weight: 700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .app-header .subtitle{
    font-size:0.72rem;
    color: var(--ink-soft);
    margin-top:4px;
  }
  .header-block{flex:1;min-width:0;}

  /* ---------- Landing screen ---------- */
  .unit-grid{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .unit-card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 15px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: border-color .15s ease, transform .1s ease;
    text-align:left;
    width:100%;
  }
  .unit-card:hover{ border-color: var(--teal); }
  .unit-card:active{ transform: scale(0.995); }
  .unit-num{
    flex:none;
    width:44px;
    height:44px;
    border-radius:50%;
    background: var(--teal-light);
    color: var(--teal-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:0.85rem;
  }
  .unit-info{ flex:1; min-width:0; }
  .unit-title{ font-weight:600; font-size:0.83rem; color:var(--ink); }
  .unit-progress-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:6px;
  }
  .unit-progress-track{
    flex:1;
    height:6px;
    border-radius:4px;
    background: var(--border);
    overflow:hidden;
  }
  .unit-progress-fill{
    height:100%;
    background: var(--teal);
    border-radius:4px;
  }
  .unit-progress-label{
    font-size:0.64rem;
    color: var(--ink-soft);
    flex:none;
  }
  .unit-chevron{
    flex:none;
    color: var(--ink-soft);
    font-size:0.94rem;
  }

  /* ---------- Quiz screen ---------- */
  .back-link{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size:0.72rem;
    cursor:pointer;
    padding:6px 0;
    margin-bottom:14px;
    display:inline-flex;
    align-items:center;
    gap:4px;
  }
  .back-link:hover{ color: var(--teal-dark); }

  .progress-wrap{
    margin-bottom: 22px;
  }
  .progress-meta{
    display:flex;
    justify-content:space-between;
    font-size:0.68rem;
    color: var(--ink-soft);
    margin-bottom:8px;
  }
  .progress-track{
    height:8px;
    border-radius:6px;
    background: var(--border);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--teal);
    border-radius:6px;
    transition: width .25s ease;
  }

  .q-card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 18px;
    box-shadow: var(--shadow);
  }
  .q-type-tag{
    display:inline-block;
    font-size:0.59rem;
    font-weight:700;
    letter-spacing: .02em;
    color: var(--teal-dark);
    background: var(--teal-light);
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .q-text{
    font-size:0.92rem;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 20px 0;
    line-height:1.45;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .option{
    display:flex;
    align-items:center;
    gap:9px;
    padding: 9px 10px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    cursor:pointer;
    text-align:left;
    font-size:0.82rem;
    color: var(--ink);
    transition: border-color .12s ease, background .12s ease;
  }
  .option:hover:not(.locked){
    border-color: var(--teal);
    background: var(--teal-light);
  }
  .option.locked{ cursor:default; }
  .option-badge{
    flex:none;
    width:28px;
    height:28px;
    border-radius:50%;
    border:1.5px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:0.7rem;
    color: var(--ink-soft);
    background: var(--paper);
  }
  .option.correct-answer{
    border-color: var(--teal);
    background: var(--teal-light);
  }
  .option.correct-answer .option-badge{
    background: var(--teal);
    border-color: var(--teal);
    color:#fff;
  }
  .option.wrong-answer{
    border-color: var(--red);
    background: var(--red-light);
  }
  .option.wrong-answer .option-badge{
    background: var(--red);
    border-color: var(--red);
    color:#fff;
  }

  .fib-row{
    display:flex;
    gap:8px;
    margin-top:4px;
  }
  .fib-input{
    flex:1;
    padding: 9px 10px;
    border-radius:10px;
    border: 1.5px solid var(--border);
    font-size:0.82rem;
    font-family:inherit;
  }
  .fib-input:focus{ outline:none; border-color: var(--teal); }
  .fib-submit{
    flex:none;
    background: var(--teal);
    color:#fff;
    border:none;
    border-radius:10px;
    padding: 0 20px;
    font-weight:600;
    font-size:0.78rem;
    cursor:pointer;
  }
  .fib-submit:disabled{ opacity:.5; cursor:default; }

  .feedback-banner{
    margin-top:16px;
    padding: 9px 10px;
    border-radius:10px;
    font-size:0.78rem;
    font-weight:600;
    display:flex;
    align-items:flex-start;
    gap:8px;
  }
  .feedback-banner.correct{
    background: var(--teal-light);
    color: var(--teal-dark);
  }
  .feedback-banner.incorrect{
    background: var(--red-light);
    color: #a12f2f;
  }
  .feedback-icon{ flex:none; font-size:0.89rem; line-height:1.3; }
  .feedback-text{ flex:1; }
  .explain-text{
    margin-top:6px;
    font-weight:400;
    color: var(--ink);
    font-size:0.77rem;
  }

  .nav-row{
    position:sticky;bottom:0;z-index:5;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px -2px 0;
    padding:8px 2px calc(8px + env(safe-area-inset-bottom));
    background:rgba(247,248,250,.96);
    border-top:1px solid var(--border);
    box-shadow:0 -5px 14px rgba(17,24,39,.06);
  }
  .btn-prev{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size:0.78rem;
    font-weight:600;
    cursor:pointer;
    padding: 8px 3px;
  }
  .btn-prev:hover{ color: var(--ink); }
  .btn-prev:disabled{ opacity:0.35; cursor:default; }
  .btn-next{
    background: var(--teal);
    color:#fff;
    border:none;
    border-radius:10px;
    padding: 9px 20px;
    font-weight:700;
    font-size:0.8rem;
    cursor:pointer;
  }
  .btn-next:hover{ background: var(--teal-dark); }
  .btn-next:disabled{ opacity:0.4; cursor:default; background:var(--ink-soft); }

  /* ---------- Summary screen ---------- */
  .summary-card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 18px;
    box-shadow: var(--shadow);
    text-align:center;
  }
  .summary-title{
    font-size:0.94rem;
    font-weight:700;
    margin:0 0 22px;
  }
  .score-orb-wrap{
    display:flex;
    justify-content:center;
    margin-bottom: 18px;
  }
  .score-orb-label{
    font-size:0.77rem;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }
  .score-count{
    font-size:1.19rem;
    font-weight:800;
    fill: var(--ink);
  }
  .score-pct{
    font-size:0.53rem;
    fill: var(--ink-soft);
    font-weight:600;
  }
  .summary-actions{
    display:flex;
    gap:9px;
    justify-content:center;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .btn-secondary{
    background: var(--paper);
    border: 1.5px solid var(--border);
    color: var(--ink);
    border-radius:10px;
    padding: 8px 15px;
    font-weight:600;
    font-size:0.78rem;
    cursor:pointer;
  }
  .btn-secondary:hover{ border-color: var(--teal); }
  .btn-primary{
    background: var(--teal);
    color:#fff;
    border:none;
    border-radius:10px;
    padding: 8px 16px;
    font-weight:700;
    font-size:0.78rem;
    cursor:pointer;
  }
  .btn-primary:hover{ background: var(--teal-dark); }

  .review-section{
    margin-top: 30px;
    text-align:left;
  }
  .review-heading{
    font-size:0.81rem;
    font-weight:700;
    margin-bottom:12px;
    color: var(--ink);
  }
  .review-item{
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom:10px;
    background: var(--paper);
  }
  .review-q{ font-weight:600; font-size:0.78rem; margin-bottom:8px; }
  .review-your{ font-size:0.72rem; color:#a12f2f; margin-bottom:4px; }
  .review-correct{ font-size:0.72rem; color: var(--teal-dark); margin-bottom:6px; }
  .review-explain{ font-size:0.71rem; color: var(--ink-soft); }
  .no-missed{ color: var(--ink-soft); font-size:0.77rem; text-align:center; padding: 10px 0; }

  @media (max-width: 480px){
    .q-card{ padding: 15px 12px; }
    .summary-card{ padding: 20px 12px; }
  }
</style>

pe": "mc", "q": "Textile mills played a key part in the rise of the city of Manchester.", "opts": ["True", "False"], "correct": 0, "explain": "The passage states textile mills played a key part in the rise of Manchester."}, {"type": "mc", "q": "A command economy is one in which the government controls production, distribution, and prices.", "opts": ["True", "False"], "correct": 0, "explain": "The text defines a command economy as one where government controls volume of production, distribution and prices."}, {"type": "mc", "q": "The Congress of Vienna in 1815 aimed to reverse the changes brought by Napoleon and restore monarchies.", "opts": ["True", "False"], "correct": 0, "explain": "Britain, Russia, Prussia and Austria drew the Treaty of Vienna in 1815 to reverse Napoleonic changes and restore monarchies."}, {"type": "mc", "q": "In 1815, Italy was politically unified under one king.", "opts": ["True", "False"], "correct": 1, "explain": "In 1815, Italy was left completely fragmented by the Congress of Vienna settlements, not unified."}, {"type": "mc", "q": "The Papal States cut off the north of the Italian peninsula from the south.", "opts": ["True", "False"], "correct": 0, "explain": "The text says the Papal States straddled the centre of the peninsula, cutting the north off from the south."}, {"type": "mc", "q": "The Kingdom of Sardinia was also called Piedmont-Sardinia.", "opts": ["True", "False"], "correct": 0, "explain": "The unit states the Kingdom of Sardinia was also called Piedmont-Sardinia."}, {"type": "mc", "q": "Giuseppe Mazzini favoured monarchy as the best form of government for a united Italy.", "opts": ["True", "False"], "correct": 1, "explain": "Mazzini viewed nation states as necessary and opposed monarchy, wanting a liberal democratic republic."}, {"type": "mc", "q": "Mazzini founded the 'Young Italy' movement in 1831.", "opts": ["True", "False"], "correct": 0, "explain": "The text states Mazzini founded Young Italy in 1831."}, {"type": "mc", "q": "Cavour became prime minister of the Kingdom of Sardinia in 1852.", "opts": ["True", "False"], "correct": 0, "explain": "The passage states Cavour became prime minister of independent Sardinia in 1852."}, {"type": "mc", "q": "Cavour promised to give Nice and Savoy to France in exchange for military help against Austria.", "opts": ["True", "False"], "correct": 0, "explain": "For France's help against Austria, Cavour promised to give the regions of Nice and Savoy to France."}, {"type": "mc", "q": "Giuseppe Garibaldi led an army known as the Red Shirts.", "opts": ["True", "False"], "correct": 0, "explain": "The text states Garibaldi led the Red Shirts, an army that wore bright red shirts into battle."}, {"type": "mc", "q": "The Kingdom of Italy was established in 1861 with Victor Emmanuel II as king.", "opts": ["True", "False"], "correct": 0, "explain": "In 1861 the kingdom of Italy was established and King Victor Emmanuel II became its king."}, {"type": "mc", "q": "Italy gained Venetia in 1866 after the Seven Weeks War.", "opts": ["True", "False"], "correct": 0, "explain": "Following Austria's defeat in the Seven Weeks War of 1866, Italy got Venetia."}, {"type": "mc", "q": "Rome became part of unified Italy in 1870 after French troops withdrew during the Franco-Prussian War.", "opts": ["True", "False"], "correct": 0, "explain": "When the Franco-Prussian war broke out in 1870, French armies withdrew from Italy and Italians entered Rome, completing unification."}, {"type": "mc", "q": "After unification, the Mafia became a secret society the central Italian government could not control.", "opts": ["True", "False"], "correct": 0, "explain": "The text lists the formation of the Mafia, a state within a state the central government was powerless to control, as a post-unification problem."}, {"type": "mc", "q": "The Congress of Vienna in 1815 created the German Confederation of 39 separate autonomous states.", "opts": ["True", "False"], "correct": 0, "explain": "The text states the 1815 Congress of Vienna created the German Confederation, consisting of 39 separate autonomous states."}, {"type": "mc", "q": "The Revolution of 1848 succeeded in unifying the German states.", "opts": ["True", "False"], "correct": 1, "explain": "The text says the Revolution of 1848 failed in its attempt to unify the German-speaking states."}, {"type": "mc", "q": "The Zollverein was a military alliance formed by the German states in 1834.", "opts": ["True", "False"], "correct": 1, "explain": "The Zollverein was an economic alliance (customs union) that promoted trade and removed tariffs, not a military alliance."}, {"type": "mc", "q": "Otto von Bismarck came from the Junker class, the landed nobility of Prussia.", "opts": ["True", "False"], "correct": 0, "explain": "The text states Bismarck came from the Junker class, or landed nobility, in Prussia."}, {"type": "mc", "q": "Bismarck pursued German unification mainly through peaceful parliamentary negotiation.", "opts": ["True", "False"], "correct": 1, "explain": "Bismarck used realpolitik and the 'Blood and Iron' policy, achieving unification through three wars, not peaceful negotiation."}, {"type": "mc", "q": "The Danish War of 1864 resulted in Schleswig going to Prussia and Holstein remaining with Austria.", "opts": ["True", "False"], "correct": 0, "explain": "As a result of the Danish War, Schleswig was given to Prussia while Austria kept Holstein."}, {"type": "mc", "q": "The Battle of Königgrätz (Sadowa) in 1866 resulted in a quick Prussian victory over Austria.", "opts": ["True", "False"], "correct": 0, "explain": "At the Battle of Königgrätz on 3 July 1866, the Prussian army quickly defeated the Austrian forces."}, {"type": "mc", "q": "The Ems Telegram was published by Bismarck to provoke France into declaring war on Prussia.", "opts": ["True", "False"], "correct": 0, "explain": "Bismarck published the edited Ems Telegram to provoke France to declare war on Prussia in 1870."}, {"type": "mc", "q": "Which European country was the first to become industrialized?", "opts": ["France", "Belgium", "Germany", "England"], "correct": 3, "explain": "The text states the Industrial Revolution first started in England in the 18th century."}, {"type": "mc", "q": "Which two social classes emerged especially as a result of industrialization, according to the unit?", "opts": ["The peasantry and the feudal lord", "The capitalist and the bourgeoisie", "The proletariat and the bourgeoisie", "The feudal lord and the bourgeoisie"], "correct": 2, "explain": "Industrialization promoted new socio-economic classes, especially the proletariat and the bourgeoisie."}, {"type": "mc", "q": "In the capitalist system, who owns the means of production?", "opts": ["The government", "A small group of wealthy individuals (capitalists/bourgeoisie)", "The proletariat collectively", "Religious institutions"], "correct": 1, "explain": "The means of production in the capitalist system are owned by a small group of wealthy individuals known as capitalists or bourgeoisie."}, {"type": "mc", "q": "What replaced wind and water power following the Industrial Revolution?", "opts": ["Solar and wind turbines", "Coal and steam", "Nuclear energy", "Animal power"], "correct": 1, "explain": "New sources of energy and power, particularly coal and steam, replaced wind and water powers."}, {"type": "mc", "q": "According to the unit, riches from the slave trade brought tremendous wealth to which British port town?", "opts": ["London", "Liverpool", "Bristol", "Glasgow"], "correct": 1, "explain": "The slave trade delivered tremendous riches to British port towns such as Liverpool."}, {"type": "mc", "q": "Which countries drew up the Treaty of Vienna in 1815?", "opts": ["Britain, Russia, Prussia and Austria", "France, Spain, Italy and Germany", "Britain, France, Italy and the Ottoman Empire", "Russia, Germany, Spain and Austria"], "correct": 0, "explain": "Britain, Russia, Prussia and Austria drew the Treaty of Vienna in 1815 to restore the monarchies."}, {"type": "mc", "q": "Which movement helped bring about national self-consciousness through the development of national language and literature?", "opts": ["The Protestant Revolution", "The Renaissance", "The Industrial Revolution", "The Congress of Vienna"], "correct": 1, "explain": "The Renaissance, with developments of national language and literature, helped bring about national self-consciousness."}, {"type": "mc", "q": "Which of the following was NOT one of the three obstacles to Italian unity in 1815?", "opts": ["Austrian occupation of Lombardy and Venice", "The Papal States", "The existence of several independent states", "French colonization of Sicily"], "correct": 3, "explain": "The three obstacles were Austrian occupation, the Papal States, and several independent states — not French colonization of Sicily."}, {"type": "mc", "q": "Who founded the 'Young Italy' movement in 1831?", "opts": ["Camillo di Cavour", "Giuseppe Garibaldi", "Giuseppe Mazzini", "Victor Emmanuel II"], "correct": 2, "explain": "In 1831, Mazzini founded a movement called 'Young Italy' which attracted tens of thousands of Italians."}, {"type": "mc", "q": "Mazzini was a member of which secret society formed to abolish foreign rule in Italy?", "opts": ["The Carbonari", "The Red Shirts", "The Zollverein", "The Junkers"], "correct": 0, "explain": "Mazzini was a member of the Carbonari, a secret society of Italian unification formed to abolish foreign rule in Italy."}, {"type": "mc", "q": "What kind of government did Mazzini want for a united Italy?", "opts": ["An absolute monarchy", "A liberal democratic republic", "A military dictatorship", "A theocracy under the Pope"], "correct": 1, "explain": "Mazzini wanted a liberal democratic republic to govern a united Italy."}, {"type": "mc", "q": "In 1852, Cavour became prime minister of which state?", "opts": ["The Kingdom of the Two Sicilies", "The Papal States", "The Kingdom of Sardinia", "The Duchy of Tuscany"], "correct": 2, "explain": "In 1852, Cavour became prime minister of the independent Kingdom of Sardinia."}, {"type": "mc", "q": "In the 1858 secret agreement, Napoleon III agreed to help Sardinia against which power?", "opts": ["Prussia", "Austria", "France's own colonies", "The Ottoman Empire"], "correct": 1, "explain": "Napoleon agreed to send troops to drive the Austrians out of Lombardy and Venetia if Austria declared war on Sardinia."}, {"type": "mc", "q": "What did Cavour promise to give France in return for its military help?", "opts": ["Sicily and Sardinia", "Nice and Savoy", "Lombardy and Venetia", "Rome and Naples"], "correct": 1, "explain": "Cavour promised to give the regions of Nice and Savoy to France for its help."}, {"type": "mc", "q": "Giuseppe Garibaldi and his Red Shirts first captured which island?", "opts": ["Sardinia", "Corsica", "Sicily", "Malta"], "correct": 2, "explain": "Garibaldi and the Red Shirts captured the island of Sicily and then crossed into the Italian mainland."}, {"type": "mc", "q": "Who became king when the Kingdom of Italy was established in 1861?", "opts": ["Napoleon III", "Victor Emmanuel II", "Otto von Bismarck", "Wilhelm I"], "correct": 1, "explain": "In 1861, the kingdom of Italy was established, and King Victor Emmanuel II became its king."}, {"type": "mc", "q": "Italian unification was finalized in 1870 when Italy annexed which city?", "opts": ["Venice", "Naples", "Rome", "Florence"], "correct": 2, "explain": "When French armies withdrew from Italy in 1870, Italians entered Rome, finalizing Italian unification."}, {"type": "mc", "q": "After Rome joined Italy, over what remaining territory did the Pope continue to govern?", "opts": ["Sicily", "Vatican City", "Naples", "Tuscany"], "correct": 1, "explain": "The Pope continued to govern a section of Rome known as Vatican City."}, {"type": "mc", "q": "Which of the following was a problem Italy faced after political unification?", "opts": ["Total religious harmony with the Church", "Tension between the industrialized North and agrarian South", "Absence of any secret societies", "Immediate political stability"], "correct": 1, "explain": "One listed problem was the tension between the industrialized North and the agrarian South."}, {"type": "mc", "q": "Which secret society formed in Italy became a 'state within a state' that the central government could not control?", "opts": ["The Carbonari", "Young Italy", "The Mafia", "The Red Shirts"], "correct": 2, "explain": "The formation of the Mafia, a kind of state within a state, was a problem the central government was powerless to control."}, {"type": "mc", "q": "The German Confederation created by the Congress of Vienna in 1815 consisted of how many separate autonomous states?", "opts": ["25", "39", "50", "12"], "correct": 1, "explain": "The 1815 Congress of Vienna created the German Confederation, which consisted of 39 separate autonomous states."}, {"type": "mc", "q": "Which German state took the lead in unifying the German Confederation?", "opts": ["Bavaria", "Austria", "Prussia", "Saxony"], "correct": 2, "explain": "While Austria usually dominated the German Confederation, Prussia took the lead in unifying the states into Germany."}, {"type": "mc", "q": "Which of the following groups opposed German unification before 1870, according to the text?", "opts": ["Prussian Junkers", "Small German states fearing Prussian domination", "German railway builders", "Zollverein merchants"], "correct": 1, "explain": "Small German states that feared Prussian domination were among the forces opposed to German unification."}, {"type": "mc", "q": "The Zollverein, created in 1834, was best described as:", "opts": ["A military pact between Prussia and Austria", "An economic customs union between German states", "A religious alliance of Catholic states", "A treaty ending the Franco-Prussian War"], "correct": 1, "explain": "The Zollverein was an economic alliance (customs union) between German states that promoted trade and removed tariffs."}, {"type": "mc", "q": "Otto von Bismarck belonged to which social class?", "opts": ["The bourgeoisie", "The proletariat", "The Junker (landed nobility)", "The clergy"], "correct": 2, "explain": "Bismarck came from the Junker class, or the landed nobility, in Prussia."}, {"type": "mc", "q": "In 1862, who appointed Bismarck as Prussian prime minister?", "opts": ["Napoleon III", "King Wilhelm I", "Franz Joseph", "Victor Emmanuel II"], "correct": 1, "explain": "In 1862, the new Prussian king, Wilhelm I, chose Bismarck as prime minister."}, {"type": "mc", "q": "Bismarck's political philosophy of pursuing goals by any means necessary was known as:", "opts": ["Nationalism", "Realpolitik", "Zollverein", "Liberalism"], "correct": 1, "explain": "Realpolitik is defined in the text as pursuing goals by any means necessary — go to war, lie, break treaties."}, {"type": "mc", "q": "Which three wars did Bismarck use to achieve German unification, in order?", "opts": ["Franco-Prussian, Danish, Austro-Prussian", "Danish War, Seven Weeks War, Franco-Prussian War", "Seven Weeks War, Franco-Prussian War, Danish War", "Crimean War, Danish War, Franco-Prussian War"], "correct": 1, "explain": "Bismarck led German unification through the Danish War (1864), the Seven Weeks War (1866), and the Franco-Prussian War (1870/71)."}, {"type": "mc", "q": "As a result of the 1864 Danish War, which territory was given to Prussia?", "opts": ["Holstein", "Schleswig", "Alsace", "Venetia"], "correct": 1, "explain": "As a result of the Danish War, Schleswig was given to Prussia, while Austria kept Holstein."}, {"type": "mc", "q": "At which battle did Prussia decisively defeat Austria in 1866?", "opts": ["Battle of Sedan", "Battle of Königgrätz (Sadowa)", "Battle of Waterloo", "Battle of Solferino"], "correct": 1, "explain": "At the Battle of Königgrätz (or Sadowa) on 3 July 1866, the Prussian army quickly defeated the Austrian forces."}, {"type": "mc", "q": "Which of the following was NOT a result of the Seven Weeks War (1866)?", "opts": ["Holstein was annexed by Prussia", "Austria was excluded from German affairs", "Venetia was given to Italy", "France annexed Alsace and Lorraine"], "correct": 3, "explain": "Alsace and Lorraine were ceded by France after the later Franco-Prussian War, not a result of the Seven Weeks War."}, {"type": "mc", "q": "What was formed under Prussian leadership after the Seven Weeks War, consisting of German states except those in the south?", "opts": ["The German Empire", "The North German Confederation", "The Zollverein", "The Weimar Republic"], "correct": 1, "explain": "The North German Confederation was formed under the leadership of Prussia after the Seven Weeks War."}, {"type": "mc", "q": "The Ems Telegram, published by Bismarck, was significant because it:", "opts": ["Ended the Franco-Prussian War", "Encouraged France to declare war on Prussia in 1870", "United the Italian states", "Freed enslaved people in the American South"], "correct": 1, "explain": "The Ems Telegram encouraged France to declare war on Prussia in 1870 by inflaming popular sentiment on both sides."}, {"type": "mc", "q": "At which battle were French forces defeated in September 1870, ending the French Second Empire?", "opts": ["Battle of Königgrätz", "Battle of Sedan", "Battle of Waterloo", "Battle of Gettysburg"], "correct": 1, "explain": "On September 2, 1870, French forces were defeated at the battle of Sedan, ending the French Second Empire."}, {"type": "mc", "q": "Under the Treaty of Frankfurt (1871), France agreed to:", "opts": ["Annex Prussian territory", "Cede Alsace and Lorraine and pay war indemnities", "Form an alliance with Prussia", "Grant independence to Bavaria"], "correct": 1, "explain": "In the Treaty of Frankfurt, France agreed to cede Alsace and Lorraine and to pay huge war indemnities to Germany."}, {"type": "mc", "q": "Who became German Emperor (Kaiser) when the German Empire was proclaimed at Versailles in 1871?", " s created to replace the domestic system of production.", "answer": "Factory", "explain": "The Factory system replaced the domestic system in which workers used hand tools at home."}, {"type": "fib", "q": "Industrialization promoted the growth of the proletariat and the _______ as new social classes.", "answer": "bourgeoisie", "explain": "Industrialization promoted new socio-economic classes, especially the proletariat and the bourgeoisie."}, {"type": "fib", "q": "A(n) _______ economy is one in which the government controls production, distribution and prices.", "answer": "command", "explain": "The text defines a command economy as one where the government controls production, distribution and prices."}, {"type": "fib", "q": "The _______ was signed in 1815 by Britain, Russia, Prussia and Austria to restore Europe's monarchies.", "answer": "Treaty of Vienna", "explain": "Britain, Russia, Prussia and Austria drew the Treaty of Vienna in 1815 to restore the monarchies."}, {"type": "fib", "q": "The Papal States straddled the centre of the Italian peninsula, cutting the north off from the _______.", "answer": "south", "explain": "The Papal States cut the north of the Italian peninsula off from the south."}, {"type": "fib", "q": "Giuseppe Mazzini founded the movement called '_______' in 1831.", "answer": "Young Italy", "explain": "In 1831, Mazzini founded a movement called 'Young Italy'."}, {"type": "fib", "q": "_______ became prime minister of the Kingdom of Sardinia in 1852.", "answer": "Cavour", "explain": "In 1852, Cavour became prime minister of the independent Kingdom of Sardinia."}, {"type": "fib", "q": "Giuseppe Garibaldi led an army known as the _______.", "answer": "Red Shirts", "explain": "Garibaldi led the Red Shirts, an army that wore bright red shirts into battle."}, {"type": "fib", "q": "The Kingdom of Italy was established in the year _______.", "answer": "1861", "explain": "In 1861, the kingdom of Italy was established with Victor Emmanuel II as king."}, ry 1863, freeing slaves in rebelling states.", "answer": "Emancipation", "explain": "In January 1863, Lincoln issued the Emancipation Proclamation, freeing slaves in rebelling parts of the country."}, {"type": "fib", "q": "President Lincoln was assassinated by _______ on April 14, 1865.", "answer": "John Wilkes Booth", "explain": "President Lincoln was assassinated by John Wilkes Booth, a Confederate sympathizer."}, {"type": "fib", "q": "The _______ Amendment, adopted on December 6, 1865, officially outlawed slavery in the United States.", "answer": "Thirteenth", "explain": "On December 6, 1865, the Thirteenth Amendment was adopted, officially outlawing slavery."}]}, {"num": 2, "title": "Africa & the Colonial Experience (1880s–1960s)", "questions": [{"type": "mc", "q": "Colonialism is defined as the direct and total dominance of one country by another based on possession of state authority by a foreign power.", "opts": ["True", "False"], "correct": 0, "explain": "The unit defines colonialism as the direct and total dominance of one country by another based on possession of state authority by a foreign power."}, {"type": "mc", "q": "The concept of colonialism is closely tied to imperialism.", "opts": ["True", "False"], "correct": 0, "explain": "The text states colonialism is inextricably tied to imperialism, the policy of using power to rule another people."}, {"type": "mc", "q": "Colonialism only began in the 19th century and had no earlier history.", "opts": ["True", "False"], "correct": 1, "explain": "Colonialism has been practised since ancient times by the Greeks, Romans, Ottomans, and others."}, {"type": "mc", "q": "'Legitimate trade' refers to the commodity trade between Africans and European merchants after the slave trade was abolished.", "opts": ["True", "False"], "correct": 0, "explain": "The text defines legitimate commerce as commodity trade between Africans and Europeans after the slave trade's abolition."}, {"type": "mc", "q": "European explorers who arrived in Africa after the 1850s were mostly inspired purely by scientific curiosity.", "opts": ["True", "False"], "correct": 1, "explain": "Explorers who arrived after the 1850s were largely European government agents, unlike earlier ones inspired by scientific inquiry."}, {"type": "mc", "q": "European missionaries converted the majority of non-Muslim Africans to Christianity in the late 19th century.", "opts": ["True", "False"], "correct": 1, "explain": "Missionaries converted less than 1% of non-Muslim Africans (outside Ethiopia) in the last two decades of the 19th century."}, {"type": "mc", "q": "Demand for raw materials and new markets was among the economic motives for European colonization of Africa.", "opts": ["True", "False"], "correct": 0, "explain": "The economic motive included demand for raw materials and the need for new market centres."}, {"type": "mc", "q": "The 'civilizing mission' implied that Africans were inferior and uncivilized while Europeans were superior and civilized.", "opts": ["True", "False"], "correct": 0, "explain": "The civilizing mission's clear implication was that Africans were inferior and uncivilized and Europeans superior and civilized."}, {"type": "mc", "q": "Rudyard Kipling wrote the poem 'The White Man's Burden' in 1899.", "opts": ["True", "False"], "correct": 0, "explain": "The text states the White Man's Burden was a poem written by Rudyard Kipling in 1899."}, {"type": "mc", "q": "Before the 1880s, most of Africa (about 90%) was independent and free from foreign rule.", "opts": ["True", "False"], "correct": 0, "explain": "Before the 1880s, only 10% of Africa was ruled by foreign powers; the rest (90%) was independent."}, {"type": "mc", "q": "The Berlin Conference was held from 1884 to 1885 in Berlin, Germany.", "opts": ["True", "False"], "correct": 0, "explain": "The Berlin Conference was held from 1884 to 1885 in Berlin, Germany."}, {"type": "mc", "q": "African representatives participated in the Berlin Conference.", "opts gned by Albert Sarrout; Lugard designed British indirect rule."}, {"type": "mc", "q": "Under the assimilation policy, an African who received French education stood a chance of becoming French.", "opts": ["True", "False"], "correct": 0, "explain": "According to the assimilation policy, an African who received French education could become French."}, {"type": "mc", "q": "Frederick Lugard was the architect of the British Indirect Rule policy.", "opts": ["True", "False"], "correct": 0, "explain": "The text states the architect of the British Indirect rule policy was Frederick Lugard."}, {"type": "mc", "q": "Settler rule involved Europeans displacing indigenous Africans and taking their fertile lands.", "opts": ["True", "False"], "correct": 0, "explain": "In settler colonies, fertile lands of African peasants were taken and given to minority white settlers."}, {"type": "mc", "q": "Ahmadu Seku resisted French rule in West Africa and was eventually exiled to Sokoto, where he died.", "opts": ["True", "False"], "correct": 0, "explain": "Ahmadu Seku's forces were defeated, his empire broke up, and he was exiled to Sokoto where he died."}, {"type": "mc", "q": "Samori Ture was finally captured by the French in 1900 and exiled to Gabon.", "opts": ["True", "False"], "correct": 0, "explain": "The French captured Samori in 1900 and exiled him to Gabon in Central Africa."}, {"type": "mc", "q": "The Maji Maji Uprising was a highly organized rebellion planned well in advance under central leadership.", "opts": ["True", "False"], "correct": 1, "explain": "The text states the Maji Maji movement was a spontaneous rising with no previous planning and central leadership."}, {"type": "mc", "q": "The Herero and Nama uprisings against German rule in South West Africa were both crushed by the Germans.", "opts": ["True", "False"], "correct": 0, "explain": "Both the Herero (1904) and Nama (1905) uprisings were crushed by the Germans."}, {"type": "mc", "q": "Egypt became a British colony after British forces entered Cairo in 1882 and defeated Urabi Pasha's revolt.", "opts": ["True", "False"], "correct": 0, "explain": "In 1882, British forces entered Cairo, defeated the revolt, and Egypt became a British colony."}, {"type": "mc", "q": "Colonialism destroyed African indigenous administrations and created artificial boundaries without local approval.", "opts": ["True", "False"], "correct": 0, "explain": "The political impacts included destruction of indigenous administrations and creation of artificial boundaries without local approval."}, {"type": "mc", "q": "Under colonialism, Africans were encouraged and allowed to develop their own manufacturing industries.", "opts": ["True", "False"], "correct": 1, "explain": "Africans were not allowed nor encouraged to go into manufacturing; Africa remained a supplier of raw materials."}, {"type": "mc", "q": "Rinderpest disease introduced by settlers affected livestock of peoples such as the Shona in present-day Zimbabwe.", "opts": ["True", "False"], "correct": 0, "explain": "Rinderpest disease, introduced by settlers, affected the livestock of the Shona people among others."}, {"type": "mc", "q": "What is colonialism, as defined in the unit?", "opts": ["A trade agreement between equal nations", "The direct and total dominance of one country by another based on possession of state authority", "A religious movement across Africa", "An alliance for mutual defense"], "correct": 0, "explain": "Colonialism is defined as the direct and total dominance of one country by another based on possession of state authority by a foreign power."}, {"type": "mc", "q": "The concept of colonialism is inseparably tied to which of the following?", "opts": ["Communism", "Socialism", "Feudalism", "Imperialism"], "correct": 3, "explain": "The text states colonialism's notion is inextricably tied to that of imperialism."}, {"type": "mc", "q": "What technological advancement facilitated the expansion of colonialism from the 16th century onward?", "opts": ["Advances in navigational technology", "The printing press", "Steam-powered factories", "The telegraph"], "correct": 0, "explain": "Colonialism grew in scope since the 16th century owing to advancements in navigational technology."}, {"type": "mc", "q": "'Legitimate trade' in the 19th century was a trade in which:", "opts": ["Goods were exchanged equally among Africans", "African raw materials were exchanged for European goods", "The slave trade was expanded", "Americans traded directly with Europeans"], "correct": 1, "explain": "Legitimate trade refers to raw products from Africa, particularly cash crops, being exchanged for European goods."}, {"type": "mc", "q": "What percentage of non-Muslim Africans (outside Ethiopia) did missionaries convert to Christianity in the last two decades of the 19th century?", "opts": ["Less than 1%", "About 25%", "Over 50%", "Nearly 100%"], "correct": 0, "explain": "European missionaries converted only less than 1% of non-Muslim Africans (outside Ethiopia) to Christianity."}, {"type": "mc", "q": "Which of the following was NOT listed as a main motive for European colonization of Africa?", "opts": ["Economic demand for raw materials and markets", "Political and strategic interest", "The civilizing mission and religious factors", "Africa's request for European governance"], "correct": 3, "explain": "The listed motives were economic, political/strategic, the civilizing mission, and religious factors — not a request from Africa."}, {"type": "mc", "q": "Rudyard Kipling's poem 'The White Man's Burden' proposed that:", "opts": ["Africans should govern themselves immediately", "White people should rule over non-white people until they adopt western ways", "Colonization should end immediately", "Africans and Europeans were equals"], "correct": 1, "explain": "The poem proposes that white people should rule non-white people until they can fully adopt western ways."}, {"type": "mc", "q": "Before the 1880s, approximately what percentage of Africa was under foreign rule?", "opts": ["10%", "50%", "75%", "90%"], "correct": 0, "explain": "Before the 1880s, only 10% of Africa was ruled by foreign powers."}, {"type": "mc", "q": "The rapid colonial expansion of Europeans in Africa from the 1880s to the early 20th century is known as:", "opts": ["The Berlin Conference", "The Scramble for Africa", "The Civilizing Mission", "The Legitimate Trade"], "correct": 1, "explain": "This fierce, rapid colonial expansion is called the Scramble for Africa."}, {"type": "mc", "q": "Who led the Berlin Conference of 1884-1885?", "opts": ["Otto von Bismarck", "King Leopold II", "Cecil Rhodes", "Frederick Lugard"], "correct": 0, "explain": "The German Chancellor Otto von Bismarck was the leader of the Berlin Conference."}, {"type": "mc", "q": "Which of the following countries was NOT among the major players controlling most of colonial Africa at the Berlin Conference?", "opts": ["France", "Germany", "Great Britain", "Sweden-Norway"], "correct": 3, "explain": "The major players were France, Germany, Great Britain, and Portugal; Sweden-Norway was represented but not a major player."}, {"type": "mc", "q": "King Leopold II of Belgium employed which explorer to explore the Congo River?", "opts": ["David Livingstone", "H.M. Stanley", "Frederick Lugard", "Cecil Rhodes"], "correct": 1, "explain": "King Leopold II employed H.M. Stanley to explore the Congo River."}, {"type": "mc", "q": "According to Article 35 of the Berlin Conference's General Act, colonial powers could acquire rights over land only if they:", "opts": ["Paid a fee to the African Union", "Had treaties, flew their flag, and established administration with police", "Won a war against local rulers", "Received permission from the League of Nations"], "correct": 1, "explain": "The principle of effective occupation required treaties, flying a flag, and establishing administration with a police force."}, {"type": "mc", "q": "What was confirmed as the private property of King Leopold II at the Berlin Conference?", "opts": ["Nigeria", "The Congo Free State", "Tanganyika", "Southern Rhodesia"], "correct": 1, "explain": "The Congo Free State was confirmed as the private property of King Leopold II of Belgium."}, {"type": "mc", "q": "What was the major factor behind European military victory over Africa during the Scramble?", "opts": ["Superior numbers of soldiers only", "Military superiority with professional, well-trained armies", "Alliance with African kingdoms", "Naval blockades only"], "correct": 1, "explain": "The major factor was the military superiority Europeans enjoyed, using professional and well-trained armies."}, {"type": "mc", "q": "The British South Africa Company (B.S.A.C.) administered which three territories?", "opts": ["Nigeria, Ghana, and Kenya", "Nyasaland, Northern Rhodesia, and Southern Rhodesia", "Congo, Togo, and Cameroon", "Egypt, Sudan, and Libya"], "correct": 1, "explain": "The B.S.A.C., under Cecil Rhodes, administered Nyasaland, Northern Rhodesia, and Southern Rhodesia."}, {"type": "mc", "q": "Company rule in Africa eventually failed mainly due to:", "opts": ["Shortage of finance and African/missionary opposition", "Too much government funding", "Lack of European interest in Africa", "Total African cooperation"], "correct": 0, "explain": "The companies' rule failed due to a shortage of finance and opposition from Africans and missionaries."}, {"type": "mc", "q": "Which colonial powers are considered to have used the direct rule and assimilation model?", "opts": ["The British and Americans", "The French, Belgians, Germans, and Portuguese", "Only the Ottomans", "The Spanish and Dutch"], "correct": 1, "explain": "The French, Belgians, Germans, and Portuguese are considered to have used the direct rule and assimilation model."}, {"type": "mc", "q": "Who designed the French colonial policy of direct rule and assimilation?", "opts": ["Frederick Lugard", "Albert Sarrout", "Cecil Rhodes", "Otto von Bismarck"], "correct": 1, "explain": "The French colonial policy of direct rule and assimilation was designed by Albert Sarrout."}, {"type": "mc", "q": "Under the French 'association' policy, the relationship between conqueror and conquered emphasized:", "opts": ["Total identity and merging", "Cooperation, not identity or merging", "Military conquest only", "Complete separation with no contact"], "correct": 1, "explain": "Association implied the relationship should be one of cooperation, not identity and merging."}, {"type": "mc", "q": "Who was the architect of the British Indirect Rule policy?", "opts": ["Albert Sarrout", "Frederick Lugard", "Cecil Rhodes", "King Leopold II"], "correct": 1, "explain": "The architect of the British Indirect Rule policy was Frederick Lugard."}, {"type": "mc", "q": "Frederick Lugard explained the importance of indirect rule in which book, published in 1922?", "opts": ["The White Man's Burden", "The Dual Mandate in British Tropical Africa", "The Scramble for Africa", "Heart of Darkness"], "correct": 1, "explain": "Lugard explained indirect rule's importance in his 1922 book, The Dual Mandate in British Tropical Africa."}, {"type": "mc", "q": "According to the text, why did the British prefer indirect rule?", "opts": ["It was more expensive but more prestigious", "It was the cheapest, most effective, and reduced African resistance", "It required no African chiefs at all", "It was mandated by the League of Nations"], "correct": 1, "explain": "Indirect rule was preferable because it was the cheapest and most effective way, and reduced African resistance."}, {"type": "mc", "q": "Settler colonies, where fertile African lands were taken for white settlers, were found in all EXCEPT which of the following?", "opts": ["South Africa and Southern/Northern Rhodesia", "Kenya and Algeria", "Angola and Mozambique", "Ethiopia and Liberia"], "correct": 3, "explain": "Ethiopia and Liberia are not listed among the settler colonies; settler rule was in South Africa, the R prising in Tanganyika was the most significant African challenge to German colonial rule."}, {"type": "mc", "q": "Who led the movement against the Germans in the Maji Maji Uprising, teaching people to sprinkle sacred water believed to turn bullets into water?", "opts": ["Samuel Maharero", "Hendrik Witbooi", "Kinjikitle Ngwale", "Urabi Pasha"], "correct": 2, "explain": "A prophet named Kinjikitle Ngwale led the movement, teaching people to use sacred water called Maji Maji."}, {"type": "mc", "q": "Who led the Herero rebellion against German rule in South West Africa in 1904?", "opts": ["Samuel Maharero", "Hendrik Witbooi", "Kinjikitle Ngwale", "Ahmadu Seku"], "correct": 0, "explain": "In 1904, the Herero people, led by Samuel Maharero, rebelled against German colonial rule."}, {"type": "mc", "q": "Who led the Nama rebellion against German colonial rule in 1905?", "opts": ["Samuel Maharero", "Hendrik Witbooi", "Asantehene Prempe", "Samori Ture"], "correct": 1, "explain": "In 1905, the Nama people, led by Hendrik Witbooi, rebelled against German colonial rule."}, {"type": "mc", "q": "Who led the Egyptian revolt against Anglo-French domination in 1881-1882?", "opts": ["Khedive Ismael Pasha", "Colonel Urabi Pasha", "Kinjikitle Ngwale", "Samori Ture"], "correct": 1, "explain": "The 1881 Egyptian revolt against imperialist domination was led by Colonel Urabi Pasha."}, {"type": "mc", "q": "What happened to Egypt in 1882 after British forces entered Cairo?", "opts": ["It gained full independence", "It became a British colony", "It was divided between Britain and France equally", "It became part of the Ottoman Empire again"], "correct": 1, "explain": "In 1882, British colonial forces entered Cairo, defeated the revolt, and Egypt became a British colony."}, {"type": "mc", "q": "What political impact did colonialism have on Africa, according to the unit?", "opts": ["It strengthened existing African administrations", "It created artificial boundaries without local approval, causing later conflicts", "It gave Africans full political representation", "It unified Africa into one nation"], "correct": 1, "explain": "Europeans created artificial boundaries without local approval, becoming a colonial legacy causing later boundary conflicts."}, {"type": "mc", "q": "What was a key economic impact of colonialism described in the unit?", "opts": ["Africa became a major manufacturing hub", "Africa remained a supplier of raw materials while manufacturing was discouraged", "Africans were given full control of mining", "African resources were left completely untouched"], "correct": 1, "explain": "Africa remained a supplier of raw materials for Europe, and Africans were not allowed or encouraged to go into manufacturing."}, {"type": "mc", "q": "Which disease, introduced by colonial settlers, affected livestock of peoples like the Shona in present-day Zimbabwe?", "opts": ["Malaria", "Rinderpest", "Smallpox", "Cholera"], "correct": 1, "explain": "Rinderpest disease, introduced by settlers, affected the livestock of the Shona people."}, {"type": "mc", "q": "Which of the following was cited as a positive outcome of colonialism in the unit?", "opts": ["End of tribal warfare due to colonial administration and construction of railways/roads", "Full African self-governance", "Complete economic equality", "Elimination of all diseases"], "correct": 0, "explain": "Positive outcomes included tribal warfare ending under colonial administration and construction of railways and roads."}, {"type": "mc", "q": "Which four countries were German colonies in Africa, according to the unit?", "opts": ["Tanganyika, Togo, Cameroon, and Namibia", "Nigeria, Ghana, Kenya, and Uganda", "Congo, Angola, Mozambique, and Zambia", "Egypt, Sudan, Libya, and Algeria"], "correct": 0, "explain": "The four German colonies in Africa were Tanganyika, Togo, Cameroon, and Namibia (South-West Africa)."}, {"type": "fib", "q": "Colonialism grew in scope since the 16th century, after the Age of ______
