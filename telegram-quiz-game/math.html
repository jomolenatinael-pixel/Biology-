<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light"><title>Grade 10 Mathematics — Textbook Flashcards</title><style>
:root{--teal:#0f8a7e;--teal-dark:#0b6c62;--teal-light:#e6f5f3;--red:#d64545;--red-light:#fbe9e9;--amber:#a36c12;--amber-light:#fff2d8;--ink:#1f2430;--ink-soft:#5b6472;--paper:#f7f8fa;--card:#fff;--border:#e3e6eb;--shadow:0 1px 2px rgba(17,24,39,.04),0 8px 24px rgba(17,24,39,.06);--radius:14px}
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;background:var(--paper)}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(15,138,126,.3);outline-offset:2px}#app{max-width:860px;margin:0 auto;padding:22px 14px 48px;min-height:100vh}.app-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:20px}.header-block{min-width:0}.app-header h1{font-size:1.2rem;line-height:1.2;margin:0;font-weight:750;letter-spacing:-.02em}.subtitle{font-size:.78rem;color:var(--ink-soft);margin-top:6px}.eyebrow{font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--teal-dark);font-weight:800;margin-bottom:6px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;background:var(--teal-light);color:var(--teal-dark);font-size:.69rem;font-weight:750}.panel,.q-card,.summary-card,.flash-card,.source-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.panel{padding:18px;margin-bottom:14px}.hero{padding:18px;margin-bottom:14px;background:linear-gradient(130deg,#e6f5f3,#fff 68%);border:1px solid #d5ece8;border-radius:var(--radius)}.hero h2{font-size:1.06rem;margin:0 0 7px}.hero p{margin:0;color:var(--ink-soft);font-size:.83rem}.filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:.72rem;font-weight:700;color:var(--ink-soft)}select,.text-input{width:100%;min-height:42px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--ink);padding:9px 11px;font-size:.83rem}.text-input{font-family:inherit}.count-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;color:var(--ink-soft);font-size:.76rem}.primary,.secondary,.ghost,.danger-soft{border:0;border-radius:10px;padding:10px 15px;font-weight:750;font-size:.8rem;transition:background .15s,border-color .15s}.primary{background:var(--teal);color:#fff}.primary:hover{background:var(--teal-dark)}.secondary{background:#fff;border:1px solid var(--border);color:var(--ink)}.secondary:hover{border-color:var(--teal)}.ghost{background:transparent;color:var(--ink-soft);padding:8px 4px}.ghost:hover{color:var(--teal-dark)}.danger-soft{background:var(--red-light);color:#a12f2f}.control-row{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:14px}.helper{font-size:.72rem;color:var(--ink-soft);margin:8px 0 0}.progress-wrap{margin:10px 0 18px}.progress-meta{display:flex;justify-content:space-between;gap:10px;font-size:.7rem;color:var(--ink-soft);margin-bottom:7px}.progress-track{height:8px;border-radius:99px;background:var(--border);overflow:hidden}.progress-fill{height:100%;background:var(--teal);border-radius:99px;transition:width .2s}.meta-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}.tag{display:inline-flex;background:var(--teal-light);color:var(--teal-dark);border-radius:99px;padding:3px 8px;font-size:.65rem;font-weight:750}.tag.neutral{background:#eef0f3;color:var(--ink-soft)}.q-card{padding:20px 18px}.q-text{font-size:1rem;line-height:1.55;font-weight:650;margin:0 0 18px;overflow-wrap:anywhere}.options{display:flex;flex-direction:column;gap:8px}.option{display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 11px;border:1.5px solid var(--border);border-radius:11px;background:#fff;text-align:left;color:var(--ink);font-size:.86rem;line-height:1.45}.option:hover:not(:disabled){border-color:var(--teal);background:var(--teal-light)}.option-badge{flex:none;width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:50%;background:var(--paper);font-weight:800;font-size:.69rem;color:var(--ink-soft)}.option.correct-answer{border-color:var(--teal);background:var(--teal-light)}.option.correct-answer .option-badge{color:#fff;background:var(--teal);border-color:var(--teal)}.option.wrong-answer{border-color:var(--red);background:var(--red-light)}.option.wrong-answer .option-badge{color:#fff;background:var(--red);border-color:var(--red)}.fib-row{display:flex;gap:8px;align-items:stretch}.fib-row .text-input{flex:1;min-width:0}.feedback{margin-top:15px;padding:11px 12px;border-radius:10px;font-size:.81rem}.feedback.correct{background:var(--teal-light);color:var(--teal-dark)}.feedback.incorrect{background:var(--red-light);color:#9f2929}.feedback p{margin:5px 0 0;color:var(--ink);font-weight:400}.feedback .answer-line{margin-top:6px;font-weight:700}.source-ref{font-size:.7rem;color:var(--ink-soft);margin-top:10px;overflow-wrap:anywhere}.nav-row{position:sticky;bottom:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px -2px 0;padding:9px 2px calc(9px + env(safe-area-inset-bottom));background:rgba(247,248,250,.97);border-top:1px solid var(--border);box-shadow:0 -5px 14px rgba(17,24,39,.05)}.summary-card{padding:23px 18px;text-align:center}.score{font-size:1.4rem;font-weight:850;margin:7px 0}.score-sub{color:var(--ink-soft);font-size:.78rem}.review-section{text-align:left;margin-top:22px}.review-heading{font-size:.85rem;font-weight:800;margin:0 0 10px}.review-item{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:11px;margin:0 0 9px}.review-item p{font-size:.77rem;margin:5px 0}.answer-correct{color:var(--teal-dark);font-weight:700}.answer-yours{color:#a12f2f}.source-panel{margin-top:18px;padding:15px 16px}.source-panel h2{font-size:.88rem;margin:0 0 8px}.source-panel p,.source-panel li{font-size:.72rem;color:var(--ink-soft);margin:5px 0}.source-panel ul{padding-left:19px;margin:7px 0}.notice{border-left:3px solid var(--amber);background:var(--amber-light);padding:9px 11px;border-radius:6px;font-size:.72rem;color:#6b4a11;margin-top:12px}.flash-card{min-height:260px;padding:24px 20px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;overflow-wrap:anywhere}.flash-face{font-size:.65rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-dark);margin-bottom:12px}.flash-content{font-size:1.13rem;line-height:1.6;font-weight:650;white-space:pre-wrap}.flash-explanation{font-size:.79rem;color:var(--ink-soft);line-height:1.55;margin-top:12px}.flash-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.mark-known.active{background:var(--teal);color:#fff}.mark-review.active{background:#fff2d8;border-color:#eccb84;color:#714b0e}.flash-topline{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:5px 0 10px;color:var(--ink-soft);font-size:.72rem}.empty-state{padding:14px;border-radius:10px;background:var(--amber-light);color:#6b4a11;font-size:.8rem}.small{font-size:.68rem;color:var(--ink-soft)}
@media(max-width:560px){#app{padding:17px 12px 38px}.app-header h1{font-size:1.05rem}.filter-grid{grid-template-columns:1fr}.panel{padding:15px}.q-card{padding:16px 13px}.flash-card{min-height:220px;padding:18px 15px}.fib-row{flex-direction:column}.fib-row .primary{min-height:42px}.count-line{align-items:flex-start;flex-direction:column}.nav-row{gap:4px}.nav-row button{padding-left:9px;padding-right:9px}}
</style>

<main id="app" aria-live="polite"></main><script id="flash-data" type="application/json">{"units":[{"unit_id":"U1","title":"Relations and Functions","start":1,"end":66},{"unit_id":"U2","title":"Polynomial Functions","start":67,"end":120},{"unit_id":"U3","title":"Exponential and Logarithmic Functions","start":121,"end":198},{"unit_id":"U4","title":"Trigonometric Functions","start":199,"end":250},{"unit_id":"U5","title":"Circles","start":251,"end":286},{"unit_id":"U6","title":"Solid Figures","start":287,"end":344},{"unit_id":"U7","title":"Coordinate Geometry","start":345,"end":380}],"flashcards":[{"flashcard_id":"U1-F001","unit_id":"U1","unit_name":"Relations and Functions","front":"What is a mathematical relation?","back":"A relation is a set of ordered pairs; the order of the components matters.","explanation":"The ordered-pair viewpoint records which first element is related to which second element.","difficulty":"easy","topic":"Relation definition","section_id":"1.1","textbook_pages":"p. 8","source_note":"Definition 1.1; printed p. 8."},{"flashcard_id":"U1-F002","unit_id":"U1","unit_name":"Relations and Functions","front":"How are domain and range defined for a relation of ordered pairs?","back":"The domain is the set of first components; the range is the set of second components.","explanation":"List each distinct first or second coordinate once.","difficulty":"easy","topic":"Domain and range","section_id":"1.1","textbook_pages":"pp. 11–12","source_note":"Domain/range definition and examples; printed pp. 11–12."},{"flashcard_id":"U1-F003","unit_id":"U1","unit_name":"Relations and Functions","front":"What does an ordered pair (x,y) mean on the Cartesian plane?","back":"x is the first coordinate (abscissa) and y is the second coordinate (ordinate); the origin is (0,0).","explanation":"Coordinates are measured along perpendicular axes in the stated order.","difficulty":"easy","topic":"Cartesian coordinates","section_id":"1.1","textbook_pages":"pp. 5–7","source_note":"Cartesian coordinate-system definition; printed pp. 5–7."},{"flashcard_id":"U1-F004","unit_id":"U1","unit_name":"Relations and Functions","front":"What boundary style represents a strict inequality such as y>x?","back":"Use a broken (dashed) boundary line because points on the line do not satisfy a strict inequality.","explanation":"For ≤ or ≥, the source instead specifies a solid boundary.","difficulty":"medium","topic":"Graphing inequalities","section_id":"1.1","textbook_pages":"p. 14","source_note":"Inequality graphing rules; printed p. 14."},{"flashcard_id":"U1-F005","unit_id":"U1","unit_name":"Relations and Functions","front":"How can a shaded graph be found for two simultaneous relation inequalities?","back":"Graph both regions and retain only their overlap: points satisfying both inequalities.","explanation":"The domain/range of the combined relation can then be read from the common region.","difficulty":"medium","topic":"Intersection of relation regions","section_id":"1.1","textbook_pages":"p. 16","source_note":"Example 4; printed p. 16."},{"flashcard_id":"U1-F006","unit_id":"U1","unit_name":"Relations and Functions","front":"What is an arithmetic pattern?","back":"A number sequence generated by repeatedly adding or subtracting a fixed difference.","explanation":"Example method: compare consecutive terms and continue the same change.","difficulty":"easy","topic":"Arithmetic patterns","section_id":"1.1","textbook_pages":"pp. 3–4","source_note":"Arithmetic-pattern explanation and Example 1; printed pp. 3–4."},{"flashcard_id":"U1-F007","unit_id":"U1","unit_name":"Relations and Functions","front":"What is a geometric pattern?","back":"A number sequence generated by repeatedly multiplying or dividing by a fixed factor.","explanation":"For example, the supplied text illustrates repeated multiplication by 2.","difficulty":"easy","topic":"Geometric patterns","section_id":"1.1","textbook_pages":"p. 4","source_note":"Geometric-pattern explanation and example; printed p. 4."},{"flashcard_id":"U1-F008","unit_id":"U1","unit_name":"Relations and Functions","front":"When is a relation a function?","back":"When no two distinct ordered pairs have the same first element with different second elements.","explanation":"A repeated identical pair does not violate the rule; one input cannot have two different outputs.","difficulty":"easy","topic":"Function definition","section_id":"1.2","textbook_pages":"p. 18","source_note":"Definition 1.3 and repeated-pair example; printed p. 18."},{"flashcard_id":"U1-F009","unit_id":"U1","unit_name":"Relations and Functions","front":"State the vertical line test.","back":"A numerical relation is a function exactly when no vertical line intersects its graph at more than one point.","explanation":"A vertical line fixes an input; multiple intersections give that input multiple outputs.","difficulty":"easy","topic":"Vertical line test","section_id":"1.2","textbook_pages":"p. 29","source_note":"Vertical Line Test note and summary; printed p. 29."},{"flashcard_id":"U1-F010","unit_id":"U1","unit_name":"Relations and Functions","front":"What is the domain of a function?","back":"The set of all input values for which the function is defined.","explanation":"For real square-root expressions, require the radicand to be nonnegative.","difficulty":"easy","topic":"Function domain","section_id":"1.2","textbook_pages":"pp. 20–22","source_note":"Domain definition and square-root example; printed pp. 20–22."},{"flashcard_id":"U1-F011","unit_id":"U1","unit_name":"Relations and Functions","front":"What is the difference between the range and codomain?","back":"The codomain is the declared target set; the range is the set of outputs actually attained and is contained in the codomain.","explanation":"An image f(x) is an output for a specified input x.","difficulty":"medium","topic":"Codomain and range","section_id":"1.2","textbook_pages":"pp. 20–21","source_note":"Definitions, notation, and range-subset statement; printed pp. 20–21."},{"flashcard_id":"U1-F012","unit_id":"U1","unit_name":"Relations and Functions","front":"Define an injective (one-to-one) function.","back":"Distinct domain elements have distinct images; equivalently, f(x₁)=f(x₂) implies x₁=x₂.","explanation":"The implication is required for every x₁,x₂ in the domain.","difficulty":"medium","topic":"Injective functions","section_id":"1.2","textbook_pages":"p. 30","source_note":"Definition 1.4; printed p. 30."},{"flashcard_id":"U1-F013","unit_id":"U1","unit_name":"Relations and Functions","front":"Define an onto (surjective) function f:A→B.","back":"Every element of B has at least one preimage in A.","explanation":"This condition is about covering the entire codomain B.","difficulty":"medium","topic":"Surjective functions","section_id":"1.2","textbook_pages":"p. 31","source_note":"Onto-function definition; printed p. 31."},{"flashcard_id":"U1-F014","unit_id":"U1","unit_name":"Relations and Functions","front":"When is a function bijective?","back":"When it is both one-to-one (injective) and onto (surjective).","explanation":"The text also calls this a one-to-one correspondence.","difficulty":"easy","topic":"Bijective functions","section_id":"1.2","textbook_pages":"p. 31","source_note":"One-to-one correspondence definition; printed p. 31."},{"flashcard_id":"U1-F015","unit_id":"U1","unit_name":"Relations and Functions","front":"How are sums and differences of functions defined?","back":"(f+g)(x)=f(x)+g(x), and (f−g)(x)=f(x)−g(x), for x in their common domains.","explanation":"Subtract the entire expression g(x) when forming f−g.","difficulty":"medium","topic":"Function combinations","section_id":"1.2","textbook_pages":"p. 24","source_note":"Sum/difference definitions; printed p. 24."},{"flashcard_id":"U1-F016","unit_id":"U1","unit_name":"Relations and Functions","front":"How are products and quotients of functions defined?","back":"(fg)(x)=f(x)g(x); (f/g)(x)=f(x)/g(x), provided g(x)≠0.","explanation":"For combinations, use common domains; for a quotient also remove denominator zeros.","difficulty":"medium","topic":"Function combinations and domains","section_id":"1.2","textbook_pages":"pp. 25–27","source_note":"Product/quotient definitions and domain restriction; printed pp. 25–27."},{"flashcard_id":"U1-F017","unit_id":"U1","unit_name":"Relations and Functions","front":"What is a linear function, and what do its parameters mean?","back":"f(x)=ax+b with real fixed a≠0 is linear; a is the slope and b is the y-intercept value.","explanation":"Its graph is a straight line. If a>0 it increases; if a<0 it decreases.","difficulty":"medium","topic":"Linear functions","section_id":"1.2","textbook_pages":"pp. 34, 38–39","source_note":"Definition 1.6 and slope/intercept statements; printed pp. 34, 38–39."},{"flashcard_id":"U1-F018","unit_id":"U1","unit_name":"Relations and Functions","front":"How do you find the intercepts of y=ax+b (a≠0)?","back":"Set y=0 and solve x=−b/a for the x-intercept (−b/a,0); set x=0 to get y-intercept (0,b).","explanation":"The source demonstrates setting the dependent value to zero for the x-intercept and x=0 for y-intercept.","difficulty":"medium","topic":"Linear intercepts","section_id":"1.2","textbook_pages":"pp. 39–40","source_note":"Worked intercept examples; printed pp. 39–40; additional source: Summary, printed p. 63.","additional_sources":[{"section_id":"Summary","textbook_pages":"p. 63"}]},{"flashcard_id":"U1-F019","unit_id":"U1","unit_name":"Relations and Functions","front":"What is a quadratic function, and what is its leading coefficient?","back":"f(x)=ax²+bx+c with real coefficients and a≠0 is quadratic; a is the leading coefficient.","explanation":"Its graph is a parabola; a>0 opens upward and a<0 downward.","difficulty":"easy","topic":"Quadratic functions","section_id":"1.2","textbook_pages":"p. 41","source_note":"Quadratic-function definition; printed p. 41; additional source: Summary, printed p. 63.","additional_sources":[{"section_id":"Summary","textbook_pages":"p. 63"}]},{"flashcard_id":"U1-F020","unit_id":"U1","unit_name":"Relations and Functions","front":"What are vertex and axis of symmetry of a parabola?","back":"The vertex is the turning point; the axis of symmetry is the vertical line through the vertex.","explanation":"For y=a(x−h)²+k, the vertex is (h,k) and the axis is x=h.","difficulty":"medium","topic":"Quadratic graph properties","section_id":"1.2","textbook_pages":"pp. 44–46","source_note":"Shifted-parabola rules; printed pp. 44–46; additional source: Summary, printed p. 63.","additional_sources":[{"section_id":"Summary","textbook_pages":"p. 63"}]},{"flashcard_id":"U1-F021","unit_id":"U1","unit_name":"Relations and Functions","front":"How does completing the square help with a quadratic graph?","back":"Rewrite ax²+bx+c in vertex form to identify the vertex and symmetry axis. For x²+6x+11, this gives (x+3)²+2 and vertex (−3,2).","explanation":"The text uses completing the square to determine graph features and intercepts.","difficulty":"hard","topic":"Completing the square","section_id":"1.2","textbook_pages":"p. 47","source_note":"Worked Example 1; printed p. 47."},{"flashcard_id":"U1-F022","unit_id":"U1","unit_name":"Relations and Functions","front":"How are real roots found graphically?","back":"Graph y=f(x); the x-coordinate(s) where the curve intersects the x-axis solve f(x)=0.","explanation":"Two intersections give two real roots, one touch gives one, and no intersection means no real roots.","difficulty":"medium","topic":"Graphical quadratic equations","section_id":"1.3","textbook_pages":"pp. 54–57","source_note":"Graphical solving procedure and examples; printed pp. 54–57."},{"flashcard_id":"U1-F023","unit_id":"U1","unit_name":"Relations and Functions","front":"How are quadratic inequalities solved graphically?","back":"Graph y=f(x) and select x-values where the parabola is below the x-axis for f(x)<0, or above it for f(x)>0; include/exclude roots according to ≤/≥ versus <\/>.","explanation":"Convert to standard form first; the graph’s position relative to the x-axis determines the solution.","difficulty":"hard","topic":"Quadratic inequalities","section_id":"1.3","textbook_pages":"pp. 58–61","source_note":"Graphical inequality procedure and examples; printed pp. 58–61."},{"flashcard_id":"U1-F024","unit_id":"U1","unit_name":"Relations and Functions","front":"What rule models the unit’s femur-height example?","back":"h=2.47f+54, where femur length f and estimated height h are in centimetres; the stated source model is for 40≤f≤55.","explanation":"Substitute the femur length for f; the example rounds calculated height to the nearest centimetre.","difficulty":"medium","topic":"Linear relation application","section_id":"1.3","textbook_pages":"pp. 50–51","source_note":"Femur/height model and worked estimates; printed pp. 50–51."},{"flashcard_id":"U1-F025","unit_id":"U1","unit_name":"Relations and Functions","front":"How can rectangle dimensions be related to perimeter 8 m if one side is x m?","back":"The other side is 4−x m, since 2(x+w)=8. The area function is S(x)=x(4−x).","explanation":"For a nondegenerate rectangle, 0<x<4.","difficulty":"medium","topic":"Perimeter and area application","section_id":"1.3","textbook_pages":"p. 52","source_note":"Exercise 1.24 wire rectangle; printed p. 52."},{"flashcard_id":"U1-F026","unit_id":"U1","unit_name":"Relations and Functions","front":"How does the leading coefficient determine quadratic opening?","back":"For f(x)=ax²+bx+c, the graph opens upward if a>0 and downward if a<0.","explanation":"Here a is the coefficient of x² and must be nonzero for the function to be quadratic.","difficulty":"easy","topic":"Quadratic graph summary","section_id":"Summary","textbook_pages":"p. 63","source_note":"Unit Summary, item 17; printed p. 63."},{"flashcard_id":"U1-F027","unit_id":"U1","unit_name":"Relations and Functions","front":"What does the axis of symmetry tell you about a parabola?","back":"It is the vertical line through the parabola’s vertex; the vertex is where the graph turns.","explanation":"The domain of a quadratic is all real numbers; its range depends on its turning value and opening direction.","difficulty":"medium","topic":"Quadratic summary properties","section_id":"Summary","textbook_pages":"p. 63","source_note":"Unit Summary, items 18–21; printed p. 63."},{"flashcard_id":"U2-F001","unit_id":"U2","unit_name":"Polynomial Functions","front":"What is a polynomial function in one variable?","back":"p(x)=aₙxⁿ+aₙ₋₁xⁿ⁻¹+…+a₁x+a₀, where n is a non-negative integer, all coefficients are real, and aₙ≠0. Its degree is n.","explanation":"Only non-negative integer powers are allowed.","difficulty":"easy","topic":"Definition","section_id":"2.1","textbook_pages":"p. 69","source_note":"Definition 2.1—printed p. 69"},{"flashcard_id":"U2-F002","unit_id":"U2","unit_name":"Polynomial Functions","front":"What are the degree, leading coefficient, leading term, and constant term?","back":"The degree is the greatest exponent with nonzero coefficient; the leading coefficient multiplies that term; the leading term is the highest-degree term; the constant term is a₀.","explanation":"Write a polynomial in descending powers to identify these reliably.","difficulty":"easy","topic":"Polynomial vocabulary","section_id":"2.1","textbook_pages":"p. 70","source_note":"Terminology list—printed p. 70"},{"flashcard_id":"U2-F003","unit_id":"U2","unit_name":"Polynomial Functions","front":"What is the degree of a nonzero constant polynomial? What about the zero polynomial?","back":"A nonzero constant polynomial has degree 0. The zero polynomial has no degree assigned.","explanation":"Do not treat the zero polynomial as an ordinary nonzero constant.","difficulty":"easy","topic":"Constant and zero polynomials","section_id":"2.1","textbook_pages":"p. 70","source_note":"Note—printed p. 70"},{"flashcard_id":"U2-F004","unit_id":"U2","unit_name":"Polynomial Functions","front":"What domain does every polynomial function have?","back":"The set of all real numbers.","explanation":"Polynomials have no denominator or radical restriction on the input.","difficulty":"easy","topic":"Domain","section_id":"2.1","textbook_pages":"p. 70","source_note":"Domain of polynomial function—printed p. 70"},{"flashcard_id":"U2-F005","unit_id":"U2","unit_name":"Polynomial Functions","front":"How is the sum of two polynomial functions defined and computed?","back":"(f+g)(x)=f(x)+g(x). Combine coefficients of like powers; the sum is a polynomial.","explanation":"A leading-term cancellation can lower the degree of the sum.","difficulty":"easy","topic":"Addition","section_id":"2.2","textbook_pages":"pp. 75–76","source_note":"Definition 2.3 and observations—printed pp. 75–76"},{"flashcard_id":"U2-F006","unit_id":"U2","unit_name":"Polynomial Functions","front":"How is the difference of two polynomial functions defined?","back":"(f−g)(x)=f(x)−g(x). Distribute the minus sign to every term of g before combining like terms.","explanation":"The difference is again a polynomial.","difficulty":"easy","topic":"Subtraction","section_id":"2.2","textbook_pages":"p. 77","source_note":"Definition 2.4 and Example 2—printed p. 77"},{"flashcard_id":"U2-F007","unit_id":"U2","unit_name":"Polynomial Functions","front":"How do you multiply two polynomials?","back":"Use the distributive property to multiply every term of one polynomial by every term of the other, then combine like terms.","explanation":"For nonzero f and g of degrees m and n, deg(fg)=m+n; a zero factor gives the zero polynomial.","difficulty":"medium","topic":"Multiplication","section_id":"2.2","textbook_pages":"pp. 78–80","source_note":"Definition 2.5, Examples 3–4, observations—printed pp. 78–80"},{"flashcard_id":"U2-F008","unit_id":"U2","unit_name":"Polynomial Functions","front":"What is the pointwise quotient (f÷g)(x), and where is it defined?","back":"(f÷g)(x)=f(x)/g(x), only for real x where g(x)≠0.","explanation":"A quotient of polynomials need not itself be a polynomial.","difficulty":"easy","topic":"Division and quotient domain","section_id":"2.2","textbook_pages":"p. 81","source_note":"Definition 2.6 and review exercise discussion—printed p. 81"},{"flashcard_id":"U2-F009","unit_id":"U2","unit_name":"Polynomial Functions","front":"State the polynomial division theorem.","back":"For polynomials f,d with d≠0 and deg d≤deg f, there are unique polynomials q,r such that f=dq+r, where r=0 or deg r<deg d.","explanation":"If r=0, d divides f exactly.","difficulty":"medium","topic":"Polynomial division theorem","section_id":"2.3","textbook_pages":"p. 84","source_note":"Theorem 2.1—printed p. 84"},{"flashcard_id":"U2-F010","unit_id":"U2","unit_name":"Polynomial Functions","front":"What does the remainder theorem say for divisor x−c?","back":"When f(x) is divided by x−c, the remainder is f(c).","explanation":"Substitute the zero c of the divisor rather than carrying out long division.","difficulty":"easy","topic":"Remainder theorem","section_id":"2.3","textbook_pages":"pp. 87–88","source_note":"Theorem 2.2—printed pp. 87–88"},{"flashcard_id":"U2-F011","unit_id":"U2","unit_name":"Polynomial Functions","front":"State both directions of the factor theorem.","back":"For a polynomial f and real c, f(c)=0 if and only if x−c is a factor of f(x).","explanation":"The theorem requires a linear factor of the form x−c.","difficulty":"easy","topic":"Factor theorem","section_id":"2.3","textbook_pages":"pp. 90–91","source_note":"Theorem 2.3—printed pp. 90–91"},{"flashcard_id":"U2-F012","unit_id":"U2","unit_name":"Polynomial Functions","front":"How does the remainder theorem apply to a linear divisor ax+b, a≠0?","back":"The remainder is f(−b/a), since ax+b=a(x−(−b/a)) has zero −b/a.","explanation":"A nonzero constant multiple of x−c has the same root c and yields the same remainder value.","difficulty":"medium","topic":"Linear divisor remainder","section_id":"Review Exercise","textbook_pages":"p. 119","source_note":"Review Exercise question 5—printed p. 119"},{"flashcard_id":"U2-F013","unit_id":"U2","unit_name":"Polynomial Functions","front":"What does it mean for c to be a zero of f?","back":"f(c)=0; equivalently, c is a root/solution of the equation f(x)=0.","explanation":"By the factor theorem, x−c is then a factor.","difficulty":"easy","topic":"Zeros","section_id":"2.4","textbook_pages":"p. 94","source_note":"Definition 2.7 and following note—printed p. 94"},{"flashcard_id":"U2-F014","unit_id":"U2","unit_name":"Polynomial Functions","front":"Define a zero of multiplicity k.","back":"(x−c)^k is a factor of f(x), but (x−c)^(k+1) is not; then c has multiplicity k.","explanation":"The exponent of the repeated linear factor gives its multiplicity.","difficulty":"easy","topic":"Multiplicity","section_id":"2.4","textbook_pages":"p. 95","source_note":"Definition 2.8—printed p. 95"},{"flashcard_id":"U2-F015","unit_id":"U2","unit_name":"Polynomial Functions","front":"What candidates does the rational zero test give?","back":"For integer-coefficient f with leading coefficient aₙ≠0 and constant term a₀≠0, a rational zero p/q in lowest terms must have p a factor of a₀ and q a factor of aₙ.","explanation":"List positive and negative factor ratios, reduce duplicates, then test them in f.","difficulty":"medium","topic":"Rational zero test","section_id":"2.4","textbook_pages":"p. 99","source_note":"Theorem 2.5 and steps—printed p. 99"},{"flashcard_id":"U2-F016","unit_id":"U2","unit_name":"Polynomial Functions","front":"State the location theorem for real zeros.","back":"If a<b and a polynomial f has f(a) and f(b) of opposite signs, then f has at least one zero strictly between a and b.","explanation":"It guarantees existence in the interval, not an exact value or necessarily uniqueness.","difficulty":"medium","topic":"Location theorem","section_id":"2.4","textbook_pages":"p. 97","source_note":"Theorem 2.4—printed p. 97"},{"flashcard_id":"U2-F017","unit_id":"U2","unit_name":"Polynomial Functions","front":"How do you find x- and y-intercepts of y=f(x)?","back":"For x-intercepts, solve f(x)=0; for the y-intercept, set x=0 and evaluate y=f(0).","explanation":"The y-intercept is (0,f(0)); x-intercepts have coordinates (c,0) for real zeros c.","difficulty":"easy","topic":"Graph intercepts","section_id":"2.5","textbook_pages":"pp. 102–105","source_note":"Worked quadratic graph examples—printed pp. 102–105"},{"flashcard_id":"U2-F018","unit_id":"U2","unit_name":"Polynomial Functions","front":"How does completing the square locate the turning point of a quadratic?","back":"Write f(x)=a(x−h)²+k. The vertex/turning point is (h,k); if a>0 it is a minimum, and if a<0 it is a maximum.","explanation":"This form also identifies the range from the extremal value.","difficulty":"medium","topic":"Quadratic graph and vertex","section_id":"2.5","textbook_pages":"pp. 102–105","source_note":"Worked quadratic graph examples—printed pp. 102–105"},{"flashcard_id":"U2-F019","unit_id":"U2","unit_name":"Polynomial Functions","front":"For an odd-degree polynomial, how do leading-coefficient signs determine the opposite end behaviors?","back":"Positive leading coefficient: left end down, right end up. Negative leading coefficient: left end up, right end down.","explanation":"For odd degree the two ends point in opposite directions.","difficulty":"medium","topic":"End behavior","section_id":"2.5","textbook_pages":"pp. 107–109","source_note":"Cubic examples and observation—printed pp. 107–109"},{"flashcard_id":"U2-F020","unit_id":"U2","unit_name":"Polynomial Functions","front":"For an even-degree polynomial, how does the leading-coefficient sign determine whether both ends rise or fall?","back":"Positive leading coefficient: both ends up. Negative leading coefficient: both ends down.","explanation":"The degree-four illustrations state the general behavior for even degree.","difficulty":"medium","topic":"End behavior","section_id":"2.5","textbook_pages":"pp. 109–110","source_note":"Degree-four graph observations and parity generalization—printed pp. 109–110"},{"flashcard_id":"U2-F021","unit_id":"U2","unit_name":"Polynomial Functions","front":"What graph shape and continuity properties characterize polynomial functions?","back":"Their graphs are smooth (no sharp corners) and continuous (no jumps or holes).","explanation":"The unit uses |x| and a discontinuous graph to illustrate what is not polynomial.","difficulty":"easy","topic":"Smoothness and continuity","section_id":"2.5","textbook_pages":"p. 107","source_note":"Graph note states polynomial graphs are smooth and continuous—printed p. 107"},{"flashcard_id":"U2-F022","unit_id":"U2","unit_name":"Polynomial Functions","front":"What general graph-count bounds apply to a degree-n polynomial?","back":"At most n x-axis intersections and at most n−1 turning points.","explanation":"These are upper bounds; the graph need not attain them.","difficulty":"medium","topic":"Graph bounds","section_id":"Summary","textbook_pages":"p. 117","source_note":"Summary item 15—printed p. 117"},{"flashcard_id":"U2-F023","unit_id":"U2","unit_name":"Polynomial Functions","front":"What is the standard strategy for a polynomial area/volume application?","back":"Translate the geometric constraint into one variable, substitute into the area or volume expression, then analyze the resulting polynomial (often a quadratic) by completing the square.","explanation":"Check that the resulting dimensions are physically feasible.","difficulty":"medium","topic":"Applications and optimization","section_id":"2.6","textbook_pages":"pp. 112–115","source_note":"Rectangle and constrained-product examples; box exercise—printed pp. 112–115"},{"flashcard_id":"U2-F024","unit_id":"U2","unit_name":"Polynomial Functions","front":"How does a rectangle with perimeter P maximize area?","back":"With x+y=P/2, A=x(P/2−x)=−(x−P/4)²+P²/16. The maximum occurs at x=y=P/4, a square.","explanation":"The unit demonstrates this for a 56 m perimeter, producing 14 m sides and 196 m² area.","difficulty":"medium","topic":"Maximum rectangle area","section_id":"2.6","textbook_pages":"pp. 112–113","source_note":"Example 1 and completing-square solution—printed pp. 112–113"},{"flashcard_id":"U3-F001","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"In a^n, what are the base and exponent?","back":"a is the base; n is the exponent. For a natural n, a^n is the product of n factors all equal to a.","explanation":"","difficulty":"easy","topic":"Exponent notation","section_id":"3.1","textbook_pages":"pp. 122–123","source_note":"Definition 3.1; printed pp. 122–123."},{"flashcard_id":"U3-F002","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What is the product law for powers with the same base?","back":"a^m·a^n=a^(m+n). The base is unchanged and the exponents are added.","explanation":"","difficulty":"easy","topic":"Exponent laws","section_id":"3.1","textbook_pages":"p. 124","source_note":"Law 1; printed p. 124."},{"flashcard_id":"U3-F003","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What is the quotient law for powers with the same base?","back":"For a≠0, a^m/a^n=a^(m−n).","explanation":"","difficulty":"easy","topic":"Exponent laws","section_id":"3.1","textbook_pages":"p. 125","source_note":"Law 2; printed p. 125."},{"flashcard_id":"U3-F004","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"How do you simplify a power raised to a power?","back":"(a^m)^n=a^(mn): multiply the exponents.","explanation":"","difficulty":"easy","topic":"Exponent laws","section_id":"3.1","textbook_pages":"p. 125","source_note":"Law 3; printed p. 125."},{"flashcard_id":"U3-F005","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What are the product and quotient power laws?","back":"(ab)^n=a^n b^n; and (a/b)^n=a^n/b^n when b≠0.","explanation":"","difficulty":"medium","topic":"Exponent laws","section_id":"3.1","textbook_pages":"p. 126","source_note":"Laws 4–5; printed p. 126."},{"flashcard_id":"U3-F006","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What do zero and negative integer exponents mean?","back":"For a≠0, a^0=1 and a^(−n)=1/a^n for positive integer n. 0^0 is undefined in this unit.","explanation":"","difficulty":"medium","topic":"Integer exponents","section_id":"3.1","textbook_pages":"pp. 127–128","source_note":"Definition 3.2; printed pp. 127–128."},{"flashcard_id":"U3-F007","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"How is a rational exponent a^(m/n) interpreted?","back":"When the real value is defined, a^(m/n)=(a^(1/n))^m: take the nth root and then raise it to m. The fraction m/n is in lowest terms in the definition.","explanation":"For a negative base, an even-index root is not real; an odd-index root of a negative number is negative.","difficulty":"medium","topic":"Rational exponents","section_id":"3.1","textbook_pages":"pp. 131–133","source_note":"Definitions 3.3–3.4; printed pp. 131–133."},{"flashcard_id":"U3-F008","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"When is a negative number’s nth root real?","back":"If n is odd, the root is real and negative; if n is even, a negative radicand has no real nth root.","explanation":"","difficulty":"medium","topic":"Rational exponents and domain","section_id":"3.1","textbook_pages":"pp. 131–132","source_note":"Definition 3.3; printed pp. 131–132."},{"flashcard_id":"U3-F009","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What is the defining conversion between exponential and logarithmic form?","back":"For a>0, a≠1 and c>0: log_a c=b if and only if a^b=c.","explanation":"","difficulty":"easy","topic":"Logarithm definition","section_id":"3.1","textbook_pages":"pp. 137–138","source_note":"Definition 3.6; printed pp. 137–138."},{"flashcard_id":"U3-F010","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What is a logarithm conceptually?","back":"log_a x is the exponent to which the base a must be raised to obtain x (with a>0, a≠1 and x>0).","explanation":"","difficulty":"easy","topic":"Logarithm meaning and conditions","section_id":"3.1","textbook_pages":"pp. 138–139","source_note":"Definition and examples; printed pp. 138–139."},{"flashcard_id":"U3-F011","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What are the basic logarithm identities?","back":"For valid base a: log_a 1=0, log_a a=1, log_a(a^p)=p, and a^(log_a p)=p when p>0.","explanation":"","difficulty":"medium","topic":"Logarithm properties","section_id":"3.1","textbook_pages":"pp. 139–141","source_note":"Properties of logarithms; printed pp. 139–141."},{"flashcard_id":"U3-F012","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What is the logarithm product law?","back":"For M,N>0 and a>0, a≠1: log_a(MN)=log_a M+log_a N.","explanation":"","difficulty":"easy","topic":"Logarithm laws","section_id":"3.1","textbook_pages":"pp. 140–141","source_note":"Theorem 3.1; printed pp. 140–141."},{"flashcard_id":"U3-F013","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What is the logarithm quotient law?","back":"For M,N>0 and a>0, a≠1: log_a(M/N)=log_a M−log_a N.","explanation":"","difficulty":"easy","topic":"Logarithm laws","section_id":"3.1","textbook_pages":"pp. 142–143","source_note":"Theorem 3.3; printed pp. 142–143."},{"flashcard_id":"U3-F014","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What is the logarithm power law?","back":"For M>0, real r and a>0, a≠1: log_a(M^r)=r log_a M.","explanation":"","difficulty":"medium","topic":"Logarithm laws","section_id":"3.1","textbook_pages":"p. 141","source_note":"Theorem 3.2; printed p. 141."},{"flashcard_id":"U3-F015","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What is the change-of-base formula?","back":"For M>0 and positive bases a,b different from 1: log_a M=(log_b M)/(log_b a).","explanation":"","difficulty":"medium","topic":"Logarithm laws","section_id":"3.1","textbook_pages":"p. 144","source_note":"Theorem 3.4; printed p. 144."},{"flashcard_id":"U3-F016","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What is a common logarithm?","back":"The base-10 logarithm log_10 M is called the common (decadic) logarithm and is often written log M.","explanation":"","difficulty":"easy","topic":"Common logarithms","section_id":"3.1","textbook_pages":"pp. 145–146","source_note":"Definition 3.7; printed pp. 145–146."},{"flashcard_id":"U3-F017","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What are characteristic and mantissa in a common logarithm?","back":"If p=m·10^c with 1≤m<10, then log p=log m+c. The characteristic is c; the mantissa is log m.","explanation":"","difficulty":"medium","topic":"Common logarithm tables","section_id":"3.1","textbook_pages":"pp. 147–148","source_note":"Common-log table procedure and Example 3; printed pp. 147–148."},{"flashcard_id":"U3-F018","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What defines an exponential function with base a?","back":"f(x)=a^x, where a>0, a≠1 and x may be any real number.","explanation":"","difficulty":"easy","topic":"Exponential functions","section_id":"3.2","textbook_pages":"p. 153","source_note":"Definition 3.8; printed p. 153."},{"flashcard_id":"U3-F019","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What are the domain, range, intercept, and asymptote of y=a^x?","back":"Domain ℝ; range (0,∞); y-intercept (0,1); no x-intercept; horizontal asymptote y=0.","explanation":"","difficulty":"medium","topic":"Exponential graphs","section_id":"3.2","textbook_pages":"pp. 158–159","source_note":"Characteristics of exponential graphs; printed pp. 158–159."},{"flashcard_id":"U3-F020","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"How does the exponential graph’s direction depend on a?","back":"For a>1, a^x is increasing. For 0<a<1, it is decreasing. In both cases values remain positive and y=0 is a horizontal asymptote.","explanation":"","difficulty":"medium","topic":"Exponential graphs","section_id":"3.2","textbook_pages":"pp. 158–159","source_note":"Characteristics for both base ranges; printed pp. 158–159."},{"flashcard_id":"U3-F021","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"How does the unit define e, and what is its approximate value?","back":"e is the value approached by (1+1/n)^n as n becomes large; e≈2.71828.","explanation":"","difficulty":"easy","topic":"Natural exponential","section_id":"3.2","textbook_pages":"pp. 160–161","source_note":"Definition and table; printed pp. 160–161."},{"flashcard_id":"U3-F022","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What are the domain and range of y=log_a x?","back":"For a>0 and a≠1, domain is (0,∞) and range is ℝ.","explanation":"","difficulty":"easy","topic":"Logarithmic functions","section_id":"3.3","textbook_pages":"pp. 163–165","source_note":"Inverse definition and graph domain/range; printed pp. 163–165."},{"flashcard_id":"U3-F023","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What are the common intercept/asymptote facts for y=log_a x?","back":"x-intercept (1,0); no y-intercept; vertical asymptote x=0 (the y-axis). Domain (0,∞), range ℝ.","explanation":"","difficulty":"medium","topic":"Logarithmic graphs","section_id":"3.3","textbook_pages":"pp. 167–169","source_note":"Graph characteristics; printed pp. 167–169."},{"flashcard_id":"U3-F024","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"How does the monotonicity of log_a x depend on a?","back":"It increases for a>1 and decreases for 0<a<1.","explanation":"","difficulty":"easy","topic":"Logarithmic graphs","section_id":"3.3","textbook_pages":"pp. 167–169","source_note":"Graph characteristics for both base ranges; printed pp. 167–169."},{"flashcard_id":"U3-F025","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What does ln x denote?","back":"ln x=log_e x, the logarithm to base e; its inverse relation is ln x=y iff x=e^y (x>0).","explanation":"","difficulty":"easy","topic":"Natural logarithms","section_id":"3.3","textbook_pages":"p. 171","source_note":"Definition 3.10; summary p. 192; printed p. 171."},{"flashcard_id":"U3-F026","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What are the textbook’s three steps for solving exponential equations?","back":"(1) Isolate the exponential expression. (2) Take logarithms of both sides and use log laws to bring down the exponent. (3) Solve for the variable.","explanation":"","difficulty":"medium","topic":"Equation-solving procedure","section_id":"3.4","textbook_pages":"p. 172","source_note":"Procedure in section 3.4.1; printed p. 172."},{"flashcard_id":"U3-F027","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What must be checked when solving a logarithmic equation?","back":"State the universe by requiring every log argument to be positive; solve using log laws or exponential form; retain only candidate solutions in that universe.","explanation":"","difficulty":"medium","topic":"Logarithmic equations","section_id":"3.4","textbook_pages":"pp. 175–176","source_note":"Log-equation procedure and examples; printed pp. 175–176."},{"flashcard_id":"U3-F028","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"How are y=a^x and y=log_a x related?","back":"They are inverse functions; their graphs reflect across y=x. Their domains and ranges interchange.","explanation":"","difficulty":"medium","topic":"Inverse functions","section_id":"3.5","textbook_pages":"pp. 178–180","source_note":"Section 3.5 discussion; printed pp. 178–180."},{"flashcard_id":"U3-F029","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What are the asymptotes and intercepts for an exponential/log inverse pair?","back":"For y=a^x: horizontal asymptote y=0 and y-intercept (0,1). For y=log_a x: vertical asymptote x=0 and x-intercept (1,0).","explanation":"","difficulty":"medium","topic":"Inverse graph features","section_id":"3.5","textbook_pages":"p. 180","source_note":"Section 3.5 summary of graph observations; printed p. 180."},{"flashcard_id":"U3-F030","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What is the compound-interest formula for n compounding periods per year?","back":"A(t)=P(1+r/n)^(nt), where P is principal, r annual interest rate as a decimal, n periods/year, t years, and A(t) amount.","explanation":"","difficulty":"medium","topic":"Compound interest","section_id":"3.6","textbook_pages":"pp. 182–183","source_note":"Theorem 3.5; printed pp. 182–183."},{"flashcard_id":"U3-F031","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What is the continuous-compounding formula?","back":"A(t)=Pe^(rt), where P is principal, r annual interest rate as a decimal, and t is years.","explanation":"","difficulty":"medium","topic":"Continuous compound interest","section_id":"3.6","textbook_pages":"pp. 184–185","source_note":"Section 3.6.1 continuous formula; printed pp. 184–185."},{"flashcard_id":"U3-F032","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"What is the exponential population-growth model in the unit?","back":"P(t)=P₀e^(kt), k>0; P₀ is population at initial time, P(t) population after t, and k the exponential growth rate.","explanation":"","difficulty":"medium","topic":"Population growth","section_id":"3.6","textbook_pages":"pp. 186–188","source_note":"Section 3.6.2; printed pp. 186–188."},{"flashcard_id":"U3-F033","unit_id":"U3","unit_name":"Exponential and Logarithmic Functions","front":"How is pH defined and how are solutions classified?","back":"pH=−log[H⁺], with [H⁺] measured in mol/L (M). pH=7 is neutral, pH<7 acidic, pH>7 basic.","explanation":"","difficulty":"medium","topic":"pH scale","section_id":"3.6","textbook_pages":"pp. 189–190","source_note":"Section 3.6.3 definition and classification; printed pp. 189–190."},{"flashcard_id":"U4-F001","unit_id":"U4","unit_name":"Trigonometric Functions","front":"What defines a positive or negative directed angle?","back":"Anticlockwise rotation is positive; clockwise rotation is negative.","explanation":"The angle measure describes the amount of rotation from initial ray to terminal ray.","difficulty":"easy","topic":"Directed angles","section_id":"4.1","textbook_pages":"p. 201","source_note":"Definition; printed p. 201."},{"flashcard_id":"U4-F002","unit_id":"U4","unit_name":"Trigonometric Functions","front":"What makes an angle standard position?","back":"Its vertex is at the origin and its initial side lies on the positive x-axis.","explanation":"Both conditions are required.","difficulty":"easy","topic":"Standard position","section_id":"4.1","textbook_pages":"p. 201","source_note":"Definition; printed p. 201."},{"flashcard_id":"U4-F003","unit_id":"U4","unit_name":"Trigonometric Functions","front":"Define one radian and give the arc-length relation.","back":"One radian is the central angle subtended by an arc whose length equals the circle’s radius. For radius r and central angle θ in radians, l=rθ (equivalently θ=l/r).","explanation":"The formula assumes θ is measured in radians.","difficulty":"easy","topic":"Radian measure and arc length","section_id":"4.1","textbook_pages":"pp. 203–204","source_note":"Definition and derivation; printed pp. 203–204."},{"flashcard_id":"U4-F004","unit_id":"U4","unit_name":"Trigonometric Functions","front":"What is the fundamental degree–radian equivalence?","back":"π radians = 180°; equivalently 2π radians = 360°.","explanation":"These equalities allow conversions in either direction.","difficulty":"easy","topic":"Degree–radian conversion","section_id":"4.1","textbook_pages":"p. 204","source_note":"Conversion rule; printed p. 204."},{"flashcard_id":"U4-F005","unit_id":"U4","unit_name":"Trigonometric Functions","front":"How do you convert degrees to radians and radians to degrees?","back":"Degrees to radians: multiply by π/180. Radians to degrees: multiply by 180/π.","explanation":"Keep the units consistent; exact answers often retain π.","difficulty":"easy","topic":"Degree–radian conversion","section_id":"4.1","textbook_pages":"pp. 204–205","source_note":"Conversion formulas; printed pp. 204–205."},{"flashcard_id":"U4-F006","unit_id":"U4","unit_name":"Trigonometric Functions","front":"How are sine, cosine, and tangent defined in a right triangle for acute angle α?","back":"sinα=opposite/hypotenuse; cosα=adjacent/hypotenuse; tanα=opposite/adjacent.","explanation":"The opposite and adjacent sides are relative to α.","difficulty":"easy","topic":"Basic trigonometric ratios","section_id":"4.2","textbook_pages":"pp. 208–209","source_note":"Definitions; printed pp. 208–209."},{"flashcard_id":"U4-F007","unit_id":"U4","unit_name":"Trigonometric Functions","front":"How does the unit circle define cosine and sine?","back":"For the unit-circle point P=(a,b) at angle θ, cosθ=a and sinθ=b; hence P=(cosθ,sinθ).","explanation":"The circle has radius 1 and is centered at the origin.","difficulty":"medium","topic":"Unit circle","section_id":"4.2","textbook_pages":"p. 213","source_note":"Definition; printed p. 213."},{"flashcard_id":"U4-F008","unit_id":"U4","unit_name":"Trigonometric Functions","front":"State the fundamental sine–cosine identity derived from the unit circle.","back":"cos²θ+sin²θ=1.","explanation":"It follows from a²+b²=1 for a point on the unit circle.","difficulty":"easy","topic":"Pythagorean identity","section_id":"4.2","textbook_pages":"pp. 213–214","source_note":"Unit circle derivation; printed pp. 213–214."},{"flashcard_id":"U4-F009","unit_id":"U4","unit_name":"Trigonometric Functions","front":"What are the three reciprocal trigonometric functions?","back":"cscθ=1/sinθ; secθ=1/cosθ; cotθ=1/tanθ.","explanation":"Each is defined where its denominator/function is nonzero.","difficulty":"easy","topic":"Reciprocal functions","section_id":"4.2","textbook_pages":"p. 217","source_note":"Definitions; printed p. 217."},{"flashcard_id":"U4-F010","unit_id":"U4","unit_name":"Trigonometric Functions","front":"What are the signs of sine, cosine, and tangent in quadrants I–IV?","back":"sin: +,+,−,−; cos: +,−,−,+; tan: +,−,+,−.","explanation":"Axis angles need separate attention because some functions may be zero or undefined.","difficulty":"medium","topic":"Signs by quadrant","section_id":"4.2","textbook_pages":"pp. 215–216","source_note":"Sign table; printed pp. 215–216."},{"flashcard_id":"U4-F011","unit_id":"U4","unit_name":"Trigonometric Functions","front":"How do sine, cosine, and tangent change for a negative angle?","back":"sin(−θ)=−sinθ; cos(−θ)=cosθ; tan(−θ)=−tanθ.","explanation":"Sine and tangent are odd; cosine is even.","difficulty":"medium","topic":"Negative angles","section_id":"4.2","textbook_pages":"p. 215","source_note":"Unit-circle reflection and summary; printed p. 215."},{"flashcard_id":"U4-F012","unit_id":"U4","unit_name":"Trigonometric Functions","front":"State the basic cofunction identities for complementary angles.","back":"sin(π/2−α)=cosα; cos(π/2−α)=sinα; tan(π/2−α)=cotα; cot(π/2−α)=tanα.","explanation":"Angles are complementary; the radian forms use π/2.","difficulty":"medium","topic":"Complementary angles","section_id":"4.2","textbook_pages":"p. 220","source_note":"Identities; printed p. 220."},{"flashcard_id":"U4-F013","unit_id":"U4","unit_name":"Trigonometric Functions","front":"What is a reference angle?","back":"The positive acute angle between a non-quadrantal angle’s terminal side and the x-axis.","explanation":"To find it, first reduce to a coterminal angle from 0° to 360°, then use the quadrant rule.","difficulty":"easy","topic":"Reference angles","section_id":"4.2","textbook_pages":"pp. 221–222","source_note":"Definition and procedure; printed pp. 221–222."},{"flashcard_id":"U4-F014","unit_id":"U4","unit_name":"Trigonometric Functions","front":"How do you find reference angle αR from θ in degrees in quadrants II, III, and IV?","back":"II: 180°−θ; III: θ−180°; IV: 360°−θ.","explanation":"For quadrant I, the reference angle is θ itself.","difficulty":"medium","topic":"Reference angles","section_id":"4.2","textbook_pages":"p. 222","source_note":"Rules; printed p. 222."},{"flashcard_id":"U4-F015","unit_id":"U4","unit_name":"Trigonometric Functions","front":"How can coterminal angles be generated?","back":"In degrees use θ+360°n; in radians use θ+2πn, where n is any integer.","explanation":"They share a terminal side and therefore have the same trigonometric values.","difficulty":"easy","topic":"Coterminal angles","section_id":"4.2","textbook_pages":"pp. 224–226","source_note":"Definition and formula; printed pp. 224–226."},{"flashcard_id":"U4-F016","unit_id":"U4","unit_name":"Trigonometric Functions","front":"What are the sine function’s period and range?","back":"Period 2π radians (360°); range −1≤sinθ≤1.","explanation":"Its domain is all real numbers.","difficulty":"easy","topic":"Sine graph","section_id":"4.2","textbook_pages":"pp. 228–229","source_note":"Graph discussion and summary; printed pp. 228–229."},{"flashcard_id":"U4-F017","unit_id":"U4","unit_name":"Trigonometric Functions","front":"What are the cosine function’s period, range, and domain?","back":"Period 2π radians (360°); range −1≤cosθ≤1; domain all real numbers.","explanation":"Cosine values repeat after one full revolution.","difficulty":"easy","topic":"Cosine graph","section_id":"4.2","textbook_pages":"p. 231","source_note":"Graph discussion; printed p. 231."},{"flashcard_id":"U4-F018","unit_id":"U4","unit_name":"Trigonometric Functions","front":"What are the tangent function’s period, range, and excluded inputs?","back":"Period π radians (180°); range all real numbers; undefined at θ=(2n+1)π/2 for n∈ℤ.","explanation":"The excluded values occur where cosine is zero.","difficulty":"medium","topic":"Tangent graph","section_id":"4.2","textbook_pages":"pp. 232–233","source_note":"Graph/domain discussion; printed pp. 232–233."},{"flashcard_id":"U4-F019","unit_id":"U4","unit_name":"Trigonometric Functions","front":"State the three Pythagorean trigonometric identities.","back":"sin²θ+cos²θ=1; 1+tan²θ=sec²θ; 1+cot²θ=csc²θ.","explanation":"Use each only where its functions are defined.","difficulty":"medium","topic":"Pythagorean identities","section_id":"4.3","textbook_pages":"pp. 234–236","source_note":"Identity list and proof; printed pp. 234–236."},{"flashcard_id":"U4-F020","unit_id":"U4","unit_name":"Trigonometric Functions","front":"State the sine and cosine sum and difference identities.","back":"sin(α±β)=sinα cosβ±cosα sinβ; cos(α±β)=cosα cosβ∓sinα sinβ.","explanation":"In the cosine formula, the sign between products is opposite the sign inside the angle.","difficulty":"hard","topic":"Addition and subtraction identities","section_id":"4.3","textbook_pages":"pp. 236–237","source_note":"Formula list; printed pp. 236–237."},{"flashcard_id":"U4-F021","unit_id":"U4","unit_name":"Trigonometric Functions","front":"State the double-angle formulas for sine, cosine, and tangent.","back":"sin2θ=2sinθcosθ; cos2θ=cos²θ−sin²θ=1−2sin²θ=2cos²θ−1; tan2θ=2tanθ/(1−tan²θ).","explanation":"For the tangent formula, denominator must be nonzero.","difficulty":"hard","topic":"Double-angle identities","section_id":"4.3","textbook_pages":"pp. 237–238","source_note":"Formula list; printed pp. 237–238."},{"flashcard_id":"U4-F022","unit_id":"U4","unit_name":"Trigonometric Functions","front":"What are the half-angle identities for sine and cosine, including the sign condition?","back":"sin(α/2)=±√((1−cosα)/2); cos(α/2)=±√((1+cosα)/2). Choose the sign according to the quadrant of α/2.","explanation":"The source explicitly states that the sign depends on the quadrant of the resulting half-angle.","difficulty":"hard","topic":"Half-angle identities","section_id":"4.3","textbook_pages":"pp. 238–239","source_note":"Derivation and sign condition; printed pp. 238–239."},{"flashcard_id":"U4-F023","unit_id":"U4","unit_name":"Trigonometric Functions","front":"What is a reliable method for solving a trigonometric equation on [0,2π)?","back":"Isolate the trig function; find its reference angle; choose quadrants using the sign; list solutions in [0,2π). For all real solutions, add 2nπ to each base solution.","explanation":"Check the specified endpoint convention: [0,2π) excludes 2π.","difficulty":"medium","topic":"Trigonometric equations","section_id":"4.3","textbook_pages":"pp. 239–241","source_note":"Worked examples and general-solution method; printed pp. 239–241."},{"flashcard_id":"U4-F024","unit_id":"U4","unit_name":"Trigonometric Functions","front":"Define angle of elevation and angle of depression.","back":"Elevation is the angle from the observer’s horizontal line of sight upward to the object; depression is measured downward from the horizontal.","explanation":"With parallel horizontal lines, the depression angle equals the corresponding elevation angle.","difficulty":"easy","topic":"Elevation and depression","section_id":"4.4","textbook_pages":"p. 242","source_note":"Definitions and diagram; printed p. 242."},{"flashcard_id":"U4-F025","unit_id":"U4","unit_name":"Trigonometric Functions","front":"Which right-triangle ratios are especially useful in height-and-distance applications?","back":"sinθ=opposite/hypotenuse; cosθ=adjacent/hypotenuse; tanθ=opposite/adjacent.","explanation":"Identify the known angle and sides from a sketch before selecting a ratio.","difficulty":"easy","topic":"Right-triangle applications","section_id":"4.4","textbook_pages":"pp. 242–244","source_note":"Worked cliff, rope and tree examples; printed pp. 242–244."},{"flashcard_id":"U4-F026","unit_id":"U4","unit_name":"Trigonometric Functions","front":"For a point P(x,y) on a terminal side at distance r>0, state the six trigonometric functions.","back":"sinθ=y/r; cosθ=x/r; tanθ=y/x; cscθ=r/y; secθ=r/x; cotθ=x/y. Also r=√(x²+y²).","explanation":"A quotient is undefined when its denominator is zero; the origin is excluded.","difficulty":"hard","topic":"Coordinate definitions","section_id":"Summary","textbook_pages":"pp. 245–246","source_note":"Unit summary; printed pp. 245–246."},{"flashcard_id":"U4-F027","unit_id":"U4","unit_name":"Trigonometric Functions","front":"What does it mean for two angles to be coterminal?","back":"They have the same terminal side; their difference is an integer multiple of 360° or 2π radians.","explanation":"Coterminal angles share trigonometric values.","difficulty":"easy","topic":"Coterminal angles","section_id":"Summary","textbook_pages":"pp. 245–246","source_note":"Unit summary; printed pp. 245–246."},{"flashcard_id":"U4-F028","unit_id":"U4","unit_name":"Trigonometric Functions","front":"What common methods does the review exercise ask students to use across the unit?","back":"Convert degree/radian measures; use unit-circle and coordinate ratios; find reference and coterminal angles; apply identities/equations; solve height, distance, and shadow problems.","explanation":"This card summarizes the reviewed skill categories rather than supplying a separate formula.","difficulty":"medium","topic":"Unit review","section_id":"Review Exercise","textbook_pages":"pp. 247–250","source_note":"Review Exercise topic coverage; printed pp. 247–250."},{"flashcard_id":"U5-F001","unit_id":"U5","unit_name":"Circles","front":"What is a circle?","back":"The locus (set) of points in a plane all at a fixed distance from one fixed point; the fixed point is the center and the fixed distance is the radius.","explanation":"This definition distinguishes the circle itself from its interior disk.","difficulty":"easy","topic":"Circle definition","section_id":"5.1","textbook_pages":"p. 252","source_note":"Definition, p. 252."},{"flashcard_id":"U5-F002","unit_id":"U5","unit_name":"Circles","front":"What are the area and perimeter (circumference) of a circle of radius r?","back":"Area A=πr²; perimeter/circumference P=2πr.","explanation":"Use square units for area and linear units for circumference.","difficulty":"easy","topic":"Circle formulas","section_id":"5.1","textbook_pages":"p. 252","source_note":"Recall of area and perimeter formulas, p. 252."},{"flashcard_id":"U5-F003","unit_id":"U5","unit_name":"Circles","front":"What is a line of symmetry? How many does a circle have?","back":"A fold line across which the two halves coincide. Every diameter is a symmetry line of a circle, so a circle has infinitely many.","explanation":"A diameter is one of infinitely many axes for the circle.","difficulty":"easy","topic":"Symmetry","section_id":"5.1","textbook_pages":"p. 253","source_note":"Symmetry discussion, p. 253."},{"flashcard_id":"U5-F004","unit_id":"U5","unit_name":"Circles","front":"What is the center-to-midpoint chord theorem?","back":"The segment joining the center of a circle to the midpoint of a chord is perpendicular to the chord.","explanation":"The theorem establishes a right angle at the chord midpoint.","difficulty":"easy","topic":"Chord theorem","section_id":"5.1","textbook_pages":"p. 254","source_note":"Theorem 5.1, p. 254."},{"flashcard_id":"U5-F005","unit_id":"U5","unit_name":"Circles","front":"What does a perpendicular from the center to a chord do?","back":"It bisects the chord into two equal parts.","explanation":"This is Theorem 5.2; the proof compares right triangles with equal radii.","difficulty":"easy","topic":"Chord theorem","section_id":"5.1","textbook_pages":"p. 255","source_note":"Theorem 5.2 and proof, p. 255."},{"flashcard_id":"U5-F006","unit_id":"U5","unit_name":"Circles","front":"What is the relation between equal chords and distance from the center?","back":"In the same circle, equal chords are equidistant from the center.","explanation":"The proof compares right triangles formed by perpendiculars from the center.","difficulty":"medium","topic":"Equal chords","section_id":"5.1","textbook_pages":"pp. 255–256","source_note":"Theorem 5.3, pp. 255–256."},{"flashcard_id":"U5-F007","unit_id":"U5","unit_name":"Circles","front":"What is the relation between equal central angles and their chords?","back":"In the same circle, chords subtending equal angles at the center have equal lengths.","explanation":"The converse form in Theorem 5.5 says equal chords subtend equal central angles.","difficulty":"medium","topic":"Chord-angle relation","section_id":"5.1","textbook_pages":"p. 257","source_note":"Theorems 5.4–5.5, p. 257."},{"flashcard_id":"U5-F008","unit_id":"U5","unit_name":"Circles","front":"How do major and minor arcs differ?","back":"A major arc measures more than 180° (or π radians); a minor arc measures less than 180° (or π radians).","explanation":"The unit also notes the usual naming convention: major arcs use three letters, minor arcs two.","difficulty":"easy","topic":"Arcs","section_id":"5.2","textbook_pages":"pp. 258–259","source_note":"Definitions and notation, pp. 258–259."},{"flashcard_id":"U5-F009","unit_id":"U5","unit_name":"Circles","front":"What is a central angle?","back":"An angle formed by two radii, with its vertex at the center of the circle.","explanation":"","difficulty":"easy","topic":"Angle definitions","section_id":"5.2","textbook_pages":"p. 259","source_note":"Definition, p. 259."},{"flashcard_id":"U5-F010","unit_id":"U5","unit_name":"Circles","front":"What is an inscribed angle?","back":"An angle whose vertex lies on the circle and whose sides are chords.","explanation":"","difficulty":"easy","topic":"Angle definitions","section_id":"5.2","textbook_pages":"p. 259","source_note":"Definition, p. 259."},{"flashcard_id":"U5-F011","unit_id":"U5","unit_name":"Circles","front":"How are a central angle and an inscribed angle related when they intercept the same arc?","back":"The inscribed angle’s measure is one-half the central angle’s measure.","explanation":"Equivalently, the central angle is twice the inscribed angle.","difficulty":"easy","topic":"Central and inscribed angles","section_id":"5.2","textbook_pages":"pp. 260–261","source_note":"Theorem 5.6, pp. 260–261."},{"flashcard_id":"U5-F012","unit_id":"U5","unit_name":"Circles","front":"What if two inscribed angles intercept the same arc?","back":"They have equal measures.","explanation":"Each is half of the same central angle.","difficulty":"easy","topic":"Inscribed angles","section_id":"5.2","textbook_pages":"p. 263","source_note":"Theorem 5.7, p. 263."},{"flashcard_id":"U5-F013","unit_id":"U5","unit_name":"Circles","front":"What is Thales’ theorem for an angle in a semicircle?","back":"An angle inscribed in a semicircle is a right angle (90°).","explanation":"The corresponding central angle is a straight angle (180°), and the inscribed angle is half of it.","difficulty":"easy","topic":"Semicircle theorem","section_id":"5.2","textbook_pages":"p. 264","source_note":"Theorem 5.8, p. 264."},{"flashcard_id":"U5-F014","unit_id":"U5","unit_name":"Circles","front":"What is a cyclic quadrilateral, and what is its opposite-angle rule?","back":"A quadrilateral whose four vertices lie on one circle. Either pair of opposite angles sums to 180°.","explanation":"The opposite-angle rule follows from the arcs intercepted by the two angles.","difficulty":"medium","topic":"Cyclic quadrilateral","section_id":"5.2","textbook_pages":"p. 265","source_note":"Definition 5.1 and Theorem 5.9, p. 265."},{"flashcard_id":"U5-F015","unit_id":"U5","unit_name":"Circles","front":"What is the arc length for central angle θ (in degrees) and radius r?","back":"s=2πr·(θ/360°).","explanation":"It is the same fraction θ/360° of the full circumference.","difficulty":"easy","topic":"Arc length","section_id":"5.3","textbook_pages":"pp. 268–269","source_note":"Definition and arc-length formula, pp. 268–269."},{"flashcard_id":"U5-F016","unit_id":"U5","unit_name":"Circles","front":"What is the chord length for central angle θ and radius r?","back":"l=2r sin(θ/2).","explanation":"Here θ is the angle subtended at the center; the half-chord is opposite θ/2 in a right triangle.","difficulty":"medium","topic":"Chord length","section_id":"5.3","textbook_pages":"p. 269","source_note":"Chord-length derivation and formula, p. 269."},{"flashcard_id":"U5-F017","unit_id":"U5","unit_name":"Circles","front":"What bounds a segment, and how is its perimeter found?","back":"A segment is bounded by a chord and an arc. Its perimeter equals chord length plus arc length.","explanation":"Do not confuse a segment (one curved and one straight boundary) with a sector.","difficulty":"easy","topic":"Segment perimeter","section_id":"5.3","textbook_pages":"p. 270","source_note":"Segment description and perimeter rule, p. 270."},{"flashcard_id":"U5-F018","unit_id":"U5","unit_name":"Circles","front":"What bounds a sector?","back":"A sector is the region enclosed by two radii and the arc between them.","explanation":"A circle is divided into a major and a minor sector by the radii.","difficulty":"easy","topic":"Sector definition","section_id":"5.3","textbook_pages":"p. 272","source_note":"Sector definition, p. 272."},{"flashcard_id":"U5-F019","unit_id":"U5","unit_name":"Circles","front":"What is the area of a sector for θ degrees and radius r?","back":"A_sector=πr²·(θ/360°).","explanation":"This is the θ/360° fraction of the full circle’s area.","difficulty":"easy","topic":"Sector area","section_id":"5.3","textbook_pages":"pp. 272–273","source_note":"Sector-area formula and example, pp. 272–273."},{"flashcard_id":"U5-F020","unit_id":"U5","unit_name":"Circles","front":"How do you calculate the perimeter of a sector?","back":"P_sector=2r+arc length=2r+2πr·(θ/360°), for θ in degrees.","explanation":"Its boundary contains two radii plus one arc.","difficulty":"easy","topic":"Sector perimeter","section_id":"5.3","textbook_pages":"p. 272","source_note":"Sector-perimeter formula, p. 272."},{"flashcard_id":"U5-F021","unit_id":"U5","unit_name":"Circles","front":"How is the area of a segment calculated?","back":"Area of segment=area of sector−area of the triangle formed by the two radii and chord.","explanation":"For θ in degrees, A=πr²(θ/360°)−(1/2)r²sinθ.","difficulty":"medium","topic":"Segment area","section_id":"5.3","textbook_pages":"pp. 273–274","source_note":"Segment-area derivation and formula, pp. 273–274."},{"flashcard_id":"U5-F022","unit_id":"U5","unit_name":"Circles","front":"What angle rule applies where two chords intersect inside a circle?","back":"The angle equals one-half the sum of the measures of the arcs intercepted by that angle and its vertical angle.","explanation":"For instance, in the diagram notation on p. 275: m∠PTQ=½(m arc PQ+m arc RS).","difficulty":"medium","topic":"Interior chord intersection","section_id":"5.4","textbook_pages":"p. 275","source_note":"Theorem 5.10, p. 275."},{"flashcard_id":"U5-F023","unit_id":"U5","unit_name":"Circles","front":"What length rule applies to two chords intersecting inside a circle?","back":"The products of the two segment lengths of one chord and of the other chord are equal: AP·PB=CP·PD.","explanation":"The unit presents this as a theorem for proof in Exercise 5.9.","difficulty":"medium","topic":"Intersecting-chord products","section_id":"5.4","textbook_pages":"p. 276","source_note":"Exercise 5.9 question 3 states the relation, p. 276."},{"flashcard_id":"U5-F024","unit_id":"U5","unit_name":"Circles","front":"What angle rule applies to lines meeting outside a circle?","back":"For two secants, two tangents, or a secant and tangent, the angle measure is half the positive difference of the intercepted arc measures.","explanation":"Take larger intercepted arc minus smaller intercepted arc, then divide by two.","difficulty":"medium","topic":"Exterior angle theorem","section_id":"5.4","textbook_pages":"p. 278","source_note":"Theorem 5.11, p. 278."},{"flashcard_id":"U5-F025","unit_id":"U5","unit_name":"Circles","front":"How are two tangent segments from the same outside point related?","back":"They have equal lengths.","explanation":"The summary states this equal-tangent-segments property.","difficulty":"easy","topic":"Tangent segments","section_id":"Summary","textbook_pages":"p. 281","source_note":"Unit summary, item 10, p. 281."},{"flashcard_id":"U6-F001","unit_id":"U6","unit_name":"Solid Figures","front":"What are the lateral area, total area, and volume rules for a right prism?","back":"LSA=ph; TSA=LSA+2BA; V=BA·h. Here p is the base perimeter, BA the area of one base, and h the prism altitude.","explanation":"The two bases are congruent; the lateral faces together contribute perimeter times altitude.","difficulty":"easy","topic":"Right prism formulas","section_id":"6.1","textbook_pages":"p. 289","source_note":"Definitions/formulas, p. 289. Printed-page citation: p. 289."},{"flashcard_id":"U6-F002","unit_id":"U6","unit_name":"Solid Figures","front":"What are the formulas for a right circular cylinder of radius r and height h?","back":"LSA=2πrh; TSA=2πrh+2πr²=2πr(h+r); V=πr²h.","explanation":"LSA covers the curved side; TSA includes both circular ends.","difficulty":"easy","topic":"Cylinder formulas","section_id":"6.1","textbook_pages":"pp. 292–293","source_note":"Formulas and example, pp. 292–293. Printed-page citation: pp. 292–293."},{"flashcard_id":"U6-F003","unit_id":"U6","unit_name":"Solid Figures","front":"How is the area of an annular cylinder base found?","back":"For outer radius R and inner radius r, BA=πR²−πr²=π(R²−r²); multiply by cylinder height for its material volume.","explanation":"Subtract the hole’s area from the full circular base before multiplying by height.","difficulty":"medium","topic":"Annular base and hollow-cylinder volume","section_id":"6.1","textbook_pages":"p. 293","source_note":"Worked annular-cylinder example, p. 293. Printed-page citation: p. 293."},{"flashcard_id":"U6-F004","unit_id":"U6","unit_name":"Solid Figures","front":"Define a pyramid.","back":"A pyramid has a polygonal base and an apex (vertex) not on the base; it is formed by joining every point of the base polygon to the apex.","explanation":"This definition distinguishes pyramid base geometry from circular cones.","difficulty":"easy","topic":"Pyramid definition","section_id":"6.2","textbook_pages":"p. 295","source_note":"Definition 6.1, p. 295. Printed-page citation: p. 295."},{"flashcard_id":"U6-F005","unit_id":"U6","unit_name":"Solid Figures","front":"What distinguishes a right pyramid from an oblique pyramid?","back":"A pyramid is right if the foot of its altitude is at the center of the base region; otherwise it is oblique.","explanation":"The altitude is the perpendicular segment from the apex to the plane of the base.","difficulty":"easy","topic":"Right versus oblique pyramid","section_id":"6.2","textbook_pages":"p. 296","source_note":"Definitions and explanation, p. 296. Printed-page citation: p. 296."},{"flashcard_id":"U6-F006","unit_id":"U6","unit_name":"Solid Figures","front":"What is a regular pyramid?","back":"A pyramid whose base is a regular polygon and whose lateral edges are all equal in length.","explanation":"The source also illustrates the altitude foot at the center for its regular square pyramid example.","difficulty":"medium","topic":"Regular pyramid","section_id":"6.2","textbook_pages":"p. 296","source_note":"Definition, p. 296. Printed-page citation: p. 296."},{"flashcard_id":"U6-F007","unit_id":"U6","unit_name":"Solid Figures","front":"Give the surface-area formulas for a regular pyramid.","back":"For base perimeter p and slant height l: LSA=½pl; TSA=BA+½pl.","explanation":"The lateral area sums congruent triangular side faces; the base area is added only for total area.","difficulty":"easy","topic":"Regular-pyramid surface area","section_id":"6.2","textbook_pages":"pp. 299–300","source_note":"Derivation and general formulas, pp. 299–300. Printed-page citation: pp. 299–300."},{"flashcard_id":"U6-F008","unit_id":"U6","unit_name":"Solid Figures","front":"How are the slant height and total surface area of a right circular cone expressed?","back":"l=√(h²+r²); LSA=πrl; TSA=πrl+πr²=πr(l+r).","explanation":"r is the base radius and h is perpendicular altitude; the right-triangle relation applies to a right circular cone.","difficulty":"easy","topic":"Right cone surface area","section_id":"6.2","textbook_pages":"p. 305","source_note":"Formula and example, p. 305. Printed-page citation: p. 305."},{"flashcard_id":"U6-F009","unit_id":"U6","unit_name":"Solid Figures","front":"What is a horizontal cross-section of a pyramid or cone?","back":"It is the intersection formed when the solid is cut by a plane parallel to the plane containing its base.","explanation":"Cross-sections parallel to the base retain a similar shape for the triangular-pyramid theorem.","difficulty":"easy","topic":"Horizontal cross-section","section_id":"6.2","textbook_pages":"pp. 306–308","source_note":"Definition 6.4 and Theorem 6.1, pp. 306–308. Printed-page citation: pp. 306–308."},{"flashcard_id":"U6-F010","unit_id":"U6","unit_name":"Solid Figures","front":"How does a pyramid’s parallel cross-section area compare with its base?","back":"If h is the pyramid altitude and k is the vertex-to-section distance, Asection/Abase=k²/h².","explanation":"The area scale is the square of the linear similarity ratio; k is measured from the vertex, not from the base.","difficulty":"medium","topic":"Pyramid cross-section area theorem","section_id":"6.2","textbook_pages":"pp. 308–310","source_note":"Theorems 6.2–6.3, pp. 308–310. Printed-page citation: pp. 308–310."},{"flashcard_id":"U6-F011","unit_id":"U6","unit_name":"Solid Figures","front":"State Cavalieri’s principle as used in the unit.","back":"Two solids of equal height have equal volumes if their cross-sectional areas are equal at every level parallel to their respective bases.","exp
