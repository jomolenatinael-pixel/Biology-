lanation":"The text uses it to establish equal volumes for pyramids with equal base area and altitude.","difficulty":"medium","topic":"Cavalieri principle","section_id":"6.2","textbook_pages":"p. 313","source_note":"Statement and application, p. 313. Printed-page citation: p. 313."},{"flashcard_id":"U6-F012","unit_id":"U6","unit_name":"Solid Figures","front":"What are the volume formulas for a pyramid and a circular cone?","back":"Pyramid: V=⅓BA·h. Circular cone: V=⅓πr²h.","explanation":"For a pyramid BA is polygonal base area; for the cone it is πr².","difficulty":"easy","topic":"Pyramid and cone volumes","section_id":"6.2","textbook_pages":"pp. 316–318","source_note":"Theorems 6.7–6.8 and examples, pp. 316–318. Printed-page citation: pp. 316–318."},{"flashcard_id":"U6-F013","unit_id":"U6","unit_name":"Solid Figures","front":"Give the surface area and volume of a sphere in radius form.","back":"SA=4πr²; V=⅓(4πr³)=4πr³/3.","explanation":"Here r is the sphere radius.","difficulty":"easy","topic":"Sphere formulas","section_id":"6.2","textbook_pages":"pp. 318–320","source_note":"Definition, formulas, and exercise, pp. 318–320. Printed-page citation: pp. 318–320."},{"flashcard_id":"U6-F014","unit_id":"U6","unit_name":"Solid Figures","front":"What are great and small circles of a sphere?","back":"A plane through the sphere’s center forms a great circle; a plane not through the center forms a small circle.","explanation":"A great circle has the sphere’s radius; all great circles are equal.","difficulty":"easy","topic":"Sphere cross-sections","section_id":"6.2","textbook_pages":"pp. 319–320","source_note":"Great and small circles section, pp. 319–320. Printed-page citation: pp. 319–320."},{"flashcard_id":"U6-F015","unit_id":"U6","unit_name":"Solid Figures","front":"Define a frustum of a pyramid.","back":"It is the part of a pyramid between the original base and a cross-section made by a plane parallel to the base.","explanation":"The cut-off portion nearer the apex is itself a smaller pyramid.","difficulty":"easy","topic":"Pyramid-frustum definition","section_id":"6.3","textbook_pages":"pp. 321–322","source_note":"Definition 6.6 and explanation, pp. 321–322. Printed-page citation: pp. 321–322."},{"flashcard_id":"U6-F016","unit_id":"U6","unit_name":"Solid Figures","front":"What shapes are the lateral faces of a frustum of a regular pyramid?","back":"They are congruent isosceles trapeziums; the slant height is the altitude of one such lateral face.","explanation":"For a general pyramid frustum the lateral faces are trapeziums.","difficulty":"medium","topic":"Pyramid-frustum faces","section_id":"6.3","textbook_pages":"p. 322","source_note":"Observations, p. 322. Printed-page citation: p. 322."},{"flashcard_id":"U6-F017","unit_id":"U6","unit_name":"Solid Figures","front":"Give the lateral and total area formulas for a regular-pyramid frustum.","back":"LSA=½l(p+p′); TSA=½l(p+p′)+A+A′, where p,p′ are base perimeters and A,A′ base areas.","explanation":"The base areas of both parallel ends are included in total surface area.","difficulty":"medium","topic":"Pyramid-frustum surface area","section_id":"6.3","textbook_pages":"pp. 323–324","source_note":"Worked example and general LSA rule, pp. 323–324; TSA also shown in the worked example. Printed-page citation: pp. 323–324."},{"flashcard_id":"U6-F018","unit_id":"U6","unit_name":"Solid Figures","front":"What is the lateral-area formula for a right-cone frustum?","back":"LSA=πl(r+r′), where l is frustum slant height and r,r′ are its base radii.","explanation":"The derivation subtracts the smaller cone’s lateral area from the larger cone’s.","difficulty":"easy","topic":"Cone-frustum lateral area","section_id":"6.3","textbook_pages":"pp. 326–327","source_note":"Derivation and formula, pp. 326–327. Printed-page citation: pp. 326–327."},{"flashcard_id":"U6-F019","unit_id":"U6","unit_name":"Solid Figures","front":"How are perpendicular height and slant height related in a right-cone frustum?","back":"l²=h²+(r−r′)², so h=√(l²−(r−r′)²).","explanation":"This follows from the right triangle formed by the frustum height and the difference of the base radii.","difficulty":"medium","topic":"Cone-frustum height relation","section_id":"6.3","textbook_pages":"pp. 327–328","source_note":"Worked derivation/example, pp. 327–328. Printed-page citation: pp. 327–328."},{"flashcard_id":"U6-F020","unit_id":"U6","unit_name":"Solid Figures","front":"State the volume formula for a frustum of a right circular cone.","back":"V=⅓πh(r²+r′²+rr′), where r and r′ are the larger and smaller base radii and h is frustum altitude.","explanation":"An equivalent form using base areas A,A′ is V=⅓h(A+A′+√(AA′)); the unit gives the analogous formula for a pyramid frustum.","difficulty":"medium","topic":"Frustum volume","section_id":"6.3","textbook_pages":"pp. 328–330","source_note":"Derivation, example, and generalization, pp. 328–330. Printed-page citation: pp. 328–330."},{"flashcard_id":"U6-F021","unit_id":"U6","unit_name":"Solid Figures","front":"How do you compute volume of a composed solid made of joined parts?","back":"Identify the component solids, find each part’s volume, then add the volumes.","explanation":"For joined solids, internal interfaces do not affect volume addition.","difficulty":"easy","topic":"Composed-solid volume","section_id":"6.4","textbook_pages":"pp. 331–333","source_note":"Section introduction and examples, pp. 331–333. Printed-page citation: pp. 331–333."},{"flashcard_id":"U6-F022","unit_id":"U6","unit_name":"Solid Figures","front":"When finding the external area of a cylinder topped by a cone, which surfaces are counted?","back":"Count the cone’s lateral area, cylinder’s lateral area, and the cylinder’s exposed bottom; omit the circular interface where they meet.","explanation":"The worked example decomposes the visible surface into those three exposed parts.","difficulty":"medium","topic":"External area of joined cone and cylinder","section_id":"6.4","textbook_pages":"pp. 332–333","source_note":"Worked example, pp. 332–333. Printed-page citation: pp. 332–333."},{"flashcard_id":"U6-F023","unit_id":"U6","unit_name":"Solid Figures","front":"How is volume found after a prism-shaped hole is drilled through a cylinder?","back":"Remaining volume = cylinder volume − removed prism volume.","explanation":"Use the prism’s cross-sectional area times its length for the removed volume.","difficulty":"medium","topic":"Subtractive composed solids","section_id":"6.4","textbook_pages":"pp. 334–335","source_note":"Worked drilling example, pp. 334–335. Printed-page citation: pp. 334–335."},{"flashcard_id":"U6-F024","unit_id":"U6","unit_name":"Solid Figures","front":"For an open-top frustum-shaped bucket with a closed bottom, what surface area represents material needed?","back":"Frustum lateral area plus the area of the closed bottom only; do not include the open top. For cone radii r,r′ and slant height l: πl(r+r′)+πr′² if r′ labels the bottom radius.","explanation":"If a problem labels the larger radius as the bottom, use that radius for the bottom disk. The text’s example adds the bottom disk to the lateral frustum area.","difficulty":"medium","topic":"Container-material application","section_id":"6.5","textbook_pages":"pp. 336–337","source_note":"Bucket example, pp. 336–337. Printed-page citation: pp. 336–337."},{"flashcard_id":"U6-F025","unit_id":"U6","unit_name":"Solid Figures","front":"How can a cylinder’s radius be found from capacity V and height h?","back":"From V=πr²h, r=√(V/(πh)); use consistent units for V and h.","explanation":"The tank example first converts liters to cubic metres, then solves the cylinder formula.","difficulty":"easy","topic":"Capacity and cylinder design","section_id":"6.5","textbook_pages":"p. 338","source_note":"Water-tank example, p. 338. Printed-page citation: p. 338."},{"flashcard_id":"U6-F026","unit_id":"U6","unit_name":"Solid Figures","front":"What volume-combination principle is used for a beam resting on cylindrical pillars?","back":"Add the beam’s cuboid volume to the volumes of both cylinders: Vtotal=lwh+2πr²h_pillar.","explanation":"Convert diameter to radius and use consistent units before adding.","difficulty":"medium","topic":"Composite construction application","section_id":"6.5","textbook_pages":"pp. 338–339","source_note":"Exercise 6.17(1), p. 339. Printed-page citation: pp. 338–339."},{"flashcard_id":"U6-F027","unit_id":"U6","unit_name":"Solid Figures","front":"What is the general frustum-of-a-pyramid volume formula shown in the summary?","back":"V=⅓h(A+A′+√(AA′)), where A and A′ are the parallel base areas and h is the frustum altitude.","explanation":"This formula is also stated for the frustum of a right circular cone using its two base areas.","difficulty":"medium","topic":"Pyramid-frustum volume summary","section_id":"Summary","textbook_pages":"pp. 340–342","source_note":"Summary, pp. 341–342. Printed-page citation: pp. 340–342."},{"flashcard_id":"U6-F028","unit_id":"U6","unit_name":"Solid Figures","front":"What are the cone-frustum total area and volume formulas?","back":"TSA=πl(r+r′)+π(r²+r′²); V=⅓πh(r²+r′²+rr′).","explanation":"TSA includes the curved side and both circular ends; volume uses perpendicular frustum height h.","difficulty":"medium","topic":"Cone-frustum summary","section_id":"Summary","textbook_pages":"p. 342","source_note":"Summary, p. 342. Printed-page citation: p. 342."},{"flashcard_id":"U6-F029","unit_id":"U6","unit_name":"Solid Figures","front":"How does water-level rise in a rectangular tank measure a submerged object’s volume?","back":"Displaced volume = rectangular base area × rise in water level; for a fully submerged object, this equals the object’s volume.","explanation":"The unit’s review exercise uses this method for a stone in a rectangular tank.","difficulty":"easy","topic":"Displacement application","section_id":"Review Exercise","textbook_pages":"pp. 343–344","source_note":"Review Exercise item 5, p. 343. Printed-page citation: pp. 343–344."},{"flashcard_id":"U6-F030","unit_id":"U6","unit_name":"Solid Figures","front":"When a cylinder, sphere, and cone have equal diameters and heights (with sphere diameter equal to common height), what is the volume ratio cylinder:sphere:cone?","back":"3:2:1.","explanation":"Let the common diameter and height be 2r; the respective volumes are 2πr³, 4πr³/3, and 2πr³/3.","difficulty":"hard","topic":"Compare volumes in review","section_id":"Review Exercise","textbook_pages":"p. 344","source_note":"Review Exercise item 9, p. 344; ratio independently derived from unit formulas. Printed-page citation: p. 344."},{"flashcard_id":"U7-F001","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What is the distance formula for P(x₁,y₁) and Q(x₂,y₂)?","back":"d=√[(x₂−x₁)²+(y₂−y₁)²].","explanation":"The squared coordinate differences make the result independent of endpoint order.","difficulty":"easy","topic":"Distance formula","section_id":"7.1","textbook_pages":"p. 350","source_note":"Definition 7.1; printed p. 350."},{"flashcard_id":"U7-F002","unit_id":"U7","unit_name":"Coordinate Geometry","front":"How is distance found when two points share a y-coordinate?","back":"For a horizontal segment, d=|x₂−x₁|.","explanation":"Only the x-coordinate changes. For a vertical segment, use the absolute difference of y-coordinates.","difficulty":"easy","topic":"Axis-aligned distance","section_id":"7.1","textbook_pages":"pp. 348–350","source_note":"Example 1; printed pp. 348–350."},{"flashcard_id":"U7-F003","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What are the sign and symmetry properties of distance?","back":"Distance is nonnegative (zero only for coincident points), and distance AB equals BA.","explanation":"","difficulty":"easy","topic":"Distance property","section_id":"7.1","textbook_pages":"p. 347","source_note":"introductory discussion; printed p. 347."},{"flashcard_id":"U7-F004","unit_id":"U7","unit_name":"Coordinate Geometry","front":"State the internal section formula when PR:RQ=p:q and P(x₁,y₁), Q(x₂,y₂).","back":"R=((p x₂+q x₁)/(p+q),(p y₂+q y₁)/(p+q)), with p,q positive.","explanation":"The ratio is measured in endpoint order PR:RQ; p weights Q and q weights P.","difficulty":"medium","topic":"Section formula","section_id":"7.2","textbook_pages":"p. 353","source_note":"Section Formula; printed p. 353."},{"flashcard_id":"U7-F005","unit_id":"U7","unit_name":"Coordinate Geometry","front":"How do you find the midpoint of endpoints (x₁,y₁) and (x₂,y₂)?","back":"M=((x₁+x₂)/2,(y₁+y₂)/2).","explanation":"Average the x-coordinates and average the y-coordinates.","difficulty":"easy","topic":"Midpoint formula","section_id":"7.2","textbook_pages":"pp. 354–355","source_note":"midpoint formula; printed pp. 354–355."},{"flashcard_id":"U7-F006","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What is the slope through P(x₁,y₁), Q(x₂,y₂)?","back":"m=(y₂−y₁)/(x₂−x₁), provided x₁≠x₂.","explanation":"Slope is change in y divided by change in x.","difficulty":"easy","topic":"Slope from points","section_id":"7.3","textbook_pages":"p. 357","source_note":"Definition 7.2; printed p. 357."},{"flashcard_id":"U7-F007","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What are the slopes of horizontal and vertical lines?","back":"Horizontal lines have slope 0; vertical lines have no slope (undefined).","explanation":"A vertical line has zero change in x, so the slope quotient denominator is zero.","difficulty":"easy","topic":"Horizontal and vertical line slopes","section_id":"7.3","textbook_pages":"p. 358","source_note":"Example 1; printed p. 358."},{"flashcard_id":"U7-F008","unit_id":"U7","unit_name":"Coordinate Geometry","front":"How is the slope related to a nonvertical line’s inclination θ?","back":"m=tan θ, where θ is measured anticlockwise from the positive x-axis and is less than 180°.","explanation":"Acute inclination gives positive slope; obtuse inclination gives negative slope.","difficulty":"medium","topic":"Slope and inclination","section_id":"7.3","textbook_pages":"pp. 359–360","source_note":"section explanation; printed pp. 359–360."},{"flashcard_id":"U7-F009","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What is the point-slope equation through (x₁,y₁) with slope m?","back":"y−y₁=m(x−x₁).","explanation":"","difficulty":"easy","topic":"Point-slope form","section_id":"7.3","textbook_pages":"p. 361","source_note":"definition of point-slope form; printed p. 361."},{"flashcard_id":"U7-F010","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What is slope-intercept form and what does b represent?","back":"y=mx+b, where m is slope and b is the y-intercept.","explanation":"","difficulty":"easy","topic":"Slope-intercept form","section_id":"7.3","textbook_pages":"p. 362","source_note":"definition; printed p. 362."},{"flashcard_id":"U7-F011","unit_id":"U7","unit_name":"Coordinate Geometry","front":"State the equation through distinct points (x₁,y₁),(x₂,y₂) when x₁≠x₂.","back":"y−y₁=[(y₂−y₁)/(x₂−x₁)](x−x₁).","explanation":"This is derived by equating slopes from the two given points to a general point on the line.","difficulty":"medium","topic":"Two-point form","section_id":"7.3","textbook_pages":"pp. 362–363","source_note":"two-point form derivation; printed pp. 362–363."},{"flashcard_id":"U7-F012","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What is the general form of a line?","back":"Ax+By+C=0, where A, B, and C are real numbers.","explanation":"","difficulty":"easy","topic":"General line form","section_id":"7.3","textbook_pages":"p. 363","source_note":"remark; printed p. 363."},{"flashcard_id":"U7-F013","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What is the intercept form for a line with nonzero intercepts p and q?","back":"x/p+y/q=1, where p,q≠0.","explanation":"","difficulty":"medium","topic":"Intercept form","section_id":"7.3","textbook_pages":"p. 364","source_note":"Exercise 7.7(4); printed p. 364."},{"flashcard_id":"U7-F014","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What is the slope condition for two nonvertical lines to be parallel?","back":"They have equal slopes: m₁=m₂.","explanation":"This condition is stated by Theorem 7.1.","difficulty":"easy","topic":"Parallel slopes","section_id":"7.4","textbook_pages":"p. 366","source_note":"Theorem 7.1; printed p. 366."},{"flashcard_id":"U7-F015","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What is the slope condition for nonvertical perpendicular lines?","back":"m₁m₂=−1.","explanation":"Equivalently, their slopes are negative reciprocals; the theorem states the condition if and only if.","difficulty":"easy","topic":"Perpendicular slopes","section_id":"7.4","textbook_pages":"pp. 367–368","source_note":"Theorem 7.2; printed pp. 367–368."},{"flashcard_id":"U7-F016","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What defines a circle geometrically?","back":"The set of all points in a plane at a fixed distance r from a fixed point called the center; r is the radius.","explanation":"","difficulty":"easy","topic":"Circle definition","section_id":"7.5","textbook_pages":"p. 371","source_note":"Definition 7.2; printed p. 371."},{"flashcard_id":"U7-F017","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What is the standard equation of a circle centered at (h,k) with radius r?","back":"(x−h)²+(y−k)²=r².","explanation":"Each point on the circumference is exactly distance r from (h,k).","difficulty":"easy","topic":"Standard circle form","section_id":"7.5","textbook_pages":"pp. 371–372","source_note":"standard equation; printed pp. 371–372."},{"flashcard_id":"U7-F018","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What is the equation of a radius-r circle centered at the origin?","back":"x²+y²=r².","explanation":"This follows from the distance of (x,y) to (0,0) being r.","difficulty":"easy","topic":"Circle centered at origin","section_id":"7.5","textbook_pages":"p. 372","source_note":"derivation and Example 2; printed p. 372."},{"flashcard_id":"U7-F019","unit_id":"U7","unit_name":"Coordinate Geometry","front":"State the general form and positive-radius condition given in the text.","back":"x²+y²+lx+my+n=0, with l²+m²−4n>0.","explanation":"The coefficients of x² and y² should be 1 before applying the stated form; completing squares gives center (−l/2,−m/2) and r²=(l²+m²−4n)/4.","difficulty":"hard","topic":"General circle form","section_id":"7.5","textbook_pages":"pp. 373–374","source_note":"Definition 7.3 and completing-square result; printed pp. 373–374."},{"flashcard_id":"U7-F020","unit_id":"U7","unit_name":"Coordinate Geometry","front":"How can area be calculated from vertices (x₁,y₁),(x₂,y₂),(x₃,y₃)?","back":"A=½|x₁(y₂−y₃)+x₂(y₃−y₁)+x₃(y₁−y₂)|.","explanation":"The absolute value ensures area is nonnegative.","difficulty":"medium","topic":"Triangle area formula","section_id":"7.6","textbook_pages":"p. 375","source_note":"area formula; printed p. 375."},{"flashcard_id":"U7-F021","unit_id":"U7","unit_name":"Coordinate Geometry","front":"How does the unit establish a coordinate triangle is right-angled or isosceles?","back":"Compare side lengths using the distance formula; use slopes to detect perpendicular sides (product −1 for nonvertical sides), or use the Pythagorean relationship for a right angle.","explanation":"The worked applications combine distance and slope computations to classify triangles.","difficulty":"medium","topic":"Triangle classification","section_id":"7.6","textbook_pages":"pp. 376–377","source_note":"Examples 1–2; printed pp. 376–377."},{"flashcard_id":"U7-F022","unit_id":"U7","unit_name":"Coordinate Geometry","front":"For point P(a,b), what are a and b called?","back":"a is the x-coordinate (abscissa); b is the y-coordinate (ordinate).","explanation":"","difficulty":"easy","topic":"Coordinate vocabulary","section_id":"Summary","textbook_pages":"p. 378","source_note":"Summary item 1; printed p. 378."},{"flashcard_id":"U7-F023","unit_id":"U7","unit_name":"Coordinate Geometry","front":"What main coordinate tools recur in the Unit 7 review?","back":"Distance and midpoint/section formulas; slopes and line equations; parallel/perpendicular tests; circle equations; and coordinate triangle area/classification.","explanation":"These topics are exercised across the review problems, including ratio division, line equations, circle diameter data, and triangle area.","difficulty":"medium","topic":"Review synthesis","section_id":"Review Exercise","textbook_pages":"pp. 379–380","source_note":"Review Exercise; printed pp. 379–380."}]}</script><script>(()=>{"use strict";
const DB=JSON.parse(document.getElementById("flash-data").textContent),U=DB.units,F=DB.flashcards,app=document.getElementById("app");
const S={view:"setup",items:[],index:0,flipped:false,known:new Set(),review:new Set(),visited:new Set(),unit:"all",difficulty:"all",topic:"all"};
const esc=v=>{const d=document.createElement("div");d.textContent=String(v==null?"":v);return d.innerHTML;};const attr=v=>esc(v).replace(/"/g,"&quot;").replace(/'/g,"&#39;");function unitBy(id){return U.find(x=>x.unit_id===id)||null;}function topics(data){return Array.from(new Set(data.map(x=>x.topic).filter(Boolean))).sort((a,b)=>a.localeCompare(b));}
function sourcePanel(){return '<section class="source-panel"><h2>Textbook source and scope</h2><p><strong>Mathematics Student’s Textbook, Grade 10</strong> — Federal Democratic Republic of Ethiopia, Ministry of Education; authors Tadele Mekonnen Yihun and Mamo Teketel Mekasha. The public catalog reports the Ethiopian New Curriculum and 2023 G.C.; the PDF metadata itself does not state a year. Google Drive source: <code>grade-10-mathematics-new-curriculum--student-textbook-kehulumcom1759925836e39e.pdf</code> (394-page PDF).</p><p>These flashcards are original study prompts derived from the seven textbook units. Each card includes a unit, section, and printed-page note. Printed pages 381–385 are logarithm/trigonometric tables outside the seven units.</p><ul>'+U.map(u=>'<li><strong>'+esc(u.unit_id)+' — '+esc(u.title)+':</strong> printed pp. '+u.start+'–'+u.end+'</li>').join("")+'</ul><div class="notice">Review these textbook-derived cards with a qualified Ethiopian Mathematics teacher before formal classroom use. Redistribution terms for the source PDF were not identified; this file does not include the textbook or long copied passages.</div></section>';}
function setup(){S.view="setup";const ts=topics(F);app.innerHTML='<header class="app-header"><div class="header-block"><div class="eyebrow">Offline retrieval practice</div><h1>Grade 10 Mathematics Flashcards</h1><div class="subtitle">'+F.length+' textbook-referenced cards · track known and review cards for this session</div></div><span class="badge">No internet required</span></header><section class="hero"><h2>Choose a deck</h2><p>Review definitions, formulas, theorems, procedures and key relationships with printed-page citations.</p></section><section class="panel"><div class="filter-grid"><div class="field"><label for="flash-unit">Unit</label><select id="flash-unit"><option value="all">All units</option>'+U.map(u=>'<option value="'+attr(u.unit_id)+'">'+esc(u.unit_id+' — '+u.title)+'</option>').join("")+'</select></div><div class="field"><label for="flash-difficulty">Difficulty</label><select id="flash-difficulty"><option value="all">All levels</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div><div class="field"><label for="flash-topic">Topic</label><select id="flash-topic"><option value="all">All topics</option>'+ts.map(t=>'<option value="'+attr(t)+'">'+esc(t)+'</option>').join("")+'</select></div></div><div class="count-line"><span id="flash-count" aria-live="polite"></span><span class="small">Progress is kept in memory only and resets when this page is closed.</span></div><div class="control-row"><button id="start-deck" class="primary" type="button">Start flashcards</button><button id="clear-flash-filters" class="secondary" type="button">Clear filters</button></div></section>'+sourcePanel();const un=document.getElementById("flash-unit"),di=document.getElementById("flash-difficulty"),to=document.getElementById("flash-topic");function filters(){S.unit=un.value;S.difficulty=di.value;S.topic=to.value;}function filtered(){filters();return F.filter(x=>(S.unit==="all"||x.unit_id===S.unit)&&(S.difficulty==="all"||x.difficulty===S.difficulty)&&(S.topic==="all"||x.topic===S.topic));}function refreshTopic(){filters();const data=F.filter(x=>(S.unit==="all"||x.unit_id===S.unit)&&(S.difficulty==="all"||x.difficulty===S.difficulty)),old=to.value,tt=topics(data);to.innerHTML='<option value="all">All topics</option>'+tt.map(t=>'<option value="'+attr(t)+'">'+esc(t)+'</option>').join("");if(tt.includes(old))to.value=old;update();}function update(){const n=filtered().length;document.getElementById("flash-count").textContent=n+" cards match these filters.";document.getElementById("start-deck").disabled=!n;}un.addEventListener("change",refreshTopic);di.addEventListener("change",refreshTopic);to.addEventListener("change",update);document.getElementById("clear-flash-filters").addEventListener("click",()=>{un.value="all";di.value="all";to.value="all";refreshTopic();});document.getElementById("start-deck").addEventListener("click",()=>{S.items=filtered();S.index=0;S.flipped=false;S.known=new Set();S.review=new Set();S.visited=new Set();S.view="cards";renderCard();});update();}
function sourceLine(c){const u=unitBy(c.unit_id);return 'Source: '+esc(c.unit_id)+' — '+esc(u?u.title:c.unit_name)+', section '+esc(c.section_id)+', printed '+esc(c.textbook_pages)+'. '+esc(c.source_note);}
function renderCard(){if(S.view!=="cards"||!S.items.length){setup();return;}const c=S.items[S.index];S.visited.add(c.flashcard_id);const n=S.items.length;let h='<button class="ghost" id="back-flash-setup" type="button">‹ Back to filters</button><div class="flash-topline"><span id="flash-counter">Card '+(S.index+1)+' of '+n+'</span><span>'+S.known.size+' known · '+S.review.size+' for review · '+S.visited.size+' viewed</span></div><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:'+Math.round(S.known.size*100/n)+'%"></div></div></div><div class="meta-row"><span class="tag">'+esc(c.unit_id)+' — '+esc((unitBy(c.unit_id)||{}).title||c.unit_name)+'</span><span class="tag neutral">'+esc(c.difficulty)+'</span><span class="tag neutral">'+esc(c.section_id)+' · '+esc(c.topic)+'</span></div><button class="flash-card" id="flip-card" type="button" aria-label="Flip flashcard"><span class="flash-face">'+(S.flipped?'Back':'Front')+'</span><span class="flash-content">'+esc(S.flipped?c.back:c.front)+'</span>'+(S.flipped&&c.explanation?'<span class="flash-explanation">'+esc(c.explanation)+'</span>':'')+'</button><div class="source-ref">'+sourceLine(c)+'</div><div class="control-row"><button id="mark-known" class="secondary mark-known '+(S.known.has(c.flashcard_id)?'active':'')+'" type="button" aria-pressed="'+S.known.has(c.flashcard_id)+'">✓ Mark as known</button><button id="mark-review" class="secondary mark-review '+(S.review.has(c.flashcard_id)?'active':'')+'" type="button" aria-pressed="'+S.review.has(c.flashcard_id)+'">⚑ Mark for review</button></div><div class="nav-row"><button id="flash-prev" class="ghost" type="button" '+(S.index===0?'disabled':'')+'>‹ Previous</button><div class="control-row" style="margin:0"><button id="shuffle-cards" class="secondary" type="button">Shuffle</button><button id="reset-cards" class="secondary" type="button">Reset session</button></div><button id="flash-next" class="primary" type="button" '+(S.index===n-1?'disabled':'')+'>Next ›</button></div>'+sourcePanel();app.innerHTML=h;document.getElementById("back-flash-setup").addEventListener("click",setup);document.getElementById("flip-card").addEventListener("click",()=>{S.flipped=!S.flipped;renderCard();});document.getElementById("flash-prev").addEventListener("click",()=>{if(S.index>0){S.index--;S.flipped=false;renderCard();}});document.getElementById("flash-next").addEventListener("click",()=>{if(S.index<n-1){S.index++;S.flipped=false;renderCard();}});document.getElementById("mark-known").addEventListener("click",()=>{if(S.known.has(c.flashcard_id))S.known.delete(c.flashcard_id);else{S.known.add(c.flashcard_id);S.review.delete(c.flashcard_id);}renderCard();});document.getElementById("mark-review").addEventListener("click",()=>{if(S.review.has(c.flashcard_id))S.review.delete(c.flashcard_id);else{S.review.add(c.flashcard_id);S.known.delete(c.flashcard_id);}renderCard();});document.getElementById("shuffle-cards").addEventListener("click",()=>{for(let i=S.items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.items[i],S.items[j]]=[S.items[j],S.items[i]];}S.index=0;S.flipped=false;renderCard();});document.getElementById("reset-cards").addEventListener("click",()=>{S.index=0;S.flipped=false;S.known.clear();S.review.clear();S.visited.clear();renderCard();});}
setup();})();</script>
<!-- Telegram Games integration: the share action only runs after an explicit user tap. -->
<script src="https://telegram.org/js/games.js"></script>
<script>
(function () {
  function addShareButton() {
    if (!window.TelegramGameProxy || typeof window.TelegramGameProxy.shareScore !== 'function') return;
    var actions = document.querySelector('.summary-actions');
    if (!actions || actions.querySelector('.telegram-share-score')) return;
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'secondary btn-secondary btn-outline telegram-share-score';
    button.textContent = 'Share score';
    button.addEventListener('click', function () {
      window.TelegramGameProxy.shareScore();
    });
    actions.appendChild(button);
  }
  addShareButton();
  new MutationObserver(addShareButton).observe(document.body, { childList: true, subtree: true });
})();
</script>
